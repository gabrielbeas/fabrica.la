name: Deploy to GitHub Pages

# Arma el sitio publicado:
# fabrica/                         -> fabrica.la/            (sitio principal)
# login.html, js/, firebase-config -> fabrica.la/            (login y código compartido del panel)
# admin/public/ (solo lo nuevo)    -> fabrica.la/admin/      (panel con Firebase)
#
# NO se publican: admin/public/herramientas/ (importadores de una sola vez: se usan en local),
# admin/src (backend viejo), admin/public/agua/data.json,
# apps-script/, las páginas viejas de agua que dependían del Worker de Cloudflare,
# ni _privado/ (datos privados, excluido en .gitignore).
#
# magnolias/ se retiró de este repo: ahora vive en su propio repo (gbd.mx), en gbd.mx/magnolias/.
#
# Requiere: en GitHub, Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
# (en vez de "Deploy from a branch").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar el sitio a publicar
        run: |
          set -e
          mkdir -p dist
          # Sitio principal
          cp -r fabrica/. dist/
          cp CNAME dist/CNAME
          # Login y código compartido del panel
          cp login.html firebase-config.js dist/
          cp -r js dist/js
          # Panel (solo archivos nuevos)
          mkdir -p dist/admin/agua dist/admin/locales dist/admin/facturacion dist/admin/calendarios dist/admin/config dist/admin/caja-chica dist/admin/bitacora dist/admin/personal
          cp admin/public/facturacion/index.html admin/public/facturacion/ficha.html dist/admin/facturacion/
          cp admin/public/index.html dist/admin/
          cp admin/public/calendarios/index.html dist/admin/calendarios/
          cp admin/public/config/index.html dist/admin/config/
          cp admin/public/caja-chica/index.html dist/admin/caja-chica/
          cp admin/public/bitacora/index.html dist/admin/bitacora/
          cp admin/public/personal/index.html dist/admin/personal/
          cp -r admin/public/css dist/admin/css
          cp admin/public/agua/lecturas.html admin/public/agua/siapa.html dist/admin/agua/
          cp admin/public/locales/index.html admin/public/locales/caratula.html dist/admin/locales/
          # Verificación: nada privado debe quedar publicado
          if find dist -name 'data.json' -o -path '*_privado*' -o -name '*.gs' -o -path '*herramientas*' | grep -q .; then
            echo "ERROR: archivos privados en dist"; exit 1
          fi
          find dist -type f | sort
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
