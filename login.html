<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap">
    <style>
        /* Colores del sistema «Panel LFdC» (el login no carga panel.css: vive fuera del panel) */
        :root { --fondo: #ffffff; --fondo-hundido: #f2f4f7; --linea: #dfe3e8; --borde-control: #8a929c; --tinta: #1b2430; --tinta-suave: #5f6670; --accion: #1f4e79; --accion-hover: #2a5f8f; --on-accion: #ffffff; --foco: #1f4e79; --peligro: #b3261e; --peligro-suave: #fbe9e7; --exito: #2e7d32; --exito-suave: #e8f5e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--fondo-hundido); color: var(--tinta); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .login-container { background: var(--fondo); border: 1px solid var(--linea); border-radius: 12px; width: 100%; max-width: 400px; padding: 40px 32px; }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header p { color: var(--tinta-suave); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
        .form-group { margin-bottom: 16px; }
        label { display: block; color: var(--tinta-suave); font-weight: 600; margin-bottom: 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
        input[type="email"], input[type="password"] { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--borde-control); border-radius: 4px; font: inherit; font-size: 15px; color: var(--tinta); background: var(--fondo); }
        input[type="email"]:focus-visible, input[type="password"]:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
        .login-btn { width: 100%; height: 44px; margin-top: 8px; background: var(--accion); color: var(--on-accion); border: none; border-radius: 4px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
        .login-btn:hover { background: var(--accion-hover); }
        .login-btn:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
        .login-btn.loading { opacity: 0.7; cursor: not-allowed; }
        .error-message { background: var(--peligro-suave); color: var(--peligro); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .error-message.show { display: block; }
        .success-message { background: var(--exito-suave); color: var(--exito); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
        .success-message.show { display: block; }
        .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(255, 255, 255, 0.3); border-top-color: var(--on-accion); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .loading-spinner { animation-duration: 2s; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img id="logoLogin" alt="La Fábrica de Chocolate" style="display:block; width: 240px; max-width: 80%; height: auto; margin: 0 auto 18px;">
            <script>
                // Local: /admin/public/css/logo.png · Publicado: /admin/css/logo.png
                document.getElementById('logoLogin').src = (['localhost', '127.0.0.1'].includes(location.hostname) ? '/admin/public/' : '/admin/') + 'css/logo.png';
            </script>
            <p>Panel de Administración</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu@correo.com"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Iniciar sesión
            </button>
        </form>

    </div>

    <script type="module">
        import { login } from './js/auth.js?v=20261005-5';

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Mostrar error
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }

        // Mostrar éxito
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }

        // Manejar submit del formulario
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Por favor completa todos los campos');
                return;
            }

            // Mostrar estado de carga
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span>Iniciando sesión...';

            try {
                const result = await login(email, password);

                if (result.success) {
                    showSuccess('¡Autenticación exitosa! Redirigiendo...');

                    // Redirigir después de 1 segundo
                    setTimeout(() => {
                        const local = ['localhost', '127.0.0.1'].includes(window.location.hostname);
                        window.location.href = local ? '/admin/public/' : '/admin/';
                    }, 1000);
                } else {
                    showError(result.error || 'Error en la autenticación');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Iniciar sesión';
                }
            } catch (error) {
                showError('Error de conexión: ' + error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Iniciar sesión';
            }
        });

        // Limpiar errores al escribir
        emailInput.addEventListener('input', () => errorMessage.classList.remove('show'));
        passwordInput.addEventListener('input', () => errorMessage.classList.remove('show'));
    </script>
</body>
</html>
