<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAPA - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="stylesheet" href="../css/panel.css?v=20261005-5">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1200px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 22px; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 34px 0 12px; }
        .barra { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
        .barra .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
        .volver { display: inline-block; color: var(--accion); text-decoration: none; font-size: 14px; margin-bottom: 14px; }

        .btn { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { background: var(--fondo-hundido); color: var(--tinta-suave); border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
        .btn-sec:hover { background: var(--linea); }
        .btn-mini { font-size: 12px; padding: 3px 10px; border: 1px solid var(--borde-control); background: var(--fondo); border-radius: 10px; cursor: pointer; color: var(--tinta-suave); }
        .btn-mini:hover { border-color: var(--accion); color: var(--accion); }
        .btn-mini.borrar:hover { border-color: var(--peligro); color: var(--peligro); }

        .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 16px 18px; }
        .tarjeta .et { font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; }
        .tarjeta .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .tarjeta .det { font-size: 12px; color: var(--tinta-suave); margin-top: 4px; line-height: 1.4; }
        .tarjeta.alerta .val { color: var(--peligro); }
        .tarjeta.bien .val { color: var(--exito); }
        @media (max-width: 900px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }

        /* Gráficas: una por medida (nunca dos ejes) */
        .graficas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .graficas { grid-template-columns: 1fr; } }
        .grafica { border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px 10px; position: relative; }
        .grafica h3 { margin: 0 0 2px; font-size: 14px; }
        .grafica .leyenda { font-size: 12px; color: var(--tinta-suave); display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
        .grafica .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
        .grafica svg { width: 100%; height: auto; display: block; overflow: visible; }
        .grafica svg text { font-size: 10px; fill: var(--tinta-suave); }
        .grafica .barra-g { fill: var(--accion); }
        .grafica .barra-g.nota { fill: url(#rayas); }
        .grafica .hit { fill: transparent; cursor: default; }
        .grafica .hit:hover + .barra-g, .grafica g.sel .barra-g { opacity: .75; }
        .grafica.linea .serie { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
        .grafica.linea .punto { stroke: var(--on-accion); stroke-width: 2; }
        .grafica.linea svg text.etq { font-size: 11px; font-weight: 600; fill: var(--tinta-suave); }
        .grafica.linea .linea-s.fondo .serie { stroke-width: 1.5; }
        .grafica.linea .leyenda [data-k] { cursor: default; }
        .tabla-ley { margin-top: 14px; overflow-x: auto; }
        .tabla-ley table { font-size: 13px; }
        .tabla-ley th { padding: 8px 10px; cursor: pointer; user-select: none; white-space: normal; vertical-align: bottom; line-height: 1.3; }
        .tabla-ley th:hover { color: var(--tinta); }
        .tabla-ley th.act { color: var(--accion); }
        .tabla-ley th .flecha { font-size: 9px; margin-left: 4px; opacity: .4; }
        .tabla-ley th.act .flecha { opacity: 1; }
        .tabla-ley td { padding: 6px 10px; white-space: nowrap; }
        .tabla-ley td:nth-child(4) { white-space: normal; min-width: 200px; }
        .tabla-ley tr.ley { cursor: pointer; }
        .tabla-ley tr.ley:hover td { background: var(--ambar-suave); }
        .tabla-ley tr.ley.off td { opacity: .4; text-decoration: line-through; }
        .tabla-ley .sw-th, .tabla-ley .sw-td { width: 46px; }
        .tabla-ley .sw-td .switch { pointer-events: none; }
        .reporte-barra { margin-top: 12px; display: flex; justify-content: flex-end; }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; vertical-align: middle; cursor: pointer; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider { position: absolute; inset: 0; background: var(--borde-control); border-radius: 20px; transition: .2s; }
        .switch .slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--fondo); border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .switch input:checked + .slider { background: var(--accion); }
        .switch input:checked + .slider::before { transform: translateX(14px); }
        .tabla-ley td i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: 3px; }
        .grafica.linea .leyenda [data-k]:hover { color: var(--tinta); }
        .grafica.linea .leyenda [data-k][title] { cursor: pointer; user-select: none; }
        .grafica.linea .leyenda [data-k].off { opacity: .35; text-decoration: line-through; }
        .grafica.linea .mostrar-todos { margin: 0 0 6px; }
        .grafica.linea svg.foco .linea-s, .grafica.linea svg.foco .etq-g { opacity: .15; transition: opacity .15s; }
        .grafica.linea svg.foco .linea-s.activa, .grafica.linea svg.foco .etq-g.activa { opacity: 1; }
        .grafica.linea svg.foco .linea-s.activa .serie { stroke-width: 3; }
        .grafica.linea svg.foco .linea-s.fondo.activa .serie { stroke: var(--tinta-suave); }
        .tip i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: 3px; }
        .grafica.linea .guia { stroke: var(--tinta-tenue); stroke-width: 1; stroke-dasharray: 3 3; display: none; }
        .grafica.linea .sub-g { font-size: 12px; color: var(--tinta-suave); margin: 0 0 6px; line-height: 1.4; }
        .grafica.linea .leyenda i { height: 3px; width: 16px; border-radius: 2px; vertical-align: 3px; }
        .tip { position: absolute; pointer-events: none; background: var(--fondo); border: 1px solid var(--linea); border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.1); padding: 8px 10px; font-size: 12px; line-height: 1.5; color: var(--tinta); white-space: nowrap; z-index: 5; display: none; }
        .tip strong { display: block; font-size: 13px; }
        .tip .gris { color: var(--tinta-suave); }

        .tabla-wrap { border: 1px solid var(--linea); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 14px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); white-space: nowrap; }
        td { padding: 9px 14px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        th.num { text-align: right; }
        tfoot td { font-weight: 600; background: var(--fondo-hundido); border-top: 1px solid var(--linea); }
        .nota-pill { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: var(--atencion-suave); color: var(--atencion); }
        .neg { color: var(--peligro); } .pos { color: var(--exito); }
        .gris { color: var(--tinta-suave); font-size: 12px; }
        .aviso { background: var(--atencion-suave); color: var(--atencion); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin: 10px 0 0; line-height: 1.5; }
        .vacio { color: var(--tinta-suave); font-size: 14px; padding: 16px 0; }

        .recibo { border: 1px solid var(--linea); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
        .recibo .tit { font-weight: 600; }
        .recibo .det { font-size: 12px; color: var(--tinta-suave); line-height: 1.6; }
        .recibo .tot { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
        .recibo .tot small { display: block; font-weight: 400; font-size: 12px; color: var(--tinta-suave); }
        .dos-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .dos-col { grid-template-columns: 1fr; } }

        .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 1000; overflow-y: auto; }
        .modal { background: var(--fondo); border-radius: 12px; width: 100%; max-width: 640px; padding: 24px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 4px; font-size: 18px; }
        .modal .sub { margin-bottom: 16px; }
        .modal h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accion); margin: 18px 0 10px; }
        .campos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
        .campos .ancho { grid-column: 1 / -1; }
        .campos label { display: block; font-size: 12px; color: var(--tinta-suave); margin-bottom: 4px; }
        .campos input, .campos select { width: 100%; padding: 8px 10px; border: 1px solid var(--borde-control); border-radius: 6px; font-size: 14px; font-family: inherit; }
        .campos input:focus { outline: none; border-color: var(--accion); }
        @media (max-width: 700px) { .campos { grid-template-columns: 1fr 1fr; } }
        .pie { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 18px; flex-wrap: wrap; }
        .msg { font-size: 13px; margin-right: auto; }
        .ok { color: var(--exito); } .err { color: var(--peligro); }
        .cargando { color: var(--tinta-suave); padding: 40px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261005-5';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261005-5';
        import { collection, getDocs, getDoc, doc, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const pesos = n => typeof n === 'number' ? (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('es-MX') : '-';
        const numero = (n, d = 0) => typeof n === 'number' ? n.toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d }) : '-';
        const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const fechaCorta = f => { if (!f) return '-'; const [y, m, d] = f.split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };
        const mesCorto = f => { const [y, m] = f.split('-'); return `${MESES[+m - 1]} ${y.slice(2)}`; };
        const mesLargo = f => { const [y, m] = f.split('-'); return `${MESES_L[+m - 1]} ${y}`; };
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        const NOTA_TXT = 'SIAPA marcó la lectura con nota (210 / 206); la lectura se repite del periodo anterior, así que el consumo parece estimado';

        let periodos = [], recibos = [], pagos = [], lecturas = [], medidores = [], inicioTubo = {}, localesTubo = {}, tarifa = null;

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            else cargar();
        }

        async function cargar(msg = '') {
            try {
                const [sP, sR, sG, sL, sA, sM, sC] = await Promise.all([
                    getDocs(collection(db, 'siapa_periodos')),
                    getDocs(collection(db, 'siapa_recibos')),
                    getDocs(collection(db, 'siapa_pagos')),
                    getDocs(collection(db, 'agua_lecturas')),
                    getDoc(doc(db, 'agua_config', 'general')),
                    getDocs(collection(db, 'agua_medidores')),
                    getDocs(collection(db, 'contratos'))
                ]);
                medidores = sM.docs.map(d => ({ id: d.id, ...d.data() }));
                // Inicio del contrato de cada tubo (si un tubo tiene varios contratos, el más antiguo).
                // RENOVADOS: el contrato actual es renovación y el locatario ya estaba antes, así que se grafica todo su histórico.
                const RENOVADOS = ['21'];   // 21: Proyectos Saraperos / Cine Responsable (renovaron en may 2026)
                inicioTubo = {}; localesTubo = {};
                sC.docs.map(d => d.data()).forEach(c => (c.facturacion?.tubos || []).forEach(({ tubo }) => {
                    const k = String(tubo).toUpperCase();
                    if (!c.vencido || !localesTubo[k]) localesTubo[k] = (c.locales || []).join(', ');
                    if (RENOVADOS.includes(k)) return;
                    if (/^\d{4}-\d{2}-\d{2}$/.test(c.inicio || '') && (!inicioTubo[k] || c.inicio < inicioTubo[k])) inicioTubo[k] = c.inicio;
                }));
                periodos = sP.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.fechaLectura.localeCompare(b.fechaLectura));
                recibos = sR.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.emision || '').localeCompare(a.emision || ''));
                pagos = sG.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.fecha.localeCompare(a.fecha));
                lecturas = sL.docs.map(d => d.data());
                tarifa = sA.exists() && typeof sA.data().costoM3 === 'number' ? sA.data().costoM3 : 78.64; // mismo valor inicial que Lecturas
                vista(msg);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<h1>SIAPA</h1><p class="err">No se pudo cargar: ${esc(err.message)}</p>`;
            }
        }

        // Agua cobrada a locatarios (lecturas del panel) por periodo de SIAPA, para comparar.
        // Cada lectura cuenta en el periodo de SIAPA con la fecha de lectura más cercana (máx. 20 días),
        // porque las fechas de captura no siempre caen en el mismo mes. No se suman el tubo MTO (medidor
        // maestro) ni Servicios Generales (consumo propio de la plaza), que no se cobra.
        const dias = (a, b) => Math.abs(new Date(a) - new Date(b)) / 86400000;
        // Periodo de SIAPA al que pertenece una lectura: el de fecha más cercana (máx. 20 días);
        // si no hay (periodos trimestrales de 2024), el primero que termina después de la lectura.
        function periodoDe(fecha) {
            let mejor = null;
            periodos.forEach(p => { const d = dias(p.fechaLectura, fecha); if (d <= 20 && (!mejor || d < mejor.d)) mejor = { p, d }; });
            if (mejor) return mejor.p;
            return periodos.find(p => p.fechaLectura >= fecha) || null;
        }
        const esMTO = l => String(l.tubo).toUpperCase() === 'MTO';
        // Consumo propio de la plaza (no se cobra a locatarios): Servicios Generales. El tubo 14 cuenta como un local más.
        const PROPIOS = ['SG'];
        const esPropio = l => PROPIOS.includes(String(l.tubo).toUpperCase());
        const lecturaDudosa = l => (l.revisar || []).length || (typeof l.consumo === 'number' && (l.consumo < 0 || l.consumo > 2000));

        // m³ por periodo de SIAPA: medidor general (SIAPA), suma de locales, consumo propio y tubo MTO
        function consumoPorPeriodo() {
            const loc = {}, mto = {}, propio = {};
            lecturas.forEach(l => {
                if (!l.fecha || typeof l.consumo !== 'number' || lecturaDudosa(l)) return;
                // Se omite la primera lectura de cada medidor (consumo = lectura: es la base, no consumo)
                // y, en MTO, los saltos por cambio de medidor
                if (l.consumo === l.lectura && l.lectura > 5) return;
                if (esMTO(l) && l.consumo > 400) return;
                const p = periodoDe(l.fecha);
                if (!p) return;
                const destino = esMTO(l) ? mto : esPropio(l) ? propio : loc;
                destino[p.fechaLectura] = (destino[p.fechaLectura] || 0) + l.consumo;
            });
            return periodos.map(p => ({ p, siapa: p.m3, locales: loc[p.fechaLectura] ?? null, propio: propio[p.fechaLectura] ?? null, mto: mto[p.fechaLectura] ?? null }));
        }

        function cobradoPorPeriodo() {
            const por = {};
            let excluidas = 0;
            lecturas.forEach(l => {
                if (!l.fecha || esMTO(l) || esPropio(l)) return;
                if (lecturaDudosa(l)) { excluidas++; return; }
                const per = periodoDe(l.fecha);
                if (!per) return;
                const k = per.fechaLectura;
                por[k] = por[k] || { m3: 0, importe: 0, n: 0 };
                if (typeof l.consumo === 'number') por[k].m3 += l.consumo;
                if (typeof l.importe === 'number') por[k].importe += l.importe;
                por[k].n++;
            });
            return { por, excluidas };
        }

        function vista(msg) {
            const ultimo = periodos[periodos.length - 1];
            const doce = periodos.slice(-12);
            const m3_12 = doce.reduce((s, p) => s + (p.m3 || 0), 0);
            const imp_12 = doce.reduce((s, p) => s + (p.importe || 0), 0);
            const costoReal = m3_12 ? imp_12 / m3_12 : null;
            const { por: cobrado, excluidas } = cobradoPorPeriodo();
            const comp = doce.map(p => ({ p, c: cobrado[p.fechaLectura] })).filter(x => x.c);
            const pagadoComp = comp.reduce((s, x) => s + (x.p.importe || 0), 0);
            const cobradoComp = comp.reduce((s, x) => s + x.c.importe, 0);
            const recuperado = pagadoComp ? cobradoComp / pagadoComp : null;
            // Histórico: todo lo pagado a SIAPA menos todo lo cobrado a locatarios por agua = lo que costó el agua propia (y la que no pasa por medidor)
            const pagadoTotal = pagos.reduce((s, g) => s + (g.monto || 0), 0);
            const cobradoTotal = Object.values(cobrado).reduce((s, c) => s + (c.importe || 0), 0);
            const propioTotal = pagadoTotal - cobradoTotal;
            const recibo = recibos.find(r => r.totalAPagar !== undefined && r.tipo !== 'recibo de pago');
            const cuenta = recibos.find(r => r.cuenta)?.cuenta;

            app.innerHTML = `
                <a class="volver" href="lecturas.html">← Lecturas de agua</a>
                <div class="barra">
                    <div>
                        <h1>SIAPA</h1>
                        <p class="sub">Recibos de la toma general${cuenta ? ` · cuenta ${esc(cuenta)}` : ''}. Importes con IVA.</p>
                    </div>
                    <div class="acciones">
                        <button class="btn-sec" id="nPago">Registrar pago</button>
                        <button class="btn" id="nRecibo">Capturar recibo</button>
                    </div>
                </div>
                <p class="msg" id="msg">${msg}</p>

                ${!periodos.length ? '<p class="vacio">Todavía no hay periodos capturados.</p>' : `
                <div class="tarjetas">
                    <div class="tarjeta">
                        <div class="et">Último periodo</div>
                        <div class="val">${pesos(ultimo.importe)}</div>
                        <div class="det">${numero(ultimo.m3)} m³ · lectura del ${fechaCorta(ultimo.fechaLectura)}</div>
                    </div>
                    <div class="tarjeta">
                        <div class="et">Últimos 12 periodos</div>
                        <div class="val">${pesos(imp_12)}</div>
                        <div class="det">${numero(m3_12)} m³ · del ${fechaCorta(doce[0].fechaLectura)} al ${fechaCorta(ultimo.fechaLectura)}</div>
                    </div>
                    <div class="tarjeta ${costoReal && tarifa && r2(costoReal) > tarifa ? 'alerta' : ''}">
                        <div class="et">Costo real por m³</div>
                        <div class="val">${dinero(costoReal)}</div>
                        <div class="det">${tarifa ? `Cobras ${dinero(tarifa)} a los locatarios${r2(costoReal) > tarifa ? ' (menos de lo que cuesta)' : ''}` : 'Últimos 12 periodos, con alcantarillado, saneamiento e IVA'}</div>
                    </div>

                        <div class="et">Pagado por consumo propio</div>

                    </div>
                </div>
                ${recibo ? `<p class="aviso">Último recibo (emitido ${fechaCorta(recibo.emision)}): total a pagar <strong>${dinero(recibo.totalAPagar)}</strong>, vence ${fechaCorta(recibo.vence)}${recibo.recargos ? ` · incluye ${dinero(recibo.recargos)} de recargos` : ''}.</p>` : ''}

                <h2>Consumo: LAFABDECHOC contra locales</h2>
                <div class="grafica linea" id="gAcum"></div>
                <div class="grafica linea" id="gMes" style="margin-top:16px"></div>

                <h2>Consumo e importe por periodo</h2>
                <div class="graficas">
                    <div class="grafica" id="gImporte"></div>

                </div>

                <h2>Costo por m³: SIAPA contra lo que cobras</h2>
                <div class="grafica linea" id="gCosto"></div>
                <div id="tCosto"></div>

                <h2>SIAPA contra lo cobrado a locatarios</h2>
                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead><tr><th>Periodo</th><th class="num">m³ SIAPA</th><th class="num">m³ locatarios</th><th class="num">Diferencia m³</th><th class="num">Pagado a SIAPA</th><th class="num">Cobrado</th><th class="num">Diferencia</th></tr></thead>
                        <tbody>${[...periodos].reverse().map(p => {
                            const c = cobrado[p.fechaLectura];
                            const dm3 = c ? p.m3 - c.m3 : null, dimp = c ? c.importe - p.importe : null;
                            return `<tr>
                                <td><strong>${fechaCorta(p.fechaLectura)}</strong></td>
                                <td class="num">${numero(p.m3)}</td>

                                <td class="num">${dm3 !== null ? numero(dm3, 1) : '-'}</td>
                                <td class="num">${pesos(p.importe)}</td>
                                <td class="num">${c ? pesos(c.importe) : '-'}</td>
                                <td class="num ${dimp === null ? '' : dimp < 0 ? 'neg' : 'pos'}">${dimp !== null ? pesos(dimp) : '-'}</td>
                            </tr>`;
                        }).join('')}</tbody>
                    </table>
                </div>
                <p class="gris" style="margin-top:8px">m³ locatarios = suma de los tubos capturados en Lecturas de agua con fecha cercana a la lectura de SIAPA (sin el medidor maestro MTO ni Servicios Generales); la diferencia es Servicios Generales más fugas o tomas sin medidor. Diferencia en pesos: rojo = cobraste menos de lo que pagaste.${excluidas ? ` Se omiten ${excluidas} lecturas marcadas para revisar o con consumo fuera de rango.` : ''}</p>

                <h2>Periodos facturados</h2>
                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead><tr><th>Fecha de lectura</th><th class="num">Lectura</th><th>Nota</th><th class="num">m³</th><th class="num">Días</th><th class="num">m³ por día</th><th class="num">Importe</th><th></th></tr></thead>
                        <tbody>${[...periodos].reverse().map(p => `<tr>
                            <td><strong>${fechaCorta(p.fechaLectura)}</strong></td>
                            <td class="num">${numero(p.lectura)}</td>
                            <td>${p.nota ? `<span class="nota-pill" title="${esc(NOTA_TXT)}">${esc(p.nota)}</span>` : ''}</td>
                            <td class="num">${numero(p.m3)}</td>
                            <td class="num">${numero(p.dias)}</td>
                            <td class="num">${numero(p.m3Dia, 3)}</td>
                            <td class="num">${dinero(p.importe)}</td>
                            <td class="num"><button class="btn-mini" data-editar="${esc(p.id)}">Editar</button></td>
                        </tr>`).join('')}</tbody>
                    </table>
                </div>`}

                <div class="dos-col">
                    <div>
                        <h2>Recibos</h2>
                        ${recibos.length ? recibos.map(r => `<div class="recibo">
                            <div>
                                <div class="tit">${r.tipo === 'recibo de pago' ? 'Recibo de pago' : `Periodo ${r.periodoDel ? fechaCorta(r.periodoDel) + ' al ' + fechaCorta(r.periodoAl) : '-'}`}</div>
                                <div class="det">Emitido ${fechaCorta(r.emision)} · vence ${fechaCorta(r.vence)}${r.totalMes ? ` · mes ${dinero(r.totalMes)}` : ''}${r.recargos ? ` · recargos ${dinero(r.recargos)}` : ''}
                                ${r.desglose ? `<br>Consumo ${dinero(r.desglose.consumo)} · alcantarillado ${dinero(r.desglose.alcantarillado)} · saneamiento ${dinero(r.desglose.saneamiento)} · descarga ${dinero(r.desglose.descarga)} · IVA ${dinero(r.desglose.iva)}` : ''}
                                ${r.nota ? `<br>${esc(r.nota)}` : ''}</div>
                            </div>
                            <div class="tot">${dinero(r.totalAPagar)}<small>total a pagar</small><button class="btn-mini borrar" data-borrar-recibo="${esc(r.id)}" style="margin-top:6px">Borrar</button></div>
                        </div>`).join('') : '<p class="vacio">Sin recibos.</p>'}
                    </div>
                    <div>
                        <h2>Pagos a SIAPA</h2>
                        ${pagos.length ? `<div class="tabla-wrap"><table class="tabla-movil">
                            <thead><tr><th>Fecha</th><th class="num">Monto</th><th>Nota</th><th></th></tr></thead>
                            <tbody>${pagos.map(g => `<tr><td><strong>${fechaCorta(g.fecha)}</strong></td><td class="num">${dinero(g.monto)}</td><td>${esc(g.nota || '')}</td>
                                <td class="num"><button class="btn-mini borrar" data-borrar-pago="${esc(g.id)}">Borrar</button></td></tr>`).join('')}</tbody>
                            <tfoot><tr><td>Total</td><td class="num">${dinero(pagos.reduce((s, g) => s + (g.monto || 0), 0))}</td><td></td><td></td></tr></tfoot>
                        </table></div>
                        <p class="gris" style="margin-top:8px">Los recibos solo muestran el último pago; si hubo pagos entre recibos, regístralos aquí.</p>` : '<p class="vacio">Sin pagos registrados.</p>'}
                    </div>
                </div>`;

            if (periodos.length) {
                graficasConsumo();
                graficaPorLocal();
                costoPorM3();
                grafica('gImporte', 'Importe por periodo', p => p.importe, v => pesos(v));
                grafica('gM3', 'm³ por periodo', p => p.m3, v => numero(v) + ' m³');
            }
            document.getElementById('nRecibo').addEventListener('click', () => ventanaRecibo());
            document.getElementById('nPago').addEventListener('click', ventanaPago);
            app.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => ventanaRecibo(periodos.find(p => p.id === b.dataset.editar))));
            app.querySelectorAll('[data-borrar-pago]').forEach(b => b.addEventListener('click', () => borrar('siapa_pagos', b.dataset.borrarPago, 'este pago')));
            app.querySelectorAll('[data-borrar-recibo]').forEach(b => b.addEventListener('click', () => borrar('siapa_recibos', b.dataset.borrarRecibo, 'este recibo (el periodo y su consumo se conservan)')));
        }

        // Consumo de LAFABDECHOC (medidor general de SIAPA) contra la suma de locales y el tubo MTO.
        // Una medida por gráfica: acumulado y mes a mes (normalizado a 30 días por los periodos trimestrales de 2024).
        const SERIES = [
            { k: 'siapa', nombre: 'LAFABDECHOC (SIAPA)', corto: 'LAFABDECHOC', color: '#1f4e79', dash: '' },
            { k: 'locales', nombre: 'Locales (suma)', corto: 'Locales', color: '#13855c', dash: '' },
            { k: 'propio', nombre: 'Servicios Generales', corto: 'Servicios Generales', color: '#a05195', dash: '' },
            { k: 'mto', nombre: 'Medidor MTO', corto: 'MTO', color: '#e8590c', dash: '5 4' }
        ];
        function graficasConsumo() {
            const filas = consumoPorPeriodo();
            // Acumulado desde el primer periodo en que las tres líneas tienen dato, para comparar parejo;
            // cada línea se corta en su primer periodo sin dato (no se rellena con ceros).
            let ini = filas.findIndex(f => SERIES.every(s => f[s.k] !== null));
            if (ini < 0) ini = Math.max(0, filas.findIndex(f => f.locales !== null));
            const desde = filas.slice(ini);
            const acum = {};
            SERIES.forEach(s => {
                let suma = 0, cortada = false;
                acum[s.k] = desde.map(f => { if (cortada || f[s.k] === null) { cortada = true; return null; } suma += f[s.k]; return suma; });
            });
            graficaLineas('gAcum', 'Consumo acumulado (m³)',
                `Suma de m³ desde el periodo que cierra el ${fechaCorta(desde[0].p.fechaLectura)}, el primero con lecturas de SIAPA, de los locales, de Servicios Generales y de MTO (medidor maestro que leen ustedes). LAFABDECHOC menos locales menos Servicios Generales es agua que no pasa por ningún medidor (fugas o tomas sin medidor).`,
                desde.map(f => f.p), acum, v => numero(v) + ' m³');
            const mes = {};
            SERIES.forEach(s => { mes[s.k] = filas.map(f => f[s.k] === null ? null : f[s.k] / f.p.dias * 30); });
            graficaLineas('gMes', 'Consumo mes a mes (m³ por 30 días)',
                'Cada periodo de SIAPA llevado a 30 días, porque en 2024 SIAPA facturó por trimestre. Los huecos son periodos sin lecturas.',
                filas.map(f => f.p), mes, v => numero(v) + ' m³');
        }

        // Gráfica de líneas con eje de tiempo. series: [{ k, nombre, corto, color, dash, fondo }]
        // (fondo = línea gris sin nombre al final). Al pasar el mouse por el nombre en la leyenda
        // se resalta esa línea; sobre la gráfica, una guía muestra los valores del periodo.
        // opc.alto: alto en px del lienzo (260 por defecto); opc.ocultables: clic en la leyenda oculta/muestra
        // la línea y la escala se ajusta a las que quedan.
        const OCULTOS = {};
        function graficaLineas(id, titulo, subtitulo, pers, valores, fmt, series = SERIES, conDiferencia = true, opc = {}) {
            const el = document.getElementById(id);
            const todas = series;
            const ocultos = OCULTOS[id] || (OCULTOS[id] = new Set());
            if (opc.ocultables) series = todas.filter(s => !ocultos.has(s.k));
            const W = 900, H = opc.alto || 260, izq = 50, der = 150, abajo = opc.mensual ? 34 : 22, arriba = 10;
            const t = pers.map(p => new Date(p.fechaLectura).getTime());
            const t0 = t[0], t1 = t[t.length - 1];
            const x = v => izq + (W - izq - der) * (v - t0) / ((t1 - t0) || 1);
            const max = Math.max(1, ...series.flatMap(s => valores[s.k].filter(v => v !== null)));
            const paso = Math.pow(10, Math.floor(Math.log10(max))) / 2;
            const tope = Math.ceil(max / paso) * paso;
            // opc.base: valor donde empieza el eje (0 por defecto)
            const base = opc.base || 0;
            const y = v => arriba + (H - arriba - abajo) * (1 - (v - base) / (tope - base));
            // Gráficas altas: una marca cada paso redondo (5, 10, 50...); las bajas: cuartos
            let ticks = [0, 1, 2, 3, 4].map(j => base + (tope - base) * j / 4);
            if (H > 300) { let p = paso; while ((tope - base) / p > 12) p *= 2; ticks = Array.from({ length: Math.round((tope - base) / p) + 1 }, (_, j) => base + j * p); }
            const tramos = vals => {
                const out = []; let cur = [];
                vals.forEach((v, i) => { if (v === null) { if (cur.length) out.push(cur); cur = []; } else cur.push([x(t[i]), y(v)]); });
                if (cur.length) out.push(cur);
                return out;
            };
            // Nombre al final de cada línea con color (texto en gris oscuro, el punto lleva el color)
            const finales = series.filter(s => !s.fondo).map(s => { const v = valores[s.k]; let i = v.length - 1; while (i >= 0 && v[i] === null) i--; return i >= 0 ? { s, i, yy: y(v[i]) } : null; })
                .filter(Boolean).sort((a, b) => a.yy - b.yy);
            // Separa los nombres 14 px entre sí sin salirse por abajo: primero hacia abajo, luego se suben si no caben
            finales.forEach((f, j) => { if (j && f.yy - finales[j - 1].yy < 14) f.yy = finales[j - 1].yy + 14; });
            const limite = H - abajo - 2;
            for (let j = finales.length - 1; j >= 0; j--) {
                const tope = j === finales.length - 1 ? limite : finales[j + 1].yy - 14;
                if (finales[j].yy > tope) finales[j].yy = tope;
            }
            const etiquetaCada = Math.ceil(pers.length / 10);
            // Eje con una marca por mes calendario (día 1), guía vertical tenue y el año en cada enero
            function ejeMensual() {
                const ini = new Date(t0), fin = new Date(t1);
                let out = '';
                for (let d = new Date(ini.getFullYear(), ini.getMonth() + 1, 1); d <= fin; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
                    const xx = x(d.getTime()), ene = d.getMonth() === 0;
                    out += `<line x1="${xx}" x2="${xx}" y1="${arriba}" y2="${H - abajo}" stroke="${ene ? '#e3e3e3' : '#f4f4f4'}"/>`
                        + `<text x="${xx}" y="${H - abajo + 12}" text-anchor="middle" style="font-size:9px">${MESES[d.getMonth()]}</text>`
                        + (ene ? `<text x="${xx}" y="${H - abajo + 25}" text-anchor="middle" style="font-size:10px;font-weight:600;fill:#666">${d.getFullYear()}</text>` : '');
                }
                return out;
            }
            const muestra = s => `<i style="background:${s.dash ? `repeating-linear-gradient(90deg,${s.color} 0 5px,transparent 5px 8px)` : s.color}"></i>`;
            // Las líneas de fondo van primero para que las de color queden encima
            const orden = [...series.filter(s => s.fondo), ...series.filter(s => !s.fondo)];
            el.innerHTML = `<h3>${titulo}</h3><p class="sub-g">${subtitulo}</p>
                ${opc.tabla ? '' : `<div class="leyenda">${todas.map(s => `<span data-k="${esc(s.k)}" class="ley ${ocultos.has(s.k) && opc.ocultables ? 'off' : ''}"${opc.ocultables ? ' title="Clic para ocultar o mostrar"' : ''}>${muestra(s)}${esc(s.nombre)}</span>`).join('')}</div>`}
                ${opc.ocultables && ocultos.size ? `<button class="btn-mini mostrar-todos">Mostrar todos (${ocultos.size} oculto${ocultos.size > 1 ? 's' : ''})</button>` : ''}
                <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">
                    ${ticks.map(v => `<line x1="${izq}" x2="${W - der}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${izq - 6}" y="${y(v) + 3}" text-anchor="end">${opc.eje ? opc.eje(v) : numero(v)}</text>`).join('')}
                    ${opc.mensual ? ejeMensual() : pers.map((p, i) => i % etiquetaCada === 0 || i === pers.length - 1 ? `<text x="${x(t[i])}" y="${H - 6}" text-anchor="middle">${mesCorto(p.fechaLectura)}</text>` : '').join('')}
                    <line class="guia" x1="0" x2="0" y1="${arriba}" y2="${H - abajo}"/>
                    ${orden.map(s => `<g class="linea-s${s.fondo ? ' fondo' : ''}" data-k="${esc(s.k)}">${tramos(valores[s.k]).map(tr => tr.length === 1
                        ? `<circle cx="${tr[0][0]}" cy="${tr[0][1]}" r="3" fill="${s.color}"/>`
                        : `<polyline class="serie" points="${tr.map(q => q.join(',')).join(' ')}" stroke="${s.color}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>`).join('')}</g>`).join('')}
                    ${finales.map(f => `<g class="etq-g" data-k="${esc(f.s.k)}"><circle cx="${x(t[f.i]) + 10}" cy="${f.yy}" r="3.5" fill="${f.s.color}"/><text class="etq" x="${x(t[f.i]) + 17}" y="${f.yy + 4}">${esc(f.s.corto)}</text></g>`).join('')}
                    <g class="marcas"></g>
                    <rect class="hit" x="${izq}" y="${arriba}" width="${W - izq - der}" height="${H - abajo - arriba}"/>
                </svg>
                <div class="tip"></div>
                ${opc.tabla ? tablaLeyenda(id, todas, opc.tabla, ocultos, muestra) : ''}`;
            const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), guia = el.querySelector('.guia'), marcas = el.querySelector('.marcas');
            // Resaltar una línea al pasar el mouse por su nombre en la leyenda
            const redibujar = () => graficaLineas(id, titulo, subtitulo, pers, valores, fmt, todas, conDiferencia, opc);
            if (opc.ocultables) {
                el.querySelectorAll('.ley[data-k]').forEach(sp => sp.addEventListener('click', () => {
                    ocultos.has(sp.dataset.k) ? ocultos.delete(sp.dataset.k) : ocultos.add(sp.dataset.k);
                    redibujar();
                }));
                el.querySelector('.mostrar-todos')?.addEventListener('click', () => { ocultos.clear(); redibujar(); });
                // Interruptor general: apaga todos si hay alguno prendido; si no, prende todos
                el.querySelector('.sw-todos')?.addEventListener('click', e => {
                    e.preventDefault();
                    if (ocultos.size < todas.length) todas.forEach(s => ocultos.add(s.k)); else ocultos.clear();
                    redibujar();
                });
                el.querySelector('.btn-reporte')?.addEventListener('click', () => {
                    const k = todas.find(s => !ocultos.has(s.k))?.k;
                    if (k && opc.tabla?.reporte) opc.tabla.reporte(k);
                });
            }
            // Ordenar la tabla al hacer clic en el encabezado
            el.querySelectorAll('.tabla-ley th[data-col]').forEach(th => th.addEventListener('click', () => {
                const o = ORDEN_TABLA[id];
                ORDEN_TABLA[id] = { col: th.dataset.col, dir: o.col === th.dataset.col ? -o.dir : (th.dataset.num ? -1 : 1) };
                redibujar();
            }));
            el.querySelectorAll('.ley[data-k]').forEach(sp => {
                sp.addEventListener('mouseenter', () => {
                    svg.classList.add('foco');
                    svg.querySelectorAll(`[data-k="${CSS.escape(sp.dataset.k)}"]`).forEach(g => g.classList.add('activa'));
                });
                sp.addEventListener('mouseleave', () => { svg.classList.remove('foco'); svg.querySelectorAll('.activa').forEach(g => g.classList.remove('activa')); });
            });
            const hit = el.querySelector('.hit');
            hit.addEventListener('mousemove', e => {
                const r = svg.getBoundingClientRect();
                const px = (e.clientX - r.left) * W / r.width;
                let i = 0;
                t.forEach((v, j) => { if (Math.abs(x(v) - px) < Math.abs(x(t[i]) - px)) i = j; });
                const xi = x(t[i]);
                guia.setAttribute('x1', xi); guia.setAttribute('x2', xi); guia.style.display = 'block';
                marcas.innerHTML = series.filter(s => !s.fondo).map(s => valores[s.k][i] === null ? '' : `<circle class="punto" cx="${xi}" cy="${y(valores[s.k][i])}" r="4.5" fill="${s.color}"/>`).join('');
                // En el recuadro: de mayor a menor en ese periodo
                const filasTip = series.map(s => ({ s, v: valores[s.k][i] })).filter(f => f.v !== null || series.length <= 4)
                    .sort((a, b) => series.length > 4 ? b.v - a.v : 0);
                let extra = '';
                if (conDiferencia && valores.siapa && valores.locales && valores.siapa[i] !== null && valores.locales[i] !== null)
                    extra = `<br><span class="gris">Sin medidor (SIAPA − locales − Servicios Generales): ${fmt(valores.siapa[i] - valores.locales[i] - (valores.propio?.[i] || 0))}</span>`;
                tip.innerHTML = `<strong>${mesLargo(pers[i].fechaLectura)}</strong><span class="gris">Lectura de SIAPA del ${fechaCorta(pers[i].fechaLectura)}</span><br>`
                    + filasTip.map(f => `${muestra(f.s)}${esc(f.s.nombre)}: ${f.v === null ? '<span class="gris">sin dato</span>' : fmt(f.v)}`).join('<br>')
                    + extra;
                tip.style.display = 'block';
                const caja = el.getBoundingClientRect();
                let left = e.clientX - caja.left + 14;
                if (left + tip.offsetWidth > caja.width) left = e.clientX - caja.left - tip.offsetWidth - 14;
                tip.style.left = Math.max(4, left) + 'px';
                tip.style.top = Math.max(4, e.clientY - caja.top - tip.offsetHeight - 12) + 'px';
            });
            hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; guia.style.display = 'none'; marcas.innerHTML = ''; });
        }

        // Una línea por medidor de local (m³ por 30 días). Los 5 que más consumen en los últimos
        // 12 periodos llevan color fijo; los demás van en gris y se resaltan desde la leyenda.
        // 8 colores distintos; del noveno en adelante se repiten con línea punteada para distinguirlos
        const COLORES_LOCALES = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
        function graficaPorLocal() {
            const porTubo = {};
            lecturas.forEach(l => {
                if (!l.fecha || esMTO(l) || esPropio(l) || typeof l.consumo !== 'number' || lecturaDudosa(l)) return;
                if (l.consumo === l.lectura && l.lectura > 5) return;
                const p = periodoDe(l.fecha);
                if (!p) return;
                const k = String(l.tubo);
                // Cada local empieza en el inicio de su contrato (antes era otro locatario o el local vacío)
                if (inicioTubo[k.toUpperCase()] && l.fecha < inicioTubo[k.toUpperCase()]) return;
                porTubo[k] = porTubo[k] || {};
                porTubo[k][p.fechaLectura] = (porTubo[k][p.fechaLectura] || 0) + l.consumo;
            });
            const tubos = Object.keys(porTubo);
            if (!tubos.length) { document.getElementById('gLocal').innerHTML = '<p class="vacio">Sin lecturas de locales.</p>'; return; }
            const ini = periodos.findIndex(p => tubos.some(k => porTubo[k][p.fechaLectura] !== undefined));
            const pers = periodos.slice(Math.max(0, ini));
            const ultimos = pers.slice(-12).map(p => p.fechaLectura);
            const total12 = k => ultimos.reduce((s, f) => s + (porTubo[k][f] || 0), 0);
            const orden = tubos.sort((a, b) => total12(b) - total12(a));
            const nombre = k => { const e = (medidores.find(m => String(m.id) === k) || {}).empresa; return e ? `Tubo ${k} · ${e}` : `Tubo ${k}`; };
            const series = orden.map((k, i) => ({
                k, nombre: nombre(k), corto: nombre(k).replace(/^Tubo (\S+) · /, '$1 · ').slice(0, 22),
                color: COLORES_LOCALES[i % COLORES_LOCALES.length], dash: i >= COLORES_LOCALES.length ? '6 4' : '', fondo: false
            }));
            const valores = {};
            // Antes del inicio del contrato no hay línea (null), aunque hubiera lecturas del medidor
            series.forEach(s => { const ini = inicioTubo[s.k.toUpperCase()]; valores[s.k] = pers.map(p => (ini && p.fechaLectura < ini) || porTubo[s.k][p.fechaLectura] === undefined ? null : porTubo[s.k][p.fechaLectura] / p.dias * 30); });
            // Datos de la tabla (uno por medidor)
            const doce = pers.slice(-12);
            const filas = {};
            series.forEach(s => {
                const m = porTubo[s.k];
                const d12 = doce.filter(p => m[p.fechaLectura] !== undefined);
                const m12 = d12.reduce((a, p) => a + m[p.fechaLectura], 0);
                const dias12 = d12.reduce((a, p) => a + p.dias, 0);
                const ult = [...pers].reverse().find(p => m[p.fechaLectura] !== undefined);
                const empresa = (medidores.find(x => String(x.id) === s.k) || {}).empresa || '';
                filas[s.k] = {
                    local: localesTubo[s.k.toUpperCase()] || '', tubo: s.k, nombre: empresa,
                    m12, prom: dias12 ? m12 / dias12 * 30 : null,
                    ultimo: ult ? m[ult.fechaLectura] / ult.dias * 30 : null,
                    total: Object.values(m).reduce((a, v) => a + v, 0),
                    desde: inicioTubo[s.k.toUpperCase()] || null
                };
            });
            const m3 = v => v === null || v === undefined ? '-' : numero(v, 1);
            graficaLineas('gLocal', 'Consumo por local (m³ por 30 días)',
                `Un medidor por línea (del noveno en adelante, punteada). En la tabla de abajo: pasa el mouse por un renglón para resaltar su línea, clic para ocultarla y que la escala se ajuste, clic en un encabezado para ordenar. Cada línea empieza en el inicio del contrato de su locatario; si el contrato es renovación (tubo 21), se muestra todo su histórico. El tubo 21 es compartido (50 / 50).`,
                pers, valores, v => numero(v, 1) + ' m³', series, false, {
                    alto: 600, ocultables: true, mensual: true,
                    tabla: {
                        filas, defecto: { col: 'm12', dir: -1 },
                        reporte: k => reporteLocal(k, { pers, valores: valores[k], fila: filas[k], color: series.find(s => s.k === k).color }),
                        columnas: [
                            { k: 'local', t: 'Local', orden: f => parseInt(f.local) || 999 },
                            { k: 'tubo', t: 'Tubo', orden: f => parseInt(f.tubo) || 999 },
                            { k: 'nombre', t: 'Locatario', texto: true },
                            { k: 'm12', t: 'm³ últimos 12 periodos', num: true, fmt: m3 },
                            { k: 'prom', t: 'Promedio por 30 días', num: true, fmt: m3 },
                            { k: 'ultimo', t: 'Último periodo (30 días)', num: true, fmt: m3 },
                            { k: 'total', t: 'Total desde el inicio', num: true, fmt: m3 },
                            { k: 'desde', t: 'Desde', fmt: v => v ? fechaCorta(v) : '<span class="gris">Todo el histórico</span>', orden: f => f.desde || '' }
                        ]
                    }
                });
        }

        // ---------- Costo por m³: SIAPA (importe del periodo ÷ m³, con IVA y todos los conceptos) contra la tarifa cobrada ----------
        // Tarifa cobrada de un periodo = el costo por m³ más usado en las lecturas de locales asignadas a ese periodo.
        function costoPorM3() {
            const cuenta = {};
            lecturas.forEach(l => {
                if (!l.fecha || esMTO(l) || esPropio(l) || typeof l.costoM3 !== 'number' || !(l.costoM3 > 0)) return;
                const p = periodoDe(l.fecha);
                if (!p) return;
                const c = cuenta[p.fechaLectura] = cuenta[p.fechaLectura] || {};
                const k = l.costoM3.toFixed(2);
                c[k] = (c[k] || 0) + 1;
            });
            const filas = periodos.map(p => {
                const c = cuenta[p.fechaLectura];
                const cobro = c ? +Object.entries(c).sort((a, b) => b[1] - a[1])[0][0] : null;
                const siapa = p.m3 ? p.importe / p.m3 : null;
                return { p, siapa, cobro, dif: siapa !== null && cobro !== null ? cobro - siapa : null };
            });
            // Promedios de todo el histórico, ponderados por m³ (total de pesos entre total de m³)
            const histSiapa = periodos.reduce((a, p) => a + p.importe, 0) / periodos.reduce((a, p) => a + p.m3, 0);
            const cobradas = lecturas.filter(l => l.fecha && !esMTO(l) && !esPropio(l) && !lecturaDudosa(l)
                && typeof l.consumo === 'number' && l.consumo > 0 && typeof l.importe === 'number' && !(l.consumo === l.lectura && l.lectura > 5));
            const histCobro = cobradas.reduce((a, l) => a + l.importe, 0) / (cobradas.reduce((a, l) => a + l.consumo, 0) || 1);
            const valores = { siapa: filas.map(f => f.siapa), cobro: filas.map(f => f.cobro), histSiapa: filas.map(() => histSiapa), histCobro: filas.map(() => histCobro) };
            const ult12 = filas.slice(-12);
            const m3_12 = ult12.reduce((a, f) => a + f.p.m3, 0), imp12 = ult12.reduce((a, f) => a + f.p.importe, 0);
            graficaLineas('gCosto', 'Costo por m³ (con IVA)',
                `SIAPA: importe del periodo entre los m³ facturados (incluye alcantarillado, saneamiento, descarga e IVA). Tú: costo por m³ con que se grabaron las lecturas de los locales de ese periodo. Punteadas: promedio de todo el histórico, ponderado por m³ (SIAPA ${dinero(histSiapa)}, tú ${dinero(histCobro)}; ${dinero(histSiapa - histCobro)} menos por m³). Últimos 12 periodos: SIAPA ${dinero(imp12 / m3_12)} por m³; en Lecturas de agua el costo para lecturas nuevas es ${dinero(tarifa)}.`,
                periodos, valores, v => dinero(v),
                [{ k: 'siapa', nombre: 'Costo SIAPA por m³', corto: 'SIAPA', color: '#1f4e79', dash: '' },
                 { k: 'cobro', nombre: 'Lo que cobras por m³', corto: 'Cobras', color: '#13855c', dash: '' },
                 { k: 'histSiapa', nombre: `Promedio histórico SIAPA (${dinero(histSiapa)})`, corto: `Prom. SIAPA ${dinero(histSiapa)}`, color: '#1f4e79', dash: '6 4' },
                 { k: 'histCobro', nombre: `Promedio histórico cobrado (${dinero(histCobro)})`, corto: `Prom. cobrado ${dinero(histCobro)}`, color: '#13855c', dash: '6 4' }],
                false, { alto: 360, mensual: true, base: 40, eje: v => '$' + numero(v) });
            // Por año
            const anios = [...new Set(periodos.map(p => p.fechaLectura.slice(0, 4)))];
            const resumen = anios.map(a => {
                const fs = filas.filter(f => f.p.fechaLectura.startsWith(a));
                const m3 = fs.reduce((s, f) => s + f.p.m3, 0), imp = fs.reduce((s, f) => s + f.p.importe, 0);
                return { a, n: fs.length, m3, siapa: m3 ? imp / m3 : null, cobros: [...new Set(fs.map(f => f.cobro).filter(v => v !== null))].sort((x, y) => x - y) };
            });
            document.getElementById('tCosto').innerHTML = `
                <div class="tabla-wrap" style="margin-top:12px">
                    <table class="tabla-movil">
                        <thead><tr><th>Año</th><th class="num">Periodos</th><th class="num">m³ SIAPA</th><th class="num">Costo SIAPA por m³</th><th>Lo que cobraste por m³</th></tr></thead>
                        <tbody>${resumen.map(r => `<tr><td><strong>${r.a}</strong></td><td class="num">${r.n}</td><td class="num">${numero(r.m3)}</td><td class="num">${dinero(r.siapa)}</td><td>${r.cobros.map(dinero).join(', ') || '-'}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
                <div class="tabla-wrap" style="margin-top:12px">
                    <table class="tabla-movil">
                        <thead><tr><th>Periodo</th><th class="num">m³</th><th class="num">Importe SIAPA</th><th class="num">SIAPA por m³</th><th class="num">Cobras por m³</th><th class="num">Diferencia por m³</th></tr></thead>
                        <tbody>${[...filas].reverse().map(f => `<tr>
                            <td><strong>${fechaCorta(f.p.fechaLectura)}</strong>${f.p.nota ? ` <span class="nota-pill" title="${esc(NOTA_TXT)}">${esc(f.p.nota)}</span>` : ''}</td>
                            <td class="num">${numero(f.p.m3)}</td>
                            <td class="num">${pesos(f.p.importe)}</td>
                            <td class="num">${dinero(f.siapa)}</td>
                            <td class="num">${f.cobro === null ? '<span class="gris">Sin lecturas</span>' : dinero(f.cobro)}</td>
                            <td class="num ${f.dif === null ? '' : f.dif < 0 ? 'neg' : 'pos'}">${f.dif === null ? '-' : dinero(f.dif)}</td>
                        </tr>`).join('')}</tbody>
                    </table>
                </div>
                <p class="gris" style="margin-top:8px">Diferencia en rojo: cobraste menos por m³ de lo que costó en SIAPA ese periodo. El costo por m³ de SIAPA sube en los meses de más consumo (tarifa por bloques), así que conviene comparar contra los periodos de consumo alto.</p>`;
        }

        // ---------- Reporte de un local (hoja carta para imprimir o guardar como PDF) ----------
        function reporteLocal(k, { pers, valores, fila, color }) {
            const desde = fila.desde;
            const lects = lecturas.filter(l => String(l.tubo) === k && l.fecha && (!desde || l.fecha >= desde))
                .sort((a, b) => a.fecha.localeCompare(b.fecha));
            const cobrado = lects.reduce((a, l) => a + (typeof l.importe === 'number' ? l.importe : 0), 0);
            const ultimaLect = [...lects].reverse().find(l => typeof l.costoM3 === 'number');
            const puntos = pers.map((p, i) => ({ p, v: valores[i] })).filter(d => d.v !== null);
            const hoy = new Date();
            const hoyTxt = `${hoy.getDate()} de ${MESES_L[hoy.getMonth()]} de ${hoy.getFullYear()}`;
            const titulo = `Consumo de agua - Local ${fila.local || fila.tubo} - ${fila.nombre}`;

            // Gráfica: m³ por 30 días de este local, con su promedio de los últimos 12 periodos
            const W = 700, H = 230, izq = 42, der = 14, arriba = 10, abajo = 34;
            const t = puntos.map(d => new Date(d.p.fechaLectura).getTime());
            const t0 = t[0], t1 = t[t.length - 1];
            const x = v => izq + (W - izq - der) * (v - t0) / ((t1 - t0) || 1);
            const max = Math.max(1, ...puntos.map(d => d.v), fila.prom || 0);
            const paso = Math.pow(10, Math.floor(Math.log10(max))) / 2;
            const tope = Math.ceil(max / paso) * paso;
            const y = v => arriba + (H - arriba - abajo) * (1 - v / tope);
            let eje = '';
            for (let d = new Date(new Date(t0).getFullYear(), new Date(t0).getMonth() + 1, 1); d.getTime() <= t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
                const xx = x(d.getTime()), ene = d.getMonth() === 0;
                eje += `<line x1="${xx}" x2="${xx}" y1="${arriba}" y2="${H - abajo}" stroke="${ene ? '#ddd' : '#f2f2f2'}"/><text x="${xx}" y="${H - abajo + 12}" text-anchor="middle" font-size="8" fill="#999">${MESES[d.getMonth()]}</text>`
                    + (ene ? `<text x="${xx}" y="${H - abajo + 25}" text-anchor="middle" font-size="9" font-weight="600" fill="#666">${d.getFullYear()}</text>` : '');
            }
            const ticks = [0, tope / 4, tope / 2, tope * 3 / 4, tope];
            const svg = puntos.length ? `<svg viewBox="0 0 ${W} ${H}" width="100%">
                ${ticks.map(v => `<line x1="${izq}" x2="${W - der}" y1="${y(v)}" y2="${y(v)}" stroke="#eee"/><text x="${izq - 5}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="#999">${numero(v)}</text>`).join('')}
                ${eje}
                ${fila.prom ? `<line x1="${izq}" x2="${W - der}" y1="${y(fila.prom)}" y2="${y(fila.prom)}" stroke="#999" stroke-dasharray="4 3"/><text x="${W - der}" y="${y(fila.prom) - 4}" text-anchor="end" font-size="9" fill="#666">Promedio 12 periodos: ${numero(fila.prom, 1)} m³</text>` : ''}
                <polyline points="${puntos.map((d, i) => `${x(t[i])},${y(d.v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
                ${puntos.map((d, i) => `<circle cx="${x(t[i])}" cy="${y(d.v)}" r="2.5" fill="${color}"/>`).join('')}
            </svg>` : '<p class="gris">Sin lecturas para graficar.</p>';

            const html = `<div class="rep">
                <div class="rep-cab">
                    <img src="../css/logo.png" alt="La Fábrica de Chocolate">
                    <div><div class="rep-et">Reporte de consumo de agua</div><div class="rep-fecha">Emitido el ${hoyTxt}</div></div>
                </div>
                <h1>${esc(fila.nombre)}</h1>
                <p class="rep-sub">Local ${esc(fila.local || '-')} · Tubo ${esc(fila.tubo)} · ${desde ? `Contrato desde el ${fechaCorta(desde)}` : 'Todo el histórico'}${lects.length ? ` · Lecturas del ${fechaCorta(lects[0].fecha)} al ${fechaCorta(lects[lects.length - 1].fecha)}` : ''}</p>
                <div class="rep-tarjetas">
                    <div><span>Últimos 12 periodos</span><strong>${numero(fila.m12, 1)} m³</strong></div>
                    <div><span>Promedio por 30 días</span><strong>${fila.prom === null ? '-' : numero(fila.prom, 1) + ' m³'}</strong></div>
                    <div><span>Último periodo (30 días)</span><strong>${fila.ultimo === null ? '-' : numero(fila.ultimo, 1) + ' m³'}</strong></div>
                    <div><span>Total desde el inicio</span><strong>${numero(fila.total, 1)} m³</strong></div>
                    <div><span>Importe registrado</span><strong>${dinero(cobrado)}</strong></div>
                    <div><span>Costo m³ de la última lectura</span><strong>${ultimaLect ? dinero(ultimaLect.costoM3) : '-'}</strong></div>
                </div>
                <h2>Consumo por periodo (m³ por 30 días)</h2>
                ${svg}
                <h2>Lecturas</h2>
                <table class="rep-tabla">
                    <thead><tr><th>Fecha</th><th class="num">Lectura (m³)</th><th class="num">Consumo (m³)</th><th class="num">Costo m³</th><th class="num">Importe</th><th>Observaciones</th></tr></thead>
                    <tbody>${lects.map(l => `<tr>
                        <td>${fechaCorta(l.fecha)}</td>
                        <td class="num">${typeof l.lectura === 'number' ? numero(l.lectura, 3) : '-'}</td>
                        <td class="num">${typeof l.consumo === 'number' ? numero(l.consumo, 3) : '-'}</td>
                        <td class="num">${typeof l.costoM3 === 'number' ? dinero(l.costoM3) : '-'}</td>
                        <td class="num">${typeof l.importe === 'number' ? dinero(l.importe) : '-'}</td>
                        <td>${esc(l.observaciones || '')}</td>
                    </tr>`).join('')}</tbody>
                    <tfoot><tr><td>Total</td><td></td><td class="num">${numero(lects.reduce((a, l) => a + (typeof l.consumo === 'number' && l.consumo > 0 ? l.consumo : 0), 0), 3)}</td><td></td><td class="num">${dinero(cobrado)}</td><td></td></tr></tfoot>
                </table>
                <p class="rep-pie">Consumo por 30 días = consumo del periodo de lectura de SIAPA llevado a 30 días. La Fábrica de Chocolate · Panel de administración.</p>
            </div>`;
            imprimirReporte(html, titulo);
        }

        function imprimirReporte(html, titulo) {
            let cont = document.getElementById('reporte-impresion');
            if (!cont) {
                cont = document.createElement('div');
                cont.id = 'reporte-impresion';
                document.body.appendChild(cont);
                const st = document.createElement('style');
                st.textContent = `
                    #reporte-impresion { display: none; }
                    @page { size: letter portrait; margin: 12mm 14mm; }
                    @media print {
                        body > *:not(#reporte-impresion) { display: none !important; }
                        #reporte-impresion { display: block !important; }
                        * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    }
                    .rep { font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif; color: #333; font-size: 11px; }
                    .rep-cab { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 14px; }
                    .rep-cab img { height: 30px; }
                    .rep-cab > div { text-align: right; }
                    .rep-et { font-size: 13px; font-weight: 700; }
                    .rep-fecha { font-size: 10px; color: #777; }
                    .rep h1 { font-size: 18px; margin: 0 0 2px; }
                    .rep-sub { color: #666; margin: 0 0 12px; }
                    .rep h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #1f4e79; margin: 16px 0 6px; }
                    .rep-tarjetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
                    .rep-tarjetas div { border: 1px solid #ddd; border-radius: 6px; padding: 6px 9px; }
                    .rep-tarjetas span { display: block; font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: .03em; }
                    .rep-tarjetas strong { font-size: 14px; }
                    .rep-tabla { width: 100%; border-collapse: collapse; font-size: 10px; }
                    .rep-tabla th { text-align: left; color: #666; font-weight: 600; border-bottom: 1px solid #ccc; padding: 4px 6px; background: #f5f5f5; }
                    .rep-tabla td { padding: 3px 6px; border-bottom: 1px solid #eee; }
                    .rep-tabla .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
                    .rep-tabla tr { break-inside: avoid; }
                    .rep-tabla tfoot td { font-weight: 700; border-top: 1px solid #999; }
                    .rep-pie { margin-top: 12px; font-size: 9px; color: #999; }`;
                document.head.appendChild(st);
            }
            cont.innerHTML = html;
            const img = cont.querySelector('img');
            const tituloPrevio = document.title;
            const imprimir = () => {
                document.title = titulo; // nombre sugerido del PDF
                window.print();
                setTimeout(() => { document.title = tituloPrevio; }, 1000);
            };
            if (img && !img.complete) { img.onload = img.onerror = imprimir; } else imprimir();
        }

        // Leyenda como tabla ordenable: cada renglón lleva la muestra de color de su línea
        const ORDEN_TABLA = {};
        function tablaLeyenda(id, series, tabla, ocultos, muestra) {
            const o = ORDEN_TABLA[id] || (ORDEN_TABLA[id] = { ...tabla.defecto });
            const col = tabla.columnas.find(c => c.k === o.col) || tabla.columnas[0];
            const valorDe = s => { const f = tabla.filas[s.k]; return col.orden ? col.orden(f) : f[col.k]; };
            const filas = [...series].sort((a, b) => {
                const x = valorDe(a), y = valorDe(b);
                if (x === null || x === undefined) return 1;
                if (y === null || y === undefined) return -1;
                return (typeof x === 'string' ? x.localeCompare(y, 'es', { numeric: true }) : x - y) * o.dir;
            });
            return `<div class="tabla-ley"><table>
                <thead><tr><th class="sw-th"><label class="switch sw-todos" title="${ocultos.size < series.length ? 'Apagar todos' : 'Prender todos'}"><input type="checkbox" ${ocultos.size === 0 ? 'checked' : ''}><span class="slider"></span></label></th><th></th>${tabla.columnas.map(c => `<th data-col="${c.k}"${c.num ? ' data-num="1" class="num' : ' class="'}${c.k === o.col ? ' act' : ''}" title="Ordenar por ${c.t.toLowerCase()}">${c.t}<span class="flecha">${c.k === o.col ? (o.dir > 0 ? '▲' : '▼') : '▲▼'}</span></th>`).join('')}</tr></thead>
                <tbody>${filas.map(s => { const f = tabla.filas[s.k]; return `<tr class="ley${ocultos.has(s.k) ? ' off' : ''}" data-k="${esc(s.k)}" title="Clic para ocultar o mostrar la línea">
                    <td class="sw-td"><span class="switch"><input type="checkbox" tabindex="-1" ${ocultos.has(s.k) ? '' : 'checked'}><span class="slider"></span></span></td>
                    <td>${muestra(s)}</td>
                    ${tabla.columnas.map(c => `<td${c.num ? ' class="num"' : ''}>${c.fmt ? c.fmt(f[c.k]) : esc(f[c.k] ?? '')}</td>`).join('')}
                </tr>`; }).join('')}</tbody>
            </table>
            ${tabla.reporte ? (series.length - ocultos.size === 1
                ? `<div class="reporte-barra"><button class="btn btn-reporte">Reporte de ${esc(tabla.filas[series.find(x => !ocultos.has(x.k)).k].nombre || 'este local')} (PDF)</button></div>`
                : `<p class="gris" style="margin:10px 0 0">Para sacar el reporte de un local, apaga todos con el interruptor del encabezado y prende solo ese.</p>`) : ''}
            </div>`;
        }

        // Barras simples, una sola medida por gráfica, con tooltip al pasar el mouse
        function grafica(id, titulo, valor, fmt) {
            const el = document.getElementById(id);
            const datos = periodos.map(p => ({ p, v: valor(p) || 0 }));
            const W = 560, H = 190, izq = 46, abajo = 22, arriba = 6;
            const max = Math.max(...datos.map(d => d.v)) || 1;
            const paso = Math.pow(10, Math.floor(Math.log10(max))) / 2;
            const tope = Math.ceil(max / paso) * paso;
            const ticks = [0, tope / 2, tope];
            const ancho = (W - izq) / datos.length, barra = Math.max(4, ancho - 2);
            const y = v => arriba + (H - arriba - abajo) * (1 - v / tope);
            const etiquetaCada = Math.ceil(datos.length / 9);
            el.innerHTML = `<h3>${titulo}</h3>
                <div class="leyenda"><span><i style="background:#1f4e79"></i>Lectura tomada</span><span><i style="background-image:repeating-linear-gradient(45deg,#1f4e79 0 2px,#fbf0dd 2px 4px)"></i>Con nota de SIAPA (210 / 206)</span></div>
                <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">
                    <defs><pattern id="rayas" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#c9d0f7"/><rect width="2" height="4" fill="#1f4e79"/></pattern></defs>
                    ${ticks.map(t => `<line x1="${izq}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#eee"/><text x="${izq - 6}" y="${y(t) + 3}" text-anchor="end">${fmt(t).replace(' m³', '')}</text>`).join('')}
                    ${datos.map((d, i) => {
                        const x = izq + i * ancho + (ancho - barra) / 2, top = y(d.v), alto = Math.max(0, H - abajo - top);
                        const r = Math.min(4, barra / 2, alto);
                        const path = `M${x},${H - abajo} V${top + r} Q${x},${top} ${x + r},${top} H${x + barra - r} Q${x + barra},${top} ${x + barra},${top + r} V${H - abajo} Z`;
                        return `<g data-i="${i}">
                            <rect class="hit" x="${izq + i * ancho}" y="${arriba}" width="${ancho}" height="${H - abajo - arriba}"/>
                            <path class="barra-g ${d.p.nota ? 'nota' : ''}" d="${path}" style="pointer-events:none"/>
                            ${i % etiquetaCada === 0 || i === datos.length - 1 ? `<text x="${izq + i * ancho + ancho / 2}" y="${H - 6}" text-anchor="middle">${mesCorto(d.p.fechaLectura)}</text>` : ''}
                        </g>`;
                    }).join('')}
                </svg>
                <div class="tip"></div>`;
            const tip = el.querySelector('.tip');
            el.querySelectorAll('g[data-i]').forEach(g => {
                const d = datos[+g.dataset.i];
                g.querySelector('.hit').addEventListener('mousemove', e => {
                    tip.innerHTML = `<strong>${fmt(d.v)}</strong>${mesLargo(d.p.fechaLectura)} · lectura ${fechaCorta(d.p.fechaLectura)}<br><span class="gris">${numero(d.p.m3)} m³ en ${numero(d.p.dias)} días · ${pesos(d.p.importe)}${d.p.nota ? ` · nota ${esc(d.p.nota)}` : ''}</span>`;
                    tip.style.display = 'block';
                    const caja = el.getBoundingClientRect();
                    let left = e.clientX - caja.left + 12;
                    if (left + tip.offsetWidth > caja.width) left = e.clientX - caja.left - tip.offsetWidth - 12;
                    tip.style.left = Math.max(4, left) + 'px';
                    tip.style.top = (e.clientY - caja.top - tip.offsetHeight - 10) + 'px';
                });
                g.querySelector('.hit').addEventListener('mouseleave', () => { tip.style.display = 'none'; });
            });
        }

        function abrirVentana(html, alAbrir) {
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<div class="modal">${html}</div>`;
            document.body.appendChild(fondo);
            const cerrar = () => fondo.remove();
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.closest('[data-cerrar]')) cerrar(); });
            alAbrir(fondo, cerrar);
        }

        // Captura de un recibo nuevo (periodo + recibo) o edición de un periodo existente
        function ventanaRecibo(periodo) {
            const p = periodo || {};
            const ed = !!periodo;
            const campo = (id, label, tipo = 'number', valor = '', extra = '') => `<div ${extra}><label>${label}</label><input id="${id}" type="${tipo}" ${tipo === 'number' ? 'step="0.01"' : ''} value="${esc(valor ?? '')}"></div>`;
            abrirVentana(`
                <h3>${ed ? 'Editar periodo' : 'Capturar recibo de SIAPA'}</h3>
                <p class="sub">${ed ? `Lectura del ${fechaCorta(p.fechaLectura)}.` : 'Copia los datos del recibo. El periodo y su consumo alimentan la tabla y las gráficas.'}</p>
                <h4>Consumo del periodo</h4>
                <div class="campos">
                    ${campo('f_fecha', 'Fecha de lectura', 'date', p.fechaLectura || '', ed ? 'style="pointer-events:none;opacity:.6"' : '')}
                    ${campo('f_lectura', 'Lectura', 'number', p.lectura)}
                    <div><label>Nota</label><input id="f_nota" value="${esc(p.nota || '')}" placeholder="Ej. 210"></div>
                    ${campo('f_m3', 'Consumo m³', 'number', p.m3)}
                    ${campo('f_dias', 'Días', 'number', p.dias)}
                    ${campo('f_importe', 'Importe del mes (con IVA)', 'number', p.importe)}
                </div>
                ${ed ? '' : `<h4>Recibo</h4>
                <div class="campos">
                    ${campo('r_del', 'Periodo del', 'date')}
                    ${campo('r_al', 'Periodo al', 'date')}
                    ${campo('r_emision', 'Fecha de emisión', 'date', hoyISO())}
                    ${campo('r_vence', 'Vencimiento', 'date')}
                    ${campo('r_total', 'Total a pagar', 'number')}
                    ${campo('r_recargos', 'Recargos', 'number')}
                </div>
                <h4>Detalle de la facturación (opcional)</h4>
                <div class="campos">
                    ${campo('d_consumo', 'Consumo del periodo')}
                    ${campo('d_alc', 'Alcantarillado')}
                    ${campo('d_san', 'Plantas de saneamiento')}
                    ${campo('d_desc', 'Descarga aguas residuales')}
                    ${campo('d_iva', 'IVA')}
                </div>`}
                <div class="pie">
                    <span class="msg" id="vmsg"></span>
                    <button class="btn-sec" data-cerrar>Cancelar</button>
                    <button class="btn" id="vguardar">${ed ? 'Guardar' : 'Guardar recibo'}</button>
                </div>`, (fondo, cerrar) => {
                const v = id => fondo.querySelector('#' + id)?.value.trim() ?? '';
                const n = id => { const x = v(id); return x === '' ? null : parseFloat(x); };
                fondo.querySelector('#vguardar').addEventListener('click', async () => {
                    const msg = fondo.querySelector('#vmsg');
                    const error = t => { msg.innerHTML = `<span class="err">${t}</span>`; };
                    const fecha = v('f_fecha');
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return error('Falta la fecha de lectura.');
                    const m3 = n('f_m3'), dias = n('f_dias'), importe = n('f_importe');
                    if (!(m3 >= 0) || !(dias > 0) || !(importe >= 0)) return error('Faltan consumo, días o importe.');
                    if (!ed && periodos.some(x => x.fechaLectura === fecha) && !confirm('Ya hay un periodo con esa fecha de lectura. ¿Reemplazarlo?')) return;
                    const usuario = getCurrentUser().email;
                    const sello = { actualizadoPor: usuario, actualizadoEn: serverTimestamp() };
                    const tareas = [setDoc(doc(db, 'siapa_periodos', fecha), {
                        fechaLectura: fecha, lectura: n('f_lectura'), nota: v('f_nota'), m3, dias,
                        m3Dia: r2(m3 / dias * 1000) / 1000, importe, origen: ed ? (p.origen || 'panel') : 'panel', ...sello
                    }, { merge: true })];
                    if (!ed) {
                        const emision = v('r_emision');
                        if (!/^\d{4}-\d{2}-\d{2}$/.test(emision)) return error('Falta la fecha de emisión del recibo.');
                        const desglose = { consumo: n('d_consumo'), alcantarillado: n('d_alc'), saneamiento: n('d_san'), descarga: n('d_desc'), iva: n('d_iva') };
                        tareas.push(setDoc(doc(db, 'siapa_recibos', emision), {
                            periodoDel: v('r_del') || null, periodoAl: v('r_al') || fecha, emision, vence: v('r_vence') || null,
                            totalMes: importe, totalAPagar: n('r_total') ?? importe, recargos: n('r_recargos'),
                            desglose: Object.values(desglose).some(x => x !== null) ? desglose : null,
                            cuenta: recibos.find(r => r.cuenta)?.cuenta || null, origen: 'panel', ...sello
                        }));
                    }
                    const btn = fondo.querySelector('#vguardar');
                    btn.disabled = true;
                    try {
                        await Promise.all(tareas);
                        cerrar();
                        cargar(`<span class="ok">${ed ? 'Periodo actualizado.' : 'Recibo guardado.'}</span>`);
                    } catch (err) {
                        console.error(err);
                        btn.disabled = false;
                        error('No se pudo guardar: ' + esc(err.message));
                    }
                });
            });
        }

        function ventanaPago() {
            abrirVentana(`
                <h3>Registrar pago a SIAPA</h3>
                <p class="sub">Monto total pagado, como aparece en el comprobante.</p>
                <div class="campos">
                    <div><label>Fecha de pago</label><input id="g_fecha" type="date" value="${hoyISO()}"></div>
                    <div><label>Monto</label><input id="g_monto" type="number" step="0.01" min="0"></div>
                    <div class="ancho"><label>Nota (opcional)</label><input id="g_nota" placeholder="Ej. liquida adeudo con recargos"></div>
                </div>
                <div class="pie">
                    <span class="msg" id="gmsg"></span>
                    <button class="btn-sec" data-cerrar>Cancelar</button>
                    <button class="btn" id="gguardar">Registrar pago</button>
                </div>`, (fondo, cerrar) => {
                fondo.querySelector('#gguardar').addEventListener('click', async () => {
                    const fecha = fondo.querySelector('#g_fecha').value, monto = parseFloat(fondo.querySelector('#g_monto').value);
                    const msg = fondo.querySelector('#gmsg');
                    if (!fecha || !(monto > 0)) { msg.innerHTML = '<span class="err">Escribe la fecha y el monto.</span>'; return; }
                    try {
                        await setDoc(doc(db, 'siapa_pagos', `${fecha}_${Math.round(monto * 100)}`), {
                            fecha, monto: r2(monto), nota: fondo.querySelector('#g_nota').value.trim(),
                            origen: 'panel', capturadoPor: getCurrentUser().email, capturadoEn: serverTimestamp()
                        });
                        cerrar();
                        cargar(`<span class="ok">Pago de ${dinero(monto)} registrado.</span>`);
                    } catch (err) {
                        msg.innerHTML = `<span class="err">No se pudo guardar: ${esc(err.message)}</span>`;
                    }
                });
            });
        }

        async function borrar(coleccion, id, que) {
            if (!confirm(`¿Borrar ${que}?`)) return;
            try {
                await deleteDoc(doc(db, coleccion, id));
                cargar('<span class="ok">Borrado.</span>');
            } catch (err) {
                document.getElementById('msg').innerHTML = `<span class="err">No se pudo borrar: ${esc(err.message)}</span>`;
            }
        }
    </script>
</body>
</html>
