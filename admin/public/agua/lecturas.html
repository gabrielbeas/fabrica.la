<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturas de Agua - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>F</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; color: #333; margin: 0; }
        .main { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: #999; font-size: 14px; margin: 0 0 25px; }

        .controles { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; margin-bottom: 20px; }
        .campo label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: 500; }
        .campo input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        .campo input:focus { outline: none; border-color: #667eea; }
        .costo-fijo { font-size: 18px; font-weight: 600; padding: 9px 0; }
        .nota-costo { font-size: 12px; color: #999; margin: -12px 0 16px; }
        .aviso-costo { background: #fff8e1; color: #8a5a00; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin: 0 0 16px; line-height: 1.6; }
        .aviso-costo .btn-sec { margin-left: 8px; padding: 6px 12px; }
        .costo-dif { color: #b26a00; font-weight: 600; }
        .costo-nuevo { display: block; font-size: 11px; color: #667eea; }

        .tabla-wrap { border: 1px solid #eee; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 12px 14px; background: #fafafa; border-bottom: 1px solid #eee; }
        td { padding: 10px 14px; border-bottom: 1px solid #f3f3f3; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
        .tubo { font-weight: 600; }
        .fecha-ant { display: block; font-size: 12px; color: #aaa; }
        td input { width: 130px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; text-align: right; }
        td input:focus { outline: none; border-color: #667eea; }
        tr.alerta td { background: #fff8e1; }
        tr.alerta .consumo { color: #b26a00; font-weight: 600; }
        tr.capturado td { background: #f1f8f4; }
        .etiqueta { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f5e9; color: #2e7d32; margin-left: 6px; }
        .btn-borrar { margin-left: 8px; font-size: 11px; padding: 2px 8px; border: 1px solid #f3c1c1; background: white; color: #c62828; border-radius: 10px; cursor: pointer; }
        .btn-borrar:hover { background: #c62828; color: white; }
        tfoot td { font-weight: 600; background: #fafafa; border-top: 1px solid #eee; }

        .acciones { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { background: #f5f5f5; color: #555; border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
        .mensaje { font-size: 14px; }
        .ok { color: #2e7d32; } .err { color: #c62828; }
        .cargando { color: #999; padding: 40px 0; text-align: center; }

        /* Calendario propio (para poder marcar días con lecturas) */
        .cal-wrap { position: relative; }
        .cal-btn { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; background: white; cursor: pointer; min-width: 190px; text-align: left; color: #333; }
        .cal-btn:hover, .cal-btn:focus { border-color: #667eea; outline: none; }
        .cal { position: absolute; top: calc(100% + 6px); left: 0; z-index: 900; background: white; border: 1px solid #ddd; border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.15); padding: 12px; width: 290px; }
        .cal-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cal-cab strong { font-size: 15px; text-transform: capitalize; }
        .cal-cab button { border: none; background: none; font-size: 22px; line-height: 1; padding: 2px 10px; cursor: pointer; color: #555; border-radius: 6px; }
        .cal-cab button:hover:not(:disabled) { background: #f3f4fe; }
        .cal-cab button:disabled { color: #ddd; cursor: default; }
        .cal-sem, .cal-dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
        .cal-sem span { font-size: 11px; color: #999; padding: 4px 0; }
        .cal-dias button { position: relative; border: none; background: none; height: 36px; border-radius: 6px; font-size: 14px; cursor: pointer; color: #333; }
        .cal-dias button:hover:not(:disabled) { background: #f3f4fe; }
        .cal-dias button:disabled { color: #ccc; cursor: default; }
        .cal-dias button.hoy { font-weight: 700; }
        .cal-dias button.sel { background: #667eea; color: white; }
        .punto-lec { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #c62828; }
        .cal-dias .punto-lec { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); }
        .cal-dias button.sel .punto-lec { background: white; }
        .cal-pie { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f0f0f0; font-size: 12px; color: #888; }
        .cal-pie button { border: none; background: none; color: #667eea; font-size: 13px; cursor: pointer; }

        /* Filas con histórico */
        tr.con-historico { cursor: pointer; }
        tr.con-historico:hover td { background: #f3f4fe; }
        tr.con-historico .tubo { color: #667eea; text-decoration: underline; text-underline-offset: 3px; }

        /* Ventana de histórico */
        .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 1000; overflow-y: auto; }
        .modal { background: white; border-radius: 12px; width: 100%; max-width: 900px; padding: 26px 30px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .modal-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 2px solid #333; padding-bottom: 14px; margin-bottom: 18px; }
        .modal-cab .emp { font-size: 12px; color: #777; letter-spacing: .05em; text-transform: uppercase; }
        .modal-cab h3 { margin: 6px 0 0; font-size: 18px; }
        .resumen-h { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
        .resumen-h div { border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; }
        .resumen-h span { display: block; font-size: 11px; color: #888; }
        .resumen-h strong { display: block; font-size: 16px; margin-top: 4px; font-variant-numeric: tabular-nums; }
        .tabla-h td { padding: 7px 10px; font-size: 13px; }
        .tabla-h th { padding: 9px 10px; }
        .tabla-h tr.sub td { font-weight: 600; background: #fafafa; border-top: 1px solid #ddd; }
        .tabla-h tr.neg td { background: #fff8e1; }
        .tabla-h tr.anom td { background: #fdecea; color: #c62828; }
        .anom-txt { font-size: 11px; font-style: normal; font-weight: 600; }
        .barra-c { width: 120px; }
        .barra-c span { display: block; height: 8px; border-radius: 4px; background: #667eea; opacity: .6; }
        .nota-h { font-size: 12px; color: #888; margin: 14px 0 0; }
        @media (max-width: 700px) { .resumen-h { grid-template-columns: repeat(2, 1fr); } .barra-c { display: none; } }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando lecturas...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js';
        import { getCurrentUser, isAuthenticated, esAdmin, db, auth } from '../../../js/auth.js';
        import {
            collection, getDocs, doc, getDoc, setDoc, deleteDoc, writeBatch, serverTimestamp
        } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const COSTO_M3_INICIAL = 78.64;
        // URL del Apps Script "Historial.gs" (Web app). Vacío = no se envía historial a Sheets.
        const HISTORIAL_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbzPuQl_iSzL7IuZGqakNUr8lzS3YD3A6mc5uplW9fNzVpkaKAOAtsXz6Jmez65FTljn/exec';

        // Agrega filas en la pestaña HISTORIAL PANEL del Sheet de operación.
        // Nunca bloquea: si falla, la lectura ya quedó en Firestore.
        async function enviarHistorial(filas) {
            if (!HISTORIAL_SHEETS_URL || !filas.length) return { ok: true, omitido: true };
            try {
                await auth.authStateReady();
                if (!auth.currentUser) return { ok: false, error: 'sesión de Firebase no disponible' };
                const idToken = await auth.currentUser.getIdToken();
                const res = await fetch(HISTORIAL_SHEETS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ idToken, lecturas: filas })
                });
                return await res.json();
            } catch (err) {
                return { ok: false, error: err.message };
            }
        }
        const empresaDe = (tubo) => (medidores.find(m => m.id === tubo) || {}).empresa || '';
        const app = document.getElementById('app');

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            iniciar().catch(err => {
                console.error(err);
                app.innerHTML = `<h1>Lecturas de Agua</h1><p class="err">No se pudieron cargar los datos: ${err.message}</p>`;
            });
        }

        // ---------- Estado ----------
        let medidores = [];     // [{id, tubo, empresa}]
        let lecturas = [];      // todas las lecturas [{id, tubo, fecha, lectura, ...}]
        let costoM3 = COSTO_M3_INICIAL;

        const fmt = (n, d = 3) => (n === null || n === undefined || isNaN(n)) ? '-' :
            Number(n).toLocaleString('es-MX', { minimumFractionDigits: d, maximumFractionDigits: d });
        const dinero = (n) => (n === null || n === undefined || isNaN(n)) ? '-' :
            '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const hoy = () => {
            const d = new Date();
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        };
        const escape = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Orden: tubos numéricos primero, luego SG, MTO
        const ordenTubo = (a, b) => {
            const na = parseInt(a.id, 10), nb = parseInt(b.id, 10);
            if (!isNaN(na) && !isNaN(nb)) return na - nb;
            if (!isNaN(na)) return -1;
            if (!isNaN(nb)) return 1;
            return a.id.localeCompare(b.id);
        };

        async function cargarDatos() {
            const [snapMed, snapLec, snapCfg] = await Promise.all([
                getDocs(collection(db, 'agua_medidores')),
                getDocs(collection(db, 'agua_lecturas')),
                getDoc(doc(db, 'agua_config', 'general'))
            ]);
            medidores = snapMed.docs.map(d => ({ id: d.id, ...d.data() }))
                .filter(m => m.activo !== false).sort(ordenTubo);
            lecturas = snapLec.docs.map(d => ({ id: d.id, ...d.data() }));
            if (snapCfg.exists() && typeof snapCfg.data().costoM3 === 'number') costoM3 = snapCfg.data().costoM3;
        }

        // Última lectura válida de un tubo ANTES de la fecha dada
        function lecturaAnterior(tubo, fecha) {
            return lecturas
                .filter(l => l.tubo === tubo && l.fecha < fecha && typeof l.lectura === 'number')
                .sort((a, b) => a.fecha < b.fecha ? 1 : -1)[0] || null;
        }
        const lecturaEnFecha = (tubo, fecha) => lecturas.find(l => l.tubo === tubo && l.fecha === fecha) || null;

        async function iniciar() {
            await cargarDatos();
            const admin = esAdmin();

            app.innerHTML = `
                <h1>Lecturas de Agua</h1>
                <p class="sub">Captura la lectura de cada medidor. El consumo y el importe se calculan solos.${esAdmin() ? ' <a href="siapa.html" style="color:#667eea;text-decoration:none">Ver recibos de SIAPA →</a>' : ''}</p>

                <div class="controles">
                    <div class="campo">
                        <label for="fecha">Fecha de lectura</label>
                        <input type="hidden" id="fecha" value="${hoy()}">
                        <div class="cal-wrap">
                            <button type="button" class="cal-btn" id="fechaBtn"></button>
                            <div class="cal" id="cal" hidden></div>
                        </div>
                    </div>
                    <div class="campo">
                        <label for="costo">Costo para lecturas nuevas (m³, IVA incluido)</label>
                        ${admin
                            ? `<input type="number" id="costo" step="0.01" min="0" value="${costoM3}" style="width:120px">`
                            : `<div class="costo-fijo">${dinero(costoM3)}</div>`}
                    </div>
                    ${admin ? `<button class="btn-sec" id="guardarCosto">Guardar costo</button>` : ''}
                </div>
                <p class="nota-costo">Se aplica a las lecturas que captures o corrijas. Las que ya están guardadas conservan su costo (columna «Costo m³»).</p>
                <div class="aviso-costo" id="avisoCosto" hidden></div>

                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead>
                            <tr>
                                <th>Tubo</th>
                                <th>Empresa</th>
                                <th class="num">Lectura anterior (m³)</th>
                                <th class="num">Lectura actual (m³)</th>
                                <th class="num">Consumo (m³)</th>
                                <th class="num">Costo m³</th>
                                <th class="num">Importe</th>
                            </tr>
                        </thead>
                        <tbody id="filas"></tbody>
                        <tfoot>
                            <tr>
                                <td colspan="4">Total</td>
                                <td class="num" id="totalConsumo">-</td>
                                <td></td>
                                <td class="num" id="totalImporte">-</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="acciones">
                    <button class="btn" id="guardar">Guardar lecturas</button>
                    <span class="mensaje" id="mensaje"></span>
                </div>
            `;

            document.getElementById('fecha').addEventListener('change', dibujarFilas);
            iniciarCalendario();
            if (admin) {
                document.getElementById('costo').addEventListener('input', recalcularTodo);
                document.getElementById('guardarCosto').addEventListener('click', guardarCosto);
            }
            document.getElementById('guardar').addEventListener('click', guardarLecturas);
            dibujarFilas();
        }

        function costoActual() {
            const input = document.getElementById('costo');
            const v = input ? parseFloat(input.value) : costoM3;
            return isNaN(v) ? 0 : v;
        }

        function dibujarFilas() {
            const fecha = document.getElementById('fecha').value;
            const tbody = document.getElementById('filas');
            tbody.innerHTML = medidores.map(m => {
                const ant = lecturaAnterior(m.id, fecha);
                const existente = lecturaEnFecha(m.id, fecha);
                return `
                    <tr id="fila-${m.id}" class="${existente ? 'capturado' : ''}">
                        <td class="tubo">${escape(m.tubo)}</td>
                        <td>${escape(m.empresa)}${existente ? '<span class="etiqueta">Capturada</span>' : ''}${existente && esAdmin() ? `<button class="btn-borrar" data-borrar="${existente.id}">Eliminar</button>` : ''}</td>
                        <td class="num">${ant ? fmt(ant.lectura) : '-'}<span class="fecha-ant">${ant ? ant.fecha : 'sin lecturas previas'}</span></td>
                        <td class="num"><input type="number" step="0.001" min="0" inputmode="decimal"
                            data-tubo="${m.id}" value="${existente && typeof existente.lectura === 'number' ? existente.lectura : ''}" placeholder="0.000"></td>
                        <td class="num consumo" id="consumo-${m.id}">-</td>
                        <td class="num" id="costo-${m.id}">-</td>
                        <td class="num" id="importe-${m.id}">-</td>
                    </tr>`;
            }).join('');
            tbody.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => recalcular(inp.dataset.tubo)));
            tbody.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', () => eliminarLectura(b.dataset.borrar)));
            // Filas con histórico: clic en cualquier parte de la fila (menos el campo de captura y botones)
            medidores.forEach(m => {
                const fila = document.getElementById(`fila-${m.id}`);
                fila.classList.add('con-historico');
                fila.title = 'Ver histórico de lecturas';
                fila.addEventListener('click', e => { if (!e.target.closest('input, button')) verHistorico(m); });
            });
            recalcularTodo();
        }

        // ---------- Calendario de fecha de lectura (punto rojo = días con lecturas grabadas) ----------
        const MESES_LARGOS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        let calMes = null; // 'YYYY-MM' que se está viendo
        function iniciarCalendario() {
            const inp = document.getElementById('fecha'), btn = document.getElementById('fechaBtn'), cal = document.getElementById('cal');
            const pintarBoton = () => { const [y, m, d] = inp.value.split('-'); btn.textContent = `${+d} ${MESES_LARGOS[+m - 1]} ${y}`; };
            pintarBoton();
            btn.addEventListener('click', () => {
                if (!cal.hidden) { cal.hidden = true; return; }
                calMes = inp.value.slice(0, 7); pintarCal(); cal.hidden = false;
            });
            // composedPath: el botón clicado puede ya no estar en la página (se redibuja el mes), así que se revisa la ruta original del clic
            document.addEventListener('click', e => { if (!e.composedPath().some(n => n.classList?.contains('cal-wrap'))) cal.hidden = true; });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') cal.hidden = true; });
            cal.addEventListener('click', e => {
                const t = e.target.closest('[data-accion], [data-dia]');
                if (!t || t.disabled) return;
                if (t.dataset.dia) {
                    inp.value = t.dataset.dia; pintarBoton(); cal.hidden = true;
                    inp.dispatchEvent(new Event('change'));
                    return;
                }
                const [y, m] = calMes.split('-').map(Number);
                if (t.dataset.accion === 'hoy') { inp.value = hoy(); pintarBoton(); cal.hidden = true; inp.dispatchEvent(new Event('change')); return; }
                const d = new Date(y, m - 1 + (t.dataset.accion === 'sig' ? 1 : -1), 1);
                calMes = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                pintarCal();
            });
            function pintarCal() {
                const [y, m] = calMes.split('-').map(Number);
                const conLecturas = new Set(lecturas.map(l => l.fecha));
                const primero = new Date(y, m - 1, 1).getDay();          // 0 = domingo
                const dias = new Date(y, m, 0).getDate();
                const limite = hoy(), elegido = inp.value;
                let celdas = '';
                for (let i = 0; i < primero; i++) celdas += '<span></span>';
                for (let d = 1; d <= dias; d++) {
                    const f = `${calMes}-${String(d).padStart(2, '0')}`;
                    const n = lecturas.filter(l => l.fecha === f).length;
                    celdas += `<button type="button" data-dia="${f}" class="${f === elegido ? 'sel' : ''} ${f === limite ? 'hoy' : ''}" ${f > limite ? 'disabled' : ''}
                        ${n ? `title="${n} lectura${n > 1 ? 's' : ''} grabada${n > 1 ? 's' : ''}"` : ''}>${d}${conLecturas.has(f) ? '<i class="punto-lec"></i>' : ''}</button>`;
                }
                const sigDeshabilitado = calMes >= limite.slice(0, 7);
                cal.innerHTML = `
                    <div class="cal-cab">
                        <button type="button" data-accion="ant" aria-label="Mes anterior">‹</button>
                        <strong>${MESES_LARGOS[m - 1]} ${y}</strong>
                        <button type="button" data-accion="sig" aria-label="Mes siguiente" ${sigDeshabilitado ? 'disabled' : ''}>›</button>
                    </div>
                    <div class="cal-sem"><span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span></div>
                    <div class="cal-dias">${celdas}</div>
                    <div class="cal-pie"><span><i class="punto-lec"></i> Con lecturas grabadas</span><button type="button" data-accion="hoy">Hoy</button></div>`;
            }
        }

        // ---------- Histórico por tubo (clic en cualquier fila) ----------
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fechaCorta = f => f ? f.split('-').reverse().join('/') : '-';
        const periodoTxt = p => { if (!/^\d{4}-\d{2}$/.test(p || '')) return '-'; const [y, m] = p.split('-'); return `${MESES[+m - 1]} ${y}`; };

        function verHistorico(m) {
            const lista = lecturas.filter(l => l.tubo === m.id && typeof l.lectura === 'number')
                .sort((a, b) => a.fecha.localeCompare(b.fecha));
            // Consumo e importe: los guardados; si faltan, se calculan contra la lectura anterior
            const filas = lista.map((l, i) => {
                const prev = lista[i - 1];
                const consumo = typeof l.consumo === 'number' ? l.consumo : (prev ? +(l.lectura - prev.lectura).toFixed(3) : null);
                const costo = typeof l.costoM3 === 'number' ? l.costoM3 : null;
                const importe = typeof l.importe === 'number' ? l.importe : (consumo !== null && costo !== null ? +(consumo * costo).toFixed(2) : null);
                return { ...l, consumo, costo, importe };
            });
            // Consumos imposibles (p. ej. el medidor dio la vuelta a 99,998) se marcan y NO entran en totales
            const ANOMALO = 1000; // m³ en una sola lectura
            filas.forEach(f => { f.anomala = (f.consumo || 0) > ANOMALO; });
            const validas = filas.filter(f => !f.anomala);
            const anomalas = filas.length - validas.length;
            const maxC = Math.max(1, ...validas.map(f => f.consumo || 0));
            const totalC = validas.reduce((s, f) => s + (f.consumo || 0), 0);
            const totalI = validas.reduce((s, f) => s + (f.importe || 0), 0);
            const anios = [...new Set(filas.map(f => f.fecha.slice(0, 4)))];
            const cuerpo = anios.map(a => {
                const del = filas.filter(f => f.fecha.startsWith(a));
                const ok = del.filter(f => !f.anomala);
                const c = ok.reduce((s, f) => s + (f.consumo || 0), 0), imp = ok.reduce((s, f) => s + (f.importe || 0), 0);
                return del.map(f => `
                    <tr class="${f.anomala ? 'anom' : f.consumo < 0 ? 'neg' : ''}" ${f.anomala ? 'title="Consumo imposible: no se suma en los totales. Revisa esta lectura."' : f.consumo < 0 ? 'title="Consumo negativo: la lectura es menor que la anterior"' : ''}>
                        <td>${fechaCorta(f.fecha)}</td>
                        <td>${periodoTxt(f.periodo || f.fecha.slice(0, 7))}</td>
                        <td class="num">${fmt(f.lectura)}</td>
                        <td class="num">${f.consumo === null ? 'primera' : fmt(f.consumo)}</td>
                        <td class="barra-c">${f.anomala ? '<em class="anom-txt">anómala</em>' : `<span style="width:${Math.max(0, (f.consumo || 0) / maxC * 100)}%"></span>`}</td>
                        <td class="num">${f.costo === null ? '-' : dinero(f.costo)}</td>
                        <td class="num">${dinero(f.importe)}</td>
                    </tr>`).join('') +
                    `<tr class="sub"><td colspan="3">Total ${a} (${del.length} lectura${del.length > 1 ? 's' : ''})</td><td class="num">${fmt(c)}</td><td></td><td></td><td class="num">${dinero(imp)}</td></tr>`;
            }).join('');

            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `
                <div class="modal" role="dialog" aria-label="Histórico de lecturas">
                    <div class="modal-cab">
                        <div><div class="emp">Histórico de lecturas de agua</div><h3>Tubo ${escape(m.tubo)} · ${escape(m.empresa)}</h3></div>
                        <button class="btn-sec" data-cerrar>Cerrar</button>
                    </div>
                    ${filas.length ? `
                    <div class="resumen-h">
                        <div><span>Lecturas</span><strong>${filas.length}</strong></div>
                        <div><span>Desde</span><strong>${fechaCorta(filas[0].fecha)}</strong></div>
                        <div><span>Consumo total</span><strong>${fmt(totalC)} m³</strong></div>
                        <div><span>Importe total</span><strong>${dinero(totalI)}</strong></div>
                        <div><span>Promedio por lectura</span><strong>${fmt(totalC / Math.max(1, filas.filter(f => f.consumo !== null).length))} m³</strong></div>
                    </div>
                    <table class="tabla-h">
                        <thead><tr><th>Fecha</th><th>Periodo</th><th class="num">Lectura (m³)</th><th class="num">Consumo (m³)</th><th></th><th class="num">Costo m³</th><th class="num">Importe</th></tr></thead>
                        <tbody>${cuerpo}</tbody>
                    </table>
                    <p class="nota-h">Importes con IVA incluido, al costo por m³ vigente en cada lectura.
                        En amarillo: consumo negativo (la lectura bajó).${anomalas ? ` <strong style="color:#c62828">En rojo: ${anomalas} lectura${anomalas > 1 ? 's' : ''} con consumo imposible (más de ${ANOMALO.toLocaleString('es-MX')} m³); no se suma${anomalas > 1 ? 'n' : ''} en los totales.</strong>` : ''}</p>` : '<p class="nota-h">Este tubo no tiene lecturas registradas.</p>'}
                </div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
        }

        let eliminando = false;
        async function eliminarLectura(id) {
            if (eliminando) return; // evita doble clic
            const l = lecturas.find(x => x.id === id);
            if (!l) return;
            if (!confirm(`¿Eliminar la lectura del tubo ${l.tubo} del ${l.fecha} (${fmt(l.lectura)} m³)?\n\nNo se puede deshacer.`)) return;
            eliminando = true;
            document.querySelectorAll('[data-borrar]').forEach(b => b.disabled = true);
            try {
                await deleteDoc(doc(db, 'agua_lecturas', id));
                await enviarHistorial([{
                    accion: 'eliminada', id, fecha: l.fecha, tubo: l.tubo, empresa: empresaDe(l.tubo),
                    lecturaAnterior: l.lecturaAnterior ?? null, fechaAnterior: l.fechaAnterior ?? null,
                    lectura: l.lectura, consumo: l.consumo ?? null, costoM3: l.costoM3 ?? null, importe: l.importe ?? null
                }]);
                await cargarDatos();
                dibujarFilas();
                mensaje(`Lectura del tubo ${l.tubo} del ${l.fecha} eliminada.`, 'ok');
            } catch (err) {
                mensaje('No se pudo eliminar: ' + err.message, 'err');
                document.querySelectorAll('[data-borrar]').forEach(b => b.disabled = false);
            } finally {
                eliminando = false;
            }
        }

        function calcular(tubo) {
            const fecha = document.getElementById('fecha').value;
            const input = document.querySelector(`input[data-tubo="${tubo}"]`);
            const valor = input.value.trim() === '' ? null : parseFloat(input.value);
            const ant = lecturaAnterior(tubo, fecha);
            if (valor === null || isNaN(valor)) return { tubo, valor: null, ant };
            const consumo = ant ? Math.round((valor - ant.lectura) * 1000) / 1000 : null;
            // Lectura ya guardada y sin cambios: se muestra con el costo e importe con que se grabó.
            // Nueva o corregida: se calcula con el costo de arriba (es lo que se grabará).
            const existente = lecturaEnFecha(tubo, fecha);
            const guardada = !!existente && typeof existente.lectura === 'number' && Math.abs(existente.lectura - valor) < 0.0005;
            const costo = guardada && typeof existente.costoM3 === 'number' ? existente.costoM3 : costoActual();
            const importe = guardada && typeof existente.importe === 'number' ? existente.importe
                : consumo === null ? null : Math.round(consumo * costo * 100) / 100;
            return { tubo, valor, ant, consumo, importe, costo, guardada };
        }

        function recalcular(tubo) {
            const r = calcular(tubo);
            const fila = document.getElementById(`fila-${tubo}`);
            document.getElementById(`consumo-${tubo}`).textContent = r.valor === null ? '-' : (r.consumo === null ? 'primera' : fmt(r.consumo));
            const actual = costoActual();
            document.getElementById(`costo-${tubo}`).innerHTML = r.valor === null ? '-'
                : r.guardada
                    ? (Math.abs(r.costo - actual) >= 0.005 ? `<span class="costo-dif" title="Grabada a este costo; el de arriba es ${dinero(actual)}">${dinero(r.costo)}</span>` : dinero(r.costo))
                    : `${dinero(r.costo)}<span class="costo-nuevo">por guardar</span>`;
            document.getElementById(`importe-${tubo}`).textContent = r.valor === null || r.importe === null ? '-' : dinero(r.importe);
            fila.classList.toggle('alerta', r.consumo !== null && r.consumo !== undefined && r.consumo < 0);
            totales();
            avisoCosto();
        }

        function recalcularTodo() {
            medidores.forEach(m => recalcular(m.id));
        }

        // Aviso cuando hay lecturas guardadas en esta fecha con un costo distinto al de arriba
        function avisoCosto() {
            const el = document.getElementById('avisoCosto');
            if (!el) return;
            const actual = costoActual();
            const distintas = medidores.map(m => calcular(m.id)).filter(r => r.guardada && Math.abs(r.costo - actual) >= 0.005 && typeof r.consumo === 'number');
            if (!distintas.length || !esAdmin() || !(actual > 0)) { el.hidden = true; return; }
            const costos = [...new Set(distintas.map(r => dinero(r.costo)))].join(', ');
            const antes = distintas.reduce((s, r) => s + (r.importe || 0), 0);
            const despues = distintas.reduce((s, r) => s + Math.round(r.consumo * actual * 100) / 100, 0);
            el.hidden = false;
            el.innerHTML = `${distintas.length} lectura${distintas.length > 1 ? 's' : ''} de esta fecha ${distintas.length > 1 ? 'están grabadas' : 'está grabada'} a <strong>${costos}</strong> por m³ (importe ${dinero(antes)}). El costo de arriba es <strong>${dinero(actual)}</strong>; con ese costo serían ${dinero(despues)}.
                <button class="btn-sec" id="aplicarCosto">Recalcular a ${dinero(actual)}</button>`;
            document.getElementById('aplicarCosto').addEventListener('click', () => aplicarCosto(distintas, actual));
        }

        async function aplicarCosto(distintas, costo) {
            const fecha = document.getElementById('fecha').value;
            if (!confirm(`Se cambiará el costo a ${dinero(costo)} por m³ en ${distintas.length} lectura(s) del ${fecha} y se recalculará su importe.\n\nLas facturas ya generadas no cambian hasta que corras "Actualizar agua y periodos" en Facturación. ¿Continuar?`)) return;
            const user = getCurrentUser();
            try {
                const batch = writeBatch(db);
                distintas.forEach(r => batch.set(doc(db, 'agua_lecturas', `${r.tubo}_${fecha}`), {
                    costoM3: costo, importe: Math.round(r.consumo * costo * 100) / 100,
                    actualizadoPor: user.email, actualizadoEn: serverTimestamp()
                }, { merge: true }));
                await batch.commit();
                await cargarDatos();
                dibujarFilas();
                mensaje(`Costo actualizado a ${dinero(costo)} en ${distintas.length} lectura(s).`, 'ok');
            } catch (err) {
                mensaje('No se pudo actualizar el costo: ' + err.message, 'err');
            }
        }

        function totales() {
            let c = 0, i = 0;
            medidores.forEach(m => {
                const r = calcular(m.id);
                if (typeof r.consumo === 'number') c += r.consumo;
                if (typeof r.importe === 'number') i += r.importe;
            });
            document.getElementById('totalConsumo').textContent = fmt(c);
            document.getElementById('totalImporte').textContent = dinero(i);
        }

        function mensaje(texto, cls) {
            const el = document.getElementById('mensaje');
            el.className = 'mensaje ' + (cls || '');
            el.textContent = texto;
        }

        async function guardarCosto() {
            const v = costoActual();
            if (!(v > 0)) { mensaje('Escribe un costo por m³ válido.', 'err'); return; }
            try {
                await setDoc(doc(db, 'agua_config', 'general'), {
                    costoM3: v, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp()
                }, { merge: true });
                costoM3 = v;
                mensaje(`Costo por m³ guardado: ${dinero(v)}`, 'ok');
            } catch (err) {
                mensaje('No se pudo guardar el costo: ' + err.message, 'err');
            }
        }

        async function guardarLecturas() {
            const fecha = document.getElementById('fecha').value;
            if (!fecha) { mensaje('Selecciona la fecha de lectura.', 'err'); return; }
            if (fecha > hoy()) { mensaje('La fecha no puede ser futura.', 'err'); return; }

            // Solo lecturas nuevas o corregidas; las que ya están guardadas sin cambios no se vuelven a grabar
            // (así no cambia su costo sin querer; para eso está "Recalcular a ...")
            const capturas = medidores.map(m => calcular(m.id)).filter(r => r.valor !== null && !isNaN(r.valor) && !r.guardada);
            if (!capturas.length) { mensaje('No hay lecturas nuevas o corregidas que guardar.', 'err'); return; }

            const negativas = capturas.filter(r => typeof r.consumo === 'number' && r.consumo < 0);
            if (negativas.length) {
                const lista = negativas.map(r => `Tubo ${r.tubo}: ${fmt(r.valor)} es menor que la anterior (${fmt(r.ant.lectura)})`).join('\n');
                if (!confirm(`Estas lecturas son MENORES que la anterior:\n\n${lista}\n\nRevisa que estén bien escritas. ¿Guardar de todos modos?`)) return;
            }
            const sobrescribe = capturas.filter(r => lecturaEnFecha(r.tubo, fecha));
            if (sobrescribe.length) {
                if (!confirm(`Ya hay lecturas del ${fecha} para: ${sobrescribe.map(r => 'tubo ' + r.tubo).join(', ')}.\n\n¿Reemplazarlas?`)) return;
            }

            const btn = document.getElementById('guardar');
            btn.disabled = true;
            mensaje('Guardando...');
            const user = getCurrentUser();
            const costo = costoActual();

            try {
                const batch = writeBatch(db);
                capturas.forEach(r => {
                    batch.set(doc(db, 'agua_lecturas', `${r.tubo}_${fecha}`), {
                        tubo: r.tubo,
                        fecha,
                        periodo: fecha.slice(0, 7),
                        lectura: r.valor,
                        lecturaAnterior: r.ant ? r.ant.lectura : null,
                        fechaAnterior: r.ant ? r.ant.fecha : null,
                        consumo: typeof r.consumo === 'number' ? r.consumo : null,
                        costoM3: costo,
                        importe: typeof r.importe === 'number' ? r.importe : null,
                        observaciones: '',
                        revisar: (typeof r.consumo === 'number' && r.consumo < 0) ? ['consumo negativo'] : [],
                        origen: 'panel',
                        capturadoPor: user.email,
                        capturadoPorUid: user.uid,
                        capturadoEn: serverTimestamp()
                    });
                });
                await batch.commit();

                const hist = await enviarHistorial(capturas.map(r => ({
                    accion: 'guardada', id: `${r.tubo}_${fecha}`, fecha, tubo: r.tubo, empresa: empresaDe(r.tubo),
                    lecturaAnterior: r.ant ? r.ant.lectura : null, fechaAnterior: r.ant ? r.ant.fecha : null,
                    lectura: r.valor, consumo: r.consumo ?? null, costoM3: costo, importe: r.importe ?? null
                })));

                await cargarDatos();
                dibujarFilas();
                if (hist.ok) {
                    mensaje(`Se guardaron ${capturas.length} lecturas del ${fecha}.`, 'ok');
                } else {
                    mensaje(`Se guardaron ${capturas.length} lecturas del ${fecha}, pero no se registraron en el historial de Sheets (${hist.error}).`, 'err');
                }
            } catch (err) {
                console.error(err);
                mensaje('No se pudo guardar: ' + err.message, 'err');
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
