                    + '<label id="iQuitarWrap" style="grid-column:1/-1;display:none;gap:8px;align-items:center;font-size:13px"><input id="iQuitar" type="checkbox" checked> Quitar primero los movimientos de ejemplo de esa cuenta</label>'
                    + '</div><div id="iVista" style="margin-top:16px"></div>'
                    + '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px"><button class="btn-sec" id="iCancelar">Cancelar</button><button class="btn" id="iCargar" disabled>Cargar movimientos</button></div></div>';
                document.body.appendChild(fondo);
                const $i = id => fondo.querySelector('#' + id);
                $i('iCuenta').innerHTML = CUENTAS.map(c => '<option value="' + c.id + '" ' + (st.cuenta === c.id ? 'selected' : '') + '>' + esc(c.nombre) + '</option>').join('') + '<option value="__nueva">Cuenta nueva…</option>';
                let leido = null;
                const cierra = () => fondo.remove();
                fondo.addEventListener('click', e => { if (e.target === fondo) cierra(); });
                $i('iCancelar').addEventListener('click', cierra);

                function vista() {
                    const v = $i('iVista'), btn = $i('iCargar');
                    $i('iNuevaWrap').style.display = $i('iCuenta').value === '__nueva' ? 'block' : 'none';
                    if (!leido) { v.innerHTML = ''; btn.disabled = true; return; }
                    if (leido.error) { v.innerHTML = '<div style="background:#fdecea;color:var(--peligro);padding:10px 14px;border-radius:8px;font-size:13px">' + esc(leido.error) + '</div>'; btn.disabled = true; return; }
                    const destino = $i('iCuenta').value, quitar = $i('iQuitar').checked && destino !== '__nueva';
                    const existentes = {}; MOVS.filter(m => m.cuenta === destino && !(quitar && m.ejemplo)).forEach(m => { const k = llave(m); existentes[k] = (existentes[k] || 0) + 1; });
                    const vistos = {}, nuevas = [], dup = [];
                    leido.filas.forEach(m => { const k = llave(m); const n = vistos[k] = (vistos[k] || 0); vistos[k]++; (n < (existentes[k] || 0) ? dup : nuevas).push(m); });
                    leido.nuevas = nuevas;
                    const ing = nuevas.filter(m => m.monto > 0).reduce((a, m) => a + m.monto, 0), gas = nuevas.filter(m => m.monto < 0).reduce((a, m) => a + m.monto, 0);
                    const fechas = leido.filas.map(m => m.fecha).sort();
                    const caja = (t, h) => '<div style="border:1px solid var(--linea);border-radius:8px;padding:8px 14px"><div style="font-size:11px;color:var(--tinta-suave);text-transform:uppercase">' + t + '</div>' + h + '</div>';
                    v.innerHTML = '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">'
                        + [['Leídos', leido.filas.length], ['Nuevos', nuevas.length], ['Ya existían', dup.length], ['Con error', leido.errores.length]].map(([t, n]) => caja(t, '<div style="font-size:18px;font-weight:700">' + n + '</div>')).join('')
                        + caja('Periodo', '<div style="font-size:14px;font-weight:600;margin-top:4px">' + (fechas.length ? fechas[0] + ' a ' + fechas[fechas.length - 1] : '-') + '</div>')
                        + caja('Ingresos / gastos nuevos', '<div class="num" style="font-size:14px;font-weight:600;margin-top:4px"><span style="color:var(--exito)">+' + dinero(ing) + '</span> / ' + dinero(gas) + '</div>') + '</div>'
                        + (leido.errores.length ? '<div style="font-size:12px;color:var(--peligro);margin-bottom:8px">Filas que no pude leer (número de renglón): ' + leido.errores.slice(0, 15).join(', ') + (leido.errores.length > 15 ? '…' : '') + '</div>' : '')
                        + '<div style="max-height:260px;overflow:auto;border:1px solid var(--linea);border-radius:8px"><table style="min-width:0;font-size:13px"><thead><tr><th>Fecha</th><th>Beneficiario</th><th>Categoría</th><th>Etiquetas</th><th class="der">Monto</th></tr></thead><tbody>'
                        + nuevas.slice(0, 12).map(m => '<tr><td class="nw">' + m.fecha + '</td><td>' + esc(m.beneficiario) + '</td><td>' + esc(m.categoria) + '</td><td>' + esc(m.etiquetas.join(' | ')) + '</td><td class="der num ' + (m.monto > 0 ? 'ingreso' : '') + '">' + (m.monto > 0 ? '+' : '') + dinero(m.monto) + '</td></tr>').join('')
                        + (nuevas.length > 12 ? '<tr><td colspan="5" style="text-align:center;color:var(--tinta-suave)">… y ' + (nuevas.length - 12) + ' más</td></tr>' : '') + '</tbody></table></div>';
                    btn.disabled = !nuevas.length; btn.textContent = nuevas.length ? 'Cargar ' + nuevas.length + ' movimiento' + (nuevas.length === 1 ? '' : 's') : 'Nada nuevo que cargar';
                }
                ['iCuenta', 'iQuitar'].forEach(id => $i(id).addEventListener('change', vista));
                $i('iArchivo').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; leido = interpretar(await f.text()); vista(); });
                $i('iCargar').addEventListener('click', () => {
                    let destino = $i('iCuenta').value;
                    if (destino === '__nueva') {
                        const nombre = $i('iNueva').value.trim(); if (!nombre) { $i('iNueva').focus(); return; }
                        destino = 'c' + Date.now(); CUENTAS.push({ id: destino, nombre, saldoInicial: 0 });
                    } else if ($i('iQuitar').checked) { for (let k = MOVS.length - 1; k >= 0; k--) if (MOVS[k].cuenta === destino && MOVS[k].ejemplo) MOVS.splice(k, 1); }
                    const cta = CUENTAS.find(c => c.id === destino);
                    cta.saldoInicial = Number(String($i('iSaldo').value).replace(/[$,\s]/g, '')) || 0;
                    let id = Math.max(0, ...MOVS.map(m => m.id)) + 1;
                    const repet = {}, base = Date.now() * 1000;
                    MOVS.filter(x => x.cuenta === destino).forEach(x => { const l = llaveMov(x); repet[l] = (repet[l] ?? -1) + 1; });
                    leido.nuevas.forEach((m, i) => { const l = llaveMov(m); repet[l] = (repet[l] ?? -1) + 1; MOVS.push({ id: id++, fid: fidDe(destino, l, repet[l]), orden: base + i, cuenta: destino, ...m }); });
                    sincronizarCatalogo();
                    const n = leido.nuevas.length;
                    cierra(); st.cuenta = destino; st.sel.clear(); pintar();
                    const a = document.getElementById('aviso'); a.textContent = 'Se cargaron ' + n + ' movimientos en ' + cta.nombre + ' (guardados en Firestore).'; a.style.display = 'block';
                });
            }
            pintar();
        }

        if (!isAuthenticated()) window.location.href = '/login.html';
        else {
            crearNavbar();
            if (!esAdmin()) app.innerHTML = '<h1>Acceso restringido</h1><p>Esta sección es solo para el administrador.</p>';
            else arrancar();
        }
    </script>
</body>
</html>
