<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261015-2">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1300px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 25px; }
        .controles { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 22px; }
        .controles label { display: block; font-size: 13px; color: var(--tinta-suave); margin-bottom: 6px; }
        .controles input { padding: 9px 12px; border: 1px solid var(--borde-control); border-radius: 6px; font-size: 15px; }
        .btn { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { background: var(--fondo-hundido); color: var(--tinta-suave); border: none; border-radius: 6px; padding: 10px 16px; font-size: 14px; cursor: pointer; }

        .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
        .tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 16px 18px; }
        .tarjeta .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
        .tarjeta .k { font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; }

        .tabla-wrap { border: 1px solid var(--linea); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 12px 14px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); white-space: nowrap; }
        td { padding: 11px 14px; border-bottom: 1px solid var(--linea); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        tr.fila-f { cursor: pointer; }
        /* Encabezados para ordenar (mismas flechas que el Directorio) */
        th.ord { cursor: pointer; user-select: none; white-space: nowrap; }
        th.ord:hover { color: var(--tinta); }
        th.ord.act { color: var(--accion); }
        th.ord .flecha { font-size: 9px; margin-left: 5px; opacity: .35; letter-spacing: -1px; }
        th.ord.act .flecha { opacity: 1; }
        tr.fila-f:hover td { background: var(--ambar-suave); }
        select.estado { padding: 5px 8px; border-radius: 12px; border: 1px solid transparent; font-size: 12px; font-weight: 600; cursor: pointer; }
        .e-pendiente { background: var(--linea); color: var(--tinta-suave); } .e-proceso { background: var(--atencion-suave); color: var(--atencion); }
        .e-pagado { background: var(--exito); color: var(--fondo); } select.estado option { background: var(--fondo); color: var(--tinta); } .e-tarde { background: var(--peligro-suave); color: var(--peligro); }
        .aviso { color: var(--atencion); font-size: 12px; display: block; margin-top: 3px; }
        tfoot td { font-weight: 600; background: var(--fondo-hundido); border-top: 1px solid var(--linea); }
        .vacio { border: 1px dashed var(--borde-control); border-radius: 10px; padding: 30px; text-align: center; color: var(--tinta-suave); }
        .ok { color: var(--exito); } .err { color: var(--peligro); }

        /* Interruptor de inclusión: verde = activa, negro = apagada (montos tachados) */
        .sw-sel .slider { background: var(--tinta) !important; }
        .sw-sel input:checked + .slider { background: var(--exito) !important; }
        tr.redactada td { color: var(--tinta-suave); }
        tr.redactada .monto { background: var(--tinta); color: transparent !important; border-radius: 3px; user-select: none; }

        /* Moratorios: interruptor + monto */
        th.mor-th { text-align: left; }
        td.mor-td { white-space: nowrap; }
        .switch { position: relative; display: inline-block; width: 38px; height: 22px; vertical-align: middle; cursor: pointer; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider { position: absolute; inset: 0; background: var(--borde-control); border-radius: 22px; transition: .2s; }
        .switch .slider::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--fondo); border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
        .switch input:checked + .slider { background: var(--peligro); }
        .switch input:checked + .slider::before { transform: translateX(16px); }
        .switch input:disabled + .slider { opacity: .5; }
        .mor-monto { display: inline-block; margin-left: 8px; color: var(--peligro); font-weight: 600; font-variant-numeric: tabular-nums; vertical-align: middle; }
        .mor-n { display: block; font-size: 11px; color: var(--peligro); margin-top: 2px; }
        /* Las tablas de locatarios y de GBD comparten el ancho de sus columnas (así quedan alineadas) */
        @media (min-width: 901px) {
            table.tabla-alineada { table-layout: fixed; }
            .tabla-alineada col.c-sel { width: 74px; } .tabla-alineada col.c-loc { width: 120px; } .tabla-alineada col.c-mor { width: 200px; }
            .tabla-alineada col.c-sub { width: 130px; } .tabla-alineada col.c-iva { width: 130px; } .tabla-alineada col.c-tot { width: 135px; } .tabla-alineada col.c-est { width: 195px; }
        }
        /* En pantallas anchas la página crece y los montos se separan más */
        @media (min-width: 1400px) {
            .main { max-width: 1500px; }
            .tabla-alineada col.c-sub { width: 175px; } .tabla-alineada col.c-iva { width: 175px; } .tabla-alineada col.c-tot { width: 175px; } .tabla-alineada col.c-est { width: 215px; }
        }
        /* Facturas de GBD */
        .gbd-sec { margin-top: 34px; }
        .gbd-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        .gbd-sec h2 { font-size: 20px; margin: 0; }
        .gbd-sec .sub2 { margin: 4px 0 0; font-size: 13px; color: var(--tinta-suave); }
        tr.fila-g { cursor: pointer; }
        tr.fila-g:hover td { background: var(--ambar-suave); }
        .det-g { display: block; font-size: 12px; font-weight: 400; color: var(--tinta-suave); margin-top: 2px; white-space: normal; }
        td.num .det-g { white-space: nowrap; }
        .nota-g { font-size: 12px; color: var(--tinta-suave); margin: 8px 0 0; }
        .lineas-g td { padding: 9px 14px; }
        .lineas-g td.num { font-family: var(--font-mono); }
        /* Corte del mes */
        .pie-corte { display: flex; justify-content: flex-end; margin-top: 16px; }
        .btn-corte { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 12px 22px; font-size: 14px; font-weight: 700; letter-spacing: .06em; cursor: pointer; }
        .btn-corte:hover { background: var(--accion-hover); }
        .tag-corte { font-size: 12px; color: var(--exito); background: var(--exito-suave); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; white-space: nowrap; }
        .corte-lista { margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 19px; }
        .corte-pasos { font-size: 13px; line-height: 19px; color: var(--tinta-suave); margin: 0; }
    </style>
</head>
<body>
    <div class="main" id="app"><p style="color:#999">Cargando...</p></div>

    <script type="module">
        import { selectorMes } from '../../../js/selector-mes.js?v=20261012-1';
        import { crearNavbar } from '../../../js/navbar.js?v=20261015-2';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261015-2';
        import { collection, getDocs, getDoc, setDoc, doc, writeBatch, updateDoc, query, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import {
            ESTADOS, mesTxt, mesActual, mesMas, resumenCorte, dinero, esc, facturaId, IVA, r2, totales, generarFactura, contratosFacturables,
            cargarConfigGeneral, MORATORIOS_DEFAULT, cargarLecturas, cargarFacturasMes, ordenLocales, cargarTodasLasFacturas, lecturasFacturadas, actualizarAguaEnFactura, conceptoAgua,
            documentoContadores, imprimirHojas, totalesFactura, normalizarCorreos, correoValido, calcGBD, conceptoGBDTxt, montosGBD, rentaDelMes
        } from '../../../js/facturacion.js?v=20261013-1';

        const app = document.getElementById('app');
        let mes = new URLSearchParams(location.search).get('mes') || mesActual();
        // Orden de la tabla (se conserva al cambiar de mes o recargar los datos)
        let ordenF = { col: 'locales', dir: 1 };
        let contratosGBD = [], facturasGBD = [];   // contratos_gbd y facturas_gbd del mes (renta a GBD y préstamo a Proyectos Saraperos)
        let corteMes = null;              // registro del corte de `mes` (facturacion_cortes/{mes}), si ya se hizo
        let prefijoMsg = '';              // texto que se antepone al próximo mensaje (aviso del corte)
        let generarSinConfirmar = false;  // el corte genera las facturas del mes siguiente sin preguntar otra vez

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            else cargar();
        }

        async function cargar(msg = '') {
            app.innerHTML = '<p style="color:#999">Cargando...</p>';
            try {
                const [snapC, facturas, general, snapCorte, snapCG, snapFG] = await Promise.all([getDocs(collection(db, 'contratos')), cargarFacturasMes(mes), cargarConfigGeneral(),
                    getDoc(doc(db, 'facturacion_cortes', mes)).catch(() => null),
                    getDocs(collection(db, 'contratos_gbd')).catch(() => null),
                    getDocs(query(collection(db, 'facturas_gbd'), where('mes', '==', mes))).catch(() => null)]);
                const porOrden = (a, b) => (a.orden || 99) - (b.orden || 99);
                contratosGBD = snapCG ? snapCG.docs.map(d => ({ id: d.id, ...d.data() })).sort(porOrden) : [];
                facturasGBD = snapFG ? snapFG.docs.map(d => ({ id: d.id, ...d.data() })).sort(porOrden) : [];
                corteMes = snapCorte?.exists() ? snapCorte.data() : null;
                msg = prefijoMsg + msg; prefijoMsg = '';
                PCT_MORATORIOS = general.moratoriosPct;
                const contratos = snapC.docs.map(d => ({ id: d.id, ...d.data() })).sort(ordenLocales);
                render(contratos, facturas, msg);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<h1>Facturación</h1><p class="err">No se pudo cargar: ${esc(err.message)}</p>`;
            }
        }

        function render(contratos, facturas, msg) {
            // Subtotal, IVA y total siempre calculados igual que en el PDF (conceptos a centavos exactos)
            facturas = facturas.map(f => ({ ...f, ...totalesFactura(f) }));
            const facturables = contratosFacturables(contratos);
            const porContrato = Object.fromEntries(facturas.map(f => [f.contratoId, f]));
            const faltan = facturables.filter(c => !porContrato[c.id]);
            const filas = [...facturas].sort((a, b) => ordenLocales(
                contratos.find(c => c.id === a.contratoId) || a, contratos.find(c => c.id === b.contratoId) || b));

            const total = facturas.reduce((s, f) => s + (f.total || 0), 0);
            const cobrado = facturas.filter(f => f.estadoPago === 'pagado' || f.estadoPago === 'pago_tarde').reduce((s, f) => s + (f.total || 0), 0);

            app.innerHTML = `
                <h1>Facturación</h1>
                <p class="sub">Facturas mensuales de LAFABDECHOC a cada locatario. <span style="color:#ccc">· v4 (agua del mes anterior)</span></p>
                <div class="controles">
                    <div><label for="mes">Mes de facturación</label><input type="month" id="mes" value="${mes}"></div>
                    ${faltan.length ? `<button class="btn" id="generar">Generar ${facturas.length ? `faltantes (${faltan.length})` : `facturas de ${mesTxt(mes)}`}</button>` : ''}
                    ${facturas.length ? `
                        <button class="btn-sec" id="actAgua" title="Toma las lecturas de agua capturadas y pone el periodo correcto al agua y a la basura en todas las facturas del mes">Actualizar agua y periodos</button>
                        <button class="btn-sec" id="exportar">Exportar PDF (<span id="nSel">${facturas.length + facturasGBD.length}</span>)</button>
                        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#555;margin:0 0 10px">
                            <input type="checkbox" id="conResumen" checked> Incluir resumen</label>` : ''}
                    <button class="btn-sec" id="histCortes" title="Cortes anteriores: consultarlos y volver a exportarlos">Historial de cortes</button>
                    ${corteMes ? `<span class="tag-corte" title="Registrado por ${esc(corteMes.hechoPor || '')}">Corte hecho el ${esc(corteMes.hechoEn?.toDate?.().toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) || '')}</span>` : ''}
                    <span id="msg">${msg}</span>
                </div>
                ${!facturables.length ? `<div class="vacio">Ningún contrato tiene datos de facturación todavía. Se importan con la herramienta local <code>herramientas/importar-facturas.html</code> (no está publicada).</div>` :
                  !facturas.length ? `<div class="vacio">No hay facturas de <strong>${mesTxt(mes)}</strong>.<br><br>"Generar" las prellena con la renta de cada contrato, el agua de las lecturas y la recolección de basura. Después revisas y ajustas cada una.</div>` : `
                <div class="resumen">
                    <div class="tarjeta"><div class="k">Facturado ${mesTxt(mes)}</div><div class="v">${dinero(total)}</div></div>
                    <div class="tarjeta"><div class="k">Cobrado</div><div class="v" style="color:var(--exito)">${dinero(cobrado)}</div></div>
                    <div class="tarjeta"><div class="k">Por cobrar</div><div class="v" style="color:#b26a00">${dinero(total - cobrado)}</div></div>
                </div>
                <div class="tabla-wrap">
                    <table class="tabla-movil tabla-alineada">
                        ${COLGROUP}
                        <thead><tr><th><label class="switch sw-sel" title="Activa: se incluye con montos. Apagada: los montos salen tachados (redacted) y no suman."><input type="checkbox" id="selTodas" checked><span class="slider"></span></label></th>${thOrd('locales', 'Locales')}${thOrd('locatario', 'Locatario')}${thOrd('moratorios', 'Moratorios', 'mor-th', 'Intereses moratorios: 5% sobre la renta sin IVA')}${thOrd('basura', 'Basura', 'num', 'Recolección de basura del mes, con IVA')}${thOrd('agua', 'Agua', 'num', 'Agua cobrada (con IVA) y fecha de la lectura que se está cargando')}${thOrd('total', 'Total con IVA', 'num')}${thOrd('estado', 'Estado de pago')}</tr></thead>
                        <tbody>
                            ${filas.map(f => `
                                <tr class="fila-f" data-id="${esc(f.id)}" data-href="ficha.html?id=${encodeURIComponent(f.contratoId)}&mes=${mes}" title="Ver factura">
                                    <td><label class="switch sw-sel" title="Activa: se incluye con montos. Apagada: los montos salen tachados (redacted) y no suman."><input type="checkbox" class="sel" data-id="${esc(f.id)}" checked><span class="slider"></span></label></td>
                                    <td><strong>${esc((f.locales || []).join(', '))}</strong></td>
                                    <td>${esc(f.razonSocial)}${(f.avisos || []).map(a => `<span class="aviso">⚠ ${esc(a)}</span>`).join('')}</td>
                                    <td class="mor-td">${celdaMoratorios(f)}</td>
                                    <td class="num"><span class="monto">${montoC(f, 'basura') === null ? '–' : dinero(montoC(f, 'basura'))}</span></td>
                                    <td class="num">${celdaAgua(f)}</td>
                                    <td class="num"><strong class="monto">${dinero(f.total)}</strong></td>
                                    <td><select class="estado ${ESTADOS[f.estadoPago]?.clase || ''}" data-id="${esc(f.id)}">
                                        ${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${k === f.estadoPago ? 'selected' : ''}>${v.txt}</option>`).join('')}
                                    </select></td>
                                </tr>`).join('')}
                        </tbody>
                        <tfoot><tr><td colspan="3">Total</td>
                            <td class="mor-td">${(() => { const m = facturas.reduce((s, f) => s + montoMoratorios(f), 0); const n = facturas.filter(f => montoMoratorios(f) > 0).length; return m ? `<span class="mor-monto">${dinero(m)}</span><span class="mor-n">${n} locatario${n > 1 ? 's' : ''}</span>` : ''; })()}</td>
                            <td class="num" id="totSub">${dinero(facturas.reduce((s, f) => s + (montoC(f, 'basura') || 0), 0))}</td>
                            <td class="num" id="totIva">${dinero(facturas.reduce((s, f) => s + (montoC(f, 'agua') || 0), 0))}</td>
                            <td class="num" id="totTot">${dinero(total)}</td><td></td></tr></tfoot>
                    </table>
                </div>`}
                <div id="gbdFact"></div>
                ${facturas.length ? `<div class="pie-corte"><button class="btn-corte" id="corte" title="Exporta el reporte, guarda el corte y pasa al mes siguiente">CORTE DEL MES</button></div>` : ''}`;
            try { pintarGBD(); } catch (err) { console.error("No se pudieron pintar las facturas de GBD", err); }

            selectorMes(document.getElementById('mes'));
            document.getElementById('mes').addEventListener('change', e => {
                mes = e.target.value || mesActual();
                history.replaceState(null, '', '?mes=' + mes);
                cargar();
            });
            document.getElementById('generar')?.addEventListener('click', () => generar(faltan, contratos));
            document.getElementById('histCortes')?.addEventListener('click', abrirHistorialCortes);
            document.getElementById('actAgua')?.addEventListener('click', () => actualizarAgua(facturas, contratos));
            const seleccion = () => [...app.querySelectorAll('input.sel:checked')].map(x => x.dataset.id);
            // Interruptor apagado = la factura se "tacha" (redacted): montos ocultos y fuera de los totales
            const actualizarSel = () => {
                const activas = new Set(seleccion());
                const n = activas.size;
                actualizarNSel();
                const todas = document.getElementById('selTodas');
                if (todas) todas.checked = n === filas.length;
                app.querySelectorAll('tr.fila-f').forEach(tr => tr.classList.toggle('redactada', !activas.has(tr.dataset.id)));
                const act = facturas.filter(f => activas.has(f.id));
                const suma = k => dinero(act.reduce((s, f) => s + (f[k] || 0), 0));
                const sumaC = t => dinero(act.reduce((s, f) => s + (montoC(f, t) || 0), 0));
                const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
                set('totSub', sumaC('basura')); set('totIva', sumaC('agua')); set('totTot', suma('total'));
            };
            app.querySelectorAll('input.sel').forEach(x => x.addEventListener('change', actualizarSel));
            document.getElementById('selTodas')?.addEventListener('change', e => {
                app.querySelectorAll('input.sel').forEach(x => { x.checked = e.target.checked; });
                actualizarSel();
            });
            const exportarPDF = async () => {
                const ids = new Set(seleccion());
                // Vuelve a leer las facturas para exportar lo último guardado (por si se editaron en otra pestaña)
                const frescas = (await cargarFacturasMes(mes)).map(f => ({ ...f, ...totalesFactura(f) }));
                const orden = [...app.querySelectorAll('tbody tr.fila-f')].map(tr => tr.dataset.id);
                // Todas salen en el PDF; las apagadas van tachadas (redacted) y no suman
                const elegidas = frescas.map(f => ({ ...f, _redactada: !ids.has(f.id) })).sort((a, b) => orden.indexOf(a.id) - orden.indexOf(b.id));
                // Facturas de GBD del mes (también con su interruptor: las apagadas van tachadas)
                const idsG = new Set(seleccionGBD());
                const gbd = (await leerFacturasGBD(mes)).map(f => ({ ...f, _redactada: !idsG.has(f.id) }));
                if (!ids.size && !idsG.size) { alert('Activa al menos una factura.'); return false; }
                const porId = Object.fromEntries(contratos.map(c => [c.id, c]));
                const conResumen = document.getElementById('conResumen').checked;
                const prendidas = ids.size + idsG.size, todas = filas.length + gbd.length;
                // window.print() espera a que se cierre el diálogo de impresión
                imprimirHojas(documentoContadores(mes, elegidas, porId, { resumen: conResumen, gbd }),
                    `Facturas LAFABDECHOC ${mesTxt(mes)}${prendidas < todas ? ` (${prendidas} de ${todas})` : ''}`);
                return true;
            };
            document.getElementById('exportar')?.addEventListener('click', exportarPDF);

            // ---------- CORTE DEL MES: exporta el reporte, guarda el corte y deja el mes siguiente listo ----------
            const abrirCorte = () => {
                const r = resumenCorte(facturas, facturables);
                const siguiente = mesMas(mes, 1);
                const apagadas = filas.length - seleccion().length;
                const lista = (items, txt) => items.map(x => esc(x.locales ? `${x.locales} ${txt(x)}` : txt(x))).join('; ');
                const avisos = [];
                if (r.pendientes.length) avisos.push(`<strong>${r.pendientes.length}</strong> factura${r.pendientes.length > 1 ? 's' : ''} sin pagar (${dinero(r.porCobrar)}): <ul class="corte-lista">${r.pendientes.map(p => `<li>${esc(p.locales)} · ${esc(p.razonSocial)} · ${esc(ESTADOS[p.estadoPago]?.txt || p.estadoPago)} · ${dinero(p.total)}</li>`).join('')}</ul>Se quedan en ${mesTxt(mes)}; las puedes seguir marcando desde ahí.`);
                if (r.sinFactura.length) avisos.push(`Sin factura este mes: ${lista(r.sinFactura, x => x.razonSocial)}.`);
                if (r.conAvisos.length) avisos.push(`${r.conAvisos.length} factura${r.conAvisos.length > 1 ? 's' : ''} con avisos (agua sin lectura, contrato vencido...): ${lista(r.conAvisos, x => x.razonSocial)}.`);
                const gbdPend = facturasGBD.filter(f => f.estadoPago !== 'pagado' && f.estadoPago !== 'pago_tarde');
                if (gbdPend.length) avisos.push(`Facturas de GBD sin pagar: ${gbdPend.map(f => `${esc(f.nombre)} (${dinero(calcGBD(f).total)})`).join('; ')}.`);
                if (apagadas) avisos.push(`${apagadas} local${apagadas > 1 ? 'es' : ''} apagado${apagadas > 1 ? 's' : ''}: salen tachados en el resumen y sin detalle.`);
                if (corteMes) avisos.push(`Ya hay un corte de este mes. Puedes repetirlo; se actualiza el registro.`);
                const fondo = document.createElement('div');
                fondo.className = 'lf-modal-fondo';
                fondo.innerHTML = `<div class="lf-modal" role="dialog" aria-label="Corte del mes" style="max-width:640px">
                    <h3>Corte de ${esc(mesTxt(mes))}</h3>
                    <div class="lf-cifras">
                        <div class="lf-cifra"><div class="lf-etiqueta">Facturado</div><div class="lf-valor" style="font-size:20px">${dinero(r.facturado)}</div></div>
                        <div class="lf-cifra"><div class="lf-etiqueta">Cobrado</div><div class="lf-valor" style="font-size:20px;color:var(--exito)">${dinero(r.cobrado)}</div></div>
                        <div class="lf-cifra"><div class="lf-etiqueta">Por cobrar</div><div class="lf-valor" style="font-size:20px">${dinero(r.porCobrar)}</div></div>
                    </div>
                    ${avisos.length ? `<div class="lf-aviso lf-aviso-atencion" style="flex-direction:column;gap:8px">${avisos.map(a => `<div>${a}</div>`).join('')}</div>` : ''}
                    <div class="lf-aviso" id="cAgua" style="flex-direction:column;gap:6px">Revisando las lecturas de agua para las facturas de ${esc(mesTxt(siguiente))}...</div>
                    <label class="lf-switch"><input type="checkbox" id="cGenerar" checked><span></span>Generar las facturas de ${esc(mesTxt(siguiente))} al terminar</label>
                    <p class="corte-pasos">Al confirmar: 1) se exporta el reporte con lo que está prendido; 2) se guarda el corte; 3) se pasa a ${esc(mesTxt(siguiente))} con los interruptores prendidos y el orden por locales${'' }. Si dejas marcada la casilla, las facturas nuevas toman la renta del periodo y el agua de las lecturas. No se borra nada: ${esc(mesTxt(mes))} sigue en el selector de mes.</p>
                    <div class="lf-modal-pie"><span id="cMsg" style="margin-right:auto;font-size:13px;color:var(--peligro)"></span><button class="lf-btn" data-cerrar>Cancelar</button><button class="lf-btn lf-btn-primario" id="cHacer">Hacer corte y exportar</button></div>
                </div>`;
                const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
                const teclas = e => { if (e.key === 'Escape') cerrar(); };
                fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
                document.addEventListener('keydown', teclas);
                document.body.appendChild(fondo);
                // El agua de las facturas de `siguiente` sale de las lecturas de `mes`: si falta alguna, se avisa antes de generar
                (async () => {
                    const el = document.getElementById('cAgua');
                    try {
                        const [lecturas, todas] = await Promise.all([cargarLecturas(), cargarTodasLasFacturas()]);
                        if (!document.body.contains(fondo)) return;
                        const problemas = [];
                        facturables.filter(c => ((c.facturacion || {}).tubos || []).length).forEach(c => {
                            const { avisos: av } = conceptoAgua(c, siguiente, lecturas, lecturasFacturadas(todas, c, lecturas, facturaId(c.id, siguiente)));
                            if (av.length) problemas.push({ locales: (c.locales || []).join(', '), razonSocial: c.razonSocial, aviso: av[0] });
                        });
                        // Agrupa por tipo de problema para que la lista no se alargue con 12 renglones casi iguales
                        const tipo = t => /ya se cobró/.test(t) ? `Sin lectura nueva de ${mesTxt(mes)} (la última ya se cobró)` : /no hay lectura de/.test(t) ? `Sin lectura de ${mesTxt(mes)} (se usaría una anterior)` : 'Sin ninguna lectura del medidor';
                        const grupos = new Map();
                        problemas.forEach(x => { const k = tipo(x.aviso); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(x.locales); });
                        if (!problemas.length) { el.className = 'lf-aviso lf-aviso-ok'; el.innerHTML = `Agua: hay lectura de ${esc(mesTxt(mes))} para todos los locatarios con medidor.`; return; }
                        el.className = 'lf-aviso lf-aviso-atencion';
                        el.innerHTML = `<div><strong>Agua: falta la lectura de ${esc(mesTxt(mes))} de ${problemas.length} locatario${problemas.length > 1 ? 's' : ''}.</strong> Sus facturas de ${esc(mesTxt(siguiente))} saldrían sin agua o con una lectura que ya se cobró.</div>
                            <ul class="corte-lista">${[...grupos].map(([k, l]) => `<li><strong>${esc(k)}:</strong> locales ${esc(l.join(' · '))}</li>`).join('')}</ul>
                            <div>Captura las lecturas en <a href="../agua/lecturas.html">Lecturas de agua</a> antes de generar. Si generas sin ellas, después usa «Actualizar agua y periodos».</div>`;
                    } catch (err) {
                        console.warn('No se pudo revisar el agua', err);
                        if (el) { el.className = 'lf-aviso'; el.textContent = 'No se pudieron revisar las lecturas de agua. Revísalas en Lecturas de agua antes de generar.'; }
                    }
                })();
                document.getElementById('cHacer').addEventListener('click', async () => {
                    const btn = document.getElementById('cHacer'), msgC = document.getElementById('cMsg');
                    btn.disabled = true; msgC.textContent = '';
                    try {
                        if (!seleccion().length && !seleccionGBD().length) throw new Error('Activa al menos una factura para exportar.');
                        const generarSig = document.getElementById('cGenerar').checked;
                        if (!(await exportarPDF())) { btn.disabled = false; return; }
                        await setDoc(doc(db, 'facturacion_cortes', mes), {
                            mes, facturas: r.facturas, facturado: r.facturado, cobrado: r.cobrado, porCobrar: r.porCobrar,
                            pendientes: r.pendientes, sinFactura: r.sinFactura,
                            gbd: facturasGBD.map(f => ({ contratoId: f.contratoId, nombre: f.nombre, total: calcGBD(f).total, estadoPago: f.estadoPago })),
                            apagadasGBD: facturasGBD.filter(f => !seleccionGBD().includes(f.id)).map(f => f.contratoId),
                            apagadas: filas.filter(f => !seleccion().includes(f.id)).map(f => f.contratoId),
                            generoSiguiente: generarSig, hechoPor: getCurrentUser().email, hechoEn: serverTimestamp()
                        });
                        cerrar();
                        // Deja el mes siguiente limpio: interruptores prendidos, orden por locales y selector de mes adelantado
                        const cerrado = mes, aviso = `<span class="ok">Corte de ${esc(mesTxt(cerrado))} hecho: reporte exportado y corte guardado. </span>`;
                        ordenF = { col: 'locales', dir: 1 };
                        mes = siguiente;
                        history.replaceState(null, '', '?mes=' + mes);
                        prefijoMsg = aviso;
                        if (generarSig) generarSinConfirmar = true;
                        await cargar();
                        if (generarSig) {
                            const g = document.getElementById('generar');
                            if (g) { prefijoMsg = aviso; g.click(); } else generarSinConfirmar = false;
                        }
                    } catch (err) {
                        console.error(err);
                        msgC.textContent = err.message || 'No se pudo hacer el corte.';
                        btn.disabled = false;
                    }
                });
            };
            document.getElementById('corte')?.addEventListener('click', abrirCorte);
            app.querySelectorAll('select.estado').forEach(s => s.addEventListener('change', () => cambiarEstado(s)));
            // Toda la fila abre la factura, salvo los controles (casilla, interruptor, estado)
            app.querySelectorAll('tr.fila-f').forEach(tr => tr.addEventListener('click', e => {
                if (e.target.closest('input, select, label, button, a')) return;
                if (e.ctrlKey || e.metaKey) window.open(tr.dataset.href, '_blank'); else location.href = tr.dataset.href;
            }));
            app.querySelectorAll('input.mor-switch').forEach(x => x.addEventListener('change', () => cambiarMoratorios(x, facturas)));

            // ---------- Ordenar por columna: reacomoda los renglones sin volver a dibujar (no se pierden los interruptores) ----------
            const posLocales = Object.fromEntries(filas.map((f, i) => [f.id, i]));
            const ORDEN_ESTADO = Object.keys(ESTADOS);
            const CLAVE = {
                locales: f => posLocales[f.id],
                locatario: f => (f.razonSocial || '').toLocaleLowerCase('es-MX'),
                moratorios: f => montoMoratorios(f),
                basura: f => montoC(f, 'basura') || 0,
                agua: f => montoC(f, 'agua') || 0,
                total: f => f.total || 0,
                // El estado se lee del select por si se cambió sin recargar
                estado: f => ORDEN_ESTADO.indexOf(app.querySelector(`select.estado[data-id="${CSS.escape(f.id)}"]`)?.value ?? f.estadoPago)
            };
            const ordenar = () => {
                const tbody = app.querySelector('tbody');
                if (!tbody) return;
                const k = CLAVE[ordenF.col] || CLAVE.locales;
                const lista = [...filas].sort((a, b) => {
                    const x = k(a), y = k(b);
                    const c = typeof x === 'string' ? x.localeCompare(y, 'es') : x - y;
                    return c * ordenF.dir || posLocales[a.id] - posLocales[b.id];
                });
                lista.forEach(f => { const tr = tbody.querySelector(`tr.fila-f[data-id="${CSS.escape(f.id)}"]`); if (tr) tbody.appendChild(tr); });
                app.querySelectorAll('th.ord').forEach(th => {
                    const act = th.dataset.col === ordenF.col;
                    th.classList.toggle('act', act);
                    th.querySelector('.flecha').textContent = act ? (ordenF.dir > 0 ? '▲' : '▼') : '▲▼';
                });
            };
            app.querySelectorAll('th.ord').forEach(th => th.addEventListener('click', () => {
                const col = th.dataset.col;
                // Montos: primer clic de mayor a menor; texto y locales: de A a Z
                ordenF = ordenF.col === col ? { col, dir: -ordenF.dir } : { col, dir: ['moratorios', 'basura', 'agua', 'total'].includes(col) ? -1 : 1 };
                ordenar();
            }));
            ordenar();
        }

        // Basura y agua de una factura (total con IVA del concepto); null si la factura no lo lleva
        const conceptoDe = (f, t) => (f.conceptos || []).find(c => c.tipo === t || (!c.tipo && (t === 'agua' ? /AGUA/ : /BASURA/).test(c.concepto || '')));
        const montoC = (f, t) => { const c = conceptoDe(f, t); return c ? (c.total || 0) : null; };
        // Agua: monto y, debajo, la(s) fecha(s) de la lectura con que se cargó, para comprobar que es la correcta
        function celdaAgua(f) {
            const c = conceptoDe(f, 'agua');
            if (!c) return '<span class="monto">–</span>';
            const fechas = [...new Set([...(c.lecturas || '').matchAll(/lectura del (\d{4})-(\d{2})-(\d{2})/g)].map(m => `${m[3]}/${m[2]}/${m[1]}`))];
            return `<span class="monto">${dinero(c.total || 0)}</span>${fechas.length ? `<span class="det-g">${fechas.join(' y ')}</span>` : '<span class="det-g">sin lectura</span>'}`;
        }

        const COLGROUP = '<colgroup><col class="c-sel"><col class="c-loc"><col><col class="c-mor"><col class="c-sub"><col class="c-iva"><col class="c-tot"><col class="c-est"></colgroup>';

        function thOrd(col, txt, cls = '', title = '') {
            return `<th class="ord ${cls}" data-col="${col}" title="${esc(title || 'Ordenar por ' + txt.toLowerCase())}">${txt}<span class="flecha">▲▼</span></th>`;
        }

        // ---------- Facturas de GBD: renta a GBD y préstamo a Proyectos Saraperos (colección facturas_gbd, id {contrato}_{YYYY-MM}) ----------
        // Cada mes se generan copiando los importes de contratos_gbd (Contratos → Contratos de GBD); después se ajustan por factura.
        // Datos solo en Firestore. Total = subtotal + IVA + moratorios − retenciones (ver calcGBD en js/facturacion.js).
        const porOrdenG = (a, b) => (a.orden || 99) - (b.orden || 99);
        async function leerFacturasGBD(mesX) {
            return (await getDocs(query(collection(db, 'facturas_gbd'), where('mes', '==', mesX)))).docs.map(d => ({ id: d.id, ...d.data() })).sort(porOrdenG);
        }
        const seleccionGBD = () => [...app.querySelectorAll('input.sel-gbd:checked')].map(x => x.dataset.id);
        // Contador del botón «Exportar PDF»: facturas prendidas de locatarios + de GBD
        function actualizarNSel() {
            const el = document.getElementById('nSel');
            if (el) el.textContent = app.querySelectorAll('input.sel:checked').length + seleccionGBD().length;
        }

        async function generarGBD(mesX) {
            const cs = (await getDocs(collection(db, 'contratos_gbd'))).docs.map(d => ({ id: d.id, ...d.data() })).sort(porOrdenG);
            const hay = new Set((await leerFacturasGBD(mesX)).map(f => f.contratoId));
            const faltan = cs.filter(c => !hay.has(c.id));
            if (!faltan.length) return 0;
            const batch = writeBatch(db), user = getCurrentUser().email;
            const locatarios = (await getDocs(collection(db, 'contratos'))).docs.map(d => ({ id: d.id, ...d.data() }));
            faltan.forEach(c => { const m = montosGBD(c, locatarios, mesX); batch.set(doc(db, 'facturas_gbd', `${c.id}_${mesX}`), {
                contratoId: c.id, mes: mesX, orden: c.orden || 99, tipo: c.tipo || null, nombre: c.nombre, contraparte: c.contraparte, concepto: c.concepto,
                porcentaje: c.porcentaje ?? null, periodo: c.periodo ?? null, capital: c.capital ?? null, tasaAnual: c.tasaAnual ?? null,
                subtotal: m.subtotal, iva: m.iva, retIsr: m.retIsr, retIva: m.retIva, moratoriosPct: 0, total: m.total,
                correos: c.correos || [], estadoPago: 'pendiente', notas: m.automatico ? `Calculado: ${pctTxtG(c.porcentaje)} de las rentas del mes.` : '', creadoPor: user, creadoEn: serverTimestamp()
            }); });
            await batch.commit();
            return faltan.length;
        }

        const pagadaG = f => f.estadoPago === 'pagado' || f.estadoPago === 'pago_tarde';
        const celdaMoraGBD = f => {
            const c = calcGBD(f), on = c.pct > 0;
            return `<label class="switch" title="${on ? 'Quitar' : 'Cobrar'} moratorios (${Math.round(PCT_MORATORIOS * 100)}% del subtotal)"><input type="checkbox" class="mor-switch-g" data-id="${esc(f.id)}" ${on ? 'checked' : ''}><span class="slider"></span></label>
                ${on ? `<span class="mor-monto monto">${dinero(c.moraTotal)}</span><span class="mor-n">${pctTxtG(c.pct)} del subtotal</span>` : ''}`;
        };
        const pctTxtG = f => `${+(f * 100).toFixed(4)}%`;

        function pintarGBD() {
            const el = document.getElementById('gbdFact');
            if (!el || (!contratosGBD.length && !facturasGBD.length)) return;
            const faltan = contratosGBD.filter(c => !facturasGBD.some(f => f.contratoId === c.id));
            const fila = f => {
                const c = calcGBD(f), txt = conceptoGBDTxt(f);
                return `<tr class="fila-g" data-id="${esc(f.id)}" title="Ver detalle">
                    <td><label class="switch sw-sel" title="Activa: se incluye con montos. Apagada: los montos salen tachados (redacted) y no suman."><input type="checkbox" class="sel-gbd" data-id="${esc(f.id)}" checked><span class="slider"></span></label></td>
                    <td><strong>${f.tipo === 'prestamo' ? 'Préstamo' : 'Renta'}</strong></td>
                    <td>${esc(f.contraparte)}<span class="det-g">${esc(txt.corto)}</span></td>
                    <td class="mor-td">${celdaMoraGBD(f)}</td>
                    <td class="num"><span class="monto">${dinero(c.subtotal)}</span></td>
                    <td class="num"><span class="monto">${dinero(c.ivaTotal)}</span></td>
                    <td class="num"><strong class="monto">${dinero(c.total)}</strong>${c.retenciones ? `<span class="det-g monto" title="Retención ISR ${dinero(c.retIsr)} + retención IVA ${dinero(c.retIva)}">ret. −${dinero(c.retenciones)}</span>` : ''}</td>
                    <td><select class="estado ${ESTADOS[f.estadoPago]?.clase || ''}" data-gbd-estado="${esc(f.id)}">
                        ${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${k === f.estadoPago ? 'selected' : ''}>${v.txt}</option>`).join('')}</select></td>
                </tr>`;
            };
            el.innerHTML = `<div class="gbd-sec">
                <div class="gbd-cab"><div><h2>Facturas de GBD</h2><p class="sub2">Renta a GBD y préstamo a Proyectos Saraperos · ${esc(mesTxt(mes))}. Clic en un renglón para abrir su factura.</p></div>
                    ${faltan.length ? `<button class="btn" id="gbdGenerar">Generar ${facturasGBD.length ? `faltantes (${faltan.length})` : `facturas de GBD de ${esc(mesTxt(mes))}`}</button>` : ''}</div>
                ${facturasGBD.length ? `<div class="tabla-wrap"><table class="tabla-alineada">
                    ${COLGROUP}
                    <thead><tr><th><label class="switch sw-sel" title="Activa: se incluye con montos. Apagada: los montos salen tachados (redacted) y no suman."><input type="checkbox" id="selTodasGbd" checked><span class="slider"></span></label></th><th>Contrato</th><th>Receptor</th><th class="mor-th">Moratorios</th><th class="num">Subtotal</th><th class="num">IVA</th><th class="num">Total</th><th>Estado de pago</th></tr></thead>
                    <tbody>${facturasGBD.map(fila).join('')}</tbody>
                    <tfoot><tr><td colspan="3">Total</td><td class="mor-td" id="totMorG"></td><td class="num" id="totSubG"></td><td class="num" id="totIvaG"></td><td class="num" id="totTotG"></td><td></td></tr></tfoot>
                </table></div>
                <p class="nota-g">Total = subtotal + IVA + moratorios − retenciones. Los importes base se editan en Contratos → Contratos de GBD; cada factura se ajusta en su detalle.</p>`
                    : `<div class="vacio">No hay facturas de GBD de <strong>${esc(mesTxt(mes))}</strong>.</div>`}
            </div>`;
            document.getElementById('gbdGenerar')?.addEventListener('click', async e => {
                e.target.disabled = true;
                try { const n = await generarGBD(mes); await cargar(`<span class="ok">Se generaron ${n} factura${n === 1 ? '' : 's'} de GBD.</span>`); }
                catch (err) { console.error(err); document.getElementById('msg').innerHTML = `<span class="err">No se pudieron generar: ${esc(err.message)}</span>`; e.target.disabled = false; }
            });
            if (!facturasGBD.length) return;

            // Interruptor apagado = factura tachada y fuera de los totales (igual que en los locatarios)
            const actualizarSelG = () => {
                const activas = new Set(seleccionGBD());
                const todas = document.getElementById('selTodasGbd');
                if (todas) todas.checked = activas.size === facturasGBD.length;
                el.querySelectorAll('tr.fila-g').forEach(tr => tr.classList.toggle('redactada', !activas.has(tr.dataset.id)));
                const act = facturasGBD.filter(f => activas.has(f.id)).map(calcGBD);
                const suma = k => act.reduce((s, c) => s + c[k], 0);
                const set = (id, t) => { const n = document.getElementById(id); if (n) n.innerHTML = t; };
                set('totSubG', dinero(r2(suma('subtotal')))); set('totIvaG', dinero(r2(suma('ivaTotal'))));
                set('totTotG', dinero(r2(suma('total'))) + (suma('retenciones') ? `<span class="det-g">ret. −${dinero(r2(suma('retenciones')))}</span>` : ''));
                const mora = suma('moraTotal'), nMora = act.filter(c => c.moraTotal > 0).length;
                set('totMorG', mora ? `<span class="mor-monto">${dinero(r2(mora))}</span><span class="mor-n">${nMora} contrato${nMora > 1 ? 's' : ''}</span>` : '');
                actualizarNSel();
            };
            el.querySelectorAll('input.sel-gbd').forEach(x => x.addEventListener('change', actualizarSelG));
            document.getElementById('selTodasGbd')?.addEventListener('change', e => { el.querySelectorAll('input.sel-gbd').forEach(x => { x.checked = e.target.checked; }); actualizarSelG(); });
            actualizarSelG();

            el.querySelectorAll('[data-gbd-estado]').forEach(sel => sel.addEventListener('change', async () => {
                const f = facturasGBD.find(x => x.id === sel.dataset.gbdEstado);
                sel.disabled = true;
                try {
                    await updateDoc(doc(db, 'facturas_gbd', f.id), { estadoPago: sel.value, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp() });
                    f.estadoPago = sel.value;
                    sel.className = `estado ${ESTADOS[sel.value]?.clase || ''}`;
                } catch (err) { console.error(err); sel.value = f.estadoPago; alert('No se pudo cambiar el estado: ' + err.message); }
                finally { sel.disabled = false; }
            }));
            el.querySelectorAll('input.mor-switch-g').forEach(sw => sw.addEventListener('change', async () => {
                const f = facturasGBD.find(x => x.id === sw.dataset.id);
                if (pagadaG(f) && !confirm(`La factura de ${f.nombre} ya está marcada como pagada. ¿${sw.checked ? 'Agregar' : 'Quitar'} los moratorios de todos modos?`)) { sw.checked = !sw.checked; return; }
                sw.disabled = true;
                try {
                    const pct = sw.checked ? PCT_MORATORIOS : 0;
                    await updateDoc(doc(db, 'facturas_gbd', f.id), { moratoriosPct: pct, total: calcGBD({ ...f, moratoriosPct: pct }).total, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp() });
                    await cargar(`<span class="ok">${sw.checked ? `Moratorios agregados a ${esc(f.nombre)}.` : `Moratorios quitados a ${esc(f.nombre)}.`}</span>`);
                } catch (err) { console.error(err); sw.checked = !sw.checked; sw.disabled = false; alert('No se pudieron actualizar los moratorios: ' + err.message); }
            }));
            // Toda la fila abre el detalle, salvo los controles (interruptores y estado)
            el.querySelectorAll('tr.fila-g').forEach(tr => tr.addEventListener('click', e => {
                if (e.target.closest('input, select, label, button, a')) return;
                location.href = `ficha-gbd.html?id=${encodeURIComponent(tr.dataset.id)}`;
            }));
        }

        // ---------- Historial de cortes: consultar y volver a exportar ----------
        async function abrirHistorialCortes() {
            const fondo = document.createElement('div');
            fondo.className = 'lf-modal-fondo';
            fondo.innerHTML = `<div class="lf-modal" role="dialog" aria-label="Historial de cortes" style="max-width:980px"><h3>Historial de cortes</h3><div id="hcCuerpo" class="nota-hc">Cargando...</div><div class="lf-modal-pie"><span id="hcMsg" style="margin-right:auto;font-size:13px;color:var(--peligro)"></span><button class="lf-btn" data-cerrar>Cerrar</button></div></div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
            const cuerpo = document.getElementById('hcCuerpo'), msgH = document.getElementById('hcMsg');
            try {
                const cortes = (await getDocs(collection(db, 'facturacion_cortes'))).docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.mes.localeCompare(a.mes));
                if (!cortes.length) { cuerpo.innerHTML = '<p class="vacio">Todavía no hay cortes. El primero aparece aquí cuando hagas el corte del mes.</p>'; return; }
                const fecha = c => c.hechoEn?.toDate?.().toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }) || '-';
                cuerpo.innerHTML = `<div class="lf-tabla-wrap"><table class="lf-tabla">
                    <thead><tr><th>Mes</th><th>Corte</th><th class="der">Facturas</th><th class="der">Facturado</th><th class="der">Cobrado</th><th class="der">Por cobrar</th><th>Sin pagar</th><th></th></tr></thead>
                    <tbody>${cortes.map(c => `<tr>
                        <td><strong>${esc(mesTxt(c.mes))}</strong></td>
                        <td>${esc(fecha(c))}<small>${esc(c.hechoPor || '')}</small></td>
                        <td class="der lf-num">${c.facturas ?? '-'}${(c.apagadas || []).length ? `<small>${c.apagadas.length} apagada${c.apagadas.length > 1 ? 's' : ''}</small>` : ''}</td>
                        <td class="der lf-num">${dinero(c.facturado)}</td>
                        <td class="der lf-num" style="color:var(--exito)">${dinero(c.cobrado)}</td>
                        <td class="der lf-num">${dinero(c.porCobrar)}</td>
                        <td title="${esc((c.pendientes || []).map(p => `${p.locales} ${p.razonSocial}`).join('; '))}">${(c.pendientes || []).length ? `${c.pendientes.length} al corte` : '<span class="lf-vacio">Todo pagado</span>'}</td>
                        <td><div class="lf-acciones"><button class="lf-btn lf-btn-compacto" data-ver-corte="${esc(c.mes)}">Ver mes</button><button class="lf-btn lf-btn-compacto lf-btn-primario" data-exp-corte="${esc(c.mes)}">Exportar</button></div></td>
                    </tr>`).join('')}</tbody></table></div>
                    <p class="nota-hc" style="margin:10px 0 0;font-size:13px;color:var(--tinta-suave)">«Exportar» vuelve a generar el reporte con las facturas de ese mes tal como están hoy y con los mismos locales apagados que se marcaron en el corte. Si cambiaron desde entonces, te avisa.</p>`;
                cuerpo.querySelectorAll('[data-ver-corte]').forEach(b => b.addEventListener('click', () => {
                    cerrar();
                    mes = b.dataset.verCorte;
                    history.replaceState(null, '', '?mes=' + mes);
                    cargar();
                }));
                cuerpo.querySelectorAll('[data-exp-corte]').forEach(b => b.addEventListener('click', async () => {
                    b.disabled = true; msgH.textContent = '';
                    try { await exportarCorte(cortes.find(c => c.mes === b.dataset.expCorte)); }
                    catch (err) { console.error(err); msgH.textContent = err.message || 'No se pudo exportar.'; }
                    finally { b.disabled = false; }
                }));
            } catch (err) {
                console.error(err);
                cuerpo.innerHTML = `<p class="err">No se pudo cargar el historial (${esc(err.message)}).</p>`;
            }
        }

        // Vuelve a exportar el reporte de un mes cortado: facturas de hoy, locales apagados como estaban en el corte
        async function exportarCorte(corte) {
            const [snapC, frescas] = await Promise.all([getDocs(collection(db, 'contratos')), cargarFacturasMes(corte.mes)]);
            const contratos = snapC.docs.map(d => ({ id: d.id, ...d.data() })).sort(ordenLocales);
            const facturas = frescas.map(f => ({ ...f, ...totalesFactura(f) }));
            if (!facturas.length) throw new Error(`Ya no hay facturas de ${mesTxt(corte.mes)}.`);
            const hoy = r2(facturas.reduce((s, f) => s + (f.total || 0), 0));
            if (typeof corte.facturado === 'number' && Math.abs(hoy - corte.facturado) > 0.005
                && !confirm(`Las facturas de ${mesTxt(corte.mes)} cambiaron desde el corte: se facturó ${dinero(corte.facturado)} y hoy suman ${dinero(hoy)}.\n\n¿Exportar con los datos de hoy?`)) return;
            const apagadas = new Set(corte.apagadas || []);
            const porId = Object.fromEntries(contratos.map(c => [c.id, c]));
            const orden = f => contratos.findIndex(c => c.id === f.contratoId);
            const elegidas = facturas.map(f => ({ ...f, _redactada: apagadas.has(f.contratoId) })).sort((a, b) => orden(a) - orden(b));
            // Las facturas de GBD solo entran si el corte ya las registraba (los cortes anteriores no las llevaban)
            const apagG = new Set(corte.apagadasGBD || []);
            const gbd = Array.isArray(corte.gbd) ? (await leerFacturasGBD(corte.mes)).map(f => ({ ...f, _redactada: apagG.has(f.contratoId) })) : [];
            if (elegidas.every(f => f._redactada) && gbd.every(f => f._redactada)) throw new Error('En ese corte todos los locales estaban apagados.');
            imprimirHojas(documentoContadores(corte.mes, elegidas, porId, { resumen: true, gbd }), `Facturas LAFABDECHOC ${mesTxt(corte.mes)} (corte)`);
        }

        async function generar(faltan, contratos) {
            if (!generarSinConfirmar && !confirm(`¿Generar ${faltan.length} factura(s) de ${mesTxt(mes)}?\n\nQuedan como "Pendiente" para que las revises.`)) return;
            generarSinConfirmar = false;
            const btn = document.getElementById('generar');
            btn.disabled = true;
            try {
                const [lecturas, general, todas] = await Promise.all([cargarLecturas(), cargarConfigGeneral(), cargarTodasLasFacturas()]);
                const porId = Object.fromEntries(contratos.map(c => [c.id, c]));
                                const user = getCurrentUser().email;
                const batch = writeBatch(db);
                faltan.forEach(c => {
                    batch.set(doc(db, 'facturas', facturaId(c.id, mes)), {
                        ...generarFactura(c, mes, lecturas, general, lecturasFacturadas(todas, c, lecturas, facturaId(c.id, mes))),
                        creadoPor: user, creadoEn: serverTimestamp()
                    });
                });
                await batch.commit();
                // También las facturas de GBD del mes (renta a GBD y préstamo), si faltan
                let nGBD = 0;
                try { nGBD = await generarGBD(mes); } catch (err) { console.warn('No se generaron las facturas de GBD', err); }
                cargar(`<span class="ok">Se generaron ${faltan.length} facturas${nGBD ? ` y ${nGBD} de GBD` : ''}. Revisa cada una antes de enviarla.</span>`);
            } catch (err) {
                console.error(err);
                document.getElementById('msg').innerHTML = `<span class="err">No se pudo generar: ${esc(err.message)}</span>`;
                btn.disabled = false;
            }
        }

        async function actualizarAgua(facturas, contratos) {
            const pagadas = facturas.filter(f => f.estadoPago === 'pagado' || f.estadoPago === 'pago_tarde').length;
            if (!confirm(`¿Actualizar el agua de ${facturas.length} facturas de ${mesTxt(mes)} con las lecturas capturadas?` +
                (pagadas ? `\n\nOjo: ${pagadas} ya están marcadas como pagadas.` : '') +
                '\n\nActualiza el agua y el periodo de la basura; renta, extraordinarios, moratorios y notas se conservan.')) return;
            const btn = document.getElementById('actAgua');
            btn.disabled = true;
            try {
                const [lecturas, todas] = await Promise.all([cargarLecturas(), cargarTodasLasFacturas()]);
                const porId = Object.fromEntries(contratos.map(c => [c.id, c]));
                const batch = writeBatch(db);
                let cambiadas = 0;
                facturas.forEach(f => {
                    const c = porId[f.contratoId];
                    if (!c) return;
                    const nuevo = actualizarAguaEnFactura(f, c, lecturas, lecturasFacturadas(todas, c, lecturas, f.id));
                    if (JSON.stringify(f.conceptos || []) === JSON.stringify(nuevo.conceptos)) return;
                    cambiadas++;
                    batch.update(doc(db, 'facturas', f.id), { ...nuevo, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp() });
                });
                if (cambiadas) await batch.commit();
                cargar(`<span class="ok">Agua y periodos actualizados en ${cambiadas} factura(s).</span>`);
            } catch (err) {
                console.error(err);
                document.getElementById('msg').innerHTML = `<span class="err">No se pudo actualizar: ${esc(err.message)}</span>`;
                btn.disabled = false;
            }
        }

        // ---------- Moratorios (porcentaje de Configuración, sobre la renta sin IVA) ----------
        let PCT_MORATORIOS = MORATORIOS_DEFAULT;
        const esConceptoMor = c => c.tipo === 'moratorios' || /MORATORIO/.test(c.concepto || '');
        const montoMoratorios = f => (f.conceptos || []).filter(esConceptoMor).reduce((s, c) => s + (Number(c.total) || 0), 0);
        function celdaMoratorios(f) {
            const monto = montoMoratorios(f);
            const on = monto > 0 || (f.moratoriosPct || 0) > 0;
            const pct = Math.round((f.moratoriosPct || (on ? PCT_MORATORIOS : 0)) * 100);
            return `<label class="switch" title="${on ? 'Quitar' : 'Cobrar'} moratorios (${Math.round(PCT_MORATORIOS * 100)}% de la renta)">
                    <input type="checkbox" class="mor-switch" data-id="${esc(f.id)}" ${on ? 'checked' : ''}><span class="slider"></span></label>
                ${on ? `<span class="mor-monto">${dinero(monto)}</span><span class="mor-n">${pct}% de la renta</span>` : ''}`;
        }
        async function cambiarMoratorios(sw, facturas) {
            const f = facturas.find(x => x.id === sw.dataset.id);
            if (!f) return;
            const pagada = f.estadoPago === 'pagado' || f.estadoPago === 'pago_tarde';
            if (pagada && !confirm(`La factura de ${f.razonSocial} ya está marcada como pagada. ¿${sw.checked ? 'Agregar' : 'Quitar'} los moratorios de todos modos?`)) { sw.checked = !sw.checked; return; }
            sw.disabled = true;
            try {
                const pct = sw.checked ? PCT_MORATORIOS : 0;
                const renta = (f.conceptos || []).filter(c => c.tipo === 'renta' || /^RENTA/.test(c.concepto || '')).reduce((s, c) => s + (Number(c.subtotal) || 0), 0);
                const sub = r2(renta * pct);
                const conceptos = (f.conceptos || []).map(c => ({ ...c }));
                let mor = conceptos.find(esConceptoMor);
                if (!mor) {
                    mor = { concepto: 'INTERESES MORATORIOS', tipo: 'moratorios' };
                    const iBasura = conceptos.findIndex(c => c.tipo === 'basura');
                    conceptos.splice(iBasura >= 0 ? iBasura : conceptos.length, 0, mor);
                }
                Object.assign(mor, { subtotal: sub, iva: r2(sub * IVA), total: r2(sub * (1 + IVA)) });
                await updateDoc(doc(db, 'facturas', f.id), {
                    conceptos, moratoriosPct: pct, ...totales(conceptos),
                    actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp()
                });
                cargar(`<span class="ok">${sw.checked ? `Moratorios agregados a ${esc(f.razonSocial)}: ${dinero(mor.total)} (con IVA).` : `Moratorios quitados a ${esc(f.razonSocial)}.`}</span>`);
            } catch (err) {
                console.error(err);
                document.getElementById('msg').innerHTML = `<span class="err">No se pudieron actualizar los moratorios: ${esc(err.message)}</span>`;
                sw.checked = !sw.checked; sw.disabled = false;
            }
        }

        async function cambiarEstado(sel) {
            const prev = [...sel.classList].find(c => c.startsWith('e-'));
            sel.disabled = true;
            try {
                await updateDoc(doc(db, 'facturas', sel.dataset.id), {
                    estadoPago: sel.value, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp()
                });
                sel.classList.remove(prev);
                sel.classList.add(ESTADOS[sel.value].clase);
                cargar(`<span class="ok">Estado actualizado.</span>`);
            } catch (err) {
                document.getElementById('msg').innerHTML = `<span class="err">No se pudo actualizar: ${esc(err.message)}</span>`;
                sel.disabled = false;
            }
        }
    </script>
