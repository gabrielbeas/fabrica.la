<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="stylesheet" href="../css/panel.css?v=20261005-4">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1300px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 20px; }
        h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 0 0 12px; }

        .barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
        .nav-mes { display: flex; align-items: center; gap: 6px; }
        .nav-mes button { border: 1px solid var(--borde-control); background: var(--fondo); border-radius: 6px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; color: var(--tinta-suave); }
        .nav-mes button:hover { border-color: var(--accion); color: var(--accion); }
        .nav-mes strong { font-size: 18px; min-width: 190px; text-align: center; text-transform: capitalize; }
        .btn { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { background: var(--fondo-hundido); color: var(--tinta-suave); border: none; border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
        .btn-sec:hover { background: var(--linea); }
        .btn-borrar { background: var(--fondo); color: var(--peligro); border: 1px solid var(--peligro-suave); border-radius: 6px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
        .btn-borrar:hover { background: var(--peligro); color: var(--on-accion); }
        .derecha { margin-left: auto; display: flex; gap: 8px; }

        .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .filtro { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea); border-radius: 16px; padding: 5px 12px; font-size: 13px; cursor: pointer; user-select: none; background: var(--fondo); }
        .filtro i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .filtro.off { opacity: .4; }
        .filtro.off i { background: var(--tinta-tenue) !important; }

        .layout { display: grid; grid-template-columns: 1fr 330px; gap: 20px; align-items: start; }
        @media (max-width: 950px) { .layout { grid-template-columns: 1fr; } }
        /* Celular: el mes compacto; los eventos se ven como barritas de color y el detalle sale en el panel de abajo */
        @media (max-width: 700px) {
            .barra { gap: 8px; }
            .nav-mes { flex: 1; }
            .barra .nav-mes strong { min-width: 0; flex: 1; font-size: 17px; }
            .barra .derecha { margin-left: 0; width: 100%; }
            .derecha .btn { flex: 1; }
            .filtros.filtros { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
            .filtros .filtro { flex: none; }
            .mes .sem, .mes .dias { grid-template-columns: repeat(7, minmax(0, 1fr)); }
            .mes .sem div { padding: 6px 0; font-size: 10px; letter-spacing: 0; }
            .mes .dia { min-height: 58px; padding: 4px 3px; }
            .mes .dia .n { font-size: 12px; min-width: 22px; height: 22px; line-height: 22px; }
            .mes .chip { font-size: 0; height: 5px; padding: 0; margin-top: 3px; border-left: none; border-radius: 3px; background: currentColor !important; }
            .mes .mas { font-size: 10px; padding-left: 1px; }
            .modal .campos { grid-template-columns: 1fr; }
            .modal-fondo.modal-fondo { padding: 12px 8px; }
            .modal-fondo .modal { padding: 18px 16px; }
        }

        /* Mes */
        .mes { border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; }
        /* minmax(0, 1fr): las siete columnas miden igual aunque un evento tenga texto largo */
        .sem, .dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .dia { min-width: 0; }
        .chip { cursor: pointer; }
        .chip:hover { filter: brightness(.95); }
        .mas { cursor: pointer; text-decoration: underline; text-decoration-color: var(--linea); }
        .det-tipo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; margin-bottom: 10px; }
        .det-tipo i { width: 8px; height: 8px; border-radius: 999px; }
        .det-fecha { color: var(--tinta-suave); font-size: 14px; margin: 0 0 12px; }
        .det-texto { font-size: 14px; line-height: 20px; margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
        .det-lista .ev { cursor: pointer; }
        .sem div { font-size: 11px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .05em; padding: 8px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); text-align: center; }
        .dia { min-height: 108px; border-right: 1px solid var(--linea); border-bottom: 1px solid var(--linea); padding: 6px 6px 4px; cursor: pointer; position: relative; background: var(--fondo); }
        .dia:nth-child(7n) { border-right: none; }
        .dia:hover { background: var(--ambar-suave); }
        /* Tres tonos: días hábiles (blanco), fines de semana del mes (gris neutro sutil), días de otro mes (gris azulado) */
        .dia.finde { background: color-mix(in srgb, #000 4%, var(--fondo)); }
        .dia.fuera { background: color-mix(in srgb, var(--accion) 7%, var(--fondo-hundido)); }
        .dia.fuera .n { color: var(--tinta-tenue); }
        .dia.sel { outline: var(--trazo) solid var(--accion); outline-offset: calc(-1 * var(--trazo)); z-index: 1; }
        /* Feriado oficial (art. 74 LFT): tachado rojo de esquina a esquina, con el grosor de trazo del sistema */
        .dia.oficial::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom right, transparent calc(50% - var(--trazo) / 2), var(--peligro) calc(50% - var(--trazo) / 2), var(--peligro) calc(50% + var(--trazo) / 2), transparent calc(50% + var(--trazo) / 2)); }
        .dia .n { font-size: 13px; font-weight: 600; color: var(--tinta-suave); display: inline-block; min-width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 12px; }
        .dia.hoy .n { background: var(--accion); color: var(--on-accion); }
        .chip { display: block; font-size: 11px; line-height: 1.25; padding: 2px 6px; border-radius: 4px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; }
        .mas { font-size: 11px; color: var(--tinta-suave); margin-top: 3px; padding-left: 4px; }

        /* Panel derecho */
        .panel { border: 1px solid var(--linea); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
        .panel h3 { margin: 0 0 12px; font-size: 16px; }
        .panel h3::first-letter { text-transform: uppercase; }
        .ev { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--linea); font-size: 14px; }
        .ev:first-of-type { border-top: none; padding-top: 0; }
        .ev .punto { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
        .ev .tit { font-weight: 600; }
        .ev .det { font-size: 12px; color: var(--tinta-suave); margin-top: 2px; }
        .ev a { color: var(--accion); text-decoration: none; font-size: 12px; }
        .ev .editar { border: none; background: none; color: var(--accion); font-size: 12px; cursor: pointer; padding: 0; }
        .ev .cuando { font-size: 12px; color: var(--tinta-suave); white-space: nowrap; margin-left: auto; padding-left: 8px; }
        .vacio { color: var(--tinta-tenue); font-size: 13px; }

        /* Ventana para capturar */
        .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 2000; overflow-y: auto; }
        .modal { background: var(--fondo); border-radius: 12px; width: 100%; max-width: 520px; padding: 24px 26px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 16px; font-size: 18px; }
        .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
        .campos .ancho { grid-column: 1 / -1; }
        .campos label { display: block; font-size: 12px; color: var(--tinta-suave); margin-bottom: 5px; }
        .campos input, .campos select, .campos textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--borde-control); border-radius: 6px; font-size: 14px; font-family: inherit; }
        .campos input:focus, .campos select:focus, .campos textarea:focus { outline: none; border-color: var(--accion); }
        .acciones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
        .acciones .izq { margin-right: auto; }
        .msg { font-size: 13px; margin-left: 8px; }
        .ok { color: var(--exito); } .err { color: var(--peligro); }
        .cargando { color: var(--tinta-suave); padding: 40px 0; text-align: center; }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando calendario...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261005-4';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261005-4';
        import { collection, getDocs, getDoc, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { FERIADOS } from '../../../js/feriados.js?v=20261005-4';
        import { personaDeVacacion, diasDeVacacion } from '../../../js/vacaciones.js?v=20261005-4';

        const app = document.getElementById('app');
        let diaLimitePago = 10; // Configuración → facturacion_config/general
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
        const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        const deISO = f => { const [y, m, d] = f.split('-').map(Number); return new Date(y, m - 1, d); };
        const sumarDias = (f, n) => { const d = deISO(f); d.setDate(d.getDate() + n); return iso(d); };
        const hoy = iso(new Date());
        const fechaLarga = f => { const d = deISO(f); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`; };
        const fechaCorta = f => { const d = deISO(f); return `${d.getDate()} ${MESES[d.getMonth()].slice(0, 3)}`; };

        // ---------- Tipos de evento ----------
        // auto: lo genera el panel; manual: lo captura alguien; soloAdmin: el operario no lo ve
        const TIPOS = {
            vencimiento: { nombre: 'Vencimientos de contrato', color: '#c62828', auto: true, soloAdmin: true },
            incremento:  { nombre: 'Incrementos de renta',     color: '#ef6c00', auto: true, soloAdmin: true },
            pago:        { nombre: 'Límite de pago de renta',  color: '#ad1457', auto: true, soloAdmin: true },
            agua:        { nombre: 'Lecturas de agua',         color: '#0288d1', auto: true },
            bitacora:    { nombre: 'Bitácora',                 color: '#d08a1e', auto: true },
            personal:    { nombre: 'Ausencias del personal',   color: '#5e35b1', auto: true, soloAdmin: true },
            actividad:   { nombre: 'Actividades',              color: '#1f4e79' },
            vacaciones:  { nombre: 'Vacaciones',               color: '#8e24aa' },
            feriado:     { nombre: 'Feriados',                 color: '#2e7d32' }
        };
        const MANUALES = ['actividad', 'vacaciones', 'feriado'];

        // ---------- Feriados oficiales (art. 74 de la Ley Federal del Trabajo) ----------
        const esOficial = f => FERIADOS.some(([x]) => x === f);
        // La lista está en js/feriados.js (también la usa Personal para contar vacaciones)

        // ---------- Estado ----------
        let admin = false, user = null;
        // El admin edita cualquier evento capturado; el operario solo los que él capturó
        const puedeEditar = ev => admin || (!!ev?.creadoPor && ev.creadoPor === user?.email);
        let manuales = [], contratos = [], lecturas = [], bitacora = [], ausencias = [], personal = [];
        let mesVista = hoy.slice(0, 7), diaSel = hoy;
        let activos = new Set(Object.keys(TIPOS));

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            user = getCurrentUser();
            admin = esAdmin();
            if (!admin) Object.entries(TIPOS).forEach(([k, t]) => { if (t.soloAdmin) activos.delete(k); });
            cargar().then(dibujar).catch(err => {
                console.error(err);
                app.innerHTML = `<h1>Calendario</h1><p class="err">No se pudo cargar: ${esc(err.message)}</p>`;
            });
        }

        async function cargar() {
            const tareas = [getDocs(collection(db, 'calendario_eventos')), getDocs(collection(db, 'agua_lecturas'))];
            // Bitácora: si no se puede leer (reglas), el calendario se muestra sin ella
            const tareaBitacora = getDocs(collection(db, 'bitacora')).then(sn => sn.docs.map(d => d.data())).catch(err => { console.warn('Sin bitácora en el calendario:', err.code || err); return []; });
            if (admin) tareas.push(getDocs(collection(db, 'contratos')), getDoc(doc(db, 'facturacion_config', 'general')).catch(() => null));
            const [snapEv, snapLec, snapC, snapCfg] = await Promise.all(tareas);
            const dia = snapCfg?.exists() ? snapCfg.data().diaLimitePago : null;
            if (Number.isInteger(dia)) diaLimitePago = dia;
            manuales = snapEv.docs.map(d => ({ id: d.id, ...d.data() }));
            lecturas = snapLec.docs.map(d => d.data());
            contratos = snapC ? snapC.docs.map(d => ({ id: d.id, ...d.data() })) : [];
            bitacora = await tareaBitacora;
            // Ausencias del personal (vacaciones, faltas, permisos, incapacidades): solo admin
            // Personal (solo admin): para ligar cada vacación a su persona
            if (admin) personal = await getDocs(collection(db, 'personal')).then(sn => sn.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.activo !== false).sort((a, b) => (a.nombre || '').localeCompare(b.nombre || '', 'es'))).catch(() => []);
            if (admin) ausencias = await getDocs(collection(db, 'personal_ausencias')).then(sn => sn.docs.map(d => d.data())).catch(err => { console.warn('Sin ausencias en el calendario:', err.code || err); return []; });
        }

        // ---------- Todos los eventos de un rango de fechas ----------
        function eventosEntre(desde, hasta) {
            const ev = [];
            const dentro = f => f >= desde && f <= hasta;
            const nombreC = c => `${c.nombreComercial || c.razonSocial} · local ${(c.locales || []).join(', ')}`;
            // Contratos (solo admin)
            contratos.forEach(c => {
                const link = `../locales/caratula.html?id=${encodeURIComponent(c.id)}`;
                if (c.fin && dentro(c.fin)) ev.push({ tipo: 'vencimiento', fecha: c.fin, titulo: `Vence contrato: ${c.nombreComercial || c.razonSocial}`, det: nombreC(c), link });
                if (c.incremento && dentro(c.incremento)) ev.push({ tipo: 'incremento', fecha: c.incremento, titulo: `Incremento de renta: ${c.nombreComercial || c.razonSocial}`, det: `${nombreC(c)}${c.incrementoTipo ? ' · ' + c.incrementoTipo : ''}`, link });
            });
            // Límite de pago (día 10) y recordatorio de lectura de agua (día 21) de cada mes del rango
            const fechasLec = new Set(lecturas.map(l => l.fecha));
            for (let d = deISO(desde.slice(0, 7) + '-01'); iso(d) <= hasta; d.setMonth(d.getMonth() + 1)) {
                const ym = iso(d).slice(0, 7);
                const fLimite = `${ym}-${String(diaLimitePago).padStart(2, '0')}`;
                if (admin && dentro(fLimite)) ev.push({ tipo: 'pago', fecha: fLimite, titulo: 'Límite de pago de renta', det: `A partir del día ${diaLimitePago + 1} el pago se considera tarde`, link: '../facturacion/?mes=' + ym });
                const hayLectura = [...fechasLec].some(f => f.startsWith(ym));
                if (!hayLectura && dentro(ym + '-21') && ym >= hoy.slice(0, 7)) ev.push({ tipo: 'agua', fecha: ym + '-21', titulo: 'Toca lectura de agua', det: 'Todavía no hay lecturas grabadas este mes', link: '../agua/lecturas.html' });
            }
            // Lecturas grabadas
            const porFecha = {};
            lecturas.forEach(l => { if (dentro(l.fecha)) porFecha[l.fecha] = (porFecha[l.fecha] || 0) + 1; });
            Object.entries(porFecha).forEach(([f, n]) => ev.push({ tipo: 'agua', fecha: f, titulo: 'Lecturas de agua grabadas', det: `${n} tubo${n > 1 ? 's' : ''}`, link: '../agua/lecturas.html' }));
            // Acciones registradas en la Bitácora (una por registro, en su fecha)
            const normResp = r => r === 'Victor Navaro' ? 'Victor Navarro' : r;
            bitacora.forEach(r => {
                if (!r.fecha || !dentro(r.fecha)) return;
                ev.push({ tipo: 'bitacora', fecha: r.fecha, hora: r.hora || '', titulo: `${r.hora ? r.hora + ' · ' : ''}${r.accion || 'Acción registrada'}`, det: [r.lugar, r.categoria, normResp(r.responsable)].filter(Boolean).join(' · '), link: '../bitacora/' });
            });
            // Ausencias del personal, un evento por día
            const TIPO_AUS = { vacaciones: 'Vacaciones', falta: 'Falta', permiso: 'Permiso', incapacidad: 'Incapacidad' };
            ausencias.forEach(a => {
                const fin = a.fin && a.fin >= a.inicio ? a.fin : a.inicio;
                for (let f = a.inicio; f && f <= fin && f <= hasta; f = sumarDias(f, 1)) {
                    if (dentro(f)) ev.push({ tipo: 'personal', fecha: f, titulo: `${TIPO_AUS[a.tipo] || 'Ausencia'}: ${a.nombre || ''}`, det: [fin !== a.inicio && `del ${fechaCorta(a.inicio)} al ${fechaCorta(fin)}`, `${a.dias} día${a.dias === 1 ? '' : 's'}`, a.goce === 'no' && 'sin goce de sueldo', a.nota].filter(Boolean).join(' · '), link: '../personal/#' + encodeURIComponent(a.personaId || '') });
                }
            });
            // Feriados oficiales
            FERIADOS.forEach(([f, t]) => { if (dentro(f)) ev.push({ tipo: 'feriado', fecha: f, titulo: t, det: 'Descanso obligatorio (art. 74 LFT)', oficial: true }); });
            // Eventos capturados (pueden durar varios días)
            manuales.forEach(m => {
                const fin = m.fin && m.fin >= m.inicio ? m.fin : m.inicio;
                for (let f = m.inicio; f <= fin; f = sumarDias(f, 1)) {
                    if (f > hasta) break;
                    const vac = m.tipo === 'vacaciones' && admin ? personaDeVacacion(m, personal) : null;
                    const vacDet = vac ? `${vac.persona.nombre}: ${diasDeVacacion(m, vac.persona).length} días de vacaciones` : '';
                    if (dentro(f)) ev.push({ tipo: m.tipo, fecha: f, titulo: m.titulo, det: [vacDet, m.local && 'Local ' + m.local, fin !== m.inicio && `del ${fechaCorta(m.inicio)} al ${fechaCorta(fin)}`, m.nota].filter(Boolean).join(' · '), manual: m, link: vac ? '../personal/#' + encodeURIComponent(vac.persona.id) : undefined });
                }
            });
            const orden = Object.keys(TIPOS);
            return ev.filter(e => activos.has(e.tipo)).sort((a, b) => a.fecha.localeCompare(b.fecha) || orden.indexOf(a.tipo) - orden.indexOf(b.tipo) || (a.hora || '').localeCompare(b.hora || ''));
        }

        // ---------- Dibujo ----------
        function dibujar() {
            const [y, m] = mesVista.split('-').map(Number);
            const primero = new Date(y, m - 1, 1);
            const inicio = new Date(primero); inicio.setDate(1 - primero.getDay());          // domingo anterior
            const celdas = Array.from({ length: 42 }, (_, i) => { const d = new Date(inicio); d.setDate(inicio.getDate() + i); return iso(d); });
            const ev = eventosEntre(celdas[0], celdas[41]);
            const delDia = f => ev.filter(e => e.fecha === f);
            const tiposVisibles = Object.entries(TIPOS).filter(([, t]) => admin || !t.soloAdmin);

            app.innerHTML = `
                <h1>Calendario</h1>
                <p class="sub">Vencimientos, incrementos, pagos y lecturas salen solos de lo capturado en el panel. Las actividades, vacaciones y feriados se agregan aquí; las vacaciones ligadas a una persona se cuentan en Personal.</p>
                <div class="barra">
                    <div class="nav-mes">
                        <button id="ant" aria-label="Mes anterior">‹</button>
                        <strong>${MESES[m - 1]} ${y}</strong>
                        <button id="sig" aria-label="Mes siguiente">›</button>
                    </div>
                    <button class="btn-sec" id="hoyBtn">Hoy</button>
                    <div class="derecha"><button class="btn" id="nuevo">+ Agregar evento</button></div>
                </div>
                <div class="filtros">
                    ${tiposVisibles.map(([k, t]) => `<span class="filtro ${activos.has(k) ? '' : 'off'}" data-tipo="${k}" title="Mostrar u ocultar"><i style="background:${t.color}"></i>${t.nombre}</span>`).join('')}
                </div>
                <div class="layout">
                    <div class="mes">
                        <div class="sem">${['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map(d => `<div>${d}</div>`).join('')}</div>
                        <div class="dias">
                            ${celdas.map(f => {
                                const lista = delDia(f), d = deISO(f);
                                const cls = [f.slice(0, 7) !== mesVista && 'fuera', f === hoy && 'hoy', f === diaSel && 'sel', (d.getDay() === 0 || d.getDay() === 6) && 'finde', esOficial(f) && 'oficial'].filter(Boolean).join(' ');
                                return `<div class="dia ${cls}" data-f="${f}">
                                    <span class="n">${d.getDate()}</span>
                                    ${lista.slice(0, 3).map((e, i) => `<span class="chip" data-ev="${i}" role="button" tabindex="0" style="border-color:${TIPOS[e.tipo].color};background:${TIPOS[e.tipo].color}14;color:${TIPOS[e.tipo].color}" title="${esc(e.titulo)}">${esc(e.titulo)}</span>`).join('')}
                                    ${lista.length > 3 ? `<div class="mas" role="button" tabindex="0">+${lista.length - 3} más</div>` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                    <div>
                        <div class="panel" id="panelDia"></div>
                        <div class="panel" id="panelProx"></div>
                    </div>
                </div>`;

            document.getElementById('ant').addEventListener('click', () => moverMes(-1));
            document.getElementById('sig').addEventListener('click', () => moverMes(1));
            document.getElementById('hoyBtn').addEventListener('click', () => { mesVista = hoy.slice(0, 7); diaSel = hoy; dibujar(); });
            document.getElementById('nuevo').addEventListener('click', () => formulario(null, diaSel));
            app.querySelectorAll('.filtro').forEach(x => x.addEventListener('click', () => {
                activos.has(x.dataset.tipo) ? activos.delete(x.dataset.tipo) : activos.add(x.dataset.tipo); dibujar();
            }));
            app.querySelectorAll('.dia').forEach(x => {
                x.addEventListener('click', () => { diaSel = x.dataset.f; if (diaSel.slice(0, 7) !== mesVista) mesVista = diaSel.slice(0, 7); dibujar(); });
                x.addEventListener('dblclick', () => formulario(null, x.dataset.f));
            });
            // Clic en un evento: ventana con el detalle completo. Clic en "+N más": todos los del día.
            const abrirChip = (el, k) => {
                const f = el.closest('.dia').dataset.f;
                if (el.classList.contains('mas')) verDia(f); else verDetalle(delDia(f)[+el.dataset.ev]);
            };
            app.querySelectorAll('.chip, .mas').forEach(x => {
                x.addEventListener('click', k => { k.stopPropagation(); abrirChip(x); });
                x.addEventListener('dblclick', k => k.stopPropagation());
                x.addEventListener('keydown', k => { if (k.key === 'Enter' || k.key === ' ') { k.preventDefault(); abrirChip(x); } });
            });
            dibujarPanelDia(delDia(diaSel));
            dibujarProximos();
        }

        // ---------- Ventana de detalle ----------
        function ventana(html, alAbrir) {
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = k => { if (k.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', k => { if (k.target === fondo || k.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
            alAbrir?.(fondo, cerrar);
            fondo.querySelector('[data-cerrar]')?.focus();
        }

        function verDetalle(e) {
            if (!e) return;
            const t = TIPOS[e.tipo];
            const editable = e.manual && puedeEditar(e.manual);
            ventana(`
                <span class="det-tipo" style="background:${t.color}14;color:${t.color}"><i style="background:${t.color}"></i>${esc(t.nombre)}</span>
                <h3 style="margin-bottom:6px">${esc(e.titulo)}</h3>
                <p class="det-fecha">${fechaLarga(e.fecha)}</p>
                ${e.det ? `<p class="det-texto">${esc(e.det)}</p>` : ''}
                ${e.manual?.creadoPor ? `<p class="det-fecha" style="margin:10px 0 0">Capturado por ${esc(e.manual.creadoPor)}</p>` : ''}
                <div class="acciones">
                    ${e.link ? `<a class="btn-sec izq" href="${e.link}" style="text-decoration:none">Abrir</a>` : ''}
                    ${editable ? `<button class="btn-sec" id="d_editar">Editar</button>` : ''}
                    <button class="btn" data-cerrar>Cerrar</button>
                </div>`, (fondo, cerrar) => {
                fondo.querySelector('#d_editar')?.addEventListener('click', () => { cerrar(); formulario(manuales.find(m => m.id === e.manual.id)); });
            });
        }

        function verDia(f) {
            const lista = delDia(f);
            ventana(`
                <h3 style="margin-bottom:6px">${fechaLarga(f)}</h3>
                <p class="det-fecha">${lista.length} eventos</p>
                <div class="det-lista">${lista.map((e, i) => `<div data-i="${i}">${filaEvento(e)}</div>`).join('')}</div>
                <div class="acciones"><button class="btn" data-cerrar>Cerrar</button></div>`, (fondo, cerrar) => {
                fondo.querySelectorAll('[data-i]').forEach(x => x.addEventListener('click', k => { if (k.target.closest('a, button')) return; cerrar(); verDetalle(lista[+x.dataset.i]); }));
                fondo.querySelectorAll('.editar').forEach(b => b.addEventListener('click', () => { cerrar(); formulario(manuales.find(m => m.id === b.dataset.id)); }));
            });
        }

        function moverMes(n) {
            const [y, m] = mesVista.split('-').map(Number);
            const d = new Date(y, m - 1 + n, 1);
            mesVista = iso(d).slice(0, 7);
            diaSel = mesVista === hoy.slice(0, 7) ? hoy : mesVista + '-01';
            dibujar();
        }

        const filaEvento = (e, conFecha = false) => `
            <div class="ev">
                <span class="punto" style="background:${TIPOS[e.tipo].color}"></span>
                <div style="flex:1;min-width:0">
                    <div class="tit">${esc(e.titulo)}</div>
                    ${e.det ? `<div class="det">${esc(e.det)}</div>` : ''}
                    <div class="det">${TIPOS[e.tipo].nombre}${e.manual?.creadoPor ? ' · capturado por ' + esc(e.manual.creadoPor) : ''}
                        ${e.link ? ` · <a href="${e.link}">Abrir</a>` : ''}
                        ${e.manual && puedeEditar(e.manual) ? ` · <button class="editar" data-id="${esc(e.manual.id)}">Editar</button>` : ''}</div>
                </div>
                ${conFecha ? `<span class="cuando">${fechaCorta(e.fecha)}</span>` : ''}
            </div>`;

        function engancharEditar(el) {
            el.querySelectorAll('.editar').forEach(b => b.addEventListener('click', () => formulario(manuales.find(m => m.id === b.dataset.id))));
        }

        function dibujarPanelDia(lista) {
            const el = document.getElementById('panelDia');
            el.innerHTML = `<h2>Día seleccionado</h2><h3>${fechaLarga(diaSel)}</h3>
                ${lista.length ? lista.map(e => filaEvento(e)).join('') : '<div class="vacio">Sin eventos. Doble clic en un día para agregar uno.</div>'}`;
            engancharEditar(el);
        }

        function dibujarProximos() {
            const lista = eventosEntre(hoy, sumarDias(hoy, 30)).filter(e => !(e.tipo === 'agua' && e.titulo.startsWith('Lecturas')));
            const el = document.getElementById('panelProx');
            el.innerHTML = `<h2>Próximos 30 días</h2>
                ${lista.length ? lista.map(e => filaEvento(e, true)).join('') : '<div class="vacio">Nada en los próximos 30 días.</div>'}`;
            engancharEditar(el);
        }

        // ---------- Capturar / editar ----------
        function formulario(ev, fecha) {
            const nuevo = !ev;
            const e = ev || { titulo: '', tipo: 'actividad', inicio: fecha || hoy, fin: '', local: '', nota: '' };
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `
                <div class="modal" role="dialog" aria-label="Evento">
                    <h3>${nuevo ? 'Agregar evento' : 'Editar evento'}</h3>
                    <div class="campos">
                        <div class="ancho"><label>Título</label><input id="e_tit" value="${esc(e.titulo)}" placeholder="Ej. Fumigación, junta con locatarios, vacaciones de..."></div>
                        <div><label>Tipo</label><select id="e_tipo">${MANUALES.map(k => `<option value="${k}" ${k === e.tipo ? 'selected' : ''}>${TIPOS[k].nombre.replace(/s$/, '').replace('Actividade', 'Actividad')}</option>`).join('')}</select></div>
                        <div><label>Local relacionado (opcional)</label><input id="e_local" value="${esc(e.local || '')}" placeholder="Ej. 7, 15"></div>
                        ${admin && personal.length ? `<div class="ancho" id="e_persona_fila"><label>Persona de vacaciones</label><select id="e_persona"><option value="">Selecciona</option>${personal.map(p => `<option value="${esc(p.id)}" ${p.id === (personaDeVacacion(e, personal)?.persona.id) ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>` : ''}
                        <div><label>Desde</label><input type="date" id="e_ini" value="${esc(e.inicio)}"></div>
                        <div><label>Hasta (opcional)</label><input type="date" id="e_fin" value="${esc(e.fin || '')}"></div>
                        <div class="ancho"><label>Nota (opcional)</label><textarea id="e_nota" rows="3">${esc(e.nota || '')}</textarea></div>
                    </div>
                    <div class="acciones">
                        ${!nuevo && puedeEditar(e) ? '<button class="btn-borrar izq" id="e_borrar">Eliminar</button>' : ''}
                        <span class="msg" id="e_msg"></span>
                        <button class="btn-sec" data-cerrar>Cancelar</button>
                        <button class="btn" id="e_guardar">${nuevo ? 'Agregar' : 'Guardar'}</button>
                    </div>
                </div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = k => { if (k.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', k => { if (k.target === fondo || k.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
            document.getElementById('e_tit').focus();
            // El campo Persona solo aplica a vacaciones; las vacaciones ligadas se cuentan en Personal
            const filaPersona = document.getElementById('e_persona_fila');
            const verPersona = () => { if (filaPersona) filaPersona.style.display = document.getElementById('e_tipo').value === 'vacaciones' ? '' : 'none'; };
            document.getElementById('e_tipo').addEventListener('change', verPersona);
            verPersona();

            document.getElementById('e_guardar').addEventListener('click', async () => {
                const msg = document.getElementById('e_msg');
                const datos = {
                    titulo: document.getElementById('e_tit').value.trim(),
                    tipo: document.getElementById('e_tipo').value,
                    local: document.getElementById('e_local').value.trim(),
                    inicio: document.getElementById('e_ini').value,
                    fin: document.getElementById('e_fin').value,
                    nota: document.getElementById('e_nota').value.trim()
                };
                // En vacaciones capturadas por el admin el título se arma con el nombre de la persona
                const tituloAuto = datos.tipo === 'vacaciones' && !!document.getElementById('e_persona_fila');
                if ((!datos.titulo && !tituloAuto) || !datos.inicio) { msg.className = 'msg err'; msg.textContent = 'Falta el título o la fecha.'; return; }
                if (datos.fin && datos.fin < datos.inicio) { msg.className = 'msg err'; msg.textContent = '"Hasta" no puede ser antes de "Desde".'; return; }
                if (datos.fin === datos.inicio) datos.fin = '';
                if (filaPersona) {
                    const pid = datos.tipo === 'vacaciones' ? document.getElementById('e_persona').value : '';
                    // Toda vacación queda ligada a su persona para que Personal la cuente
                    if (datos.tipo === 'vacaciones' && !pid) { msg.className = 'msg err'; msg.textContent = 'Selecciona la persona de vacaciones.'; return; }
                    if (datos.tipo === 'vacaciones' && !datos.titulo) datos.titulo = `Vacaciones ${personal.find(p => p.id === pid).nombre}`;
                    datos.personaId = pid;
                    datos.persona = personal.find(p => p.id === pid)?.nombre || '';
                }
                const btn = document.getElementById('e_guardar'); btn.disabled = true;
                try {
                    if (nuevo) await addDoc(collection(db, 'calendario_eventos'), { ...datos, creadoPor: user.email, creadoEn: serverTimestamp() });
                    else await updateDoc(doc(db, 'calendario_eventos', e.id), { ...datos, editadoPor: user.email, editadoEn: serverTimestamp() });
                    cerrar();
                    await cargar();
                    diaSel = datos.inicio; mesVista = datos.inicio.slice(0, 7);
                    activos.add(datos.tipo);
                    dibujar();
                } catch (err) {
                    console.error(err); btn.disabled = false;
                    msg.className = 'msg err'; msg.textContent = 'No se pudo guardar: ' + err.message;
                }
            });
            document.getElementById('e_borrar')?.addEventListener('click', async () => {
                if (!confirm(`¿Eliminar "${e.titulo}"?`)) return;
                try {
                    await deleteDoc(doc(db, 'calendario_eventos', e.id));
                    cerrar(); await cargar(); dibujar();
                } catch (err) { alert('No se pudo eliminar: ' + err.message); }
            });
        }
    </script>
</body>
</html>
