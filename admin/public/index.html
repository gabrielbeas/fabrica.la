<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="css/panel.css?v=20261015-2">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1250px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 26px; }
        h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 34px 0 12px; }

        .tarjetas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 16px 18px; }
        .tarjeta .et { font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; }
        .tarjeta .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .tarjeta .det { font-size: 12px; color: var(--tinta-suave); margin-top: 4px; }
        @media (max-width: 800px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }

        .buscar { padding: 9px 12px; border: 1px solid var(--borde-control); border-radius: 6px; font-size: 14px; width: 280px; margin-bottom: 12px; }
        .buscar:focus { outline: none; border-color: var(--accion); }
        .tabla-wrap { border: 1px solid var(--linea); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 14px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); white-space: nowrap; }
        td { padding: 10px 14px; border-bottom: 1px solid var(--linea); vertical-align: top; }
        tbody tr:last-child td { border-bottom: none; }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .gris { color: var(--tinta-suave); font-size: 12px; }
        .correos label { display: flex; gap: 8px; align-items: baseline; padding: 1px 0; cursor: pointer; }
        .correos input[type=checkbox] { flex: none; width: 16px; height: 16px; margin: 0; position: relative; top: 3px; accent-color: var(--accion); cursor: pointer; }
        .correos a { color: var(--accion); text-decoration: none; overflow-wrap: anywhere; }
        .correos a:hover { text-decoration: underline; }
        /* Barra para escribir a los correos marcados */
        .barra-correo { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--linea); border-radius: var(--radio-md); background: var(--fondo-hundido); font-size: 13px; }
        .barra-correo .cuenta { font-weight: 600; margin-right: 4px; }
        .barra-correo .marcar { font: inherit; font-size: 13px; border: none; background: none; padding: 0; color: var(--accion); cursor: pointer; text-decoration: underline; text-decoration-color: var(--linea); }
        .barra-correo select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--borde-control); border-radius: var(--radio-sm); background: var(--fondo); color: var(--tinta); margin-left: auto; }
        .barra-correo .escribir { font: inherit; font-size: 13px; font-weight: 600; height: 34px; padding: 0 14px; border: none; border-radius: var(--radio-sm); background: var(--accion); color: var(--on-accion); cursor: pointer; }
        .barra-correo .escribir:disabled { background: var(--linea); color: var(--tinta-tenue); cursor: not-allowed; }
        .barra-correo .aviso-largo { flex-basis: 100%; color: var(--atencion); font-size: 12px; }
        .correos .tipo { font-size: 11px; color: var(--tinta-tenue); }
        a.loc { color: var(--tinta); text-decoration: none; font-weight: 600; }
        a.loc:hover { color: var(--accion); }
        .vencido { color: var(--peligro); font-size: 11px; font-weight: 600; }
        /* Locales y metrajes: cada fila en una sola línea (en pantallas anchas) */
        @media (min-width: 901px) { .tabla-met td, .tabla-met th { white-space: nowrap; } }
        /* Cotizador por local (a la derecha de la tabla de metrajes; filas alineadas con ella) */
        .met-lado { display: flex; gap: 24px; align-items: flex-start; }
        .met-lado > .met-col { min-width: 0; }
        .met-lado > .met-izq { flex: 0 1 auto; }
        @media (min-width: 901px) { .tabla-met { width: auto; } .met-izq .tabla-wrap { display: inline-block; max-width: 100%; } }
        .met-lado > .met-der { flex: 0 0 480px; }
        .met-cab { height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 8px; font-size: 14px; }
        .met-cab .desglose { margin: 0; }
        .met-cab button { font: inherit; font-size: 13px; border: none; background: none; color: var(--accion); cursor: pointer; padding: 4px 2px; }
        .met-cab button:hover { text-decoration: underline; }
        @media (min-width: 901px) {
            .tabla-met th, .tabla-met td, .tabla-cot th, .tabla-cot td { height: 36px; vertical-align: middle; box-sizing: border-box; padding: 0 8px; white-space: nowrap; font-size: 13px; }
        }
        .tabla-cot { width: 100%; border-collapse: collapse; }
        .tabla-cot input { font: inherit; font-family: var(--font-mono); font-size: 13px; width: 96px; text-align: right; padding: 3px 6px; border: 1px solid var(--borde-control); border-radius: var(--radio-sm); background: var(--fondo); color: var(--tinta); }
        .tabla-cot input:focus { outline: 2px solid var(--foco); outline-offset: 1px; }
        .tabla-cot .sube { color: var(--exito); } .tabla-cot .baja { color: var(--peligro); }
        .tabla-cot .dif { font-size: 13px; }
        @media (max-width: 1100px) { .met-lado { flex-wrap: wrap; } .met-lado > .met-der { flex: 1 1 100%; overflow-x: auto; } }
        .desglose { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 12px; cursor: pointer; }
        tr.sub-local td { color: var(--tinta-suave); }
        .barra-m2 { height: 8px; border-radius: 4px; background: var(--accion); opacity: .55; }
        tfoot td { font-weight: 600; background: var(--fondo-hundido); border-top: 1px solid var(--linea); }
        .dos { display: grid; grid-template-columns: 1fr; gap: 0; }
        .cargando { color: var(--tinta-suave); padding: 40px 0; text-align: center; }
        .err { color: var(--peligro); }
        /* Apps del inicio */
        .apps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 10px; }
        @media (max-width: 900px) { .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .app { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px 18px; border: 1px solid var(--linea); border-radius: 14px; background: var(--fondo); color: var(--tinta); text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
        .app:hover { transform: translateY(-3px); box-shadow: 0 8px 22px rgba(208, 138, 30,.15); border-color: var(--ambar); }
        .app .ico { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accion-suave); }
        .app .ico svg { width: 24px; height: 24px; stroke: var(--accion); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .app .nom { font-weight: 600; font-size: 15px; }
        .app .des { font-size: 12px; color: var(--tinta-suave); line-height: 1.4; }
        .app.pendiente { cursor: default; opacity: .6; }
        .app.pendiente:hover { transform: none; box-shadow: none; border-color: var(--linea); }
        .app.pendiente .ico { background: var(--tinta-tenue); }
        @media (max-width: 700px) {
            .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .app { padding: 14px; gap: 8px; border-radius: 12px; }
            .app .ico { width: 38px; height: 38px; border-radius: 10px; }
            .app .ico svg { width: 20px; height: 20px; }
            .app .nom { font-size: 14px; }
            .app:hover { transform: none; }
        }
        .prox { display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 8px; background: var(--linea); color: var(--tinta-suave); vertical-align: middle; }
        th.ord { cursor: pointer; user-select: none; }
        th.ord:hover { color: var(--tinta); }
        th.ord.act { color: var(--accion); }
        th.ord .flecha { font-size: 9px; margin-left: 5px; opacity: .35; letter-spacing: -1px; }
        th.ord.act .flecha { opacity: 1; }
        .volver { display: inline-block; color: var(--accion); text-decoration: none; font-size: 14px; margin-bottom: 14px; }
        .acceso { display: inline-block; margin-top: 10px; padding: 11px 20px; border-radius: 6px; background: var(--accion); color: var(--on-accion); text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando...</div></div>

    <script type="module">
        import { crearNavbar } from '../../js/navbar.js?v=20261015-2';
        import { getCurrentUser, isAuthenticated, esAdmin, db, basePath } from '../../js/auth.js?v=20261015-2';
        import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { correosDeContrato, abrirCorreo, CORREO_REMITENTE, urlGmail } from '../../js/correos-contrato.js?v=20261014-6';
        import { telefonoWhatsApp } from '../../js/whatsapp.js?v=20261015-2';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const num = n => (Number(n) || 0).toLocaleString('es-MX', { maximumFractionDigits: 2 });
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        const b = basePath();

        // ---------- Apps del inicio (agregar aquí las nuevas) ----------
        const ICO = {
            directorio: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17c.8-2 2.5-3 4.5-3s3.7 1 4.5 3"/></svg>',
            metrajes: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 12h9V3M12 12v9"/></svg>',
            locales: '<svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg>',
            facturacion: '<svg viewBox="0 0 24 24"><path d="M6 2h9l3 3v17l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
            agua: '<svg viewBox="0 0 24 24"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/></svg>',
            siapa: '<svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2.5-1.5L12 21l-2.5-1.5L7 21z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>',
            calendario: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
            config: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
            compras: '<svg viewBox="0 0 24 24"><path d="M3 4h2.5l2 11h10.5l2-8H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
            caja: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2M7 6V4h10v2"/></svg>',
            bitacora: '<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M8.5 10l1.5 1.5L13 8.5M8.5 15.5l1.5 1.5 3-3"/></svg>',
            depositos: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>',
            pagos: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/></svg>',
            cfe: '<svg viewBox="0 0 24 24"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12z"/></svg>',
            personal: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2.1.7 3.5 2.8 3.5 5.6"/></svg>'
        };
        // Orden de las tarjetas (Gabriel, 04/10/2026): 4 por fila en escritorio
        const APPS = [
            { id: 'directorio', nombre: 'Directorio', des: 'Contactos de cada local: teléfono y correos', href: '#directorio', soloAdmin: true },
            { id: 'locales', nombre: 'Contratos', des: 'Carátulas, vigencias y alertas', href: b + 'locales/', soloAdmin: true },
            { id: 'metrajes', nombre: 'Locales y metrajes', des: 'Superficie, renta y renta por m² de cada contrato', href: '#metrajes', soloAdmin: true },
            { id: 'facturacion', nombre: 'Facturación', des: 'Facturas del mes y exportación para contadores', href: b + 'facturacion/', soloAdmin: true },
            { id: 'depositos', nombre: 'Depósitos', des: 'Depósito en garantía de cada contrato: acuerdo, pagos y saldo', href: b + 'depositos/', soloAdmin: true },
            { id: 'pagos', nombre: 'Pagos mensuales', des: 'Impuestos, rentas, seguros y servicios que se pagan cada mes', href: b + 'pagos-mensuales/', soloAdmin: true },
            { id: 'compras', nombre: 'Compras', des: 'Catálogo de productos por proveedor y órdenes de compra', href: b + 'compras/', roles: ['admin', 'operario'] },
            { id: 'caja', nombre: 'Caja Chica', des: 'Gastos, reposiciones y cortes de efectivo', href: b + 'caja-chica/', roles: ['admin', 'operario'] },
            { id: 'agua', nombre: 'Lecturas de agua', des: 'Captura de lecturas e histórico por tubo', href: b + 'agua/lecturas.html' },
            { id: 'bitacora', nombre: 'Bitácora', des: 'Registro de acciones realizadas en la plaza', href: b + 'bitacora/', roles: ['admin', 'operario'] },
            { id: 'calendario', nombre: 'Calendario', des: 'Actividades, vacaciones y días feriados', href: b + 'calendarios/' },
            { id: 'cfe', nombre: 'CFE', des: 'Consumo y recibos de luz del edificio', href: b + 'cfe/', soloAdmin: true },
            { id: 'siapa', nombre: 'SIAPA', des: 'Recibos, pagos y consumo de la toma general', href: b + 'agua/siapa.html', soloAdmin: true },
            { id: 'personal', nombre: 'Personal', des: 'Expedientes, vacaciones y ausencias', href: b + 'personal/', soloAdmin: true },
            { id: 'config', nombre: 'Configuración', des: 'Usuarios y valores de facturación', href: b + 'config/', soloAdmin: true }
        ];
        const tarjetaApp = a => a.pendiente
            ? `<div class="app pendiente" title="Este módulo todavía no está listo"><span class="ico">${ICO[a.id] || ''}</span><span class="nom">${esc(a.nombre)} <span class="prox">Próximamente</span></span><span class="des">${esc(a.des)}</span></div>`
            : `<a class="app" href="${a.href}"><span class="ico">${ICO[a.id] || ''}</span><span class="nom">${esc(a.nombre)}</span><span class="des">${esc(a.des)}</span></a>`;

        let user = null, contratos = null;

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            user = getCurrentUser();
            window.addEventListener('hashchange', mostrar);
            mostrar();
        }

        async function cargarContratos() {
            if (contratos) return contratos;
            const snap = await getDocs(collection(db, 'contratos'));
            const hoy = hoyISO();
            contratos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => parseInt(a.locales?.[0] || 999) - parseInt(b.locales?.[0] || 999))
                .map(c => ({ ...c, vencido: !!(c.fin && c.fin < hoy) }));
            return contratos;
        }

        async function mostrar() {
            const vista = location.hash.slice(1);
            const admin = esAdmin();
            window.scrollTo(0, 0);
            app.style.maxWidth = vista === 'metrajes' ? '1750px' : '';
            if (!admin || !['directorio', 'metrajes'].includes(vista)) {
                app.innerHTML = `
                    <h1>Bienvenido, ${esc(user.nombre || user.email)}</h1>
                    <p class="sub">La Fábrica de Chocolate</p>
                    <div class="apps">${APPS.filter(a => a.roles ? a.roles.includes(user.rol) : admin || !a.soloAdmin).map(tarjetaApp).join('')}</div>`;
                return;
            }
            app.innerHTML = '<div class="cargando">Cargando...</div>';
            try {
                await cargarContratos();
                if (vista === 'directorio') vistaDirectorio(); else vistaMetrajes();
            } catch (err) {
                console.error(err);
                app.innerHTML = `<a class="volver" href="#">← Inicio</a><p class="err">No se pudo cargar: ${esc(err.message)}</p>`;
            }
        }

        const caratula = id => `locales/caratula.html?id=${encodeURIComponent(id)}`;

        // Correos únicos del locatario (notificación + facturación): js/correos-contrato.js, el mismo que usa Depósitos
        const correosDe = correosDeContrato;

        // Columnas ordenables del Directorio
        const COL_DIR = {
            locales: c => parseInt(c.locales?.[0] || 999),
            nombre: c => (c.nombreComercial || '').toLowerCase(),
            razon: c => (c.razonSocial || '').toLowerCase(),
            telefono: c => String(c.telefono || ''),
            correos: c => (correosDe(c)[0]?.correo || '').toLowerCase()
        };
        let ordenDir = { col: 'locales', dir: 1 };
        let busquedaDir = '';
        // Correos marcados para escribirles (se conservan al ordenar o buscar)
        const marcados = new Set();
        let modoCorreo = 'bcc';

        // Encabezado ordenable (sirve para ambas tablas)
        const thOrden = (orden, col, txt, cls = '') => {
            const act = orden.col === col;
            return `<th class="ord ${cls} ${act ? 'act' : ''}" data-col="${col}" title="Ordenar por ${txt.toLowerCase()}">${txt}<span class="flecha">${act ? (orden.dir > 0 ? '▲' : '▼') : '▲▼'}</span></th>`;
        };
        // Vacíos siempre al final, sin importar la dirección
        const comparar = (cols, orden) => (a, b) => {
            const f = cols[orden.col], x = f(a), y = f(b);
            const vx = x === '' || x === 0, vy = y === '' || y === 0;
            if (vx !== vy) return vx ? 1 : -1;
            return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * orden.dir || cols.locales(a) - cols.locales(b);
        };

        function vistaDirectorio() {
            const lista = [...contratos].sort(comparar(COL_DIR, ordenDir));
            app.innerHTML = `
                <a class="volver" href="#">← Inicio</a>
                <h1>Directorio</h1>
                <p class="sub">Contactos de cada local. Haz clic en el título de una columna para ordenar.</p>
                <input class="buscar" id="buscar" placeholder="Buscar local, nombre o correo..." value="${esc(busquedaDir)}">
                <div class="barra-correo" id="barraCorreo">
                    <span class="cuenta" id="cuentaCorreos"></span>
                    <span>Marcar:</span>
                    <button class="marcar" data-marcar="todos">todos los visibles</button>
                    <button class="marcar" data-marcar="Contrato">solo de contrato</button>
                    <button class="marcar" data-marcar="Facturación">solo de facturación</button>
                    <button class="marcar" data-marcar="ninguno">ninguno</button>
                    <select id="modoCorreo" aria-label="Cómo enviar">
                        <option value="bcc" ${modoCorreo === 'bcc' ? 'selected' : ''}>Copia oculta (CCO)</option>
                        <option value="to" ${modoCorreo === 'to' ? 'selected' : ''}>Para (todos se ven)</option>
                    </select>
                    <button class="escribir" id="escribirCorreo" title="Abre la redacción de Gmail desde admin@fabrica.la">Escribir correo</button>
                    <span class="aviso-largo" id="avisoLargo" hidden></span>
                </div>
                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead><tr>${thOrden(ordenDir, 'locales', 'Locales')}${thOrden(ordenDir, 'nombre', 'Nombre comercial')}${thOrden(ordenDir, 'razon', 'Razón social')}${thOrden(ordenDir, 'telefono', 'Teléfono')}${thOrden(ordenDir, 'correos', 'Correos')}</tr></thead>
                        <tbody id="dir">
                            ${lista.map(c => {
                                const correos = correosDe(c);
                                const texto = [c.locales?.join(' '), c.nombreComercial, c.razonSocial, c.telefono, ...correos.map(x => x.correo)].join(' ').toLowerCase();
                                return `<tr data-texto="${esc(texto)}">
                                    <td><a class="loc" href="${caratula(c.id)}">${esc((c.locales || []).join(', '))}</a>${c.vencido ? '<div class="vencido">Contrato vencido</div>' : ''}</td>
                                    <td>${esc(c.nombreComercial || '-')}</td>
                                    <td>${esc(c.razonSocial)}</td>
                                    <td>${c.telefono ? telefonoWhatsApp(c.telefono) : '<span class="gris">Sin registrar</span>'}</td>
                                    <td class="correos">${correos.length ? correos.map(x => `<label><input type="checkbox" data-correo="${esc(x.correo)}" data-tipo="${esc(x.tipo)}" ${marcados.has(x.correo.toLowerCase()) ? 'checked' : ''}><span><a href="mailto:${esc(x.correo)}">${esc(x.correo)}</a> <span class="tipo">${esc(x.tipo)}</span></span></label>`).join('') : '<span class="gris">Sin registrar</span>'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <p class="gris" style="margin-top:8px">El teléfono se captura en la carátula de cada contrato (Editar → Arrendatario). Al darle clic se abre WhatsApp. Los correos de «Facturación» se editan en Facturación (clic en el locatario → Datos de facturación → Editar) y los de «Contrato» en la carátula (Editar → Condiciones).</p>`;
            const filtrar = () => {
                const q = busquedaDir.trim().toLowerCase();
                document.querySelectorAll('#dir tr').forEach(tr => { tr.style.display = !q || tr.dataset.texto.includes(q) ? '' : 'none'; });
            };
            document.getElementById('buscar').addEventListener('input', e => { busquedaDir = e.target.value; filtrar(); });
            filtrar();

            // ---------- Correo a los marcados ----------
            const cajas = () => [...document.querySelectorAll('#dir input[data-correo]')];
            const visible = cb => cb.closest('tr').style.display !== 'none';
            const actualizarBarra = () => {
                const n = marcados.size;
                document.getElementById('cuentaCorreos').textContent = n ? `${n} correo${n === 1 ? '' : 's'} marcado${n === 1 ? '' : 's'}` : 'Marca los correos a los que quieres escribir';
                document.getElementById('escribirCorreo').disabled = !n;
            };
            cajas().forEach(cb => cb.addEventListener('change', () => {
                const c = cb.dataset.correo.toLowerCase();
                cb.checked ? marcados.add(c) : marcados.delete(c);
                // El mismo correo puede salir en dos contratos: se marca o desmarca en todos
                cajas().filter(x => x.dataset.correo.toLowerCase() === c).forEach(x => { x.checked = cb.checked; });
                actualizarBarra();
            }));
            app.querySelectorAll('[data-marcar]').forEach(b => b.addEventListener('click', () => {
                const que = b.dataset.marcar;
                if (que === 'ninguno') marcados.clear();
                else cajas().filter(visible).filter(cb => que === 'todos' || cb.dataset.tipo === que).forEach(cb => marcados.add(cb.dataset.correo.toLowerCase()));
                cajas().forEach(cb => { cb.checked = marcados.has(cb.dataset.correo.toLowerCase()); });
                actualizarBarra();
            }));
            document.getElementById('modoCorreo').addEventListener('change', e => { modoCorreo = e.target.value; });
            document.getElementById('escribirCorreo').addEventListener('click', () => {
                const direcciones = [...marcados];
                const datos = modoCorreo === 'to' ? { para: direcciones } : { cco: direcciones };
                const url = urlGmail(datos);
                const aviso = document.getElementById('avisoLargo');
                // Gmail corta los enlaces muy largos
                aviso.hidden = url.length <= 7000;
                aviso.textContent = `Son muchas direcciones (${url.length} caracteres); si Gmail no las muestra todas, envía en dos partes.`;
                abrirCorreo(datos);
            });
            actualizarBarra();
            app.querySelectorAll('th.ord').forEach(t => t.addEventListener('click', () => {
                const col = t.dataset.col;
                ordenDir = ordenDir.col === col ? { col, dir: -ordenDir.dir } : { col, dir: 1 };
                vistaDirectorio();
            }));
        }

        // Columnas ordenables de "Locales y metrajes": clave → valor para comparar
        const COL_MET = {
            locales: c => parseInt(c.locales?.[0] || 999),
            locatario: c => (c.razonSocial || c.nombreComercial || '').toLowerCase(),
            acceso: c => (c.acceso || '').toLowerCase(),
            m2: c => Number(c.m2) || 0,
            renta: c => c.total || 0,
            rentaM2: c => c.m2 ? (c.total || 0) / c.m2 : 0
        };
        let ordenMet = { col: 'locales', dir: 1 };
        let desglosarLocales = false;   // prueba: un local por fila
        // Cotizador: por contrato, renta mensual y renta por m² propuestas (arrancan con la renta actual; no se guardan)
        let cot = {};
        const cotDe = c => cot[c.id] || (cot[c.id] = { renta: c.total || 0, m2p: c.m2 && c.total ? c.total / c.m2 : 0 });
        const numCot = t => { const v = Number(String(t).replace(/[$,\s]/g, '')); return String(t).trim() === '' || !Number.isFinite(v) ? null : v; };
        const signo = (n, f) => (Math.abs(n) < 0.005 ? f(0) : (n > 0 ? '+' : '−') + f(Math.abs(n)));
        const pctTxt = n => `${n > 0 ? '+' : n < 0 ? '−' : ''}${Math.abs(n).toFixed(1)}%`;

        function vistaMetrajes() {
            const m2Total = contratos.reduce((s, c) => s + (Number(c.m2) || 0), 0);
            const m2Rentado = contratos.filter(c => !c.propio).reduce((s, c) => s + (Number(c.m2) || 0), 0);   // la renta por m² no cuenta locales propios
            const nLocales = contratos.reduce((s, c) => s + (c.locales || []).length, 0);
            const rentaTotal = contratos.reduce((s, c) => s + (c.total || 0), 0);
            const th = (col, txt, cls = '') => {
                const act = ordenMet.col === col;
                return `<th class="ord ${cls} ${act ? 'act' : ''}" data-col="${col}" title="Ordenar por ${txt.toLowerCase()}">${txt}<span class="flecha">${act ? (ordenMet.dir > 0 ? '▲' : '▼') : '▲▼'}</span></th>`;
            };
            const f = COL_MET[ordenMet.col];
            const lista = [...contratos].sort((a, b) => {
                const x = f(a), y = f(b);
                return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * ordenMet.dir || COL_MET.locales(a) - COL_MET.locales(b);
            });
            app.innerHTML = `
                <a class="volver" href="#">← Inicio</a>
                <h1>Locales y metrajes</h1>
                <p class="sub">Superficie y renta por contrato. Haz clic en el título de una columna para ordenar.</p>
                <div class="met-lado">
                <div class="met-col met-izq">
                <div class="met-cab"><label class="desglose"><input type="checkbox" id="desglosar" ${desglosarLocales ? 'checked' : ''}> Un local por fila (prueba)</label></div>
                <div class="tabla-wrap">
                    <table class="tabla-movil tabla-met">
                        <thead><tr>${th('locales', 'Locales')}${th('locatario', 'Locatario')}${th('acceso', 'Acceso')}${th('m2', 'm²', 'num')}${th('renta', 'Renta mensual', 'num')}${th('rentaM2', 'Renta por m²', 'num')}</tr></thead>
                        <tbody>
                            ${lista.map(c => {
                                const locs = (c.locales || []).length ? c.locales : [''];
                                const filasC = desglosarLocales ? locs : [locs.join(', ')];
                                return filasC.map((l, i) => {
                                    const primera = i === 0;
                                    const resto = '<span class="gris" title="Los m² y la renta son del contrato completo">incluido en el contrato</span>';
                                    return `<tr${!primera ? ' class="sub-local"' : ''}>
                                <td><a class="loc" href="${caratula(c.id)}">${esc(l)}</a></td>
                                <td>${esc(c.razonSocial || c.nombreComercial)}${primera && c.vencido ? ' <span class="vencido">Vencido</span>' : ''}</td>
                                <td>${esc(c.acceso || '-')}</td>
                                <td class="num">${!primera ? '' : c.m2 ? num(c.m2) : '<span class="gris">-</span>'}</td>
                                <td class="num">${!primera ? resto : c.propio ? '<span class="gris" title="Local del propietario: sin renta">Propio</span>' : dinero(c.total)}</td>
                                <td class="num">${!primera ? '' : c.m2 && !c.propio ? dinero((c.total || 0) / c.m2) : '-'}</td>
                            </tr>`;
                                }).join('');
                            }).join('')}
                        </tbody>
                        <tfoot><tr><td colspan="3">Total · ${contratos.length} contratos, ${nLocales} locales</td><td class="num">${num(m2Total)}</td>
                            <td class="num">${dinero(rentaTotal)}</td><td class="num">${m2Rentado ? dinero(rentaTotal / m2Rentado) : '-'}</td></tr></tfoot>
                    </table>
                </div>
                </div>
                <div class="met-col met-der">
                <div class="met-cab"><span><strong>Cotizador</strong> · edita la renta por m² o la mensual y se ajusta la otra</span><button type="button" id="cotReset">Restablecer</button></div>
                <div class="tabla-wrap">
                    <table class="tabla-cot">
                        <thead><tr><th class="num">Renta por m²</th><th class="num">Renta mensual</th><th class="num">Diferencia $</th><th class="num">Diferencia %</th></tr></thead>
                        <tbody>
                            ${lista.map(c => {
                                const locs = (c.locales || []).length ? c.locales : [''];
                                const n = desglosarLocales ? locs.length : 1;
                                const x = cotDe(c);
                                return Array.from({ length: n }, (_, i) => i > 0 ? '<tr class="sub-local"><td colspan="4"></td></tr>' : `<tr data-id="${esc(c.id)}">
                                <td class="num"><input inputmode="decimal" class="cot-m2" value="${c.m2 ? x.m2p.toFixed(2) : ''}" ${c.m2 ? '' : 'disabled title="Sin m² capturados"'} aria-label="Renta por m² cotizada"></td>
                                <td class="num"><input inputmode="decimal" class="cot-renta" value="${x.renta.toFixed(2)}" aria-label="Renta mensual cotizada"></td>
                                <td class="num dif" data-d="$"></td><td class="num dif" data-d="%"></td>
                            </tr>`).join('');
                            }).join('')}
                        </tbody>
                        <tfoot><tr id="cotPie"><td class="num" data-t="m2"></td><td class="num" data-t="renta"></td><td class="num dif" data-t="d$"></td><td class="num dif" data-t="d%"></td></tr></tfoot>
                    </table>
                </div>
                </div>
                </div>
                <p class="gris" style="margin-top:8px">Los m² son por contrato (como vienen en cada carátula). Los contratos con varios locales muestran la superficie total. Renta sin IVA.</p>`;
            // Cotizador: cada campo ajusta al otro y se recalculan diferencias y totales
            const porId = Object.fromEntries(contratos.map(c => [c.id, c]));
            const pintarDif = (el, d, p) => {
                el.querySelector('[data-d="$"]').textContent = p === null ? '-' : signo(d, dinero);
                el.querySelector('[data-d="%"]').textContent = p === null ? '-' : pctTxt(p);
                el.querySelectorAll('.dif').forEach(td => { td.classList.toggle('sube', p !== null && d > 0.005); td.classList.toggle('baja', p !== null && d < -0.005); });
            };
            const totalesCot = () => {
                const filasCot = [...app.querySelectorAll('.tabla-cot tbody tr[data-id]')];
                let renta = 0, m2 = 0;
                filasCot.forEach(tr => { const c = porId[tr.dataset.id], x = cot[tr.dataset.id]; renta += x.renta; if (!c.propio || x.renta > 0) m2 += Number(c.m2) || 0; });
                const pie = document.getElementById('cotPie'), d = renta - rentaTotal, p = rentaTotal ? d / rentaTotal * 100 : null;
                pie.querySelector('[data-t="m2"]').textContent = m2 ? dinero(renta / m2) : '-';
                pie.querySelector('[data-t="renta"]').textContent = dinero(renta);
                pie.querySelector('[data-t="d$"]').textContent = signo(d, dinero);
                pie.querySelector('[data-t="d%"]').textContent = p === null ? '-' : pctTxt(p);
                pie.querySelectorAll('.dif').forEach(td => { td.classList.toggle('sube', d > 0.005); td.classList.toggle('baja', d < -0.005); });
            };
            const recalcFila = tr => {
                const c = porId[tr.dataset.id], x = cot[tr.dataset.id], d = x.renta - (c.total || 0);
                pintarDif(tr, d, c.total ? d / c.total * 100 : null);
            };
            app.querySelectorAll('.tabla-cot tbody tr[data-id]').forEach(tr => {
                const c = porId[tr.dataset.id], x = cot[tr.dataset.id], iM2 = tr.querySelector('.cot-m2'), iR = tr.querySelector('.cot-renta');
                iM2.addEventListener('input', () => { const v = numCot(iM2.value); if (v === null || v < 0) return; x.m2p = v; x.renta = v * c.m2; iR.value = x.renta.toFixed(2); recalcFila(tr); totalesCot(); });
                iR.addEventListener('input', () => { const v = numCot(iR.value); if (v === null || v < 0) return; x.renta = v; x.m2p = c.m2 ? v / c.m2 : 0; if (c.m2) iM2.value = x.m2p.toFixed(2); recalcFila(tr); totalesCot(); });
                [iM2, iR].forEach(i => i.addEventListener('focus', () => i.select()));
                recalcFila(tr);
            });
            totalesCot();
            document.getElementById('cotReset').addEventListener('click', () => { cot = {}; vistaMetrajes(); });
            document.getElementById('desglosar').addEventListener('change', e => { desglosarLocales = e.target.checked; vistaMetrajes(); });
            app.querySelectorAll('th.ord').forEach(t => t.addEventListener('click', () => {
                const col = t.dataset.col;
                // Primer clic: texto A→Z, números de mayor a menor; segundo clic invierte
                ordenMet = ordenMet.col === col ? { col, dir: -ordenMet.dir } : { col, dir: ['locales', 'locatario', 'acceso'].includes(col) ? 1 : -1 };
                vistaMetrajes();
            }));
        }
    </script>
</body>
</html>
