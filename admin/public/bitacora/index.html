<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="stylesheet" href="../css/panel.css?v=20261005-1">
    <style>
        /* Solo lo propio de Bitácora; lo demás viene de panel.css (sistema «Panel LFdC») */
        body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--font-sans); font-size: 15px; line-height: 22px; }
        .main { max-width: var(--ancho-pagina); margin: 0 auto; padding: var(--espacio-6) var(--espacio-4) var(--espacio-7); display: flex; flex-direction: column; gap: var(--espacio-5); }
        .cabeza { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--espacio-3); flex-wrap: wrap; }
        .filtros { display: flex; flex-wrap: wrap; gap: var(--espacio-2) var(--espacio-3); align-items: flex-end; }
        .filtros .lf-campo { flex: 0 1 190px; }
        .filtros .lf-campo.buscar { flex: 1 1 240px; }
        .tabla-pie { display: flex; flex-direction: column; gap: var(--espacio-2); }
        .cargando, .vacio { color: var(--tinta-suave); text-align: center; padding: var(--espacio-6) var(--espacio-4); }
        .nota { color: var(--tinta-suave); font-size: 13px; line-height: 18px; margin: 0; }
        .oculto { display: none; }
        .lf-cifra .lf-valor.texto { font-family: var(--font-sans); font-size: 18px; line-height: 30px; font-weight: 700; }
        .fecha { white-space: nowrap; }
        .fecha strong { font-weight: 500; }
        .accion { font-weight: 600; }
        .detalle { color: var(--tinta-suave); font-size: 13px; line-height: 18px; margin-top: var(--espacio-1); white-space: pre-line; }
        .enlace { font: inherit; font-size: 13px; line-height: 18px; border: none; background: none; padding: 0; color: var(--tinta); cursor: pointer; text-decoration: underline; text-decoration-color: var(--ambar); text-decoration-thickness: 2px; text-underline-offset: 3px; }
        .enlace:hover { text-decoration-color: var(--tinta); }
        .enlace:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }

        .lf-modal-fondo:not(.abierto) { display: none; }
        .lf-modal .lf-subtitulo-pag { margin: calc(-1 * var(--espacio-3)) 0 0; }
        .fotos-ops { display: flex; gap: var(--espacio-2); flex-wrap: wrap; }
        .fotos { display: flex; gap: var(--espacio-2); flex-wrap: wrap; }
        .foto { position: relative; width: 84px; height: 84px; border: 1px solid var(--linea); border-radius: var(--radio-md); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--tinta-suave); text-align: center; background: var(--fondo-hundido); }
        .foto img { width: 100%; height: 100%; object-fit: cover; }
        .foto button { position: absolute; top: 4px; right: 4px; border: none; background: var(--tinta); color: var(--fondo); border-radius: var(--radio-pill); width: 20px; height: 20px; line-height: 18px; font-size: 13px; cursor: pointer; padding: 0; }
        .progreso { height: 4px; border-radius: var(--radio-pill); background: var(--linea); overflow: hidden; }
        .progreso span { display: block; height: 100%; width: 0; background: var(--ambar); transition: width .15s; }
        .msg { font-size: 13px; line-height: 18px; color: var(--peligro); margin-right: auto; }
        .hist div { padding: var(--espacio-2) 0; border-top: 1px solid var(--linea); font-size: 14px; line-height: 20px; }
        .hist div:first-child { border-top: none; }
        .lf-modal.visor { max-width: 900px; }
        .lf-modal.visor h3 { overflow-wrap: anywhere; }
        #vContenido img { display: block; max-width: 100%; max-height: 75vh; margin: 0 auto; border-radius: var(--radio-md); }
        #vContenido iframe { width: 100%; height: 75vh; border: 1px solid var(--linea); border-radius: var(--radio-md); }
        @media (prefers-reduced-motion: reduce) { .progreso span { transition: none; } }
    </style>
</head>
<body>
    <main class="main" id="app"><div class="cargando">Cargando...</div></main>

    <div class="lf-modal-fondo" id="modal">
        <div class="lf-modal">
            <h3 id="mTitulo">Registrar acción</h3>
            <p class="lf-subtitulo-pag" id="mSub">Anota lo que se hizo, dónde y quién lo hizo.</p>
            <div class="lf-form">
                <div class="lf-campo"><label for="fFecha">Fecha</label><input type="date" id="fFecha"></div>
                <div class="lf-campo"><label for="fHora">Hora</label><input type="time" id="fHora"></div>
                <div class="lf-campo"><label for="fCategoria">Categoría</label><select id="fCategoria"></select></div>
                <div class="lf-campo"><label for="fLugar">Lugar</label><select id="fLugar"></select></div>
                <div class="lf-campo lf-ancho"><label for="fAccion">Acción realizada</label><input id="fAccion" maxlength="160" placeholder="Ej. Limpieza de filtro de la bomba 2"></div>
                <div class="lf-campo lf-ancho"><label for="fDetalle">Detalle (opcional)</label><textarea id="fDetalle" rows="3" maxlength="1500" placeholder="Observaciones, hallazgos, material usado..."></textarea></div>
                <div class="lf-campo"><label for="fResponsable">Responsable</label><select id="fResponsable"></select></div>
                <div class="lf-campo lf-ancho">
                    <label>Fotos (opcional, hasta 3; foto o PDF de máximo 10 MB)</label>
                    <div class="fotos-ops">
                        <button type="button" class="lf-btn" id="bCamara">Tomar foto</button>
                        <button type="button" class="lf-btn" id="bArchivo">Elegir archivo</button>
                    </div>
                    <input type="file" id="iCamara" accept="image/*" capture="environment" class="oculto">
                    <input type="file" id="iArchivo" accept="image/*,application/pdf" multiple class="oculto">
                    <div class="fotos" id="fotos"></div>
                    <div class="progreso"><span id="progreso"></span></div>
                </div>
            </div>
            <p class="nota" id="mNota"></p>
            <div class="lf-modal-pie">
                <span class="msg" id="mMsg"></span>
                <button class="lf-btn" data-cerrar>Cancelar</button>
                <button class="lf-btn lf-btn-primario" id="bGuardar">Registrar</button>
            </div>
        </div>
    </div>

    <div class="lf-modal-fondo" id="modalHist">
        <div class="lf-modal">
            <h3>Historial de cambios</h3>
            <p class="lf-subtitulo-pag" id="hSub"></p>
            <div class="hist" id="hLista"></div>
            <div class="lf-modal-pie"><button class="lf-btn" data-cerrar>Cerrar</button></div>
        </div>
    </div>

    <div class="lf-modal-fondo" id="modalEliminar">
        <div class="lf-modal">
            <h3>Eliminar registro</h3>
            <p class="lf-subtitulo-pag" id="eSub"></p>
            <p style="margin:0">Se borran el registro, sus fotos y su historial de correcciones. Queda una copia en la bitácora de eliminados (sin fotos). No se puede deshacer.</p>
            <div class="lf-modal-pie">
                <span class="msg" id="eMsg"></span>
                <button class="lf-btn" data-cerrar>Cancelar</button>
                <button class="lf-btn lf-btn-peligro" id="bEliminar">Eliminar</button>
            </div>
        </div>
    </div>

    <div class="lf-modal-fondo" id="modalFoto">
        <div class="lf-modal visor">
            <h3 id="vTitulo">Foto</h3>
            <div id="vContenido"></div>
            <div class="lf-modal-pie">
                <a class="lf-btn" id="vDescargar" style="text-decoration:none">Descargar</a>
                <button class="lf-btn" data-cerrar>Cerrar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261005-1';
        import { auth, db, isAuthenticated, esAdmin, esOperario, getCurrentUser } from '../../../js/auth.js?v=20261005-1';
        import { getApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { collection, doc, getDocs, setDoc, writeBatch, deleteDoc, query, orderBy, limit, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { getStorage, ref, uploadBytesResumable, getBlob, deleteObject } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js';

        // Listas fijas (las mismas que valida firestore.rules)
        const CATEGORIAS = ['Limpieza', 'Mantenimiento', 'Mantenimiento preventivo', 'Bombas y cisterna', 'Agua', 'Electricidad', 'Seguridad', 'Basura y recolección', 'Jardinería', 'Proveedor o servicio externo', 'Atención a locatario', 'Otro'];
        const LUGARES = [...Array.from({ length: 22 }, (_, i) => `Local ${i + 1}`), 'Oficinas', 'Áreas comunes', 'Baños', 'Estacionamiento', 'Azotea', 'Cuarto de bombas', 'Cisterna', 'Fachada', 'Otro'];
        const RESPONSABLES = ['Claudio Del Angel', 'Victor Navarro', 'Admin LAFABDECHOC'];
        // Registros guardados antes del 04/10/2026 traen la grafía anterior «Victor Navaro»
        const normResp = r => r === 'Victor Navaro' ? 'Victor Navarro' : r;
        const MAX_FOTOS = 3, MAX_BYTES = 10 * 1024 * 1024;
        const TIPOS = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif', 'application/pdf'];
        const HORAS_EDICION = 24; // el operario corrige sus registros hasta 24 h después de capturarlos

        const app = document.getElementById('app');
        const user = getCurrentUser();
        const admin = esAdmin(), operario = esOperario();
        const storage = getStorage(getApp());
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fechaCorta = f => { if (!f) return '-'; const [y, m, d] = f.split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };
        const ahora = () => { const d = new Date(); const l = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString(); return { fecha: l.slice(0, 10), hora: l.slice(11, 16) }; };

        let registros = [], editando = null, fotosNuevas = [], fotosActuales = [];

        if (!isAuthenticated() || !(admin || operario)) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            iniciar();
        }

        function iniciar() {
            const opciones = (id, lista) => { document.getElementById(id).innerHTML = lista.map(v => `<option>${esc(v)}</option>`).join(''); };
            opciones('fCategoria', CATEGORIAS);
            opciones('fLugar', LUGARES);
            document.getElementById('fResponsable').innerHTML = '<option value="">Selecciona</option>' + RESPONSABLES.map(v => `<option>${esc(v)}</option>`).join('');
            document.getElementById('bCamara').addEventListener('click', () => document.getElementById('iCamara').click());
            document.getElementById('bArchivo').addEventListener('click', () => document.getElementById('iArchivo').click());
            document.getElementById('iCamara').addEventListener('change', agregarArchivos);
            document.getElementById('iArchivo').addEventListener('change', agregarArchivos);
            document.getElementById('bGuardar').addEventListener('click', guardar);
            document.getElementById('bEliminar').addEventListener('click', eliminar);
            document.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => cerrar(b.closest('.lf-modal-fondo').id)));
            document.querySelectorAll('.lf-modal-fondo').forEach(m => m.addEventListener('click', e => { if (e.target === m) cerrar(m.id); }));
            document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.lf-modal-fondo.abierto').forEach(m => cerrar(m.id)); });
            cargar();
        }

        async function cargar(aviso = '') {
            try {
                const s = await getDocs(query(collection(db, 'bitacora'), orderBy('fecha', 'desc'), limit(1500)));
                registros = s.docs.map(d => { const x = { id: d.id, ...d.data() }; x.responsable = normResp(x.responsable); x.registradoPorNombre = normResp(x.registradoPorNombre); return x; })
                    .sort((a, b) => (b.fecha + (b.hora || '')).localeCompare(a.fecha + (a.hora || '')));
                vista(aviso);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<h1 class="lf-titulo">Bitácora</h1><p class="lf-aviso lf-aviso-error">No se pudo cargar la bitácora (${esc(err.code || err.message)}). Si es un error de permisos, falta publicar las reglas de Firestore.</p>`;
            }
        }

        function vista(aviso) {
            const hoy = ahora().fecha, mes = hoy.slice(0, 7);
            const delMes = registros.filter(r => r.fecha?.startsWith(mes));
            const deHoy = registros.filter(r => r.fecha === hoy);
            const topCat = Object.entries(delMes.reduce((a, r) => (a[r.categoria] = (a[r.categoria] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1])[0];
            const misMes = delMes.filter(r => r.creadoPor === auth.currentUser?.uid).length;
            app.innerHTML = `
                <div class="cabeza">
                    <div><h1 class="lf-titulo">Bitácora</h1><p class="lf-subtitulo-pag">Registro de acciones realizadas en la plaza: qué se hizo, dónde, cuándo y quién.</p></div>
                    <button class="lf-btn lf-btn-primario" id="bNuevo">Registrar acción</button>
                </div>
                ${aviso ? `<p class="lf-aviso lf-aviso-ok" style="margin:0">${aviso}</p>` : ''}
                <div class="lf-cifras">
                    <div class="lf-cifra"><div class="lf-etiqueta">Hoy</div><div class="lf-valor">${deHoy.length}</div><div class="lf-detalle">acciones registradas</div></div>
                    <div class="lf-cifra"><div class="lf-etiqueta">Este mes</div><div class="lf-valor">${delMes.length}</div><div class="lf-detalle">${misMes} capturadas por ti</div></div>
                    <div class="lf-cifra"><div class="lf-etiqueta">Categoría más frecuente</div><div class="lf-valor texto">${topCat ? esc(topCat[0]) : '-'}</div><div class="lf-detalle">${topCat ? `${topCat[1]} este mes` : 'Sin registros este mes'}</div></div>
                    <div class="lf-cifra"><div class="lf-etiqueta">Total</div><div class="lf-valor">${registros.length}</div><div class="lf-detalle">en la bitácora</div></div>
                </div>
                <div class="tabla-pie">
                <div class="filtros">
                    <div class="lf-campo"><label for="flMes">Mes</label><input type="month" id="flMes" value="${mes}"></div>
                    <div class="lf-campo"><label for="flCategoria">Categoría</label><select id="flCategoria"><option value="">Todas</option>${CATEGORIAS.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
                    <div class="lf-campo"><label for="flLugar">Lugar</label><select id="flLugar"><option value="">Todos</option>${LUGARES.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
                    <div class="lf-campo"><label for="flResponsable">Responsable</label><select id="flResponsable"><option value="">Todos</option>${RESPONSABLES.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
                    <div class="lf-campo buscar"><label for="flBuscar">Buscar</label><input type="search" id="flBuscar" placeholder="En acción o detalle"></div>
                </div>
                <div class="tabla-wrap lf-tabla-wrap">
                    <table class="lf-tabla tabla-movil">
                        <thead><tr><th>Fecha</th><th>Categoría</th><th>Lugar</th><th>Acción</th><th>Responsable</th><th>Fotos</th><th></th></tr></thead>
                        <tbody id="filas"></tbody>
                    </table>
                    <div class="vacio oculto" id="sinFilas">No hay registros con esos filtros.</div>
                </div>
                <p class="nota">${admin ? 'Como administrador puedes corregir o eliminar cualquier registro. Cada corrección queda en el historial y cada registro eliminado queda copiado en la bitácora de eliminados.' : `Puedes corregir tus registros hasta ${HORAS_EDICION} horas después de capturarlos. No se pueden borrar; cada corrección queda en el historial.`}</p>
                </div>`;
            document.getElementById('bNuevo').addEventListener('click', () => abrir());
            ['flMes', 'flCategoria', 'flLugar', 'flResponsable'].forEach(id => document.getElementById(id).addEventListener('change', filas));
            document.getElementById('flBuscar').addEventListener('input', filas);
            filas();
        }

        const puedeEditar = r => admin || (operario && r.creadoPor === auth.currentUser?.uid && r.creadoEn?.toMillis && Date.now() - r.creadoEn.toMillis() < HORAS_EDICION * 3600000);

        function filas() {
            const v = id => document.getElementById(id).value;
            const q = v('flBuscar').trim().toLocaleLowerCase('es-MX');
            const lista = registros.filter(r => (!v('flMes') || r.fecha?.startsWith(v('flMes')))
                && (!v('flCategoria') || r.categoria === v('flCategoria'))
                && (!v('flLugar') || r.lugar === v('flLugar'))
                && (!v('flResponsable') || r.responsable === v('flResponsable'))
                && (!q || `${r.accion} ${r.detalle || ''}`.toLocaleLowerCase('es-MX').includes(q)));
            const tbody = document.getElementById('filas');
            tbody.innerHTML = lista.map(r => `<tr>
                <td class="fecha lf-num"><strong>${fechaCorta(r.fecha)}</strong><small>${esc(r.hora || '')}</small></td>
                <td><span class="lf-estado">${esc(r.categoria)}</span></td>
                <td>${esc(r.lugar)}</td>
                <td><div class="accion">${esc(r.accion)}</div>${r.detalle ? `<div class="detalle">${esc(r.detalle)}</div>` : ''}</td>
                <td>${esc(r.responsable)}<small>Capturó: ${esc(r.registradoPorNombre || '')}</small></td>
                <td>${(r.fotos || []).length ? (r.fotos || []).map((f, i) => `<button class="enlace" data-foto="${esc(r.id)}" data-i="${i}">${f.tipo === 'application/pdf' ? 'PDF' : 'Foto'} ${i + 1}</button>`).join('<br>') : '<span class="lf-vacio">-</span>'}</td>
                <td><div class="lf-acciones">${puedeEditar(r) ? `<button class="lf-btn lf-btn-compacto" data-editar="${esc(r.id)}">Corregir</button>` : ''}${r.ultimaEdicionHistorialId ? `<button class="lf-btn lf-btn-compacto" data-hist="${esc(r.id)}">Historial</button>` : ''}${admin ? `<button class="lf-btn lf-btn-compacto lf-btn-icono lf-btn-peligro" data-eliminar="${esc(r.id)}" aria-label="Eliminar registro" title="Eliminar registro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>` : ''}</div></td>
            </tr>`).join('');
            document.getElementById('sinFilas').classList.toggle('oculto', lista.length > 0);
            tbody.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => abrir(registros.find(r => r.id === b.dataset.editar))));
            tbody.querySelectorAll('[data-foto]').forEach(b => b.addEventListener('click', () => verArchivo(registros.find(r => r.id === b.dataset.foto).fotos[+b.dataset.i])));
            tbody.querySelectorAll('[data-hist]').forEach(b => b.addEventListener('click', () => verHistorial(registros.find(r => r.id === b.dataset.hist))));
            tbody.querySelectorAll('[data-eliminar]').forEach(b => b.addEventListener('click', () => pedirEliminar(registros.find(r => r.id === b.dataset.eliminar))));
        }

        // ---------- Eliminar (solo admin) ----------
        let eliminando = null;
        function pedirEliminar(r) {
            eliminando = r;
            document.getElementById('eSub').textContent = `${fechaCorta(r.fecha)} ${r.hora || ''} · ${r.lugar} · ${r.accion}`;
            document.getElementById('eMsg').textContent = '';
            document.getElementById('modalEliminar').classList.add('abierto');
        }

        async function eliminar() {
            const r = eliminando, btn = document.getElementById('bEliminar'), msg = document.getElementById('eMsg');
            if (!r || !admin) return;
            btn.disabled = true; msg.textContent = '';
            try {
                // Copia en bitacora_eliminados + borrado del registro y su historial en un solo batch
                const hist = await getDocs(collection(db, 'bitacora', r.id, 'historial'));
                const { id, ...datos } = r;
                const b = writeBatch(db);
                b.set(doc(db, 'bitacora_eliminados', id), { ...datos, correcciones: hist.size, eliminadoPor: auth.currentUser.uid, eliminadoPorNombre: user.nombre || user.email, eliminadoEn: serverTimestamp() });
                hist.docs.forEach(h => b.delete(h.ref));
                b.delete(doc(db, 'bitacora', id));
                await b.commit();
                // Fotos: si alguna no se puede borrar, el registro ya no existe y el archivo queda huérfano
                for (const f of r.fotos || []) { try { await deleteObject(ref(storage, f.path)); } catch (err) { console.warn('No se borró', f.path, err); } }
                cerrar('modalEliminar');
                await cargar('Registro eliminado.');
            } catch (err) {
                console.error(err);
                msg.textContent = err.code === 'permission-denied' ? 'Permiso denegado: falta publicar las reglas de Firestore.' : 'No se pudo eliminar. Inténtalo de nuevo.';
            } finally { btn.disabled = false; }
        }

        // ---------- Formulario ----------
        function abrir(r = null) {
            editando = r;
            const a = ahora();
            const set = (id, val) => { document.getElementById(id).value = val; };
            set('fFecha', r?.fecha || a.fecha);
            set('fHora', r?.hora || a.hora);
            set('fCategoria', r?.categoria || CATEGORIAS[0]);
            set('fLugar', r?.lugar || 'Áreas comunes');
            set('fAccion', r?.accion || '');
            set('fDetalle', r?.detalle || '');
            set('fResponsable', r?.responsable || (RESPONSABLES.includes(user.nombre) ? user.nombre : ''));
            fotosNuevas = [];
            fotosActuales = [...(r?.fotos || [])];
            pintarFotos();
            document.getElementById('progreso').style.width = '0%';
            document.getElementById('mMsg').textContent = '';
            document.getElementById('mTitulo').textContent = r ? 'Corregir registro' : 'Registrar acción';
            document.getElementById('bGuardar').textContent = r ? 'Guardar corrección' : 'Registrar';
            document.getElementById('mNota').textContent = r ? 'La corrección queda en el historial del registro.' : (admin ? 'Solo el administrador puede eliminar registros.' : 'Los registros no se pueden borrar.');
            document.getElementById('modal').classList.add('abierto');
        }

        function cerrar(id) {
            document.getElementById(id).classList.remove('abierto');
            if (id === 'modal') { fotosNuevas.forEach(f => f.url && URL.revokeObjectURL(f.url)); fotosNuevas = []; }
            if (id === 'modalFoto') {
                const m = document.getElementById('modalFoto');
                document.getElementById('vContenido').innerHTML = '';
                if (m.dataset.url) { URL.revokeObjectURL(m.dataset.url); delete m.dataset.url; }
            }
        }

        // Reduce fotos grandes (lado mayor 1920 px, JPEG) para que suban rápido desde el celular
        async function reducir(file) {
            if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type) || file.size < 1.5 * 1024 * 1024) return file;
            try {
                const img = await createImageBitmap(file);
                const k = Math.min(1, 1920 / Math.max(img.width, img.height));
                const c = document.createElement('canvas');
                c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
                c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82));
                return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
            } catch { return file; }
        }

        async function agregarArchivos(e) {
            const lista = [...(e.target.files || [])];
            e.target.value = '';
            const msg = document.getElementById('mMsg');
            msg.textContent = '';
            for (const f of lista) {
                if (fotosActuales.length + fotosNuevas.length >= MAX_FOTOS) { msg.textContent = `Máximo ${MAX_FOTOS} fotos por registro.`; break; }
                if (!TIPOS.includes(f.type)) { msg.textContent = 'Solo fotos (JPG, PNG, WEBP, HEIC) o PDF.'; continue; }
                const r = await reducir(f);
                if (r.size > MAX_BYTES) { msg.textContent = 'Un archivo pasa de 10 MB.'; continue; }
                fotosNuevas.push({ file: r, url: r.type.startsWith('image/') && !r.type.includes('hei') ? URL.createObjectURL(r) : '' });
            }
            pintarFotos();
        }

        function pintarFotos() {
            const cont = document.getElementById('fotos');
            cont.innerHTML = fotosActuales.map((f, i) => `<div class="foto" title="${esc(f.nombre)}">${esc(f.tipo === 'application/pdf' ? 'PDF' : 'Foto guardada')}<button data-quitar-act="${i}" title="Quitar">×</button></div>`).join('')
                + fotosNuevas.map((f, i) => `<div class="foto" title="${esc(f.file.name)}">${f.url ? `<img src="${f.url}" alt="">` : esc(f.file.type === 'application/pdf' ? 'PDF' : f.file.name)}<button data-quitar-new="${i}" title="Quitar">×</button></div>`).join('');
            cont.querySelectorAll('[data-quitar-act]').forEach(b => b.addEventListener('click', () => { fotosActuales.splice(+b.dataset.quitarAct, 1); pintarFotos(); }));
            cont.querySelectorAll('[data-quitar-new]').forEach(b => b.addEventListener('click', () => { const [f] = fotosNuevas.splice(+b.dataset.quitarNew, 1); if (f.url) URL.revokeObjectURL(f.url); pintarFotos(); }));
            const lleno = fotosActuales.length + fotosNuevas.length >= MAX_FOTOS;
            document.getElementById('bCamara').disabled = lleno;
            document.getElementById('bArchivo').disabled = lleno;
        }

        const nombreSeguro = n => n.normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g, '_').slice(-100) || 'archivo';

        async function subir(registroId, file, i, total) {
            const path = `bitacora/${auth.currentUser.uid}/${registroId}/${Date.now()}_${i}_${nombreSeguro(file.name)}`;
            await new Promise((ok, mal) => {
                const t = uploadBytesResumable(ref(storage, path), file, { contentType: file.type, customMetadata: { uploadedBy: auth.currentUser.uid } });
                t.on('state_changed', s => { document.getElementById('progreso').style.width = `${Math.round(((i + s.bytesTransferred / s.totalBytes) / total) * 100)}%`; }, mal, ok);
            });
            return { path, nombre: file.name, tipo: file.type, bytes: file.size };
        }

        async function guardar() {
            const v = id => document.getElementById(id).value.trim();
            const msg = document.getElementById('mMsg'), btn = document.getElementById('bGuardar');
            const datos = { fecha: v('fFecha'), hora: v('fHora'), categoria: v('fCategoria'), lugar: v('fLugar'), accion: v('fAccion'), detalle: v('fDetalle'), responsable: v('fResponsable') };
            if (!/^\d{4}-\d{2}-\d{2}$/.test(datos.fecha) || !/^\d{2}:\d{2}$/.test(datos.hora)) { msg.textContent = 'Revisa la fecha y la hora.'; return; }
            if (datos.fecha > ahora().fecha) { msg.textContent = 'La fecha no puede ser futura.'; return; }
            if (!datos.accion) { msg.textContent = 'Escribe la acción realizada.'; return; }
            if (!RESPONSABLES.includes(datos.responsable)) { msg.textContent = 'Selecciona el responsable.'; return; }
            if (editando && !puedeEditar(editando)) { msg.textContent = 'Este registro ya no se puede corregir.'; return; }
            btn.disabled = true; msg.textContent = '';
            const refDoc = editando ? doc(db, 'bitacora', editando.id) : doc(collection(db, 'bitacora'));
            const subidas = [];
            try {
                for (let i = 0; i < fotosNuevas.length; i++) subidas.push(await subir(refDoc.id, fotosNuevas[i].file, i, fotosNuevas.length));
                const fotos = [...fotosActuales, ...subidas];
                const nombre = user.nombre || user.email;
                if (editando) {
                    const hist = doc(collection(db, 'bitacora', editando.id, 'historial'));
                    const campos = ['fecha', 'hora', 'categoria', 'lugar', 'accion', 'detalle', 'responsable', 'fotos'];
                    const antes = Object.fromEntries(campos.map(k => [k, editando[k] ?? (k === 'fotos' ? [] : '')]));
                    const b = writeBatch(db);
                    b.update(refDoc, { ...datos, fotos, editadoPor: auth.currentUser.uid, editadoPorNombre: nombre, editadoEn: serverTimestamp(), ultimaEdicionHistorialId: hist.id });
                    b.set(hist, { accion: 'editado', antes, despues: { ...datos, fotos }, registradoPor: auth.currentUser.uid, registradoPorNombre: nombre, registradoEn: serverTimestamp() });
                    await b.commit();
                } else {
                    await setDoc(refDoc, { ...datos, fotos, creadoPor: auth.currentUser.uid, registradoPorNombre: nombre, creadoEn: serverTimestamp() });
                }
                cerrar('modal');
                await cargar(editando ? 'Corrección guardada; quedó en el historial.' : 'Acción registrada.');
            } catch (err) {
                console.error(err);
                for (const s of subidas) { try { await deleteObject(ref(storage, s.path)); } catch { /* el archivo se queda sin registro */ } }
                msg.textContent = err.code === 'permission-denied' || err.code === 'storage/unauthorized'
                    ? 'Permiso denegado: falta publicar las reglas de Firestore o Storage, o el registro ya no se puede corregir.'
                    : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.';
            } finally { btn.disabled = false; }
        }

        async function verArchivo(f) {
            if (!f?.path) return;
            try {
                // getBlob no trae el tipo del archivo: sin él el navegador muestra la foto como texto
                const datos = await getBlob(ref(storage, f.path), MAX_BYTES);
                const blob = new Blob([datos], { type: f.tipo || datos.type || 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const visor = document.getElementById('vContenido');
                visor.innerHTML = blob.type === 'application/pdf'
                    ? `<iframe src="${url}" title="PDF"></iframe>`
                    : blob.type.includes('hei')
                        ? `<p class="nota">Este formato (HEIC) no se puede mostrar en el navegador. Usa "Descargar".</p>`
                        : `<img src="${url}" alt="">`;
                const bajar = document.getElementById('vDescargar');
                bajar.href = url;
                bajar.download = f.nombre || 'foto';
                document.getElementById('vTitulo').textContent = f.nombre || 'Foto';
                document.getElementById('modalFoto').dataset.url = url;
                document.getElementById('modalFoto').classList.add('abierto');
            } catch (err) {
                console.error(err);
                alert('No se pudo abrir el archivo. Revisa las reglas de Storage.');
            }
        }

        async function verHistorial(r) {
            document.getElementById('hSub').textContent = `${fechaCorta(r.fecha)} ${r.hora || ''} · ${r.accion}`;
            const lista = document.getElementById('hLista');
            lista.innerHTML = '<div class="nota">Cargando...</div>';
            document.getElementById('modalHist').classList.add('abierto');
            try {
                const s = await getDocs(query(collection(db, 'bitacora', r.id, 'historial'), orderBy('registradoEn', 'desc')));
                const etq = { fecha: 'Fecha', hora: 'Hora', categoria: 'Categoría', lugar: 'Lugar', accion: 'Acción', detalle: 'Detalle', responsable: 'Responsable', fotos: 'Fotos' };
                lista.innerHTML = s.docs.map(d => {
                    const h = d.data();
                    const cambios = Object.keys(etq).filter(k => JSON.stringify(h.antes?.[k] ?? '') !== JSON.stringify(h.despues?.[k] ?? ''))
                        .map(k => k === 'fotos' ? `Fotos: ${(h.antes?.fotos || []).length} → ${(h.despues?.fotos || []).length}` : `${etq[k]}: «${esc(h.antes?.[k] || '')}» → «${esc(h.despues?.[k] || '')}»`);
                    const cuando = h.registradoEn?.toDate ? h.registradoEn.toDate().toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }) : '';
                    return `<div><strong>${esc(h.registradoPorNombre || '')}</strong> <span class="nota">${esc(cuando)}</span><br>${cambios.join('<br>') || '<span class="nota">Sin cambios visibles</span>'}</div>`;
                }).join('') || '<div class="nota">Sin cambios.</div>';
            } catch (err) {
                lista.innerHTML = `<div class="nota">No se pudo cargar el historial (${esc(err.code || err.message)}).</div>`;
            }
        }
    </script>
