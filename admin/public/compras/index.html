<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Compras - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261015-5">
    <style>
        /* Solo lo propio de Compras; lo demás viene de panel.css (sistema «Panel LFdC») */
        body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--font-sans); font-size: 14px; line-height: 20px; }
        .main { max-width: 1400px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0; }
        .cabeza { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
        .acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 6px; border: none; background: var(--accion); color: var(--on-accion); cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--borde-control); background: var(--fondo); color: var(--tinta); cursor: pointer; }
        .btn-sec:hover { background: var(--fondo-hundido); }
        .btn-mini { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--borde-control); background: var(--fondo); color: var(--accion); cursor: pointer; }
        .msg { font-size: 13px; } .ok { color: var(--exito); } .err { color: var(--peligro); }
        .prov { border: 1px solid var(--linea); border-radius: 10px; margin-bottom: 22px; overflow: hidden; }
        .prov-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); }
        .prov-cab h2 { margin: 0; font-size: 16px; }
        .prov-cab .det { color: var(--tinta-suave); font-size: 12px; margin-top: 2px; }
        .tabla-wrap { overflow-x: auto; }
        .datos-prov { padding: 6px 18px 0; border-bottom: 1px solid var(--linea); }
        .datos-prov[hidden] { display: none; }
        .prov-cab h2 { display: flex; align-items: center; gap: 8px; }
        button.flecha { width: 28px; height: 28px; border: none; background: none; border-radius: 6px; cursor: pointer; color: var(--accion); padding: 0; display: inline-flex; align-items: center; justify-content: center; }
        button.flecha:hover { background: var(--accion-suave); }
        button.flecha svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
        button.flecha[aria-expanded="true"] svg { transform: rotate(180deg); }
        .ficha-prov { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 22px; padding: 4px 0 14px; }
        .ficha-prov .k { font-size: 11px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; }
        .ficha-prov .v { font-size: 13px; overflow-wrap: anywhere; }
        .ficha-prov .ancho { grid-column: 1 / -1; }
        table.cat { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
        table.cat.fijo { min-width: 1240px; table-layout: fixed; }
        table.cat.fijo th, table.cat.fijo td { padding-left: 12px; padding-right: 12px; }
        table.cat.fijo th.num, table.cat.fijo td.num { text-align: right; }
        table.cat.fijo td.centro, table.cat.fijo th.centro { text-align: center; }
        table.cat tfoot td.num { font-family: var(--font-sans); }
        table.cat.fijo th, table.cat.fijo td { overflow-wrap: anywhere; }
        table.cat th { text-align: left; font-size: 11px; font-weight: 600; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; padding: 9px 10px; border-bottom: 1px solid var(--linea); white-space: nowrap; }
        table.cat td { padding: 7px 10px; border-bottom: 1px solid var(--fondo-hundido); vertical-align: middle; }
        table.cat .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-family: var(--font-mono); }
        table.cat th.num { font-family: var(--font-sans); }
        table.cat button.nombre { font: inherit; font-weight: 600; border: none; background: none; padding: 0; cursor: pointer; color: var(--tinta); text-align: left; }
        table.cat button.nombre:hover { color: var(--accion); text-decoration: underline; }
        table.cat input.cant { width: 84px; box-sizing: border-box; font: inherit; font-family: var(--font-mono); text-align: right; padding: 5px 7px; border: 1px solid var(--borde-control); border-radius: 6px; background: var(--fondo); color: var(--tinta); }
        .btn-lapiz { width: 22px; height: 22px; padding: 0; margin-right: 4px; border: none; background: none; color: var(--accion); cursor: pointer; vertical-align: -5px; border-radius: 4px; }
        .btn-lapiz:hover { background: var(--accion-suave); }
        .btn-lapiz svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        th.ord { cursor: pointer; user-select: none; }
        th.ord:hover { color: var(--tinta); }
        th.ord.act { color: var(--accion); }
        th.ord .flecha { font-size: 9px; margin-left: 5px; opacity: .35; letter-spacing: -1px; }
        th.ord.act .flecha { opacity: 1; }
        table.cat input.precio { width: 100px; box-sizing: border-box; font: inherit; font-family: var(--font-mono); text-align: right; padding: 5px 7px; border: 1px solid var(--accion); border-radius: 6px; background: var(--accion-suave); color: var(--tinta); }
        table.cat input.precio.cambio { border-color: var(--atencion); background: var(--atencion-suave); }
        table.cat input.cant.con { border-color: var(--accion); background: var(--accion-suave); }
        table.cat tfoot td { border-bottom: none; padding: 4px 10px; font-weight: 600; }
        .gris { color: var(--tinta-suave); font-size: 12px; }
        .vacio { color: var(--tinta-suave); text-align: center; padding: 26px 16px; }
        .ordenes h2 { font-size: 16px; margin: 30px 0 10px; }
        .btn-basura { width: 28px; height: 28px; padding: 0; border: 1px solid var(--borde-control); border-radius: 6px; background: var(--fondo); color: var(--peligro); cursor: pointer; vertical-align: middle; display: inline-flex; align-items: center; justify-content: center; }
        .btn-basura:hover { background: var(--peligro-suave); border-color: var(--peligro); }
        .btn-basura svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .estado { font: inherit; font-size: 12px; border: 1px solid var(--borde-control); border-radius: 999px; padding: 4px 8px; background: var(--fondo); color: var(--tinta); }
        .l-tabla { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
        .l-tabla th { text-align: left; font-size: 11px; color: var(--tinta-suave); padding: 5px 6px; border-bottom: 1px solid var(--linea); text-transform: uppercase; }
        .l-tabla td { padding: 5px 6px; border-bottom: 1px solid var(--fondo-hundido); }
        .l-tabla .num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }

        /* Celular: las tablas anchas se vuelven tarjetas (clase tabla-movil, estilos en js/navbar.js) */
        @media (max-width: 700px) {
            table.cat, table.cat.fijo { min-width: 0; }
            .prov-cab { padding: 12px 14px; }
            .prov-cab .acciones { width: 100%; }
            .prov-cab .acciones .btn, .prov-cab .acciones .btn-sec { flex: 1 1 auto; }
            .datos-prov { padding: 6px 14px 0; }
            table.cat.fijo td.num input.cant { width: 110px !important; }
        }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="vacio">Cargando...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261015-5';
        import { isAuthenticated, esAdmin, esOperario, getCurrentUser, db } from '../../../js/auth.js?v=20261015-5';
        import { collection, getDocs, doc, addDoc, setDoc, updateDoc, deleteDoc, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { correoValido, normalizarCorreos } from '../../../js/facturacion.js?v=20261013-1';
        import { totalesOrden, conIva, dinero, imprimirOrden, correoOrden, CORREO_REMITENTE } from '../../../js/orden-compra.js?v=20261015-5';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        // Orden de columnas: una elección por proveedor en el catálogo y otra en las órdenes (sin elección = orden original)
        const ordCat = {}, ordOrd = { col: '', dir: 1 };
        const CLAVE_CAT = {
            producto: p => (p.nombre || '').toLowerCase(), marca: p => (p.marca || '').toLowerCase(), clave: p => (p.clave || '').toLowerCase(),
            contenido: p => (p.contenido || '').toLowerCase(), unidad: p => (p.unidad || '').toLowerCase(),
            sin: p => Number(p.precioSinIva) || 0, con: p => (Number(p.precioSinIva) || 0) * 1.16,
            cant: p => Number(cant[p.id]) || 0, importe: p => importeConIva(p, cant[p.id])
        };
        const CLAVE_OC = {
            folio: o => String(o.folio || ''), fecha: o => String(o.fecha || ''), proveedor: o => (o.proveedorNombre || '').toLowerCase(),
            lineas: o => (o.lineas || []).length, total: o => totalesOrden(o.lineas || []).total, estado: o => ESTADOS_OC[o.estado || 'enviada'] || ''
        };
        const ordenarPor = (lista, clave, est) => {
            if (!est || !est.col) return lista;
            const f = clave[est.col];
            return [...lista].sort((a, b) => { const x = f(a), y = f(b); return (typeof x === 'string' ? x.localeCompare(y, 'es', { numeric: true }) : x - y) * est.dir; });
        };
        const flechaOrd = (est, col) => `<span class="flecha">${est && est.col === col ? (est.dir > 0 ? '▲' : '▼') : '▲▼'}</span>`;
        const thCat = (provId, est, col, txt, cls = '', antes = '') => `<th class="ord ${cls} ${est && est.col === col ? 'act' : ''}" data-ocat="${esc(provId)}" data-col="${col}" title="Ordenar por ${txt.toLowerCase()}">${antes}${txt}${flechaOrd(est, col)}</th>`;
        const fechaCorta = f => /^\d{4}-\d{2}-\d{2}$/.test(f || '') ? f.split('-').reverse().join('/') : (f || '');
        const UNIDADES = ['CAJA', 'PAQUETE', 'BULTO', 'BOTELLA', 'LITRO', '5 LITROS', 'GARRAFA', 'PIEZA', 'ROLLO', 'KILO'];
        const ESTADOS_OC = { enviada: 'Enviada', recibida: 'Recibida', cancelada: 'Cancelada' };

        let proveedores = [], productos = [], ordenes = [], cant = {};
        const editandoPrecios = new Set();   // proveedores cuya tabla está en modo «Editar precios»
        // Cantidades del pedido en preparación (por navegador; no se guardan en Firestore hasta generar la orden)
        try { cant = JSON.parse(localStorage.getItem('lfdc_compras_cant') || '{}'); } catch { cant = {}; }
        const guardarCant = () => { try { localStorage.setItem('lfdc_compras_cant', JSON.stringify(cant)); } catch { /* sin almacenamiento no pasa nada */ } };

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin() && !esOperario()) app.innerHTML = '<h1>Acceso restringido</h1>';
            else cargar();
        }

        async function cargar(msg = '') {
            try {
                const [sp, sd, so] = await Promise.all([
                    getDocs(collection(db, 'proveedores')), getDocs(collection(db, 'productos_compra')), getDocs(collection(db, 'ordenes_compra'))
                ]);
                proveedores = sp.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.activo !== false).sort((a, b) => (a.orden ?? 99) - (b.orden ?? 99) || a.nombre.localeCompare(b.nombre, 'es'));
                productos = sd.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p.activo !== false).sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
                ordenes = so.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.folio || '').localeCompare(a.folio || ''));
                render(msg);
            } catch (err) {
                console.error(err);
                app.innerHTML = `<p class="err">No se pudo cargar: ${esc(err.message)}</p>`;
            }
        }

        // Importe de una línea con IVA (cantidad × precio con IVA)
        const importeConIva = (p, q) => Math.round((Number(q) || 0) * (Number(p.precioSinIva) || 0) * 116) / 100;

        const lineasDe = pid => productos.filter(p => p.proveedorId === pid && Number(cant[p.id]) > 0)
            .map(p => ({ productoId: p.id, nombre: p.nombre, marca: p.marca || '', clave: p.clave || '', contenido: p.contenido || '', unidad: p.unidad || '', cantidad: Number(cant[p.id]), precioSinIva: Number(p.precioSinIva) || 0 }));

        // Datos del proveedor «para el record»: fiscales, contacto y condiciones de pago (se despliegan con la flechita del nombre)
        const datosAbiertos = new Set();
        function datosProveedor(v) {
            const dato = (k, val, ancho = false) => val ? `<div class="${ancho ? 'ancho' : ''}"><div class="k">${k}</div><div class="v">${esc(val)}</div></div>` : '';
            return `<div class="datos-prov" data-datos="${esc(v.id)}" ${datosAbiertos.has(v.id) ? '' : 'hidden'}>
                <div class="ficha-prov">
                    ${dato('Giro', v.giro)}${dato('RFC', v.rfc)}${dato('Número de cliente', v.numeroCliente)}
                    ${dato('Domicilio', v.domicilio, true)}${dato('Sitio web', v.web)}${dato('Teléfono', v.telefono)}${dato('Correos', (v.correos || []).join(' · '))}
                    ${dato('Forma de pago', v.formaPago)}${dato('Método de pago', v.metodoPago)}${dato('Uso de CFDI', v.usoCfdi)}
                    ${dato('Entrega habitual', v.entrega)}${dato('Notas de entrega', v.entregaNotas)}${dato('Notas', v.notas, true)}
                </div></div>`;
        }
        const hayDatos = v => !!(v.rfc || v.domicilio || v.giro || v.web || v.numeroCliente || v.formaPago || v.entrega);

        function seccionProveedor(prov, prods) {
            const clavePv = prov?.id || '-';
            const estCat = ordCat[clavePv];
            prods = ordenarPor(prods, CLAVE_CAT, estCat);
            const lineas = prov ? lineasDe(prov.id) : [];
            const t = totalesOrden(lineas);
            return `<section class="prov" data-prov="${esc(prov?.id || '')}">
                <div class="prov-cab">
                    <div><h2>${esc(prov?.nombre || 'Sin proveedor asignado')}${prov && hayDatos(prov) ? `<button type="button" class="flecha" data-flecha="${esc(prov.id)}" aria-expanded="${datosAbiertos.has(prov.id)}" aria-label="Mostrar u ocultar los datos del proveedor" title="Datos del proveedor"><svg viewBox="0 0 24 24"><path d="M5 8l7 8 7-8"/></svg></button>` : ''}</h2>
                        <div class="det">${prov ? [prov.contacto, (prov.correos || []).join(' · '), prov.telefono].filter(Boolean).map(esc).join(' · ') || 'Sin datos de contacto: edita el proveedor para agregar correos' : 'Asigna un proveedor a estos productos para poder pedirlos'}</div></div>
                    <div class="acciones">
                        ${prov && editandoPrecios.has(prov.id) ? `<span class="gris" id="avisoPrecios">Edita los precios sin IVA y guarda.</span>
                        <button class="btn-sec" data-cancelar-precios="${esc(prov.id)}">Cancelar</button>
                        <button class="btn" data-guardar-precios="${esc(prov.id)}">Guardar precios</button>` : prov ? `<button class="btn-sec" data-editar-prov="${esc(prov.id)}">Editar proveedor</button>
                        <button class="btn-sec" data-precios="${esc(prov.id)}" ${prods.length ? '' : 'disabled'}>Editar precios</button>
                        <button class="btn-sec" data-limpiar="${esc(prov.id)}" ${lineas.length ? '' : 'disabled'}>Limpiar cantidades</button>
                        <button class="btn" data-orden="${esc(prov.id)}" ${lineas.length ? '' : 'disabled'}>Generar orden de compra${lineas.length ? ` (${lineas.length} · ${dinero(t.total)})` : ''}</button>` : ''}
                    </div>
                </div>
                ${prov ? datosProveedor(prov) : ''}
                ${prods.length ? `<div class="tabla-wrap"><table class="cat fijo tabla-movil">
                    <colgroup><col style="width:22%"><col style="width:100px"><col style="width:140px"><col style="width:200px"><col style="width:150px"><col style="width:140px"><col style="width:130px"><col style="width:115px"><col style="width:140px"></colgroup>
                    <thead><tr>${thCat(clavePv, estCat, 'producto', 'Producto')}${thCat(clavePv, estCat, 'marca', 'Marca')}${thCat(clavePv, estCat, 'clave', 'Clave')}${thCat(clavePv, estCat, 'contenido', 'Contenido')}${thCat(clavePv, estCat, 'unidad', 'Unidad de compra')}${thCat(clavePv, estCat, 'sin', 'Precio s/IVA', 'num', prov && !editandoPrecios.has(prov.id) ? `<button type="button" class="btn-lapiz" data-precios="${esc(prov.id)}" title="Editar los precios sin IVA" aria-label="Editar los precios sin IVA"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg></button>` : '')}${thCat(clavePv, estCat, 'con', 'Precio c/IVA', 'num')}${thCat(clavePv, estCat, 'cant', 'Cantidad', 'num')}${thCat(clavePv, estCat, 'importe', 'Importe c/IVA', 'num')}</tr></thead>
                    <tbody>${prods.map(p => { const q = Number(cant[p.id]) || 0; return `<tr>
                        <td><button type="button" class="nombre" data-editar-prod="${esc(p.id)}" title="Editar producto">${esc(p.nombre)}</button>${p.notas ? `<div class="gris">${esc(p.notas)}</div>` : ''}</td>
                        <td>${esc(p.marca || '')}</td><td>${esc(p.clave || '')}</td><td>${esc(p.contenido || '')}</td><td>${esc(p.unidad || '')}</td>
                        ${prov && editandoPrecios.has(prov.id)
                            ? `<td class="num"><input type="text" class="precio" inputmode="decimal" data-precio="${esc(p.id)}" value="${Number(p.precioSinIva) || 0}" aria-label="Precio sin IVA de ${esc(p.nombre)}"></td><td class="num" data-precio-iva="${esc(p.id)}">${dinero(conIva(p.precioSinIva))}</td>`
                            : `<td class="num">${dinero(p.precioSinIva)}</td><td class="num">${dinero(conIva(p.precioSinIva))}</td>`}
                        <td class="num"><input type="text" class="cant ${q > 0 ? 'con' : ''}" inputmode="decimal" data-cant="${esc(p.id)}" value="${q > 0 ? q : ''}" placeholder="0" aria-label="Cantidad de ${esc(p.nombre)}"></td>
                        <td class="num" data-importe="${esc(p.id)}">${q > 0 ? dinero(importeConIva(p, q)) : ''}</td></tr>`; }).join('')}</tbody>
                    ${prov ? `<tfoot><tr><td colspan="8" class="num">Total del pedido con IVA</td><td class="num" data-tot="${esc(prov.id)}">${lineas.length ? dinero(t.total) : ''}</td></tr></tfoot>` : ''}
                </table></div>` : '<div class="vacio">Este proveedor todavía no tiene productos. Usa «Agregar producto».</div>'}
            </section>`;
        }

        function render(msg = '') {
            const sinProv = productos.filter(p => !proveedores.some(v => v.id === p.proveedorId));
            app.innerHTML = `
                <div class="cabeza">
                    <div><h1>Compras</h1><p class="sub">Catálogo de productos de mantenimiento por proveedor y órdenes de compra. Los correos salen de ${esc(CORREO_REMITENTE)}.</p></div>
                    <div class="acciones"><span id="msg" class="msg">${msg}</span>
                        <button class="btn-sec" id="nuevoProv">Agregar proveedor</button><button class="btn" id="nuevoProd">Agregar producto</button></div>
                </div>
                ${!proveedores.length && !productos.length ? '<div class="vacio">Todavía no hay proveedores ni productos. Empieza con «Agregar proveedor».</div>' : ''}
                ${proveedores.map(v => seccionProveedor(v, productos.filter(p => p.proveedorId === v.id))).join('')}
                ${sinProv.length ? seccionProveedor(null, sinProv) : ''}
                <div class="ordenes">
                    <h2>Órdenes de compra</h2>
                    ${ordenes.length ? `<div class="tabla-wrap"><table class="cat tabla-movil">
                        <thead><tr>${['folio:Folio', 'fecha:Fecha', 'proveedor:Proveedor', 'lineas:Líneas:num', 'total:Total c/IVA:num', 'estado:Estado'].map(d => { const [c, t, k] = d.split(':'); return `<th class="ord ${k || ''} ${ordOrd.col === c ? 'act' : ''}" data-ooc="${c}" title="Ordenar por ${t.toLowerCase()}">${t}${flechaOrd(ordOrd, c)}</th>`; }).join('')}<th></th></tr></thead>
                        <tbody>${ordenarPor(ordenes, CLAVE_OC, ordOrd).map(o => `<tr>
                            <td><strong>${esc(o.folio)}</strong></td><td>${esc(fechaCorta(o.fecha))}</td><td>${esc(o.proveedorNombre || '')}</td>
                            <td class="num">${(o.lineas || []).length}</td><td class="num">${dinero(totalesOrden(o.lineas || []).total)}</td>
                            <td><select class="estado" data-estado="${esc(o.id)}">${Object.entries(ESTADOS_OC).map(([k, t]) => `<option value="${k}" ${k === (o.estado || 'enviada') ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
                            <td><button class="btn-mini" data-pdf="${esc(o.id)}">PDF</button> <button class="btn-mini" data-correo="${esc(o.id)}">Correo</button>${esAdmin() ? ` <button class="btn-basura" data-borrar="${esc(o.id)}" title="Borrar la orden ${esc(o.folio)}" aria-label="Borrar la orden ${esc(o.folio)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>` : ''}</td></tr>`).join('')}</tbody>
                    </table></div>` : '<div class="vacio">Todavía no hay órdenes. Captura cantidades en un proveedor y usa «Generar orden de compra».</div>'}
                </div>`;
            enlazar();
        }

        function enlazar() {
            app.querySelectorAll('th[data-ocat]').forEach(t => t.addEventListener('click', e => {
                if (e.target.closest('button')) return;
                const k = t.dataset.ocat, col = t.dataset.col, e0 = ordCat[k];
                ordCat[k] = e0 && e0.col === col ? { col, dir: -e0.dir } : { col, dir: 1 };
                render();
            }));
            app.querySelectorAll('th[data-ooc]').forEach(t => t.addEventListener('click', () => {
                const col = t.dataset.ooc;
                if (ordOrd.col === col) ordOrd.dir = -ordOrd.dir; else { ordOrd.col = col; ordOrd.dir = 1; }
                render();
            }));
            document.getElementById('nuevoProv').addEventListener('click', () => editarProveedor(null));
            document.getElementById('nuevoProd').addEventListener('click', () => editarProducto(null));
            app.querySelectorAll('[data-editar-prov]').forEach(b => b.addEventListener('click', () => editarProveedor(proveedores.find(v => v.id === b.dataset.editarProv))));
            app.querySelectorAll('[data-editar-prod]').forEach(b => b.addEventListener('click', () => editarProducto(productos.find(p => p.id === b.dataset.editarProd))));
            app.querySelectorAll('[data-flecha]').forEach(b => b.addEventListener('click', () => {
                const id = b.dataset.flecha, panel = app.querySelector(`[data-datos="${CSS.escape(id)}"]`);
                const abrir = panel.hidden;
                panel.hidden = !abrir; b.setAttribute('aria-expanded', String(abrir));
                if (abrir) datosAbiertos.add(id); else datosAbiertos.delete(id);
            }));
            app.querySelectorAll('[data-precios]').forEach(b => b.addEventListener('click', () => { editandoPrecios.add(b.dataset.precios); render(); }));
            app.querySelectorAll('[data-cancelar-precios]').forEach(b => b.addEventListener('click', () => { editandoPrecios.delete(b.dataset.cancelarPrecios); render(); }));
            // Al escribir un precio se actualiza su precio con IVA y se resalta si cambió
            app.querySelectorAll('input.precio').forEach(i => i.addEventListener('input', () => {
                const p = productos.find(x => x.id === i.dataset.precio), n = Number(String(i.value).replace(/[$,\s]/g, ''));
                const celda = app.querySelector(`[data-precio-iva="${CSS.escape(p.id)}"]`);
                if (celda) celda.textContent = i.value.trim() !== '' && Number.isFinite(n) ? dinero(conIva(n)) : '-';
                i.classList.toggle('cambio', Number.isFinite(n) && n !== p.precioSinIva);
            }));
            app.querySelectorAll('[data-guardar-precios]').forEach(b => b.addEventListener('click', async () => {
                const pid = b.dataset.guardarPrecios, sec = b.closest('section.prov'), aviso = sec.querySelector('#avisoPrecios');
                const cambios = [];
                for (const i of sec.querySelectorAll('input.precio')) {
                    const p = productos.find(x => x.id === i.dataset.precio), n = Number(String(i.value).replace(/[$,\s]/g, ''));
                    if (i.value.trim() === '' || !Number.isFinite(n) || n < 0) { aviso.className = 'err'; aviso.textContent = `Revisa el precio de «${p.nombre}».`; i.focus(); return; }
                    if (n !== p.precioSinIva) cambios.push({ p, n });
                }
                if (!cambios.length) { editandoPrecios.delete(pid); render('<span class="ok">No había cambios de precio.</span>'); return; }
                b.disabled = true;
                try {
                    const user = getCurrentUser().email, lote = writeBatch(db);
                    cambios.forEach(({ p, n }) => lote.update(doc(db, 'productos_compra', p.id), {
                        precioSinIva: n,
                        historialPrecios: [...(p.historialPrecios || []), { fecha: hoyISO(), precioSinIva: n, por: user, nota: 'Edición de precios' }],
                        actualizadoPor: user, actualizadoEn: serverTimestamp()
                    }));
                    await lote.commit();
                    editandoPrecios.delete(pid);
                    await cargar(`<span class="ok">${cambios.length} precio${cambios.length === 1 ? '' : 's'} actualizado${cambios.length === 1 ? '' : 's'}.</span>`);
                } catch (err) { console.error(err); aviso.className = 'err'; aviso.textContent = 'No se pudo guardar: ' + err.message; b.disabled = false; }
            }));
            app.querySelectorAll('[data-limpiar]').forEach(b => b.addEventListener('click', () => {
                productos.filter(p => p.proveedorId === b.dataset.limpiar).forEach(p => delete cant[p.id]); guardarCant(); render();
            }));
            app.querySelectorAll('[data-orden]').forEach(b => b.addEventListener('click', () => ordenDeCompra(proveedores.find(v => v.id === b.dataset.orden))));
            // Cantidades: actualizar importes y totales sin redibujar (se conserva el foco)
            app.querySelectorAll('input.cant').forEach(i => i.addEventListener('input', () => {
                const p = productos.find(x => x.id === i.dataset.cant), v = Number(String(i.value).replace(',', '.'));
                if (Number.isFinite(v) && v > 0) cant[p.id] = v; else delete cant[p.id];
                guardarCant();
                i.classList.toggle('con', !!cant[p.id]);
                const imp = app.querySelector(`[data-importe="${CSS.escape(p.id)}"]`); if (imp) imp.textContent = cant[p.id] ? dinero(importeConIva(p, cant[p.id])) : '';
                const sec = i.closest('section.prov'), pid = sec.dataset.prov, lineas = lineasDe(pid), t = totalesOrden(lineas);
                const tot = sec.querySelector('[data-tot]'); if (tot) tot.textContent = lineas.length ? dinero(t.total) : '';
                const bo = sec.querySelector('[data-orden]'); if (bo) { bo.disabled = !lineas.length; bo.textContent = `Generar orden de compra${lineas.length ? ` (${lineas.length} · ${dinero(t.total)})` : ''}`; }
                const bl = sec.querySelector('[data-limpiar]'); if (bl) bl.disabled = !lineas.length;
            }));
            app.querySelectorAll('[data-estado]').forEach(s => s.addEventListener('change', async () => {
                s.disabled = true;
                try { await updateDoc(doc(db, 'ordenes_compra', s.dataset.estado), { estado: s.value, actualizadoPor: getCurrentUser().email, actualizadoEn: serverTimestamp() }); ordenes.find(o => o.id === s.dataset.estado).estado = s.value; }
                catch (err) { console.error(err); alert('No se pudo cambiar el estado: ' + err.message); render(); }
                finally { s.disabled = false; }
            }));
            // Borrar una orden (solo admin): antes se guarda una copia en ordenes_compra_eliminadas
            app.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', async () => {
                const o = ordenes.find(x => x.id === b.dataset.borrar);
                if (!o || !confirm(`¿Borrar la orden ${o.folio} de ${o.proveedorNombre || 'el proveedor'} por ${dinero(totalesOrden(o.lineas || []).total)}?

No se puede deshacer (queda una copia guardada).`)) return;
                b.disabled = true;
                try {
                    const { id, ...datos } = o;
                    await setDoc(doc(db, 'ordenes_compra_eliminadas', id), { ...datos, eliminadoPor: getCurrentUser().email, eliminadoEn: serverTimestamp() });
                    await deleteDoc(doc(db, 'ordenes_compra', id));
                    await cargar(`<span class="ok">Orden ${esc(o.folio)} borrada.</span>`);
                } catch (err) { console.error(err); alert('No se pudo borrar la orden: ' + err.message); b.disabled = false; }
            }));
            app.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => { const o = ordenes.find(x => x.id === b.dataset.pdf); imprimirOrden(o, proveedores.find(v => v.id === o.proveedorId) || { nombre: o.proveedorNombre, correos: o.proveedorCorreos || [] }); }));
            app.querySelectorAll('[data-correo]').forEach(b => b.addEventListener('click', () => { const o = ordenes.find(x => x.id === b.dataset.correo); correoOrden(o, proveedores.find(v => v.id === o.proveedorId) || { nombre: o.proveedorNombre, correos: o.proveedorCorreos || [] }); }));
        }

        // ---------- ventanas ----------
        function ventana(html, ancho = 560) {
            const fondo = document.createElement('div');
            fondo.className = 'lf-modal-fondo';
            fondo.innerHTML = `<div class="lf-modal" role="dialog" style="max-width:${ancho}px">${html}</div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
            return { fondo, cerrar, $: id => fondo.querySelector('#' + id) };
        }

        function editarProveedor(v) {

                    <div class="lf-campo"><label for="pv_fp">Forma de pago</label><input id="pv_fp" value="${esc(v?.formaPago || '')}"></div>

            const guardar = async extra => {

                if (!extra) {
                    if (!nombre) { msg.textContent = 'Escribe el nombre de la empresa.'; return; }

                }
                const datos = extra || { nombre, contacto: w.$('pv_contacto').value.trim(), telefono: w.$('pv_tel').value.trim(), correos: normalizarCorreos(renglones).filter(x => x.toLowerCase() !== 'facturas@fabrica.la'), rfc: w.$('pv_rfc').value.trim().toUpperCase(), numeroCliente: w.$('pv_cliente').value.trim(), giro: w.$('pv_giro').value.trim(), domicilio: w.$('pv_dom').value.trim(), web: w.$('pv_web').value.trim(), usoCfdi: w.$('pv_uso').value.trim(), formaPago: w.$('pv_fp').value.trim(), metodoPago: w.$('pv_mp').value.trim(), entrega: w.$('pv_entrega').value.trim(), entregaNotas: w.$('pv_entnotas').value.trim(), notas: w.$('pv_notas').value.trim(), activo: true, ...(v ? {} : { orden: proveedores.length + 1 }) };
                try {

        function editarProducto(p) {
            if (!proveedores.length) { alert('Primero agrega un proveedor.'); return; }
            const w = ventana(`<h3>${p ? 'Editar producto' : 'Agregar producto'}</h3>
                <div class="lf-form">
                    <div class="lf-campo lf-ancho"><label for="pd_nombre">Producto</label><input id="pd_nombre" value="${esc(p?.nombre || '')}"></div>
                    <div class="lf-campo"><label for="pd_prov">Proveedor</label><select id="pd_prov">${proveedores.map(v => `<option value="${esc(v.id)}" ${v.id === (p?.proveedorId || '') ? 'selected' : ''}>${esc(v.nombre)}</option>`).join('')}</select></div>

                    <div class="lf-campo lf-ancho"><label for="pd_desc">Descripción como la factura el proveedor</label><input id="pd_desc" value="${esc(p?.descripcionFactura || '')}"></div>

                    <div class="lf-campo"><label for="pd_satu">Clave de unidad SAT</label><input id="pd_satu" value="${esc(p?.claveUnidadSat || '')}"></div>
                    <div class="lf-campo lf-ancho"><label for="pd_notas">Notas</label><input id="pd_notas" value="${esc(p?.notas || '')}"></div>
                </div>

                    ${p ? '<button class="lf-btn" id="pd_archivar" title="Deja de mostrarse; queda guardado">Archivar</button>' : ''}
                    <button class="lf-btn" data-cerrar>Cancelar</button><button class="lf-btn lf-btn-primario" id="pd_guardar">Guardar</button></div>`, 620);
            const precio = () => { const n = Number(String(w.$('pd_precio').value).replace(/[$,\s]/g, '')); return w.$('pd_precio').value.trim() === '' || !Number.isFinite(n) ? null : n; };
            const act = () => { const n = precio(); w.$('pd_precioIva').value = n === null ? '' : conIva(n).toFixed(2); };
            w.$('pd_precio').addEventListener('input', act); act();
            const guardar = async extra => {

        // Folio: OC-AAAAMM-NNN (año y mes pegados). El consecutivo sigue por año: las órdenes viejas OC-AAAA-NNN también cuentan
        function siguienteFolio() {
            const hoy = new Date(), anio = hoy.getFullYear(), mes = String(hoy.getMonth() + 1).padStart(2, '0');
            const mayor = Math.max(0, ...ordenes.map(o => { const m = /^OC-(\d{4})(?:\d{2})?-(\d+)$/.exec(o.folio || ''); return m && +m[1] === anio ? +m[2] : 0; }));
            return `OC-${anio}${mes}-${String(mayor + 1).padStart(3, '0')}`;
        }

        function ordenDeCompra(prov) {
            const lineas = lineasDe(prov.id);
            if (!lineas.length) return;
            const t = totalesOrden(lineas);
            const ultimaEntrega = prov.entrega || ordenes.find(o => o.entrega)?.entrega || '';
            const w = ventana(`<h3>Orden de compra · ${esc(prov.nombre)}</h3>
                <table class="l-tabla"><thead><tr><th>Producto</th><th>Unidad</th><th class="num">Cant.</th><th class="num">Precio s/IVA</th><th class="num">Importe</th></tr></thead><tbody>
                    ${lineas.map(l => `<tr><td>${esc(l.nombre)}</td><td>${esc(l.unidad)}</td><td class="num">${esc(String(l.cantidad))}</td><td class="num">${dinero(l.precioSinIva)}</td><td class="num">${dinero(l.cantidad * l.precioSinIva)}</td></tr>`).join('')}
                    <tr><td colspan="4" class="num"><strong>Subtotal</strong></td><td class="num">${dinero(t.subtotal)}</td></tr>
                    <tr><td colspan="4" class="num"><strong>IVA 16%</strong></td><td class="num">${dinero(t.iva)}</td></tr>
                    <tr><td colspan="4" class="num"><strong>Total</strong></td><td class="num"><strong>${dinero(t.total)}</strong></td></tr></tbody></table>
                <div class="lf-form">
                    <div class="lf-campo lf-ancho"><label for="oc_entrega">Entregar en (aparece en la orden)</label><input id="oc_entrega" value="${esc(ultimaEntrega)}" placeholder="Domicilio de entrega"></div>
                    <div class="lf-campo lf-ancho"><label for="oc_notas">Notas para el proveedor</label><textarea id="oc_notas" rows="2">${esc(prov.entregaNotas || '')}</textarea></div>
                </div>
                <p class="gris" style="margin:0">Al generar se guarda la orden con su folio. El correo se abre en Gmail (${esc(CORREO_REMITENTE)}) para ${(prov.correos || []).length ? esc(prov.correos.join(', ')) : '<span class="err">— el proveedor no tiene correos: agrégalos en «Editar proveedor»</span>'}; el PDF se adjunta a mano.</p>
                <div class="lf-modal-pie"><span id="oc_msg" class="err" style="margin-right:auto;font-size:13px"></span>
                    <button class="lf-btn" data-cerrar>Cancelar</button>
                    <button class="lf-btn" id="oc_pdf">Guardar y exportar PDF</button>
                    <button class="lf-btn lf-btn-primario" id="oc_correo">Guardar y abrir correo</button></div>`, 680);
            const generar = async como => {
                const msg = w.$('oc_msg');
                if (como === 'correo' && !(prov.correos || []).length) { msg.textContent = 'Este proveedor no tiene correos.'; return; }
                const o = { folio: siguienteFolio(), fecha: hoyISO(), proveedorId: prov.id, proveedorNombre: prov.nombre, proveedorCorreos: prov.correos || [], lineas, entrega: w.$('oc_entrega').value.trim(), notas: w.$('oc_notas').value.trim(), estado: 'enviada', ...totalesOrden(lineas) };
                w.$('oc_pdf').disabled = w.$('oc_correo').disabled = true;
                if (como === 'correo') correoOrden(o, prov);   // primero, para que el navegador no bloquee la pestaña de Gmail
                try {
                    await addDoc(collection(db, 'ordenes_compra'), { ...o, creadoPor: getCurrentUser().email, creadoEn: serverTimestamp() });
                    productos.filter(p => p.proveedorId === prov.id).forEach(p => delete cant[p.id]); guardarCant();
                    w.cerrar();
                    if (como === 'pdf') imprimirOrden(o, prov);
                    await cargar(`<span class="ok">Orden ${esc(o.folio)} guardada.</span>`);
                } catch (err) { console.error(err); msg.textContent = 'No se pudo guardar: ' + err.message; w.$('oc_pdf').disabled = w.$('oc_correo').disabled = false; }
            };
            w.$('oc_pdf').addEventListener('click', () => generar('pdf'));
            w.$('oc_correo').addEventListener('click', () => generar('correo'));
        }
    </script>
</body>
</html>
