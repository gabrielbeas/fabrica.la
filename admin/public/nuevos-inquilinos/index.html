<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nuevos inquilinos - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261104-1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 20px; }
        .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
        .chips { align-items: center; }
        .btn { font: inherit; font-size: 14px; font-weight: 600; line-height: 20px; padding: 9px 18px; border-radius: var(--radio-sm); border: 1px solid var(--accion); background: var(--accion); color: var(--on-accion); cursor: pointer; }
        .btn:hover:not(:disabled) { background: var(--accion-hover); border-color: var(--accion-hover); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { font: inherit; font-size: 14px; font-weight: 600; line-height: 20px; padding: 9px 16px; border-radius: var(--radio-sm); border: 1px solid var(--borde-control); background: var(--fondo); color: var(--tinta); cursor: pointer; }
        .btn-sec:hover:not(:disabled) { background: var(--fondo-hundido); }
        .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .chip { border: 1px solid var(--linea); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--tinta-suave); }
        .chip.act { border-color: var(--accion); background: var(--accion-suave); color: var(--accion); font-weight: 600; }
        .tabla-wrap { border: 1px solid var(--linea); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
        th { text-align: left; font-weight: 600; color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 11px 12px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); white-space: nowrap; }
        td { padding: 11px 12px; border-bottom: 1px solid var(--linea); }
        tr.fila { cursor: pointer; } tr.fila:hover td { background: var(--fondo-hundido); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .etapa { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--accion-suave); color: var(--accion); }
        .etapa.activado { background: var(--exito-suave); color: var(--exito); } .etapa.descartado { background: var(--fondo-hundido); color: var(--tinta-suave); }
        .puntos { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: middle; }
        .puntos i { width: 8px; height: 8px; border-radius: 50%; background: var(--linea); } .puntos i.on { background: var(--accion); }
        .borrar { background: none; border: none; cursor: pointer; padding: 6px; border-radius: var(--radio-sm); color: var(--tinta-suave); line-height: 0; }
        .borrar:hover { background: var(--peligro-suave, #fdecea); color: var(--peligro); }
        .borrar svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        @media (max-width: 700px) { .tabla-movil tbody tr { position: relative; } .tabla-movil td:last-child { position: absolute; top: 6px; right: 8px; width: auto; padding: 0 !important; } .tabla-movil td:first-child { padding-right: 44px !important; } .tabla-movil td.vacio { position: static; padding: 20px 0 !important; text-align: center !important; } }
        .vacio { padding: 40px; text-align: center; color: var(--tinta-suave); }
        .err { color: var(--peligro); } .cargando { color: var(--tinta-suave); padding: 40px 0; text-align: center; }
        .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 1000; overflow-y: auto; }
        .modal { background: var(--fondo); border-radius: 12px; width: 100%; max-width: 520px; padding: 26px 30px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .modal h3 { margin: 0 0 14px; font-size: 18px; }
        .campo { margin-bottom: 14px; } label { display: block; font-size: 12px; color: var(--tinta-suave); margin-bottom: 4px; }
        select { width: 100%; padding: 8px 10px; border: 1px solid var(--borde-control); border-radius: 8px; font: inherit; background: #fff; }
        .pie { display: flex; justify-content: flex-end; gap: 10px; align-items: center; margin-top: 18px; } .pie .err { margin-right: auto; font-size: 13px; }
        .chk { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--tinta); }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261112-1';
        import { fechaLarga } from '../../../js/selector-fecha.js?v=20261028-1';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261111-1';
        import { collection, getDocs, getDoc, setDoc, doc, writeBatch, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { pasosDe, etapaDe } from '../../../js/nuevos-inquilinos.js?v=20261111-5';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => n ? '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const fechaTxt = f => /^\d{4}-\d{2}-\d{2}$/.test(f || '') ? fechaLarga(f) : '-';
        const ordenLocal = (a, b) => parseInt(a.locales?.[0] || 999) - parseInt(b.locales?.[0] || 999);
        let procesos = [], contratos = [], filtro = 'en_proceso';

        if (!isAuthenticated()) window.location.href = '/login.html';
        else {
            crearNavbar();
            if (!esAdmin()) app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            else cargar().catch(e => { console.error(e); app.innerHTML = `<h1>Nuevos inquilinos</h1><p class="err">No se pudo cargar: ${esc(e.message)}</p>`; });
        }

        async function cargar() {
            const [sp, sc] = await Promise.all([getDocs(collection(db, 'nuevos_inquilinos')), getDocs(collection(db, 'contratos'))]);
            contratos = sc.docs.map(d => ({ id: d.id, ...d.data() }));
            procesos = sp.docs.map(d => ({ id: d.id, ...d.data() }));
            pintar();
            const local = new URLSearchParams(location.search).get('local');
            if (local) modalNuevo(local);
        }

        function pintar() {
            const cuenta = e => procesos.filter(p => (p.estado || 'en_proceso') === e).length;
            const lista = procesos.filter(p => filtro === 'todos' || (p.estado || 'en_proceso') === filtro)
                .sort((a, b) => ordenLocal(a, b) || (b.actualizadoEn?.seconds || 0) - (a.actualizadoEn?.seconds || 0));
            const actual = id => contratos.find(c => c.id === id);
            app.innerHTML = `
                <div class="cab"><div><h1>Nuevos inquilinos</h1>
                <p class="sub">Cambios de inquilino y renovaciones de un local que ya existe: propuesta, cuestionario, contrato, firma y pagos. Al activar, el contrato nuevo entra a Contratos, Facturación y Depósitos, y el anterior pasa a inactivo sin perder su información.</p></div>
                </div>
                <div class="chips">${[['en_proceso', 'En proceso'], ['activado', 'Activados'], ['descartado', 'Descartados'], ['todos', 'Todos']].map(([k, t]) => `<button class="chip ${filtro === k ? 'act' : ''}" data-f="${k}">${t}${k !== 'todos' ? ` (${cuenta(k)})` : ` (${procesos.length})`}</button>`).join('')}<button class="btn" id="btnNuevo" style="margin-left:auto">Nuevo proceso</button></div>
                <div class="tabla-wrap"><table class="tabla-movil">
                    <thead><tr><th>Local</th><th>Inquilino actual</th><th>Interesado</th><th>Tipo</th><th>Etapa</th><th class="num">Renta propuesta</th><th>Inicio propuesto</th><th></th></tr></thead>
                    <tbody>${lista.map(p => {
                        const d = p.datos || {}, c = actual(p.contratoId) || {}, et = etapaDe(p), est = p.estado || 'en_proceso';
                        return `<tr class="fila" data-id="${esc(p.id)}"><td><b>${esc((p.locales || c.locales || []).join(', '))}</b></td><td>${esc(c.razonSocial || '-')}</td>
                            <td>${esc(p.interesado || d.razonSocial || d.dirigidaA || 'Sin nombre')}</td><td>${d.tipoContrato === 'renovacion' ? 'Renovación' : 'Inquilino nuevo'}</td>
                            <td><span class="etapa ${est}">${esc(est === 'activado' ? 'Activado' : et.nombre)}</span><span class="puntos">${pasosDe(p).map(x => `<i class="${x.hecho ? 'on' : ''}"></i>`).join('')}</span></td>
                            <td class="num">${dinero(d.renta)}</td><td>${esc(fechaTxt(d.inicio))}</td>
                            <td style="text-align:right"><button class="borrar" data-borrar="${esc(p.id)}" title="${est === 'activado' ? 'Un proceso activado no se puede borrar' : 'Borrar este proceso'}" aria-label="Borrar proceso"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></td></tr>`;
                    }).join('') || `<tr><td colspan="8" class="vacio">${filtro === 'en_proceso' ? 'No hay procesos en marcha. Pulsa «Nuevo proceso» para empezar con un local.' : 'Sin procesos en esta lista.'}</td></tr>`}</tbody>
                </table></div>`;
            app.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { filtro = b.dataset.f; pintar(); }));
            app.querySelectorAll('tr.fila').forEach(r => r.addEventListener('click', () => { location.href = 'ficha.html?id=' + encodeURIComponent(r.dataset.id); }));
            document.getElementById('btnNuevo').addEventListener('click', () => modalNuevo(null));
            app.querySelectorAll('[data-borrar]').forEach(b => b.addEventListener('click', async e => {
                e.stopPropagation();
                const p = procesos.find(x => x.id === b.dataset.borrar); if (!p) return;
                if (p.estado === 'activado') { alert('Este proceso ya se activó y dio origen a un contrato: no se puede borrar.'); return; }
                const c = contratos.find(x => x.id === p.contratoId) || {}, quien = p.interesado || (p.datos || {}).razonSocial || (p.datos || {}).dirigidaA || 'sin nombre';
                if (!confirm('¿Borrar el proceso del Local ' + (p.locales || c.locales || []).join(', ') + ' (' + quien + ')?\n\nSe pierde su propuesta, cuestionario, pagos registrados y documentos. Queda una copia de respaldo en el panel, pero ya no aparecerá en la lista.')) return;
                if (!confirm('SEGUNDA CONFIRMACIÓN\n\n¿Seguro que quieres borrar este proceso? Esta es la última pregunta.')) return;
                try {
                    const user = getCurrentUser(), { id, ...datosP } = p, batch = writeBatch(db);
                    batch.set(doc(db, 'nuevos_inquilinos_eliminados', id), { ...datosP, eliminadoPor: user.email, eliminadoEn: serverTimestamp() });
                    batch.delete(doc(db, 'nuevos_inquilinos', id));
                    await batch.commit();
                    procesos = procesos.filter(x => x.id !== id); pintar();
                } catch (err) { console.error(err); alert('No se pudo borrar: ' + err.message); }
            }));
        }

        async function modalNuevo(localId) {
            const locales = contratos.filter(c => !c.propio && c.estado !== 'terminado').sort(ordenLocal);
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<div class="modal" role="dialog" aria-label="Nuevo proceso">
                <h3>Nuevo proceso</h3>
                <div class="campo"><label for="nLocal">Local</label><select id="nLocal"><option value="">Elegir local</option>${locales.map(c => `<option value="${esc(c.id)}" ${c.id === localId ? 'selected' : ''}>Local ${esc((c.locales || []).join(', '))} · ${esc(c.razonSocial || '')}</option>`).join('')}</select></div>
                <div class="campo"><label for="nTipo">Tipo</label><select id="nTipo"><option value="nuevo">Inquilino nuevo (el actual se va)</option><option value="renovacion">Renovación (el mismo inquilino continúa)</option></select></div>
                <div class="campo" id="nPropC" style="display:none"><label class="chk"><input type="checkbox" id="nProp" checked> Partir de la propuesta ya guardada en Contratos para este local</label></div>
                <div class="pie"><span class="err" id="nMsg"></span><button class="btn-sec" data-x>Cancelar</button><button class="btn" id="nCrear">Crear y abrir</button></div></div>`;
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-x')) fondo.remove(); });
            document.body.appendChild(fondo);
            let propuesta = null;
            const revisaProp = async () => {
                const id = fondo.querySelector('#nLocal').value; propuesta = null;
                if (id) { try { const sp = await getDoc(doc(db, 'propuestas', id)); if (sp.exists()) propuesta = sp.data(); } catch (e) { /* sin propuesta */ } }
                fondo.querySelector('#nPropC').style.display = propuesta ? '' : 'none';
            };
            fondo.querySelector('#nLocal').addEventListener('change', revisaProp); revisaProp();
            fondo.querySelector('#nCrear').addEventListener('click', async e => {
                const id = fondo.querySelector('#nLocal').value, msg = fondo.querySelector('#nMsg');
                if (!id) { msg.textContent = 'Elige el local.'; return; }
                e.target.disabled = true;
                try {
                    const c = contratos.find(x => x.id === id), user = getCurrentUser();
                    const datos = { ...(propuesta && fondo.querySelector('#nProp').checked ? propuesta.datos || {} : {}), tipoContrato: fondo.querySelector('#nTipo').value };
                    const pid = 'ni_' + Date.now().toString(36);
                    await setDoc(doc(db, 'nuevos_inquilinos', pid), {
                        contratoId: id, locales: c.locales || [], estado: 'en_proceso', interesado: datos.razonSocial || datos.dirigidaA || '', datos,
                        propuestaEnviada: null, aceptada: null, versionPdf: 0, pagos: [],
                        creadoPor: user.email, creadoEn: serverTimestamp(), actualizadoPor: user.email, actualizadoEn: serverTimestamp()
                    });
                    location.href = 'ficha.html?id=' + encodeURIComponent(pid);
                } catch (err) { console.error(err); msg.textContent = 'No se pudo crear: ' + err.message; e.target.disabled = false; }
            });
        }
    </script>
</body>
</html>
