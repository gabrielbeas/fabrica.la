<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar contratos - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261005-5">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        h1 { font-size: 24px; margin-bottom: 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin-bottom: 30px; }
        .card { border: 1px solid var(--linea); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .btn { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linea); }
        th { color: var(--tinta-suave); font-weight: 600; }
        .ok { color: var(--exito); } .err { color: var(--peligro); }
        #log { font-family:  var(--font-mono); font-size: 13px; white-space: pre-wrap; background: var(--fondo-hundido); padding: 12px; border-radius: 6px; min-height: 40px; }
    </style>
</head>
<body>
    <div class="main" id="app">Verificando acceso...</div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261005-5';
        import { getCurrentUser, isAuthenticated, esAdmin, db } from '../../../js/auth.js?v=20261005-5';
        import { writeBatch, doc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const app = document.getElementById('app');
        const dinero = n => typeof n === 'number' ? '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta herramienta es solo para el administrador.</p>';
            } else {
                render();
            }
        }

        function render() {
            app.innerHTML = `
                <h1>Importar contratos</h1>
                <p class="sub">Carga del Google Sheet CONTROL ADMIN (pestaña INQUILINOS) a Firestore.</p>
                <div class="card">
                    <p><strong>1.</strong> Selecciona el archivo <code>_privado/contratos.json</code> de tu carpeta fabrica.la.</p>
                    <input type="file" id="archivo" accept=".json">
                </div>
                <div class="card" id="resumen" style="display:none"></div>
                <div class="card">
                    <p><strong>2.</strong> Importar a Firestore. Si lo corres otra vez, reemplaza los mismos contratos (no duplica).</p>
                    <button class="btn" id="btnImportar" disabled>Importar</button>
                    <div id="log" style="margin-top:15px"></div>
                </div>`;

            let datos = null;
            const log = (m, cls = '') => { document.getElementById('log').innerHTML += `<span class="${cls}">${m}</span>\n`; };

            document.getElementById('archivo').addEventListener('change', async e => {
                const f = e.target.files[0];
                if (!f) return;
                try {
                    datos = JSON.parse(await f.text());
                    if (!Array.isArray(datos.contratos)) throw new Error('Formato inesperado');
                } catch (err) { datos = null; log('No se pudo leer: ' + err.message, 'err'); return; }
                const res = document.getElementById('resumen');
                res.style.display = 'block';
                res.innerHTML = `<p><strong>${datos.contratos.length}</strong> contratos.</p>
                    <table><thead><tr><th>Locales</th><th>Inquilino</th><th>Inicio</th><th>Fin</th><th>Renta mensual</th></tr></thead><tbody>
                    ${datos.contratos.map(c => `<tr><td>${(c.locales || []).join(', ')}</td><td>${c.razonSocial}</td><td>${c.inicio || '-'}</td><td>${c.fin || '-'}</td><td>${dinero(c.total)}</td></tr>`).join('')}
                    </tbody></table>`;
                document.getElementById('btnImportar').disabled = false;
            });

            document.getElementById('btnImportar').addEventListener('click', async () => {
                if (!datos || !confirm(`¿Importar ${datos.contratos.length} contratos a Firestore?`)) return;
                const btn = document.getElementById('btnImportar');
                btn.disabled = true;
                try {
                    const batch = writeBatch(db);
                    datos.contratos.forEach(c => {
                        const { id, ...resto } = c;
                        batch.set(doc(db, 'contratos', id), {
                            ...resto, origen: 'sheets', importadoPor: getCurrentUser().email, importadoEn: serverTimestamp()
                        });
                    });
                    await batch.commit();
                    log(`Importados ${datos.contratos.length} contratos.`, 'ok');
                } catch (err) {
                    log('Error al guardar: ' + err.message, 'err');
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
