<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Carátula de contrato - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261023-1">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 900px; margin: 0 auto; padding: 30px 20px 60px; }
        .barra { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .barra a { color: var(--accion); text-decoration: none; font-size: 14px; }
        .btn { background: var(--accion); color: var(--on-accion); border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-sec { background: var(--fondo-hundido); color: var(--tinta-suave); border: none; border-radius: 6px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
        .btn-sec:hover { background: var(--linea); }
        .btn-mini { margin-top: 12px; padding: 7px 14px; font-size: 13px; }

        /* Ventana de historial de depósitos */
        .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-start; justify-content: center; padding: 50px 16px; z-index: 1000; overflow-y: auto; }
        .modal { background: var(--fondo); border-radius: 12px; width: 100%; max-width: 820px; padding: 26px 30px; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
        .modal-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 2px solid var(--tinta); padding-bottom: 14px; margin-bottom: 18px; }
        .modal-cab .emp { font-size: 12px; color: var(--tinta-suave); letter-spacing: .05em; text-transform: uppercase; }
        .modal-cab h3 { margin: 6px 0 0; font-size: 18px; }
        .inc-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 24px; }
        .inc-form label { display: block; font-size: 12px; color: var(--tinta-suave); margin-bottom: 4px; }
        .inc-form input { width: 100%; padding: 8px 10px; border: 1px solid var(--borde-control); border-radius: 6px; font: inherit; font-size: 14px; box-sizing: border-box; }
        .inc-form .ancho { grid-column: 1 / -1; }
        .inc-vista { border: 1px solid var(--linea); border-radius: 8px; padding: 12px 16px; margin-top: 16px; font-size: 14px; line-height: 22px; background: var(--fondo-hundido); }
        .inc-vista strong { font-family: var(--font-mono); font-weight: 500; }
        .inc-vista .dif { color: var(--tinta-suave); font-size: 13px; }
        .inc-pie { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 18px; }
        .inc-pie .err { margin-right: auto; font-size: 13px; }
        .modal h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 20px 0 8px; }
        .tabla-dep th { background: var(--fondo-hundido); }
        .tabla-dep tr.comp td { color: var(--tinta-suave); }
        .tabla-dep tr.sub td { font-weight: 600; border-top: 1px solid var(--borde-control); color: var(--tinta-suave); }
        .nota-p { font-size: 12px; color: var(--tinta-suave); }
        .resumen-dep { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .resumen-dep div { border: 1px solid var(--linea); border-radius: 8px; padding: 12px 14px; }
        .resumen-dep span { display: block; font-size: 12px; color: var(--tinta-suave); }
        .resumen-dep strong { display: block; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
        tr.total.pagado td { border-top: none; color: var(--exito); }
        tr.total.pagado .nota-p { font-weight: 400; }
        .sub-cfe { font-size: 13px; font-weight: 600; color: var(--tinta-suave); margin: 12px 0 6px; }
        .sub-cfe:first-of-type { margin-top: 0; }
        .tabla-dep tr.tarde td { background: var(--peligro-suave); color: var(--peligro); }
        .tabla-dep tr.tarde .nota-p { color: var(--peligro); }
        .tarde-txt { display: inline; font-size: 12px; font-weight: 600; color: var(--peligro); }
        .nota-dep { font-size: 13px; color: var(--tinta-suave); margin: 16px 0 0; line-height: 1.5; }
        .aviso-dep { font-size: 13px; color: var(--peligro); margin: 14px 0 0; }

        .hoja { border: 1px solid var(--linea); border-radius: 10px; padding: 36px 40px; }
        .encabezado { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--tinta); padding-bottom: 16px; margin-bottom: 24px; }
        .encabezado .emp { font-size: 12px; color: var(--tinta-suave); letter-spacing: .05em; text-transform: uppercase; }
        .encabezado h1 { font-size: 22px; margin: 6px 0 4px; }
        .encabezado .loc { font-size: 15px; color: var(--tinta-suave); }
        .estado { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 10px; }
        .e-vigente { background: var(--exito-suave); color: var(--exito); } .e-vencido { background: var(--peligro-suave); color: var(--peligro); } .e-termina { background: var(--atencion-suave); color: var(--atencion); }

        .secciones { display: grid; grid-template-columns: 1fr; gap: 26px; }
        .seccion h2 { border-bottom: 1px solid var(--linea); padding-bottom: 6px; }
        /* Numeración automática de secciones (1. Arrendatario, 2. Garantías...) */
        .secciones { counter-reset: sec; }
        .secciones > .seccion > h2::before { counter-increment: sec; content: counter(sec) ". "; }
        .sin-dato { color: var(--tinta-tenue); font-weight: 400; }
        .vig-wrap { display: flex; flex-direction: row-reverse; gap: 30px; align-items: flex-start; }
        .vig-wrap dl { flex: 1; }
        .vig-cajas { flex: none; width: 280px; display: flex; flex-direction: column; gap: 10px; }
        .vig-alerta { width: 100%; display: flex; gap: 12px; align-items: center; border: 1px solid; border-radius: 10px; padding: 14px 16px; }
        .vig-punto { flex: none; width: 16px; height: 16px; border-radius: 50%; }
        .vig-punto.cuadro { border-radius: 3px; }
        .vig-titulo { font-weight: 700; font-size: 15px; }
        .vig-det { font-size: 12px; color: var(--tinta-suave); margin-top: 2px; }
        @media (max-width: 700px) { .vig-wrap { flex-direction: column; } .vig-cajas { width: 100%; } }
        .seccion h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 0 0 10px; }
        .seccion.ancha { grid-column: 1 / -1; }
        dl { margin: 0; display: grid; grid-template-columns: 220px 1fr; gap: 7px 16px; font-size: 14px; }
        dt { color: var(--tinta-suave); }
        dd { margin: 0; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; color: var(--tinta-suave); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--linea); }
        td { padding: 7px 8px; border-bottom: 1px solid var(--fondo-hundido); }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .total td { font-weight: 700; border-top: 1px solid var(--borde-control); border-bottom: none; }
        .notas { font-size: 13px; color: var(--tinta-suave); }
        .notas li { margin-bottom: 3px; }
        .pie { margin-top: 28px; font-size: 11px; color: var(--tinta-tenue); }
        .err { color: var(--peligro); }

        /* Alertas del contrato */
        .alertas-caja { border: 1px solid var(--linea); border-radius: 10px; padding: 16px 20px; margin-bottom: 20px; }
        .alertas-caja h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--peligro); margin: 0 0 12px; }
        .alerta-fila { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--fondo-hundido); font-size: 14px; }
        .alerta-fila:first-of-type { border-top: none; padding-top: 0; }
        .alerta-fila .punto { flex: none; width: 10px; height: 10px; border-radius: 50%; position: relative; top: 1px; }
        .alerta-fila .punto.cuadro { border-radius: 2px; }
        .alerta-fila .que { flex: 1; }
        .alerta-fila .que strong { font-weight: 600; }
        .alerta-fila .que span { color: var(--tinta-suave); font-size: 13px; }
        .alerta-fila .cuando { font-weight: 600; white-space: nowrap; font-size: 13px; }

        @media (max-width: 700px) { .secciones { grid-template-columns: minmax(0, 1fr); } .hoja { padding: 18px 14px; } .encabezado { flex-wrap: wrap; gap: 10px; } .barra { gap: 8px; } }
        @media print {
            nav, .navbar, .barra, #aviso, .alertas-caja, .no-print, .modal-fondo { display: none !important; }
            .main { max-width: none; padding: 0; }
            .hoja { border: none; padding: 0; }
            body { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="main" id="app"><p style="color:#999">Cargando...</p></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261023-1';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261023-1';
        import { doc, getDoc, getDocs, updateDoc, addDoc, writeBatch, query, where, collection, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { actualizarRentaEnFactura, mesTxt, imprimirHojas, LOGO_URL } from '../../../js/facturacion.js?v=20261013-1';
        import { telefonoWhatsApp } from '../../../js/whatsapp.js?v=20261023-1';
        import { cuentaDeposito, BASES_DEPOSITO } from '../../../js/depositos.js?v=20261023-1';
        import { requerimientoDeposito } from '../../../js/requerimiento-deposito.js?v=20261014-10';
        import { alertasContrato, cuandoTxt, diasHasta, nivelDe, COLOR_NIVEL, COLOR_OTRA, TEXTO_NIVEL, VENTANA_DIAS } from '../../../js/alertas-contrato.js?v=20261023-1';

        const app = document.getElementById('app');
        let diaLimitePago = 10; // Configuración → facturacion_config/general; pagos después de ese día son tarde
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const fechaTxt = f => { if (!f || !/^\d{4}-\d{2}-\d{2}$/.test(f)) return f || '-'; const [y, m, d] = f.split('-'); return `${+d} de ${MESES[+m - 1]} de ${y}`; };
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        const filaSiempre = (k, v) => `<dt>${k}</dt><dd>${(v === undefined || v === null || v === '' || v === '-') ? '<span class="sin-dato">Sin registrar</span>' : v}</dd>`;
        const fila = (k, v) => (v === undefined || v === null || v === '' || v === '-') ? '' : `<dt>${k}</dt><dd>${v}</dd>`;

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p>Esta sección es solo para el administrador.</p>';
            } else {
                cargar().catch(err => { app.innerHTML = `<p class="err">No se pudo cargar el contrato: ${esc(err.message)}</p>`; });
            }
        }

        async function cargar() {
            const id = new URLSearchParams(location.search).get('id');
            const [snap, snapCfg] = await Promise.all([
                id ? getDoc(doc(db, 'contratos', id)) : null,
                getDoc(doc(db, 'facturacion_config', 'general')).catch(() => null)
            ]);
            const dia = snapCfg?.exists() ? snapCfg.data().diaLimitePago : null;
            if (Number.isInteger(dia)) diaLimitePago = dia;
            if (!snap || !snap.exists()) {
                app.innerHTML = `<div class="barra"><a href="./">← Locales</a></div><p class="err">No se encontró el contrato.</p>`;
                return;
            }
            contratoId = id;
            vista(snap.data());
        }

        let contratoId = null;

        // Alerta de vigencia (columna derecha de la sección Vigencia)
        // Más de 90 días: círculo verde. 90 días o menos: color según urgencia y días que faltan.
        const plural = n => `${n.toLocaleString('es-MX')} día${n === 1 ? '' : 's'}`;
        function cajaFecha(fecha, t) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha || '')) return '';
            const d = diasHasta(fecha);
            let color, titulo, detalle;
            if (d > VENTANA_DIAS) {
                color = '#3d8a5a'; titulo = t.ok;
                detalle = `Faltan ${plural(d)} ${t.para}`;
            } else {
                // Fin de contrato: color según cuánto falta. Incremento: un solo color, sin escala de tiempo.
                color = t.escala ? COLOR_NIVEL[nivelDe(d)] : COLOR_OTRA;
                titulo = d < 0 ? t.pasado : d === 0 ? `${t.verbo} hoy` : `${t.verbo} en ${plural(d)}`;
                detalle = d < 0 ? `${t.hace} hace ${plural(-d)} (${fechaTxt(fecha)})` : `${t.etiqueta}: ${fechaTxt(fecha)}`;
            }
            return `<div class="vig-alerta" style="border-color:${color}">
                <span class="vig-punto${t.escala ? '' : ' cuadro'}" style="background:${color}"></span>
                <div><div class="vig-titulo" style="color:${color}">${titulo}</div><div class="vig-det">${detalle}</div></div>
            </div>`;
        }
        function alertaVigencia(c) {
            const cajas = [
                cajaFecha(c.fin, { escala: true, ok: 'Vigente', para: 'para el vencimiento', verbo: 'Vence', pasado: 'Contrato vencido', hace: 'Venció', etiqueta: 'Fin del contrato' }),
                cajaFecha(c.incremento, { ok: 'Sin incremento próximo', para: 'para el incremento de renta', verbo: 'Incremento', pasado: 'Incremento pendiente', hace: 'Tocaba', etiqueta: 'Incremento de renta' + (c.incrementoTipo ? ` (${esc(c.incrementoTipo)})` : '') })
            ].filter(Boolean);
            return cajas.length ? `<div class="vig-cajas">${cajas.join('')}</div>` : '';
        }

        // Detalle de alertas (en la lista de Locales solo se ve un punto)
        function cajaAlertas(c) {
            const a = alertasContrato(c);
            if (!a.total) return '';
            const filas = a.lista.map(e => `
                <div class="alerta-fila">
                    ${e.tipo === 'Fin de contrato'
                        ? `<span class="punto" style="background:${COLOR_NIVEL[e.nivel]}" title="${TEXTO_NIVEL[e.nivel]}"></span>`
                        : `<span class="punto cuadro" style="background:${COLOR_OTRA}"></span>`}
                    <div class="que"><strong>${esc(e.tipo)}</strong> · ${fechaTxt(e.fecha)}${e.det ? `<br><span>${esc(e.det)}</span>` : ''}</div>
                    <div class="cuando" style="color:${e.tipo === 'Fin de contrato' && e.nivel !== '60' ? COLOR_NIVEL[e.nivel] : 'var(--tinta)'}">${e.dias < 0 ? 'Vencido ' : ''}${cuandoTxt(e.dias)}</div>
                </div>`);
            if (a.saldo) filas.push(`
                <div class="alerta-fila">
                    <span class="punto cuadro" style="background:${COLOR_OTRA}"></span>
                    <div class="que"><strong>Saldo por pagar</strong>${c.porPagarNota ? `<br><span>${esc(c.porPagarNota)}</span>` : ''}</div>
                    <div class="cuando">${dinero(a.saldo)}</div>
                </div>`);
            return `<div class="alertas-caja"><h2>Alertas (${a.total})</h2>${filas.join('')}</div>`;
        }

        function vista(c) {
            contratoActual = c;
            const estado = c.estado === 'terminacion_anticipada' ? ['e-termina', 'Terminación anticipada']
                : (c.fin && c.fin < hoyISO()) ? ['e-vencido', 'Vencido'] : ['e-vigente', 'Vigente'];
            document.title = `Carátula · ${c.razonSocial}`;

            const mant = [
                typeof c.mantenimientoPct === 'number' ? (c.mantenimientoPct * 100).toFixed(0) + '%' : '',
                typeof c.mantenimientoMonto === 'number' ? dinero(c.mantenimientoMonto) : ''
            ].filter(Boolean).join(' · ');

            app.innerHTML = `
                <div class="barra">
                    <a href="./">← Locales</a>
                    <div style="display:flex;gap:10px">
                        <button class="btn-sec" id="btnEditar">Editar</button>
                        <button class="btn" onclick="window.print()">Imprimir / PDF</button>
                    </div>
                </div>
                <div id="aviso"></div>
                ${cajaAlertas(c)}
                <div class="hoja">
                    <div class="encabezado">
                        <div>
                            <div class="emp">La Fábrica de Chocolate · Carátula de contrato de arrendamiento</div>
                            <h1>${esc(c.razonSocial)}</h1>
                            <div class="loc">Local ${esc((c.locales || []).join(', '))}${c.m2 ? ` · ${c.m2} m²` : ''}</div>
                        </div>
                        <span class="estado ${estado[0]}">${estado[1]}</span>
                    </div>

                    <div class="secciones">
                        <div class="seccion">
                            <h2>Arrendatario</h2>
                            <dl>
                                ${fila('Razón social', esc(c.razonSocial))}
                                ${fila('RFC', esc(c.rfc))}
                                ${fila('Nombre comercial', esc(c.nombreComercial))}
                                ${fila((c.locales || []).length > 1 ? 'Locales' : 'Local', esc((c.locales || []).join(', ')))}
                                ${fila('Superficie', c.m2 ? `${esc(c.m2)} m²` : '')}
                                ${fila('Giro', esc(c.giro))}
                                ${fila('Representante', esc(c.representante))}
                                ${fila('Teléfono', telefonoWhatsApp(c.telefono))}
                                ${fila('Dirección', (c.direccion || []).map(esc).join('<br>'))}
                                ${fila('Acceso al local', esc(c.acceso))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Vigencia</h2>
                            <div class="vig-wrap">
                            ${alertaVigencia(c)}
                            <dl>
                                ${fila('Firma', c.firma ? fechaTxt(c.firma) : (c.firmaOk ? 'Firmado (sin fecha registrada)' : ''))}
                                ${fila('Plazo', esc(c.plazo))}
                                ${fila('Inicio', fechaTxt(c.inicio))}
                                ${fila('Fin', fechaTxt(c.fin))}
                                ${fila('Incremento de renta', fechaTxt(c.incremento) + (c.incrementoTipo ? ` (${esc(c.incrementoTipo)})` : ''))}
                                ${fila('', esc(c.incrementoNota))}
                                ${fila('Fecha límite de pago', esc(c.fechaLimite))}
                            </dl>
                            </div>
                        </div>
                        <div class="seccion">
                            <h2>Renta actual</h2>
                            <dl>
                                ${fila('Mantenimiento', mant)}
                                ${fila('Renta mensual', dinero(c.total))}
                                ${fila('Con IVA', dinero(c.totalIva))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Depósito</h2>
                            <dl>
                                ${fila('Meses de depósito', c.mesesDeposito)}
                                ${fila('Base del depósito', BASES_DEPOSITO[cuentaDeposito(c).baseClave] + ' · ' + dinero(cuentaDeposito(c).base))}
                                ${fila('Depósito requerido', dinero(cuentaDeposito(c).requerido))}
                                ${fila('Depósito pagado', dinero(cuentaDeposito(c).pagado) + (cuentaDeposito(c).saldo <= 0.005 && cuentaDeposito(c).pagado > 0 ? ' (cubierto)' : ''))}
                                ${fila('Fecha del primer pago', cuentaDeposito(c).primero ? fechaTxt(cuentaDeposito(c).primero) : '')}
                                ${fila('Último pago', cuentaDeposito(c).ultimo ? fechaTxt(cuentaDeposito(c).ultimo) : '')}
                                ${fila('Meses de gracia', c.mesesGracia)}
                                ${fila('Por pagar', dinero(cuentaDeposito(c).saldo) + (c.porPagarNota ? ` · ${esc(c.porPagarNota)}` : ''))}
                            </dl>
                            ${Array.isArray(c.historialDepositos) ? `<button class="btn-sec btn-mini no-print" id="btnDepositos">Ver historial de pagos de depósito</button>` : ''}
                            ${!c.propio ? `<button class="btn-sec btn-mini no-print" id="btnRequerimiento" title="Hoja de requerimiento de pago del saldo del depósito en garantía">Requerimiento de cobro (PDF)</button>` : ''}
                        </div>
                        ${(c.rentas || []).length ? `
                        <div class="seccion ancha">
                            <h2>Historial de renta</h2>
                            <table>
                                <thead><tr><th>Concepto</th><th>Periodo</th><th>Incremento / nota</th><th class="num">Monto mensual</th></tr></thead>
                                <tbody>
                                    ${filasRenta(c)}
                                    <tr class="total"><td colspan="3">Renta mensual vigente${explicaVigente(c)}</td><td class="num">${dinero(c.total)}</td></tr>
                                    ${filaTotalPagado(c)}
                                </tbody>
                            </table>
                            <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">
                                ${typeof c.total === 'number' ? `<button class="btn btn-mini" id="btnIncremento">Aplicar incremento de renta</button>` : ''}
                                ${(c.pagosRenta || []).length ? `<button class="btn-sec btn-mini" id="btnPagosRenta">Ver historial de pagos de renta</button>` : ''}
                            </div>
                        </div>` : ''}
                        <div class="seccion">
                            <h2>CFE</h2>
                            ${bloquesCFE(c)}
                        </div>
                        <div class="seccion">
                            <h2>Seguro y servicios</h2>
                            <dl>
                                ${filaSiempre('Aseguradora', esc(c.seguro?.aseguradora))}
                                ${filaSiempre('Póliza', esc(c.seguro?.poliza))}
                                ${filaSiempre('A nombre de', esc(c.seguro?.nombre))}
                                ${filaSiempre('Vigencia del seguro', c.seguro?.vigencia ? fechaTxt(c.seguro.vigencia) : '')}
                                ${filaSiempre('Telmex', esc(c.telmex))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Garantías</h2>
                            <dl>
                                ${fila('Garantía', esc(c.garantia))}
                                ${fila('Obligado solidario', (c.obligadosSolidarios || []).map(esc).join('<br>'))}
                                ${fila('Detalle', esc(c.garantiaDetalle))}
                                ${fila('Seguros requeridos', esc(c.segurosRequeridos))}
                            </dl>
                        </div>
                        <div class="seccion ancha">
                            <h2>Condiciones del contrato</h2>
                            <dl>
                                ${fila('Periodo de gracia', esc(c.periodoGracia))}
                                ${fila('Moratorios', esc(c.moratoriosContrato))}
                                ${fila('Terminación anticipada', esc(c.terminacionAnticipada))}
                                ${fila('Notificaciones', (c.correosNotificacion || []).map(esc).join(' · '))}
                                ${fila('Documento', esc(c.documento))}
                            </dl>
                        </div>
                        ${c.notas ? `
                        <div class="seccion ancha">
                            <h2>Notas</h2>
                            <div class="notas" style="white-space:pre-wrap">${esc(c.notas)}</div>
                        </div>` : ''}
                        ${(c.extras || []).length || c.totalNota ? `
                        <div class="seccion ancha">
                            <h2>Notas de la hoja original</h2>
                            <ul class="notas">
                                ${c.totalNota ? `<li>Renta mensual ${esc(c.totalNota)}.</li>` : ''}
                                ${(c.extras || []).map(x => `<li>${esc(x.valor)} <span style="color:#bbb">(fila ${x.fila}, col ${x.col})</span></li>`).join('')}
                            </ul>
                        </div>` : ''}
                    </div>
                    <div class="pie">Generado el ${fechaTxt(hoyISO())} desde el panel de administración.${c.editadoPor ? ` Última edición: ${esc(c.editadoPor)}.` : ''}</div>
                </div>`;
            document.getElementById('btnEditar').addEventListener('click', () => edicion(c));
            document.getElementById('btnDepositos')?.addEventListener('click', () => ventanaDepositos(c));
            document.getElementById('btnRequerimiento')?.addEventListener('click', e => requerimientoDeposito({ ...c, id: contratoId }, e.currentTarget));
            document.getElementById('btnPagosRenta')?.addEventListener('click', () => ventanaPagosRenta(c));
            document.getElementById('btnIncremento')?.addEventListener('click', () => ventanaIncremento(c));
            if (avisoPendiente) { document.getElementById('aviso').innerHTML = avisoPendiente; avisoPendiente = ''; }
        }

        let contratoActual = null;
        let avisoPendiente = '';

        // ---------------- HISTORIAL DE RENTA: periodos e incrementos ----------------
        // c.rentas: [{ concepto, anio, monto, nota, periodo, desde, hasta, incrementoPct }]
        //   desde / hasta (YYYY-MM-DD): vigencia de esa renta; hasta = null mientras sigue abierta.
        //   incrementoPct: fracción (0.0419 = 4.19%) con la que se calculó respecto al periodo anterior.
        // Sin fechas se muestra el texto `periodo` original (contratos que todavía no se especifican).
        const r2 = n => Math.round(n * 100) / 100;
        const mesAnio = f => { const [y, m] = f.split('-'); return `${MESES[+m - 1].toUpperCase()} ${y}`; };
        const periodoRenta = r => r.desde ? `${mesAnio(r.desde)} – ${r.hasta ? mesAnio(r.hasta) : 'VIGENTE'}` : (r.periodo || '');
        const pctTxt = f => `${+(f * 100).toFixed(4)}%`;
        const notaRenta = r => {
            const nota = String(r.nota ?? '').replace(/[☀-➿️]/g, '').trim();
            const pct = typeof r.incrementoPct === 'number' ? pctTxt(r.incrementoPct) : '';
            return nota && nota !== pct ? (pct ? `${pct} · ${nota}` : nota) : (pct || nota);
        };
        const sumarDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
        // Renta que rige hoy: la que tiene el `desde` más reciente (o, sin fechas, la última de la lista)
        // Periodos de la lista: si la fila no trae fechas (`desde`), se calculan hacia atrás desde la fecha del próximo aumento
        // (`incremento`): la última fila es el año que termina un día antes y cada fila anterior es un año antes. Lo que cae antes del
        // inicio del contrato se marca como anterior. Solo cuentan las filas «RENTA MENSUAL AAAA»; las de base u otros conceptos
        // se muestran sin periodo. Es solo para mostrar: no se guarda nada ni cambia la facturación.
        const sumarAnios = (f, n) => `${+f.slice(0, 4) + n}${f.slice(4)}`;
        const esPeriodoRenta = r => /^RENTA\s+MENSUAL\s+\d{4}$/i.test(String(r.concepto || '').trim());
        function periodosCalculados(c) {
            const mapa = new Map();
            const fecha = f => /^\d{4}-\d{2}-\d{2}$/.test(f || '');
            if (!fecha(c.incremento)) return mapa;
            const filas = (c.rentas || []).filter(r => esPeriodoRenta(r) && !r.desde);
            filas.reverse().forEach((r, j) => {
                const desde = sumarAnios(c.incremento, -(j + 1)), hasta = sumarDias(sumarAnios(c.incremento, -j), -1);
                mapa.set(r, fecha(c.inicio) && hasta < c.inicio ? { antes: true } : { desde: fecha(c.inicio) && desde < c.inicio ? c.inicio : desde, hasta });
            });
            return mapa;
        }
        function filasRenta(c) {
            const calc = periodosCalculados(c);
            return c.rentas.map(r => {
                const k = calc.get(r);
                const propio = k && k.antes && r.periodo;   // antes del inicio y con su propio texto de periodo: se respeta ese texto
                const periodo = !k || propio ? periodoRenta(r) : k.antes ? 'ANTERIOR AL INICIO DEL CONTRATO' : `${mesAnio(k.desde)} – ${mesAnio(k.hasta)}`;
                // El texto original (por ejemplo, el rango de INPC con que se calculó el aumento) se conserva como nota
                const extra = k && !propio && r.periodo ? `<div style="font-size:11px;color:var(--tinta-suave)">Base INPC: ${esc(r.periodo)}</div>` : '';
                return `<tr><td>${esc(r.concepto)}</td><td${k && !propio ? ' title="Calculado con la fecha del próximo aumento y los aumentos anuales"' : ''}>${esc(periodo)}${extra}</td><td>${esc(notaRenta(r))}</td><td class="num">${dinero(r.monto)}</td></tr>`;
            }).join('');
        }
        // La renta vigente puede no ser la última fila (por ejemplo, renta más mantenimiento): se explica de dónde sale
        function explicaVigente(c) {
            const filas = (c.rentas || []).filter(esPeriodoRenta);
            const ult = filas.length ? filas[filas.length - 1].monto : null;
            if (typeof ult !== 'number' || typeof c.total !== 'number' || Math.abs(c.total - ult) < 0.05) return '';
            const dif = r2(c.total - ult), pct = (dif / ult) * 100;
            const mant = typeof c.mantenimientoPct === 'number' ? c.mantenimientoPct : 0;
            const txt = mant > 0 && Math.abs(c.total - ult * (1 + mant)) < 0.05
                ? `Renta ${dinero(ult)} + mantenimiento ${+(mant * 100).toFixed(2)} % ${dinero(dif)}`
                : `Última renta de la lista ${dinero(ult)}; la vigente es ${dinero(dif)} (${+pct.toFixed(2)} %) ${dif > 0 ? 'mayor' : 'menor'}`;
            return `<div style="font-size:11px;font-weight:400;color:var(--tinta-suave)">${txt}</div>`;
        }
        const idxVigente = rentas => {
            let idx = -1;
            rentas.forEach((r, i) => { if (r.desde && (idx < 0 || r.desde > rentas[idx].desde)) idx = i; });
            return idx >= 0 ? idx : rentas.length - 1;
        };

        function ventanaIncremento(c) {
            const actual = c.total;
            const sugerida = /^\d{4}-\d{2}-\d{2}$/.test(c.incremento || '') ? c.incremento : hoyISO();
            abrirVentana(`
                <div class="modal-cab">
                    <div><div class="emp">${esc(c.razonSocial)}</div><h3>Aplicar incremento de renta</h3></div>
                    <button class="btn-sec" data-cerrar>Cerrar</button>
                </div>
                <div class="inc-form">
                    <div><label for="incPct">% de incremento${c.incrementoTipo ? ` (${esc(c.incrementoTipo)})` : ''}</label><input id="incPct" type="number" step="any" min="-50" max="100" placeholder="Ej. 3.57" autofocus></div>
                    <div><label for="incDesde">Vigente desde</label><input id="incDesde" type="date" value="${sugerida}"></div>
                </div>
                <div class="inc-vista" id="incVista">Escribe el porcentaje para ver la nueva renta.</div>
                <p class="nota-dep" id="incFacturas"></p>
                <p class="nota-dep">Se calcula sobre la renta mensual vigente (sin IVA, ${dinero(actual)}). Cierra el periodo actual el día anterior, agrega el nuevo periodo, actualiza la renta mensual en todo el panel y mueve el próximo incremento un año. Las facturas pendientes de ese mes en adelante se actualizan con la renta nueva; las ya pagadas no cambian. Queda registrado en el historial del contrato.</p>
                <div class="inc-pie"><span class="err" id="incMsg"></span><button class="btn-sec" data-cerrar>Cancelar</button><button class="btn" id="incAplicar" disabled>Aplicar incremento</button></div>`,
                'Aplicar incremento de renta');
            const pct = document.getElementById('incPct'), desde = document.getElementById('incDesde'), vista_ = document.getElementById('incVista'), btn = document.getElementById('incAplicar');
            const calc = () => {
                const p = parseFloat(pct.value);
                if (!Number.isFinite(p)) { vista_.textContent = 'Escribe el porcentaje para ver la nueva renta.'; btn.disabled = true; return null; }
                const nuevo = r2(actual * (1 + p / 100));
                vista_.innerHTML = `Renta mensual sin IVA: ${dinero(actual)} → <strong>${dinero(nuevo)}</strong><br>Con IVA (16%): ${dinero(c.totalIva ?? r2(actual * 1.16))} → <strong>${dinero(r2(nuevo * 1.16))}</strong><br><span class="dif">${nuevo >= actual ? '+' : '−'}${dinero(Math.abs(r2(nuevo - actual)))} al mes sin IVA${/^\d{4}-\d{2}-\d{2}$/.test(desde.value) ? ` · desde ${fechaTxt(desde.value)}` : ''}</span>`;
                btn.disabled = false;
                return { p, nuevo };
            };
            // Facturas del contrato que se verían afectadas (se leen una vez; si falla, la ventana sigue igual)
            let facturas = [];
            const avisoFacturas = () => {
                const mes = /^\d{4}-\d{2}-\d{2}$/.test(desde.value) ? desde.value.slice(0, 7) : null;
                const el = document.getElementById('incFacturas');
                if (!el || !mes) return;
                const afect = facturas.filter(f => f.mes >= mes);
                const pend = afect.filter(f => !esPagada(f)), pag = afect.filter(esPagada);
                el.innerHTML = !afect.length ? `No hay facturas generadas de ${mesTxt(mes)} en adelante: las nuevas saldrán con la renta nueva.`
                    : `Se actualizará${pend.length > 1 ? 'n' : ''} <strong>${pend.length}</strong> factura${pend.length === 1 ? '' : 's'} pendiente${pend.length === 1 ? '' : 's'} (${pend.map(f => mesTxt(f.mes)).join(', ') || 'ninguna'}).${pag.length ? ` Sin cambios por estar pagada${pag.length > 1 ? 's' : ''}: ${pag.map(f => mesTxt(f.mes)).join(', ')}.` : ''}`;
            };
            getDocs(query(collection(db, 'facturas'), where('contratoId', '==', contratoId)))
                .then(sn => { facturas = sn.docs.map(d => ({ id: d.id, ...d.data() })); avisoFacturas(); })
                .catch(err => console.warn('No se pudieron leer las facturas del contrato', err));
            pct.addEventListener('input', calc);
            desde.addEventListener('input', () => { calc(); avisoFacturas(); });
            btn.addEventListener('click', async () => {
                const r = calc(), msg = document.getElementById('incMsg');
                if (!r) return;
                msg.textContent = '';
                try {
                    btn.disabled = true;
                    await aplicarIncremento(c, r.p, r.nuevo, desde.value);
                } catch (err) {
                    console.error(err);
                    msg.textContent = err.message || 'No se pudo guardar.';
                    btn.disabled = false;
                }
            });
        }

        async function aplicarIncremento(c, p, nuevoMonto, desde) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(desde)) throw new Error('Elige la fecha desde la que rige la nueva renta.');
            if (p < -50 || p > 100) throw new Error('El porcentaje debe estar entre -50 y 100.');
            const antesRentas = JSON.parse(JSON.stringify(c.rentas || []));
            const rentas = JSON.parse(JSON.stringify(c.rentas || []));
            if (rentas.some(r => r.desde === desde)) throw new Error('Ya hay un periodo de renta que empieza ese día.');
            const i = idxVigente(rentas);
            if (i >= 0 && rentas[i]?.desde) {
                if (desde <= rentas[i].desde) throw new Error(`La fecha debe ser posterior al inicio del periodo vigente (${fechaTxt(rentas[i].desde)}).`);
                rentas[i].hasta = sumarDias(desde, -1);
                rentas[i].periodo = periodoRenta(rentas[i]);
            }
            const nuevo = { concepto: `RENTA MENSUAL ${desde.slice(0, 4)}`, anio: +desde.slice(0, 4), monto: nuevoMonto, nota: '', desde, hasta: null, incrementoPct: +(p / 100).toFixed(6) };
            nuevo.periodo = periodoRenta(nuevo);
            rentas.push(nuevo);
            const [y, m, d] = desde.split('-');
            const cambios = { rentas, total: nuevoMonto, totalIva: r2(nuevoMonto * 1.16), incremento: `${+y + 1}-${m}-${d}` };
            const antes = { rentas: antesRentas, total: c.total ?? null, totalIva: c.totalIva ?? null, incremento: c.incremento ?? null };
            const user = getCurrentUser();
            await updateDoc(doc(db, 'contratos', contratoId), { ...cambios, editadoPor: user.email, editadoEn: serverTimestamp() });
            await addDoc(collection(db, 'contratos', contratoId, 'historial'), {
                antes: JSON.parse(JSON.stringify(antes)), despues: JSON.parse(JSON.stringify(cambios)),
                por: user.email, en: serverTimestamp()
            });
            const snap = await getDoc(doc(db, 'contratos', contratoId));
            // Derrame a Facturación: las facturas pendientes de ese mes en adelante toman la renta nueva
            let facturas = { actualizadas: [], pagadas: [], error: null };
            try { facturas = await propagarRentaAFacturas({ id: contratoId, ...snap.data() }, desde); }
            catch (err) { console.error(err); facturas.error = err.message; }
            document.querySelector('.modal-fondo')?.remove();
            const lista = ms => ms.map(mesTxt).join(', ');
            avisoPendiente = `<p class="ok" style="background:var(--exito-suave);color:var(--exito);padding:10px 14px;border-radius:6px;font-size:14px">Incremento de ${pctTxt(p / 100)} aplicado: renta mensual ${dinero(nuevoMonto)} sin IVA desde ${fechaTxt(desde)}. Próximo incremento: ${fechaTxt(cambios.incremento)}.
                ${facturas.actualizadas.length ? `<br>Facturas actualizadas: ${esc(lista(facturas.actualizadas))}.` : '<br>No había facturas pendientes de ese mes en adelante; las nuevas saldrán con la renta nueva.'}
                ${facturas.pagadas.length ? `<br>Sin cambios por estar pagadas: ${esc(lista(facturas.pagadas))}.` : ''}
                ${facturas.error ? `<br><span style="color:var(--peligro)">No se pudieron actualizar las facturas (${esc(facturas.error)}). Usa «Actualizar» desde Facturación o avísame.</span>` : ''}</p>`;
            vista(snap.data());
        }

        const esPagada = f => f.estadoPago === 'pagado' || f.estadoPago === 'pago_tarde';
        // Pone la renta que rige en cada mes en las facturas del contrato desde el mes de `desde`.
        // Las pagadas no se tocan (se reportan). Devuelve { actualizadas: [mes], pagadas: [mes] }.
        async function propagarRentaAFacturas(contrato, desde) {
            const mesDesde = desde.slice(0, 7);
            const sn = await getDocs(query(collection(db, 'facturas'), where('contratoId', '==', contrato.id)));
            const facturas = sn.docs.map(d => ({ id: d.id, ...d.data() })).filter(f => f.mes >= mesDesde).sort((a, b) => a.mes.localeCompare(b.mes));
            const out = { actualizadas: [], pagadas: [] };
            const batch = writeBatch(db), user = getCurrentUser();
            facturas.forEach(f => {
                if (esPagada(f)) { out.pagadas.push(f.mes); return; }
                const nuevo = actualizarRentaEnFactura(f, contrato);
                if (JSON.stringify(nuevo.conceptos) === JSON.stringify(f.conceptos || [])) return;
                batch.update(doc(db, 'facturas', f.id), { ...nuevo, actualizadoPor: user.email, actualizadoEn: serverTimestamp(), notaRenta: `Renta actualizada por incremento desde ${desde}` });
                out.actualizadas.push(f.mes);
            });
            if (out.actualizadas.length) await batch.commit();
            return out;
        }

        // Servicios de CFE: el principal (cfe*) y, si existe, un segundo servicio (cfe2*)
        function bloquesCFE(c) {
            const dl = s => `<dl>
                ${filaSiempre('Titular del servicio', esc(s.titular))}
                ${filaSiempre('Dirección del servicio', esc(s.direccion))}
                ${filaSiempre('No. de servicio', esc(s.servicio))}
                ${filaSiempre('RMU', esc(s.rmu))}
                ${filaSiempre('Cuenta', esc(s.cuenta))}
            </dl>`;
            const s1 = { titular: c.cfeTitular, direccion: c.cfe, servicio: c.cfeServicio, rmu: c.cfeRmu, cuenta: c.cfeCuenta };
            const s2 = { titular: c.cfe2Titular, direccion: c.cfe2Direccion, servicio: c.cfe2Servicio, rmu: c.cfe2Rmu, cuenta: c.cfe2Cuenta };
            if (!Object.values(s2).some(Boolean)) return dl(s1);
            return `<div class="sub-cfe">Servicio 1</div>${dl(s1)}<div class="sub-cfe">Servicio 2</div>${dl(s2)}`;
        }

        // Total pagado de renta (pagos reales de Simplifi; no incluye depósitos en garantía)
        function filaTotalPagado(c) {
            const p = c.pagosRenta || [];
            if (!p.length) return '';
            const total = p.reduce((s, x) => s + (x.monto || 0), 0);
            const fechas = p.map(x => x.fecha).sort();
            const conServicios = p.filter(x => /AGUA|BASURA/i.test(x.nota + ' ' + x.tags)).length;
            return `<tr class="total pagado"><td colspan="3">Total pagado de renta
                <div class="nota-p">${p.length} pagos, del ${fechaTxt(fechas[0])} al ${fechaTxt(fechas[fechas.length - 1])}. Montos con IVA, sin depósitos en garantía.${conServicios ? ` ${conServicios} pago${conServicios > 1 ? 's incluyen' : ' incluye'} agua o basura.` : ''}</div></td>
                <td class="num">${dinero(total)}</td></tr>`;
        }

        // Abre una ventana (modal) con el HTML dado; se cierra con el botón, Esc o clic fuera.
        function abrirVentana(html, etiqueta) {
            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(etiqueta)}">${html}</div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);
        }

        // Historial de pagos de renta (c.pagosRenta: [{ fecha, monto, pago, nota, tags }]), agrupado por año
        function ventanaPagosRenta(c) {
            const fechaCorta = f => f.split('-').reverse().join('/');
            const pagos = [...(c.pagosRenta || [])].sort((a, b) => a.fecha.localeCompare(b.fecha));
            const total = pagos.reduce((s, p) => s + (p.monto || 0), 0);
            const esTarde = p => +p.fecha.slice(8, 10) > diaLimitePago; // pagos después del día límite
            const tardes = pagos.filter(esTarde).length;
            const anios =[...new Set(pagos.map(p => p.fecha.slice(0, 4)))];
            const limpiar = t => String(t || '').replace(/;?\s*(LOCAL [\d, ]+|OFICINAS)\s*;?/gi, ' ').replace(/\s+/g, ' ').trim();
            const bloques = anios.map(a => {
                const del = pagos.filter(p => p.fecha.startsWith(a));
                const sub = del.reduce((s, p) => s + (p.monto || 0), 0);
                return `${del.map(p => {
                    const extra = [p.nota, limpiar(p.tags) !== limpiar(p.pago) ? limpiar(p.tags) : ''].filter(Boolean).join(' · ');
                    return `<tr${esTarde(p) ? ' class="tarde" title="Pagado después del día ${diaLimitePago}"' : ''}><td>${fechaCorta(p.fecha)}</td><td>${esc(p.pago)}${extra ? `<div class="nota-p">${esc(extra)}</div>` : ''}</td><td class="num">${dinero(p.monto)}</td></tr>`;
                }).join('')}
                <tr class="sub"><td colspan="2">Total ${a} (${del.length} pago${del.length > 1 ? 's' : ''})</td><td class="num">${dinero(sub)}</td></tr>`;
            }).join('');
            abrirVentana(`
                <div class="modal-cab">
                    <div><div class="emp">Historial de pagos de renta</div><h3>${esc(c.razonSocial)} · Local ${esc((c.locales || []).join(', '))}</h3></div>
                    <button class="btn-sec" data-cerrar>Cerrar</button>
                </div>
                <table class="tabla-dep">
                    <thead><tr><th>Fecha</th><th>Pagó / nota</th><th class="num">Monto</th></tr></thead>
                    <tbody>${bloques}</tbody>
                </table>
                <div class="resumen-dep">
                    <div><span>Total pagado</span><strong>${dinero(total)}</strong></div>
                    <div><span>Pagos</span><strong>${pagos.length}${tardes ? ` <span class="tarde-txt">(${tardes} después del día ${diaLimitePago})</span>` : ''}</strong></div>
                    <div><span>Periodo</span><strong style="font-size:14px">${fechaCorta(pagos[0].fecha)} – ${fechaCorta(pagos[pagos.length - 1].fecha)}</strong></div>
                </div>
                <p class="nota-dep">Montos con IVA. No incluye depósitos en garantía. Algunos pagos incluyen agua o basura cuando se cobraron junto con la renta.${c.pagosRentaFuente ? ' Fuente: ' + esc(c.pagosRentaFuente) : ''}</p>`,
                'Historial de pagos de renta');
        }

        // ---------------- HISTORIAL DE PAGOS DE DEPÓSITO ----------------
        // c.historialDepositos: [{ fecha, pago, locales, banco, monto, tipo }]
        //   tipo 'directo'    → pago del inquilino a este contrato (suma)
        //   tipo 'compartido' → pago hecho para varios locales (se muestra, no suma)
        //   tipo 'asignado'   → parte de los pagos compartidos que corresponde a este contrato (suma)
        // Depósito en garantía: requerido = meses de depósito × renta vigente con mantenimiento incluido (sin IVA); pagado = pagos directos y asignados
        const resumenDeposito = cuentaDeposito;   // misma cuenta que Depósitos y las alertas (js/depositos.js)

        function ventanaDepositos(c) {
            const fechaCorta = f => /^\d{4}-\d{2}-\d{2}$/.test(f || '') ? f.split('-').reverse().join('/') : esc(f || '');
            const pagos = [...(c.historialDepositos || [])].sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
            const compartidos = pagos.filter(p => p.tipo === 'compartido');
            const cuentan = pagos.filter(p => p.tipo !== 'compartido');
            const pagado = cuentan.reduce((s, p) => s + (p.monto || 0), 0);
            const totalComp = compartidos.reduce((s, p) => s + (p.monto || 0), 0);
            // Igual que la sección Depósitos: meses de depósito × renta vigente
            const requerido = cuentaDeposito(c).requerido;
            const saldo = cuentaDeposito(c).saldo;
            const filaPago = p => `<tr class="${p.tipo === 'compartido' ? 'comp' : ''}">
                <td>${fechaCorta(p.fecha)}</td><td>${esc(p.pago)}${p.nota ? `<div class="nota-p">${esc(p.nota)}</div>` : ''}</td>
                <td>${esc(p.locales)}</td><td>${esc(p.banco)}</td><td class="num">${dinero(p.monto)}</td></tr>`;

            const fondo = document.createElement('div');
            fondo.className = 'modal-fondo';
            fondo.innerHTML = `
                <div class="modal" role="dialog" aria-label="Historial de pagos de depósito">
                    <div class="modal-cab">
                        <div><div class="emp">Historial de pagos de depósito</div><h3>${esc(c.razonSocial)} · Local ${esc((c.locales || []).join(', '))}</h3></div>
                        <button class="btn-sec" data-cerrar>Cerrar</button>
                    </div>
                    ${compartidos.length ? `
                    <h4>Pagos compartidos (locales ${esc([...new Set(compartidos.map(p => p.locales))].join(' / '))})</h4>
                    <table class="tabla-dep">
                        <thead><tr><th>Fecha</th><th>Pagó</th><th>Locales</th><th>Banco</th><th class="num">Monto</th></tr></thead>
                        <tbody>${compartidos.map(filaPago).join('')}
                            <tr class="sub"><td colspan="4">Total pagado entre los locales</td><td class="num">${dinero(totalComp)}</td></tr>
                        </tbody>
                    </table>` : ''}
                    <h4>Pagos que cuentan para este contrato</h4>
                    <table class="tabla-dep">
                        <thead><tr><th>Fecha</th><th>Concepto</th><th>Locales</th><th>Banco</th><th class="num">Monto</th></tr></thead>
                        <tbody>${cuentan.length ? cuentan.map(filaPago).join('') : '<tr><td colspan="5" style="text-align:center;color:#999;padding:16px">Sin pagos de depósito registrados.</td></tr>'}</tbody>
                    </table>
                    <div class="resumen-dep">
                        <div><span>Pagado</span><strong>${dinero(pagado)}</strong></div>
                        <div><span>Depósito requerido</span><strong>${dinero(requerido)}</strong></div>
                        <div><span>${saldo > 0 ? 'Debe' : saldo < 0 ? 'Saldo a favor' : 'Saldo'}</span><strong style="color:${saldo > 0 ? 'var(--peligro)' : 'var(--exito)'}">${dinero(Math.abs(saldo))}</strong></div>
                    </div>
                    ${Math.abs(pagado - (c.deposito || 0)) > 0.01 ? `<p class="aviso-dep">El total pagado (${dinero(pagado)}) no coincide con el depósito registrado en la carátula (${dinero(c.deposito)}).</p>` : ''}
                    ${c.historialDepositosNota ? `<p class="nota-dep">${esc(c.historialDepositosNota)}</p>` : ''}
                </div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', esc_); };
            const esc_ = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', esc_);
            document.body.appendChild(fondo);
        }

        // ---------------- EDICIÓN ----------------
        // [campo, etiqueta, tipo, sección]
        const CAMPOS = [
            ['razonSocial', 'Razón social', 'texto', 'Arrendatario'],
            ['rfc', 'RFC', 'texto', 'Arrendatario'],
            ['locales', 'Locales (separados por coma)', 'lista', 'Arrendatario'],
            ['m2', 'm²', 'numero', 'Arrendatario'],
            ['nombreComercial', 'Nombre comercial', 'texto', 'Arrendatario'],
            ['giro', 'Giro', 'texto', 'Arrendatario'],
            ['representante', 'Representante legal', 'texto', 'Arrendatario'],
            ['telefono', 'Teléfono de contacto', 'texto', 'Arrendatario'],
            ['acceso', 'Acceso al local', 'texto', 'Arrendatario'],
            ['direccion', 'Dirección (una línea por renglón)', 'lineas', 'Arrendatario'],
            ['garantia', 'Garantía', 'texto', 'Garantías'],
            ['obligadosSolidarios', 'Obligados solidarios (uno por renglón)', 'lineas', 'Garantías'],
            ['garantiaDetalle', 'Detalle de la garantía', 'textarea', 'Garantías'],
            ['segurosRequeridos', 'Seguros requeridos por contrato', 'textarea', 'Garantías'],
            ['periodoGracia', 'Periodo de gracia', 'texto', 'Condiciones'],
            ['moratoriosContrato', 'Intereses moratorios (contrato)', 'texto', 'Condiciones'],
            ['terminacionAnticipada', 'Terminación anticipada', 'textarea', 'Condiciones'],
            ['correosNotificacion', 'Correos de notificación (uno por renglón)', 'lineas', 'Condiciones'],
            ['documento', 'Archivo del contrato', 'texto', 'Condiciones'],
            ['estado', 'Estado', 'estado', 'Vigencia'],
            ['firma', 'Fecha de firma', 'fecha', 'Vigencia'],
            ['plazo', 'Plazo', 'texto', 'Vigencia'],
            ['inicio', 'Inicio', 'fecha', 'Vigencia'],
            ['fin', 'Fin', 'fecha', 'Vigencia'],
            ['incremento', 'Incremento de renta', 'fecha', 'Vigencia'],
            ['incrementoTipo', 'Tipo de incremento', 'texto', 'Vigencia'],
            ['fechaLimite', 'Fecha límite de pago', 'texto', 'Vigencia'],
            ['total', 'Renta mensual (sin IVA)', 'numero', 'Renta'],
            ['totalIva', 'Renta con IVA', 'numero', 'Renta'],
            ['mantenimientoPct', 'Mantenimiento (%)', 'porcentaje', 'Renta'],
            ['mantenimientoMonto', 'Mantenimiento ($)', 'numero', 'Renta'],
            ['mesesDeposito', 'Meses de depósito', 'numero', 'Depósito'],
            ['mesesGracia', 'Meses de gracia', 'numero', 'Depósito'],
            ['porPagarNota', 'Nota de por pagar', 'texto', 'Depósito'],
            ['seguro.aseguradora', 'Aseguradora', 'texto', 'Seguro y servicios'],
            ['seguro.poliza', 'Póliza', 'texto', 'Seguro y servicios'],
            ['seguro.nombre', 'A nombre de', 'texto', 'Seguro y servicios'],
            ['seguro.vigencia', 'Vigencia del seguro', 'fecha', 'Seguro y servicios'],
            ['telmex', 'Telmex', 'texto', 'Seguro y servicios'],
            ['cfeTitular', 'Titular del servicio', 'texto', 'CFE'],
            ['cfe', 'Dirección del servicio', 'texto', 'CFE'],
            ['cfeServicio', 'No. de servicio', 'texto', 'CFE'],
            ['cfeRmu', 'RMU', 'texto', 'CFE'],
            ['cfeCuenta', 'Cuenta', 'texto', 'CFE'],
            ['cfe2Titular', 'Titular (2º servicio)', 'texto', 'CFE · segundo servicio'],
            ['cfe2Direccion', 'Dirección (2º servicio)', 'texto', 'CFE · segundo servicio'],
            ['cfe2Servicio', 'No. de servicio (2º)', 'texto', 'CFE · segundo servicio'],
            ['cfe2Rmu', 'RMU (2º servicio)', 'texto', 'CFE · segundo servicio'],
            ['cfe2Cuenta', 'Cuenta (2º servicio)', 'texto', 'CFE · segundo servicio'],
            ['notas', 'Notas', 'textarea', 'Notas']
        ];
        const leer = (c, k) => k.split('.').reduce((o, p) => (o == null ? undefined : o[p]), c);

        function valorInput(c, [k, , tipo]) {
            const v = leer(c, k);
            if (v === undefined || v === null) return '';
            if (tipo === 'lista') return v.join(', ');
            if (tipo === 'lineas') return v.join('\n');
            if (tipo === 'porcentaje') return typeof v === 'number' ? +(v * 100).toFixed(4) : '';
            if (tipo === 'fecha') return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
            return v;
        }

        function control(c, campo) {
            const [k, , tipo] = campo;
            const val = esc(valorInput(c, campo));
            const id = 'f_' + k.replace('.', '_');
            if (tipo === 'estado') return `<select id="${id}">
                <option value="vigente" ${c.estado !== 'terminacion_anticipada' ? 'selected' : ''}>Vigente (vencido si ya pasó la fecha de fin)</option>
                <option value="terminacion_anticipada" ${c.estado === 'terminacion_anticipada' ? 'selected' : ''}>Terminación anticipada</option></select>`;
            if (tipo === 'lineas' || tipo === 'textarea') return `<textarea id="${id}" rows="${tipo === 'textarea' ? 4 : 3}">${val}</textarea>`;
            const t = tipo === 'fecha' ? 'date' : (tipo === 'numero' || tipo === 'porcentaje') ? 'number' : 'text';
            return `<input id="${id}" type="${t}" ${t === 'number' ? 'step="any"' : ''} value="${val}">`;
        }

        function edicion(c) {
            const secciones = [...new Set(CAMPOS.map(x => x[3]))];
            app.innerHTML = `
                <style>
                    .form-sec { border: 1px solid var(--linea); border-radius: 10px; padding: 18px 22px; margin-bottom: 16px; }
                    .form-sec h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accion); margin: 0 0 14px; }
                    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
                    .form-grid label { display: block; font-size: 12px; color: var(--tinta-suave); margin-bottom: 4px; }
                    .form-grid input, .form-grid select, .form-grid textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--borde-control); border-radius: 6px; font: inherit; font-size: 14px; }
                    .form-grid .ancho { grid-column: 1 / -1; }
                    .extra { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--fondo-hundido); font-size: 14px; }
                    .extra.quitado span { text-decoration: line-through; color: var(--tinta-tenue); }
                    .btn-mini { font-size: 12px; padding: 3px 10px; border: 1px solid var(--borde-control); background: var(--fondo); border-radius: 10px; cursor: pointer; }
                    @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
                </style>
                <div class="barra">
                    <a href="#" id="cancelar1">← Cancelar</a>
                    <div style="display:flex;gap:10px;align-items:center">
                        <span id="msg" style="font-size:14px"></span>
                        <button class="btn" id="guardar1">Guardar cambios</button>
                    </div>
                </div>
                <h1 style="font-size:22px;margin:0 0 20px">Editar: ${esc(c.razonSocial)}</h1>
                ${secciones.map(s => `
                    <div class="form-sec"><h2>${s}</h2><div class="form-grid">
                        ${CAMPOS.filter(x => x[3] === s).map(x => `
                            <div class="${['lineas', 'textarea'].includes(x[2]) ? 'ancho' : ''}">
                                <label for="f_${x[0].replace('.', '_')}">${x[1]}</label>${control(c, x)}
                            </div>`).join('')}
                    </div></div>`).join('')}
                ${(c.extras || []).length ? `
                <div class="form-sec"><h2>Notas de la hoja original</h2>
                    <p style="font-size:13px;color:#888;margin:0 0 10px">Marca las que ya no necesitas; se quitan al guardar.</p>
                    ${(c.extras || []).map((x, i) => `
                        <div class="extra" id="extra_${i}"><span>${esc(x.valor)} <span style="color:#bbb">(fila ${x.fila}, col ${x.col})</span></span>
                        <button class="btn-mini" data-extra="${i}">Quitar</button></div>`).join('')}
                    <button class="btn-mini" id="quitarTodas" style="margin-top:10px">Quitar todas</button>
                </div>` : ''}
                <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
                    <button class="btn-sec" id="cancelar2">Cancelar</button>
                    <button class="btn" id="guardar2">Guardar cambios</button>
                </div>`;

            const quitar = new Set();
            const marcar = (i, on) => {
                on ? quitar.add(i) : quitar.delete(i);
                const el = document.getElementById('extra_' + i);
                el.classList.toggle('quitado', on);
                el.querySelector('button').textContent = on ? 'Deshacer' : 'Quitar';
            };
            app.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => marcar(+b.dataset.extra, !quitar.has(+b.dataset.extra))));
            document.getElementById('quitarTodas')?.addEventListener('click', () => (c.extras || []).forEach((_, i) => marcar(i, true)));

            // "Con IVA" se calcula solo: renta mensual + 16%
            const IVA = 0.16;
            const fTotal = document.getElementById('f_total');
            const fIva = document.getElementById('f_totalIva');
            fIva.readOnly = true;
            fIva.style.background = '#f7f7f7';
            fIva.title = 'Se calcula automáticamente: renta mensual + 16% de IVA';
            fIva.previousElementSibling.textContent = 'Renta con IVA (automático, +16%)';
            fTotal.addEventListener('input', () => {
                const v = parseFloat(fTotal.value);
                fIva.value = isNaN(v) ? '' : (Math.round(v * (1 + IVA) * 100) / 100).toFixed(2);
            });

            const cancelar = e => { e.preventDefault(); vista(c); };
            document.getElementById('cancelar1').addEventListener('click', cancelar);
            document.getElementById('cancelar2').addEventListener('click', cancelar);
            document.getElementById('guardar1').addEventListener('click', () => guardar(c, quitar));
            document.getElementById('guardar2').addEventListener('click', () => guardar(c, quitar));
        }

        function leerFormulario() {
            const nuevo = {};
            for (const [k, , tipo] of CAMPOS) {
                const el = document.getElementById('f_' + k.replace('.', '_'));
                const raw = el.value.trim();
                let v;
                if (tipo === 'lista') v = raw ? raw.split(/[,;]+/).map(s => s.trim()).filter(Boolean) : [];
                else if (tipo === 'lineas') v = raw ? raw.split('\n').map(s => s.trim()).filter(Boolean) : [];
                else if (tipo === 'numero') v = raw === '' ? null : Number(raw);
                else if (tipo === 'porcentaje') v = raw === '' ? null : Number(raw) / 100;
                else v = raw === '' ? null : raw;
                if (typeof v === 'number' && isNaN(v)) throw new Error(`"${CAMPOS.find(x => x[0] === k)[1]}" no es un número válido`);
                nuevo[k] = v;
            }
            return nuevo;
        }

        async function guardar(c, quitar) {
            const msg = document.getElementById('msg');
            let nuevo;
            try { nuevo = leerFormulario(); } catch (err) { msg.className = 'err'; msg.textContent = err.message; return; }
            if (!nuevo.razonSocial) { msg.className = 'err'; msg.textContent = 'La razón social no puede quedar vacía.'; return; }

            // Solo los campos que cambiaron
            const cambios = {}, antes = {}, despues = {};
            for (const [k, , tipo] of CAMPOS) {
                const previo = leer(c, k);
                const norm = v => (v === undefined || v === '' || (Array.isArray(v) && !v.length)) ? null : v;
                const a = tipo === 'fecha' && previo && !/^\d{4}-\d{2}-\d{2}$/.test(previo) ? previo : norm(previo);
                const b = norm(nuevo[k]);
                if (tipo === 'fecha' && a && !/^\d{4}-\d{2}-\d{2}$/.test(a) && b === null) continue; // fecha en texto libre sin tocar
                if (JSON.stringify(a) !== JSON.stringify(b)) { cambios[k] = b; antes[k] = a; despues[k] = b; }
            }
            if (quitar.size) {
                const restantes = (c.extras || []).filter((_, i) => !quitar.has(i));
                cambios.extras = restantes;
                antes.extras = (c.extras || []).filter((_, i) => quitar.has(i)).map(x => x.valor);
                despues.extras = `${quitar.size} nota(s) quitada(s)`;
            }
            if (!Object.keys(cambios).length) { msg.className = ''; msg.textContent = 'No hay cambios.'; return; }

            document.getElementById('guardar1').disabled = document.getElementById('guardar2').disabled = true;
            msg.className = ''; msg.textContent = 'Guardando...';
            const user = getCurrentUser();
            try {
                await updateDoc(doc(db, 'contratos', contratoId), {
                    ...cambios, editadoPor: user.email, editadoEn: serverTimestamp()
                });
                await addDoc(collection(db, 'contratos', contratoId, 'historial'), {
                    antes: JSON.parse(JSON.stringify(antes)), despues: JSON.parse(JSON.stringify(despues)),
                    por: user.email, en: serverTimestamp()
                });
                const snap = await getDoc(doc(db, 'contratos', contratoId));
                avisoPendiente = `<p class="ok" style="background:var(--exito-suave);color:var(--exito);padding:10px 14px;border-radius:6px;font-size:14px">Cambios guardados (${Object.keys(cambios).length} campo(s)).</p>`;
                vista(snap.data());
            } catch (err) {
                console.error(err);
                msg.className = 'err'; msg.textContent = 'No se pudo guardar: ' + err.message;
                document.getElementById('guardar1').disabled = document.getElementById('guardar2').disabled = false;
            }
        }
    </script>
</body>
</html>
