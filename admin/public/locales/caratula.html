<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carátula de contrato - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>F</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; color: #333; margin: 0; }
        .main { max-width: 900px; margin: 0 auto; padding: 30px 20px 60px; }
        .barra { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .barra a { color: #667eea; text-decoration: none; font-size: 14px; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }

        .hoja { border: 1px solid #eee; border-radius: 10px; padding: 36px 40px; }
        .encabezado { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #333; padding-bottom: 16px; margin-bottom: 24px; }
        .encabezado .emp { font-size: 12px; color: #777; letter-spacing: .05em; text-transform: uppercase; }
        .encabezado h1 { font-size: 22px; margin: 6px 0 4px; }
        .encabezado .loc { font-size: 15px; color: #555; }
        .estado { display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 10px; }
        .e-vigente { background: #e8f5e9; color: #2e7d32; } .e-vencido { background: #fdecea; color: #c62828; } .e-termina { background: #fff3e0; color: #ef6c00; }

        .secciones { display: grid; grid-template-columns: 1fr 1fr; gap: 24px 40px; }
        .seccion h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #667eea; margin: 0 0 10px; }
        .seccion.ancha { grid-column: 1 / -1; }
        dl { margin: 0; display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; font-size: 14px; }
        dt { color: #888; }
        dd { margin: 0; font-weight: 500; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; color: #888; font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid #eee; }
        td { padding: 7px 8px; border-bottom: 1px solid #f5f5f5; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .total td { font-weight: 700; border-top: 1px solid #ddd; border-bottom: none; }
        .notas { font-size: 13px; color: #666; }
        .notas li { margin-bottom: 3px; }
        .pie { margin-top: 28px; font-size: 11px; color: #aaa; }
        .err { color: #c62828; }

        @media (max-width: 700px) { .secciones { grid-template-columns: 1fr; } .hoja { padding: 22px; } dl { grid-template-columns: 120px 1fr; } }
        @media print {
            nav, .navbar, .barra { display: none !important; }
            .main { max-width: none; padding: 0; }
            .hoja { border: none; padding: 0; }
            body { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="main" id="app"><p style="color:#999">Cargando...</p></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js';
        import { isAuthenticated, esAdmin, db } from '../../../js/auth.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const fechaTxt = f => { if (!f || !/^\d{4}-\d{2}-\d{2}$/.test(f)) return f || '-'; const [y, m, d] = f.split('-'); return `${+d} de ${MESES[+m - 1]} de ${y}`; };
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        const fila = (k, v) => (v === undefined || v === null || v === '' || v === '-') ? '' : `<dt>${k}</dt><dd>${v}</dd>`;

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p>Esta sección es solo para el administrador.</p>';
            } else {
                cargar().catch(err => { app.innerHTML = `<p class="err">No se pudo cargar el contrato: ${esc(err.message)}</p>`; });
            }
        }

        async function cargar() {
            const id = new URLSearchParams(location.search).get('id');
            const snap = id ? await getDoc(doc(db, 'contratos', id)) : null;
            if (!snap || !snap.exists()) {
                app.innerHTML = `<div class="barra"><a href="./">← Locales</a></div><p class="err">No se encontró el contrato.</p>`;
                return;
            }
            const c = snap.data();
            const estado = c.estado === 'terminacion_anticipada' ? ['e-termina', 'Terminación anticipada']
                : (c.fin && c.fin < hoyISO()) ? ['e-vencido', 'Vencido'] : ['e-vigente', 'Vigente'];
            document.title = `Carátula · ${c.razonSocial}`;

            const mant = [
                typeof c.mantenimientoPct === 'number' ? (c.mantenimientoPct * 100).toFixed(0) + '%' : '',
                typeof c.mantenimientoMonto === 'number' ? dinero(c.mantenimientoMonto) : ''
            ].filter(Boolean).join(' · ');

            app.innerHTML = `
                <div class="barra">
                    <a href="./">← Locales</a>
                    <button class="btn" onclick="window.print()">Imprimir / PDF</button>
                </div>
                <div class="hoja">
                    <div class="encabezado">
                        <div>
                            <div class="emp">La Fábrica de Chocolate · Carátula de contrato de arrendamiento</div>
                            <h1>${esc(c.razonSocial)}</h1>
                            <div class="loc">Local ${esc((c.locales || []).join(', '))}${c.m2 ? ` · ${c.m2} m²` : ''}</div>
                        </div>
                        <span class="estado ${estado[0]}">${estado[1]}</span>
                    </div>

                    <div class="secciones">
                        <div class="seccion">
                            <h2>Arrendatario</h2>
                            <dl>
                                ${fila('Razón social', esc(c.razonSocial))}
                                ${fila('RFC', esc(c.rfc))}
                                ${fila('Garantía', esc(c.garantia))}
                                ${fila('Dirección', (c.direccion || []).map(esc).join('<br>'))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Vigencia</h2>
                            <dl>
                                ${fila('Firma', c.firma ? fechaTxt(c.firma) : (c.firmaOk ? 'Firmado (sin fecha registrada)' : ''))}
                                ${fila('Plazo', esc(c.plazo))}
                                ${fila('Inicio', fechaTxt(c.inicio))}
                                ${fila('Fin', fechaTxt(c.fin))}
                                ${fila('Incremento de renta', fechaTxt(c.incremento) + (c.incrementoTipo ? ` (${esc(c.incrementoTipo)})` : ''))}
                                ${fila('', esc(c.incrementoNota))}
                                ${fila('Fecha límite de pago', esc(c.fechaLimite))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Renta actual</h2>
                            <dl>
                                ${fila('Mantenimiento', mant)}
                                ${fila('Renta mensual', dinero(c.total))}
                                ${fila('Con IVA', dinero(c.totalIva))}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Depósito</h2>
                            <dl>
                                ${fila('Depósito', typeof c.deposito === 'number' ? dinero(c.deposito) + (c.depositoPagado ? ' (pagado)' : '') : '')}
                                ${fila('Fecha de depósito', c.depositoFecha ? fechaTxt(c.depositoFecha) : '')}
                                ${fila('Meses de depósito', c.mesesDeposito)}
                                ${fila('Meses de gracia', c.mesesGracia)}
                                ${fila('Por pagar', typeof c.porPagar === 'number' ? dinero(c.porPagar) + (c.porPagarNota ? ` · ${esc(c.porPagarNota)}` : '') : '')}
                            </dl>
                        </div>
                        ${(c.rentas || []).length ? `
                        <div class="seccion ancha">
                            <h2>Historial de renta</h2>
                            <table>
                                <thead><tr><th>Concepto</th><th>Periodo</th><th>Incremento / nota</th><th class="num">Monto mensual</th></tr></thead>
                                <tbody>
                                    ${c.rentas.map(r => `<tr><td>${esc(r.concepto)}</td><td>${esc(r.periodo)}</td><td>${esc(r.nota)}</td><td class="num">${dinero(r.monto)}</td></tr>`).join('')}
                                    <tr class="total"><td colspan="3">Renta mensual vigente</td><td class="num">${dinero(c.total)}</td></tr>
                                </tbody>
                            </table>
                        </div>` : ''}
                        ${(c.seguro || c.telmex || c.cfe) ? `
                        <div class="seccion">
                            <h2>Seguro</h2>
                            <dl>
                                ${c.seguro ? fila('Aseguradora', esc(c.seguro.aseguradora)) + fila('Póliza', esc(c.seguro.poliza)) + fila('A nombre de', esc(c.seguro.nombre)) + fila('Vigencia', fechaTxt(c.seguro.vigencia)) : '<dt>—</dt><dd>Sin seguro registrado</dd>'}
                            </dl>
                        </div>
                        <div class="seccion">
                            <h2>Servicios</h2>
                            <dl>
                                ${fila('Telmex', esc(c.telmex))}
                                ${fila('CFE', esc(c.cfe))}
                            </dl>
                        </div>` : ''}
                        ${(c.extras || []).length || c.totalNota ? `
                        <div class="seccion ancha">
                            <h2>Notas de la hoja original</h2>
                            <ul class="notas">
                                ${c.totalNota ? `<li>Renta mensual ${esc(c.totalNota)}.</li>` : ''}
                                ${(c.extras || []).map(x => `<li>${esc(x.valor)} <span style="color:#bbb">(fila ${x.fila}, col ${x.col})</span></li>`).join('')}
                            </ul>
                        </div>` : ''}
                    </div>
                    <div class="pie">Generado el ${fechaTxt(hoyISO())} desde el panel de administración.</div>
                </div>`;
        }
    </script>
</body>
</html>
