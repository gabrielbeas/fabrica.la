<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locales - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>F</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; color: #333; margin: 0; }
        .main { max-width: 1250px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: #999; font-size: 14px; margin: 0 0 25px; }

        /* Tarjetas de resumen */
        .tarjetas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
        .tarjeta { border: 1px solid #eee; border-radius: 10px; padding: 16px 18px; }
        .tarjeta .et { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: .04em; }
        .tarjeta .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .tarjeta .det { font-size: 12px; color: #999; margin-top: 4px; }
        .tarjeta.roja .val { color: #c62828; }
        .tarjeta.naranja .val { color: #ef6c00; }
        @media (max-width: 800px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }

        /* Filtros */
        .filtros { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
        .chip { background: white; border: 1px solid #ddd; border-radius: 16px; padding: 6px 14px; font-size: 13px; color: #555; cursor: pointer; }
        .chip.activa { background: #667eea; border-color: #667eea; color: white; }
        .leyenda { margin-left: auto; font-size: 12px; color: #999; display: flex; gap: 12px; align-items: center; }
        @media (max-width: 700px) { .filtros { flex-wrap: wrap; } .leyenda { margin-left: 0; width: 100%; } .tabla-movil tbody tr { position: relative; } .tabla-movil td.col-alerta { position: absolute; top: 11px; right: 14px; width: auto; padding: 0 !important; } .tabla-movil td.col-alerta:has(.punto) + td { padding-right: 22px !important; } }
        .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

        /* Tabla */
        .tabla-wrap { border: 1px solid #eee; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 12px 14px; background: #fafafa; border-bottom: 1px solid #eee; white-space: nowrap; }
        td { padding: 11px 14px; border-bottom: 1px solid #f3f3f3; vertical-align: top; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { cursor: pointer; }
        tbody tr:hover td { background: #f8f9ff; }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .nw { white-space: nowrap; }
        .estado { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
        .e-vigente { background: #e8f5e9; color: #2e7d32; }
        .e-vencido { background: #fdecea; color: #c62828; }
        .e-termina { background: #fff3e0; color: #ef6c00; }
        .gris { color: #999; }

        /* Punto de alerta (el detalle está en la carátula) */
        .col-alerta { width: 36px; text-align: center; padding-left: 8px; padding-right: 0; }
        .punto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; }

        tfoot td { font-weight: 600; background: #fafafa; border-top: 1px solid #eee; }
        .cargando { color: #999; padding: 40px 0; text-align: center; }
        .err { color: #c62828; }
        .vacio td { text-align: center; color: #999; padding: 30px; cursor: default; }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando contratos...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js';
        import { isAuthenticated, esAdmin, db } from '../../../js/auth.js';
        import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { alertasContrato, hoyISO, VENTANA_DIAS as VENTANA, PESO_NIVEL as PESO, COLOR_NIVEL, TEXTO_NIVEL } from '../../../js/alertas-contrato.js';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fechaTxt = f => { if (!f) return '-'; const [y, m, d] = f.split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            } else {
                iniciar().catch(err => { console.error(err); app.innerHTML = `<h1>Locales</h1><p class="err">No se pudieron cargar los contratos: ${esc(err.message)}</p>`; });
            }
        }

        function estadoDe(c) {
            if (c.estado === 'terminacion_anticipada') return { clase: 'e-termina', txt: 'Terminación anticipada' };
            if (c.fin && c.fin < hoyISO()) return { clase: 'e-vencido', txt: 'Vencido' };
            return { clase: 'e-vigente', txt: 'Vigente' };
        }

        // Solo un punto de color; el detalle se ve en la carátula
        function punto(a) {
            if (!a.peor) return '';
            const tip = `${a.total} alerta${a.total > 1 ? 's' : ''} · ${TEXTO_NIVEL[a.peor]} · ver detalle en la carátula`;
            return `<span class="punto" style="background:${COLOR_NIVEL[a.peor]}" title="${esc(tip)}"></span>`;
        }

        async function iniciar() {
            const snap = await getDocs(collection(db, 'contratos'));
            const contratos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => parseInt(a.locales?.[0] || 999) - parseInt(b.locales?.[0] || 999))
                .map(c => ({ ...c, _e: estadoDe(c), _a: alertasContrato(c) }));

            if (!contratos.length) {
                app.innerHTML = `<h1>Locales</h1><p class="sub">Todavía no hay contratos en el panel. Se importan con la herramienta local <code>herramientas/importar-contratos.html</code> (no está publicada).</p>`;
                return;
            }

            const activos = contratos.filter(c => c._e.txt !== 'Vencido');
            const vencidos = contratos.length - activos.length;
            const todasAlertas = contratos.flatMap(c => c._a.lista);
            const urgentes = todasAlertas.filter(e => e.dias <= 30).length;
            const atrasadas = todasAlertas.filter(e => e.dias < 0).length;
            const conAlertas = contratos.filter(c => c._a.peor).length;
            const saldoTotal = contratos.reduce((s, c) => s + c._a.saldo, 0);
            const conSaldo = contratos.filter(c => c._a.saldo).length;

            app.innerHTML = `
                <h1>Locales</h1>
                <p class="sub">Contratos, vencimientos y saldos. Haz clic en un renglón para abrir la carátula.</p>

                <div class="tarjetas">
                    <div class="tarjeta">
                        <div class="et">Contratos activos</div>
                        <div class="val">${activos.length}</div>
                        <div class="det">${vencidos ? `${vencidos} vencido${vencidos > 1 ? 's' : ''} · ` : ''}${contratos.length} en total</div>
                    </div>
                    <div class="tarjeta">
                        <div class="et">Renta mensual</div>
                        <div class="val">${dinero(activos.reduce((s, c) => s + (c.total || 0), 0))}</div>
                        <div class="det">Sin IVA, contratos activos</div>
                    </div>
                    <div class="tarjeta ${atrasadas ? 'roja' : urgentes ? 'naranja' : ''}">
                        <div class="et">Atención próximos 30 días</div>
                        <div class="val">${urgentes}</div>
                        <div class="det">${atrasadas ? `${atrasadas} ya vencida${atrasadas > 1 ? 's' : ''} · ` : ''}${todasAlertas.length} alertas en ${VENTANA} días</div>
                    </div>
                    <div class="tarjeta ${saldoTotal ? 'naranja' : ''}">
                        <div class="et">Saldos por pagar</div>
                        <div class="val">${dinero(saldoTotal)}</div>
                        <div class="det">${conSaldo ? `${conSaldo} locatario${conSaldo > 1 ? 's' : ''}` : 'Sin saldos pendientes'}</div>
                    </div>
                </div>

                <div class="filtros">
                    <button class="chip activa" data-f="todos">Todos (${contratos.length})</button>
                    <button class="chip" data-f="alertas">Con alertas (${conAlertas})</button>
                    <div class="leyenda">
                        <span><i style="background:#c62828"></i>Vencido</span>
                        <span><i style="background:#ef6c00"></i>30 días</span>
                        <span><i style="background:#f9a825"></i>60 días</span>
                        <span><i style="background:#667eea"></i>90 días</span>
                    </div>
                </div>

                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead><tr><th class="col-alerta"></th><th>Locales</th><th>Inquilino</th><th>Estado</th><th>Inicio</th><th>Fin</th><th>Incremento</th><th class="num">Renta mensual</th><th class="num">Con IVA</th></tr></thead>
                        <tbody id="cuerpo"></tbody>
                        <tfoot><tr><td></td><td colspan="6">Total</td>
                            <td class="num">${dinero(contratos.reduce((s, c) => s + (c.total || 0), 0))}</td>
                            <td class="num">${dinero(contratos.reduce((s, c) => s + (c.totalIva || 0), 0))}</td></tr></tfoot>
                    </table>
                </div>`;

            const cuerpo = document.getElementById('cuerpo');
            function pintar(filtro) {
                let lista = contratos;
                if (filtro === 'alertas') {
                    lista = contratos.filter(c => c._a.peor)
                        .sort((a, b) => PESO[a._a.peor] - PESO[b._a.peor] || (a._a.lista[0]?.dias ?? 999) - (b._a.lista[0]?.dias ?? 999));
                }
                cuerpo.innerHTML = lista.length ? lista.map(c => `
                    <tr data-id="${esc(c.id)}">
                        <td class="col-alerta">${punto(c._a)}</td>
                        <td><strong>${esc((c.locales || []).join(', '))}</strong></td>
                        <td>${esc(c.razonSocial)}${c.nombreComercial ? `<div class="gris" style="font-size:12px">${esc(c.nombreComercial)}</div>` : ''}</td>
                        <td><span class="estado ${c._e.clase}">${c._e.txt}</span></td>
                        <td class="nw">${fechaTxt(c.inicio)}</td>
                        <td class="nw">${fechaTxt(c.fin)}</td>
                        <td class="nw">${fechaTxt(c.incremento)}${c.incrementoTipo ? `<div class="gris" style="font-size:12px">${esc(c.incrementoTipo)}</div>` : ''}</td>
                        <td class="num">${dinero(c.total)}</td>
                        <td class="num">${dinero(c.totalIva)}</td>
                    </tr>`).join('') : '<tr class="vacio"><td colspan="9">Ningún contrato tiene alertas.</td></tr>';
                cuerpo.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
                    window.location.href = 'caratula.html?id=' + encodeURIComponent(tr.dataset.id);
                }));
            }

            app.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
                app.querySelectorAll('.chip').forEach(x => x.classList.toggle('activa', x === ch));
                pintar(ch.dataset.f);
            }));
            pintar('todos');
        }
    </script>
</body>
</html>
