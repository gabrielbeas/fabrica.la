<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locales - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>F</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; color: #333; margin: 0; }
        .main { max-width: 1150px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: #999; font-size: 14px; margin: 0 0 25px; }

        .tabs { display: flex; gap: 4px; border-bottom: 1px solid #eee; margin-bottom: 25px; }
        .tab { background: none; border: none; padding: 12px 18px; font-size: 15px; color: #666; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
        .tab.activa { color: #667eea; border-bottom-color: #667eea; font-weight: 600; }
        .contador { display: inline-block; min-width: 20px; padding: 1px 7px; margin-left: 6px; border-radius: 10px; background: #fdecea; color: #c62828; font-size: 12px; font-weight: 600; }

        .grupo { margin-bottom: 28px; }
        .grupo h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }
        .alerta { display: flex; gap: 16px; align-items: center; border: 1px solid #eee; border-left: 4px solid #ccc; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
        .alerta .dias { min-width: 90px; font-weight: 700; font-size: 15px; }
        .alerta .txt { flex: 1; }
        .alerta .txt strong { display: block; margin-bottom: 3px; }
        .alerta .txt span { color: #777; font-size: 13px; }
        .alerta a { color: #667eea; text-decoration: none; font-size: 13px; white-space: nowrap; }
        .n-vencido { border-left-color: #c62828; } .n-vencido .dias { color: #c62828; }
        .n-30 { border-left-color: #ef6c00; } .n-30 .dias { color: #ef6c00; }
        .n-60 { border-left-color: #f9a825; } .n-60 .dias { color: #b28704; }
        .n-90 { border-left-color: #667eea; } .n-90 .dias { color: #667eea; }
        .vacio { color: #999; font-size: 14px; padding: 10px 0; }

        .tabla-wrap { border: 1px solid #eee; border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 12px 14px; background: #fafafa; border-bottom: 1px solid #eee; white-space: nowrap; }
        td { padding: 11px 14px; border-bottom: 1px solid #f3f3f3; }
        tr:last-child td { border-bottom: none; }
        tbody tr { cursor: pointer; }
        tbody tr:hover td { background: #f8f9ff; }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .estado { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
        .e-vigente { background: #e8f5e9; color: #2e7d32; }
        .e-vencido { background: #fdecea; color: #c62828; }
        .e-termina { background: #fff3e0; color: #ef6c00; }
        tfoot td { font-weight: 600; background: #fafafa; border-top: 1px solid #eee; }
        .cargando { color: #999; padding: 40px 0; text-align: center; }
        .err { color: #c62828; }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando contratos...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js';
        import { isAuthenticated, esAdmin, db } from '../../../js/auth.js';
        import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fechaTxt = f => { if (!f) return '-'; const [y, m, d] = f.split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };
        const hoyISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
        const diasHasta = f => Math.round((new Date(f + 'T00:00:00') - new Date(hoyISO() + 'T00:00:00')) / 86400000);

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            } else {
                iniciar().catch(err => { console.error(err); app.innerHTML = `<h1>Locales</h1><p class="err">No se pudieron cargar los contratos: ${esc(err.message)}</p>`; });
            }
        }

        function estadoDe(c) {
            if (c.estado === 'terminacion_anticipada') return { clase: 'e-termina', txt: 'Terminación anticipada' };
            if (c.fin && c.fin < hoyISO()) return { clase: 'e-vencido', txt: 'Vencido' };
            return { clase: 'e-vigente', txt: 'Vigente' };
        }

        // Eventos con fecha que hay que vigilar
        function eventos(contratos) {
            const ev = [];
            contratos.forEach(c => {
                const quien = `${c.razonSocial} · Local ${(c.locales || []).join(', ')}`;
                if (c.fin) ev.push({ c, fecha: c.fin, tipo: 'Fin de contrato', detalle: `Plazo ${c.plazo || '-'}, inició el ${fechaTxt(c.inicio)}`, quien });
                if (c.incremento) ev.push({ c, fecha: c.incremento, tipo: 'Incremento de renta', detalle: `Tipo: ${c.incrementoTipo || '-'} · Renta actual ${dinero(c.total)}`, quien });
                if (c.seguro && /^\d{4}-\d{2}-\d{2}$/.test(c.seguro.vigencia || '')) ev.push({ c, fecha: c.seguro.vigencia, tipo: 'Vencimiento de seguro', detalle: `${c.seguro.aseguradora || ''} · Póliza ${c.seguro.poliza || '-'}`, quien });
            });
            return ev.map(e => ({ ...e, dias: diasHasta(e.fecha) })).sort((a, b) => a.dias - b.dias);
        }

        async function iniciar() {
            const snap = await getDocs(collection(db, 'contratos'));
            const contratos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => parseInt(a.locales?.[0] || 999) - parseInt(b.locales?.[0] || 999));

            if (!contratos.length) {
                app.innerHTML = `<h1>Locales</h1><p class="sub">Todavía no hay contratos en el panel. Impórtalos desde <a href="../herramientas/importar-contratos.html">Importar contratos</a>.</p>`;
                return;
            }

            const ev = eventos(contratos).filter(e => e.dias <= 90);
            const grupos = [
                { clase: 'n-vencido', titulo: 'Vencidos', lista: ev.filter(e => e.dias < 0) },
                { clase: 'n-30', titulo: 'Próximos 30 días', lista: ev.filter(e => e.dias >= 0 && e.dias <= 30) },
                { clase: 'n-60', titulo: '31 a 60 días', lista: ev.filter(e => e.dias > 30 && e.dias <= 60) },
                { clase: 'n-90', titulo: '61 a 90 días', lista: ev.filter(e => e.dias > 60) }
            ];
            const urgentes = ev.filter(e => e.dias <= 30).length;
            const pendientes = contratos.filter(c => typeof c.porPagar === 'number' && c.porPagar > 0);

            app.innerHTML = `
                <h1>Locales</h1>
                <p class="sub">${contratos.length} contratos · Renta mensual total ${dinero(contratos.filter(c => estadoDe(c).txt !== 'Vencido').reduce((s, c) => s + (c.total || 0), 0))} (sin IVA, contratos no vencidos)</p>
                <div class="tabs">
                    <button class="tab activa" data-tab="alertas">Alertas${urgentes ? `<span class="contador">${urgentes}</span>` : ''}</button>
                    <button class="tab" data-tab="contratos">Contratos</button>
                </div>
                <div id="tab-alertas">
                    ${grupos.map(g => `
                        <div class="grupo">
                            <h2>${g.titulo}</h2>
                            ${g.lista.length ? g.lista.map(e => `
                                <div class="alerta ${g.clase}">
                                    <div class="dias">${e.dias < 0 ? `Hace ${-e.dias} d` : e.dias === 0 ? 'Hoy' : `En ${e.dias} d`}</div>
                                    <div class="txt"><strong>${esc(e.tipo)}: ${fechaTxt(e.fecha)}</strong><span>${esc(e.quien)} · ${esc(e.detalle)}</span></div>
                                    <a href="caratula.html?id=${encodeURIComponent(e.c.id)}">Ver carátula →</a>
                                </div>`).join('') : '<div class="vacio">Nada en este periodo.</div>'}
                        </div>`).join('')}
                    <div class="grupo">
                        <h2>Saldos por pagar</h2>
                        ${pendientes.length ? pendientes.map(c => `
                            <div class="alerta n-60">
                                <div class="dias">${dinero(c.porPagar)}</div>
                                <div class="txt"><strong>${esc(c.razonSocial)}</strong><span>Local ${esc((c.locales || []).join(', '))}${c.porPagarNota ? ' · ' + esc(c.porPagarNota) : ''}</span></div>
                                <a href="caratula.html?id=${encodeURIComponent(c.id)}">Ver carátula →</a>
                            </div>`).join('') : '<div class="vacio">Sin saldos pendientes.</div>'}
                    </div>
                </div>
                <div id="tab-contratos" style="display:none">
                    <div class="tabla-wrap">
                        <table>
                            <thead><tr><th>Locales</th><th>Inquilino</th><th>Estado</th><th>Inicio</th><th>Fin</th><th>Incremento</th><th class="num">Renta mensual</th><th class="num">Con IVA</th></tr></thead>
                            <tbody>
                                ${contratos.map(c => { const e = estadoDe(c); return `
                                    <tr data-id="${esc(c.id)}">
                                        <td><strong>${esc((c.locales || []).join(', '))}</strong></td>
                                        <td>${esc(c.razonSocial)}</td>
                                        <td><span class="estado ${e.clase}">${e.txt}</span></td>
                                        <td>${fechaTxt(c.inicio)}</td>
                                        <td>${fechaTxt(c.fin)}</td>
                                        <td>${fechaTxt(c.incremento)}${c.incrementoTipo ? ` <span style="color:#999">(${esc(c.incrementoTipo)})</span>` : ''}</td>
                                        <td class="num">${dinero(c.total)}</td>
                                        <td class="num">${dinero(c.totalIva)}</td>
                                    </tr>`; }).join('')}
                            </tbody>
                            <tfoot><tr><td colspan="6">Total</td>
                                <td class="num">${dinero(contratos.reduce((s, c) => s + (c.total || 0), 0))}</td>
                                <td class="num">${dinero(contratos.reduce((s, c) => s + (c.totalIva || 0), 0))}</td></tr></tfoot>
                        </table>
                    </div>
                </div>`;

            app.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
                app.querySelectorAll('.tab').forEach(x => x.classList.toggle('activa', x === t));
                document.getElementById('tab-alertas').style.display = t.dataset.tab === 'alertas' ? '' : 'none';
                document.getElementById('tab-contratos').style.display = t.dataset.tab === 'contratos' ? '' : 'none';
            }));
            app.querySelectorAll('tbody tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
                window.location.href = 'caratula.html?id=' + encodeURIComponent(tr.dataset.id);
            }));
        }
    </script>
</body>
</html>
