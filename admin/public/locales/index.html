<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Locales - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231f4e79'/><text x='50' y='64' text-anchor='middle' font-family='Roboto,Arial,sans-serif' font-weight='900' font-size='40' textLength='88' lengthAdjust='spacingAndGlyphs' fill='white'>LFdC</text></svg>">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20261006">
    <meta name="apple-mobile-web-app-title" content="LFdC">
    <link rel="stylesheet" href="../css/panel.css?v=20261015-5">
    <style>
        * { box-sizing: border-box; }
        body { font-family: var(--font-sans); background: var(--fondo); color: var(--tinta); margin: 0; }
        .main { max-width: 1250px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--tinta-suave); font-size: 14px; margin: 0 0 25px; }

        /* Tarjetas de resumen */
        .tarjetas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
        .tarjeta { border: 1px solid var(--linea); border-radius: 10px; padding: 16px 18px; }
        .tarjeta .et { font-size: 12px; color: var(--tinta-suave); text-transform: uppercase; letter-spacing: .04em; }
        .tarjeta .val { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
        .tarjeta .det { font-size: 12px; color: var(--tinta-suave); margin-top: 4px; }
        .tarjeta.roja .val { color: var(--peligro); }
        .tarjeta.naranja .val { color: var(--atencion); }
        @media (max-width: 800px) { .tarjetas { grid-template-columns: repeat(2, 1fr); } }

        /* Filtros */
        .filtros { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
        .chip { background: var(--fondo); border: 1px solid var(--borde-control); border-radius: 16px; padding: 6px 14px; font-size: 13px; color: var(--tinta-suave); cursor: pointer; }
        .chip.activa { background: var(--accion); border-color: var(--accion); color: var(--on-accion); }
        .leyenda { margin-left: auto; font-size: 12px; color: var(--tinta-suave); display: flex; gap: 12px; align-items: center; }
        @media (max-width: 700px) { .filtros { flex-wrap: wrap; } .leyenda { margin-left: 0; width: 100%; } .tabla-movil tbody tr { position: relative; } .tabla-movil td.col-alerta { position: absolute; top: 11px; right: 14px; width: auto; padding: 0 !important; } .tabla-movil td.col-alerta:not(:empty) + td { padding-right: 52px !important; } }
        .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

        /* Tabla */
        .tabla-wrap { border: 1px solid var(--linea); border-radius: 10px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; font-weight: 600; color: var(--tinta-suave); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; padding: 12px 14px; background: var(--fondo-hundido); border-bottom: 1px solid var(--linea); white-space: nowrap; }
        td { padding: 11px 14px; border-bottom: 1px solid var(--linea); vertical-align: top; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr { cursor: pointer; }
        tbody tr:hover td { background: var(--ambar-suave); }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .nw { white-space: nowrap; }
        .estado { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
        .e-vigente { background: var(--exito-suave); color: var(--exito); }
        .e-vencido { background: var(--peligro-suave); color: var(--peligro); }
        .e-termina { background: var(--atencion-suave); color: var(--atencion); }
        .gris { color: var(--tinta-suave); }

        /* Punto de alerta (el detalle está en la carátula) */
        .col-alerta { width: 36px; text-align: center; padding-left: 8px; padding-right: 0; }
        .punto { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-top: 4px; }
        .cuadro { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-top: 4px; }
        .marcas { display: inline-flex; gap: 5px; align-items: center; }
        .leyenda i.cuadro-ley { border-radius: 2px; }

        tfoot td { font-weight: 600; background: var(--fondo-hundido); border-top: 1px solid var(--linea); }
        .cargando { color: var(--tinta-suave); padding: 40px 0; text-align: center; }
        .err { color: var(--peligro); }
        .vacio td { text-align: center; color: var(--tinta-suave); padding: 30px; cursor: default; }

        /* Contratos de GBD */
        .seccion-gbd { margin-top: 40px; }
        .seccion-gbd h2 { font-size: 20px; margin: 0 0 4px; }
        .seccion-gbd .sub { margin: 0 0 14px; }
        .tabla-gbd tbody tr { cursor: default; }
        .tabla-gbd { font-size: 13px; }
        .tabla-gbd th, .tabla-gbd td { padding-left: 10px; padding-right: 10px; }
        .tabla-gbd th.num, .tabla-gbd td.num { padding-left: 6px; padding-right: 6px; }
        .tabla-gbd td { white-space: nowrap; }
        .tabla-gbd td.contrato { white-space: normal; min-width: 150px; }
        .tabla-gbd td.concepto { white-space: normal; min-width: 170px; }
        .tabla-gbd td.correos { white-space: normal; min-width: 215px; }
        .tabla-gbd .correos a { display: block; color: var(--tinta); text-decoration: none; }
        .tabla-gbd .correos a:hover { color: var(--accion); text-decoration: underline; }
        .est-pend { background: var(--fondo-hundido); color: var(--tinta-suave); }
        .btn-mini { font: inherit; font-size: 12px; padding: 4px 12px; border: 1px solid var(--borde-control); background: var(--fondo); border-radius: 12px; cursor: pointer; color: var(--tinta); }
        .btn-mini:hover { background: var(--fondo-hundido); }
        .gbd-nota { font-size: 12px; color: var(--tinta-suave); margin: 8px 0 0; }
        .lf-modal .grupo-gbd { grid-column: 1 / -1; margin: 6px 0 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tinta-suave); }
    </style>
</head>
<body>
    <div class="main" id="app"><div class="cargando">Cargando contratos...</div></div>

    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js?v=20261015-5';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js?v=20261015-5';
        import { collection, getDocs, doc, updateDoc, addDoc, query, where, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
        import { alertasContrato, hoyISO, VENTANA_DIAS as VENTANA, PESO_NIVEL as PESO, COLOR_NIVEL, COLOR_OTRA, TEXTO_NIVEL } from '../../../js/alertas-contrato.js?v=20261015-5';

        const app = document.getElementById('app');
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const dinero = n => typeof n === 'number' ? '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
        const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fechaTxt = f => { if (!f) return '-'; const [y, m, d] = f.split('-'); return `${+d} ${MESES[+m - 1]} ${y}`; };

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else {
            crearNavbar();
            if (!esAdmin()) {
                app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
            } else {
                iniciar().catch(err => { console.error(err); app.innerHTML = `<h1>Locales</h1><p class="err">No se pudieron cargar los contratos: ${esc(err.message)}</p>`; });
            }
        }

        function estadoDe(c) {
            if (c.estado === 'terminacion_anticipada') return { clase: 'e-termina', txt: 'Terminación anticipada' };
            if (c.fin && c.fin < hoyISO()) return { clase: 'e-vencido', txt: 'Vencido' };
            return { clase: 'e-vigente', txt: 'Vigente' };
        }

        // Círculo: fin de contrato, con color según cuánto falta. Cuadrito: incremento o depósito (un solo color).
        // El detalle se ve en la carátula.
        function punto(a) {
            if (!a.total) return '';
            const circulo = a.contrato ? `<span class="punto" style="background:${COLOR_NIVEL[a.contrato]}" title="${esc('Fin de contrato · ' + TEXTO_NIVEL[a.contrato] + ' · ver detalle en la carátula')}"></span>` : '';
            const cuadro = a.otras ? `<span class="cuadro" style="background:${COLOR_OTRA}" title="${esc(a.otras + ' alerta' + (a.otras > 1 ? 's' : '') + ' de incremento o depósito · ver detalle en la carátula')}"></span>` : '';
            return `<span class="marcas">${circulo}${cuadro}</span>`;
        }

        async function iniciar() {
            const snap = await getDocs(collection(db, 'contratos'));
            const contratos = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => parseInt(a.locales?.[0] || 999) - parseInt(b.locales?.[0] || 999))
                .map(c => ({ ...c, _e: estadoDe(c), _a: alertasContrato(c) }));

            if (!contratos.length) {
                app.innerHTML = `<h1>Locales</h1><p class="sub">Todavía no hay contratos en el panel. Se importan con la herramienta local <code>herramientas/importar-contratos.html</code> (no está publicada).</p>`;
                return;
            }

            const activos = contratos.filter(c => c._e.txt !== 'Vencido');
            const vencidos = contratos.length - activos.length;
            const todasAlertas = contratos.flatMap(c => c._a.lista);
            const urgentes = todasAlertas.filter(e => e.dias <= 30).length;
            const atrasadas = todasAlertas.filter(e => e.dias < 0).length;
            const conAlertas = contratos.filter(c => c._a.peor).length;
            const saldoTotal = contratos.reduce((s, c) => s + c._a.saldo, 0);
            const conSaldo = contratos.filter(c => c._a.saldo).length;

            app.innerHTML = `
                <h1>Locales</h1>
                <p class="sub">Contratos, vencimientos y saldos. Haz clic en un renglón para abrir la carátula.</p>

                <div class="tarjetas">
                    <div class="tarjeta">
                        <div class="et">Contratos activos</div>
                        <div class="val">${activos.length}</div>
                        <div class="det">${vencidos ? `${vencidos} vencido${vencidos > 1 ? 's' : ''} · ` : ''}${contratos.length} en total</div>
                    </div>
                    <div class="tarjeta">
                        <div class="et">Renta mensual</div>
                        <div class="val">${dinero(activos.reduce((s, c) => s + (c.total || 0), 0))}</div>
                        <div class="det">Sin IVA, contratos activos</div>
                    </div>
                    <div class="tarjeta ${atrasadas ? 'roja' : urgentes ? 'naranja' : ''}">
                        <div class="et">Atención próximos 30 días</div>
                        <div class="val">${urgentes}</div>
                        <div class="det">${atrasadas ? `${atrasadas} ya vencida${atrasadas > 1 ? 's' : ''} · ` : ''}${todasAlertas.length} alertas en ${VENTANA} días</div>
                    </div>
                    <div class="tarjeta ${saldoTotal ? 'naranja' : ''}">
                        <div class="et">Saldos por pagar</div>
                        <div class="val">${dinero(saldoTotal)}</div>
                        <div class="det">${conSaldo ? `${conSaldo} locatario${conSaldo > 1 ? 's' : ''}` : 'Sin saldos pendientes'}</div>
                    </div>
                </div>

                <div class="filtros">
                    <button class="chip activa" data-f="todos">Todos (${contratos.length})</button>
                    <button class="chip" data-f="alertas">Con alertas (${conAlertas})</button>
                    <div class="leyenda">
                        <span>Fin de contrato:</span>
                        ${['vencido', '30', '60', '90'].map(n => `<span><i style="background:${COLOR_NIVEL[n]}"></i>${n === 'vencido' ? 'Vencido' : n + ' días'}</span>`).join('')}
                        <span><i class="cuadro-ley" style="background:${COLOR_OTRA}"></i>Incremento o depósito</span>
                    </div>
                </div>

                <div class="tabla-wrap">
                    <table class="tabla-movil">
                        <thead><tr><th class="col-alerta"></th><th>Locales</th><th>Inquilino</th><th>Estado</th><th>Inicio</th><th>Fin</th><th>Incremento</th><th class="num">Renta mensual</th><th class="num">Con IVA</th></tr></thead>
                        <tbody id="cuerpo"></tbody>
                        <tfoot><tr><td></td><td colspan="6">Total</td>
                            <td class="num">${dinero(contratos.reduce((s, c) => s + (c.total || 0), 0))}</td>
                            <td class="num">${dinero(contratos.reduce((s, c) => s + (c.totalIva || 0), 0))}</td></tr></tfoot>
                    </table>
                </div>
                <div id="gbd"></div>`;

            const cuerpo = document.getElementById('cuerpo');
            function pintar(filtro) {
                let lista = contratos;
                if (filtro === 'alertas') {
                    lista = contratos.filter(c => c._a.peor)
                        .sort((a, b) => PESO[a._a.peor] - PESO[b._a.peor] || (a._a.lista[0]?.dias ?? 999) - (b._a.lista[0]?.dias ?? 999));
                }
                cuerpo.innerHTML = lista.length ? lista.map(c => `
                    <tr data-id="${esc(c.id)}">
                        <td class="col-alerta">${punto(c._a)}</td>
                        <td><strong>${esc((c.locales || []).join(', '))}</strong></td>
                        <td>${esc(c.razonSocial)}${c.nombreComercial ? `<div class="gris" style="font-size:12px">${esc(c.nombreComercial)}</div>` : ''}</td>
                        <td><span class="estado ${c._e.clase}">${c._e.txt}</span></td>
                        <td class="nw">${fechaTxt(c.inicio)}</td>
                        <td class="nw">${fechaTxt(c.fin)}</td>
                        <td class="nw">${fechaTxt(c.incremento)}${c.incrementoTipo ? `<div class="gris" style="font-size:12px">${esc(c.incrementoTipo)}</div>` : ''}</td>
                        <td class="num">${dinero(c.total)}</td>
                        <td class="num">${dinero(c.totalIva)}</td>
                    </tr>`).join('') : '<tr class="vacio"><td colspan="9">Ningún contrato tiene alertas.</td></tr>';
                cuerpo.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => {
                    window.location.href = 'caratula.html?id=' + encodeURIComponent(tr.dataset.id);
                }));
            }

            app.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
                app.querySelectorAll('.chip').forEach(x => x.classList.toggle('activa', x === ch));
                pintar(ch.dataset.f);
            }));
            pintar('todos');
            await cargarGBD();
            pintarGBD();
        }

        // ---------------- CONTRATOS DE GBD (colección contratos_gbd) ----------------
        // Renta a GBD y préstamo a Proyectos Saraperos. Datos solo en Firestore (nunca en el código).
        // Campos: orden, tipo (renta|prestamo), nombre, contraparte, concepto, porcentaje+periodo (renta) o capital+tasaAnual (préstamo),
        //         subtotal, iva, retIsr, retIva, total (= subtotal + iva - retIsr - retIva), correos [], estado, fuente.
        const ESTADOS_GBD = { pendiente: ['Pendiente', 'est-pend'], en_proceso: ['En proceso', 'e-termina'], pagado: ['Pagado a tiempo', 'e-vigente'], pago_tarde: ['Pagado tarde', 'e-vencido'] };
        const pct = f => `${+(f * 100).toFixed(4)}%`;
        const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
        const correoValido = x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x);
        let gbd = [];
        let facturasMesGBD = {};          // factura de GBD del mes en curso por contrato (de ahí sale el estado)
        const mesHoy = hoyISO().slice(0, 7);

        async function cargarGBD() {
            try {
                const sn = await getDocs(collection(db, 'contratos_gbd'));
                gbd = sn.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.orden || 99) - (b.orden || 99));
                const fs = await getDocs(query(collection(db, 'facturas_gbd'), where('mes', '==', mesHoy)));
                facturasMesGBD = Object.fromEntries(fs.docs.map(d => [d.data().contratoId, d.data()]));
            } catch (err) { console.warn('No se pudieron leer los contratos de GBD', err); gbd = []; facturasMesGBD = {}; }
        }

        function conceptoGBD(c) {
            if (c.tipo === 'prestamo') return `Préstamo de ${dinero(c.capital)} al ${pct(c.tasaAnual || 0)} anual<div class="gris" style="font-size:12px">${esc(c.concepto)}</div>`;
            return `${typeof c.porcentaje === 'number' ? `<strong>${pct(c.porcentaje)}</strong> · ` : ''}${esc(c.concepto)}`;
        }

        function pintarGBD() {
            const el = document.getElementById('gbd');
            if (!el) return;
            const fila = c => {
                const [txt, clase] = ESTADOS_GBD[facturasMesGBD[c.id]?.estadoPago] || [null, ''];
                return `<tr>
                    <td class="contrato"><strong>${esc(c.nombre)}</strong><div class="gris" style="font-size:12px">${esc(c.contraparte)}</div></td>
                    <td class="concepto">${conceptoGBD(c)}</td>
                    <td class="num">${dinero(c.subtotal)}</td>
                    <td class="num">${dinero(c.iva)}</td>
                    <td class="num">${dinero(c.retIsr)}</td>
                    <td class="num">${dinero(c.retIva)}</td>
                    <td class="num"><strong>${dinero(c.total)}</strong></td>
                    <td class="correos">${(c.correos || []).map(x => `<a href="mailto:${esc(x)}">${esc(x)}</a>`).join('') || '<span class="gris">-</span>'}</td>
                    <td>${txt ? `<span class="estado ${clase}" title="Factura de ${mesHoy}">${txt}</span>` : '<span class="gris" title="Todavía no hay factura de GBD de este mes">-</span>'}</td>
                    <td><button class="btn-mini" data-editar-gbd="${esc(c.id)}">Editar</button></td>
                </tr>`;
            };
            el.innerHTML = `<div class="seccion-gbd">
                <h2>Contratos de GBD</h2>
                <p class="sub">Renta a GBD y préstamo a Proyectos Saraperos.</p>
                <div class="tabla-wrap"><table class="tabla-gbd">
                    <thead><tr><th>Contrato</th><th>Concepto</th><th class="num">Subtotal</th><th class="num">IVA</th><th class="num">Ret. ISR</th><th class="num">Ret. IVA</th><th class="num">Total</th><th>Enviar a</th><th>Estado del mes</th><th></th></tr></thead>
                    <tbody>${gbd.length ? gbd.map(fila).join('') : '<tr class="vacio"><td colspan="10">Sin contratos de GBD.</td></tr>'}</tbody>
                </table></div>
                <p class="gbd-nota">Total = subtotal + IVA − retenciones. El estado es el de la factura de este mes (se cambia en Facturación → Facturas de GBD). Los importes de aquí se copian a las facturas que se generen desde ahora.</p>
            </div>`;
            el.querySelectorAll('[data-editar-gbd]').forEach(b => b.addEventListener('click', () => editarGBD(gbd.find(x => x.id === b.dataset.editarGbd))));
        }

        function editarGBD(c) {
            const num = v => (typeof v === 'number' ? String(v) : '');
            const fondo = document.createElement('div');
            fondo.className = 'lf-modal-fondo';
            fondo.innerHTML = `<div class="lf-modal" role="dialog" aria-label="Editar contrato de GBD">
                <h3>Editar: ${esc(c.nombre)}</h3>
                <div class="lf-form">
                    <div class="lf-campo"><label for="g_contraparte">Contraparte</label><input id="g_contraparte" value="${esc(c.contraparte)}"></div>
                    <div class="lf-campo"><label for="g_concepto">Concepto</label><input id="g_concepto" value="${esc(c.concepto)}"></div>
                    ${c.tipo === 'prestamo' ? `
                        <div class="lf-campo"><label for="g_capital">Capital del préstamo ($)</label><input id="g_capital" class="lf-num" inputmode="decimal" value="${num(c.capital)}"></div>
                        <div class="lf-campo"><label for="g_tasa">Tasa anual (%)</label><input id="g_tasa" class="lf-num" inputmode="decimal" value="${typeof c.tasaAnual === 'number' ? +(c.tasaAnual * 100).toFixed(4) : ''}"></div>` : `
                        <div class="lf-campo"><label for="g_pct">Porcentaje sobre el total de rentas (%)</label><input id="g_pct" class="lf-num" inputmode="decimal" value="${typeof c.porcentaje === 'number' ? +(c.porcentaje * 100).toFixed(4) : ''}"></div>
                        <div class="lf-campo"><label for="g_periodo">Periodo</label><input id="g_periodo" value="${esc(c.periodo || '')}"></div>`}
                    <p class="grupo-gbd">Importes</p>
                    <div class="lf-campo"><label for="g_subtotal">Subtotal</label><input id="g_subtotal" class="lf-num" inputmode="decimal" value="${num(c.subtotal)}"></div>
                    <div class="lf-campo"><label for="g_iva">IVA</label><input id="g_iva" class="lf-num" inputmode="decimal" value="${num(c.iva)}"></div>
                    <div class="lf-campo"><label for="g_retIsr">Retención ISR</label><input id="g_retIsr" class="lf-num" inputmode="decimal" value="${num(c.retIsr)}"></div>
                    <div class="lf-campo"><label for="g_retIva">Retención IVA</label><input id="g_retIva" class="lf-num" inputmode="decimal" value="${num(c.retIva)}"></div>
                    <div class="lf-campo"><label for="g_total">Total (automático)</label><input id="g_total" class="lf-num" readonly></div>
                    <div class="lf-campo lf-ancho"><label for="g_correos">Enviar a (un correo por renglón)</label><textarea id="g_correos" rows="4">${esc((c.correos || []).join('\n'))}</textarea></div>
                </div>
                <div class="lf-modal-pie"><span id="g_msg" style="margin-right:auto;font-size:13px;color:var(--peligro)"></span><button class="lf-btn" data-cerrar>Cancelar</button><button class="lf-btn lf-btn-primario" id="g_guardar">Guardar</button></div>
            </div>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', teclas); };
            const teclas = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.hasAttribute('data-cerrar')) cerrar(); });
            document.addEventListener('keydown', teclas);
            document.body.appendChild(fondo);

            const v = id => document.getElementById(id).value.trim();
            const n = id => { const t = v(id).replace(/[$,\s]/g, ''); return t === '' ? null : Number(t); };
            const totalAuto = () => {
                const [a, b, c1, d] = ['g_subtotal', 'g_iva', 'g_retIsr', 'g_retIva'].map(n);
                document.getElementById('g_total').value = [a, b, c1, d].every(x => x === null || Number.isFinite(x)) ? r2((a || 0) + (b || 0) - (c1 || 0) - (d || 0)).toFixed(2) : '';
            };
            ['g_subtotal', 'g_iva', 'g_retIsr', 'g_retIva'].forEach(id => document.getElementById(id).addEventListener('input', totalAuto));
            totalAuto();

            document.getElementById('g_guardar').addEventListener('click', async () => {
                const msg = document.getElementById('g_msg'), btn = document.getElementById('g_guardar');
                msg.textContent = '';
                const importes = { subtotal: n('g_subtotal'), iva: n('g_iva'), retIsr: n('g_retIsr'), retIva: n('g_retIva') };
                if (Object.values(importes).some(x => x === null || !Number.isFinite(x) || x < 0)) { msg.textContent = 'Revisa los importes: deben ser números de cero en adelante.'; return; }
                const renglones = v('g_correos').split('\n').map(x => x.trim()).filter(Boolean);
                const malos = renglones.filter(x => !correoValido(x));
                if (malos.length) { msg.textContent = `Correo no válido: ${malos[0]}`; return; }
                const nuevo = { contraparte: v('g_contraparte'), concepto: v('g_concepto'), ...importes, correos: [...new Set(renglones)] };
                nuevo.total = r2(nuevo.subtotal + nuevo.iva - nuevo.retIsr - nuevo.retIva);
                if (!nuevo.contraparte || !nuevo.concepto) { msg.textContent = 'La contraparte y el concepto no pueden quedar vacíos.'; return; }
                if (c.tipo === 'prestamo') {
                    nuevo.capital = n('g_capital'); const t = n('g_tasa'); nuevo.tasaAnual = t === null ? null : t / 100;
                    if (![nuevo.capital, nuevo.tasaAnual].every(x => x !== null && Number.isFinite(x) && x >= 0)) { msg.textContent = 'Revisa el capital y la tasa.'; return; }
                } else {
                    const p = n('g_pct'); nuevo.porcentaje = p === null ? null : p / 100; nuevo.periodo = v('g_periodo');
                    if (nuevo.porcentaje !== null && !Number.isFinite(nuevo.porcentaje)) { msg.textContent = 'Revisa el porcentaje.'; return; }
                }
                // Solo los campos que cambiaron
                const antes = {}, despues = {};
                for (const k of Object.keys(nuevo)) {
                    if (JSON.stringify(c[k] ?? null) !== JSON.stringify(nuevo[k] ?? null)) { antes[k] = c[k] ?? null; despues[k] = nuevo[k] ?? null; }
                }
                if (!Object.keys(despues).length) { cerrar(); return; }
                btn.disabled = true;
                try {
                    const user = getCurrentUser();
                    await updateDoc(doc(db, 'contratos_gbd', c.id), { ...despues, editadoPor: user.email, editadoEn: serverTimestamp() });
                    await addDoc(collection(db, 'contratos_gbd', c.id, 'historial'), { antes, despues, por: user.email, en: serverTimestamp() });
                    cerrar();
                    await cargarGBD();
                    pintarGBD();
                } catch (err) {
                    console.error(err);
                    msg.textContent = 'No se pudo guardar: ' + err.message;
                    btn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
