<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Mensajes a locatarios - La Fábrica de Chocolate</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23667eea'/><text x='50' y='65' font-size='60' text-anchor='middle' fill='white' font-weight='bold'>F</text></svg>">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #333; background: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .main { max-width: 1120px; margin: 0 auto; padding: 30px 20px 60px; }
        h1 { margin: 0 0 6px; font-size: 26px; }
        h2 { margin: 0; font-size: 16px; }
        .sub { margin: 0 0 24px; color: #888; font-size: 14px; line-height: 1.5; }
        .barra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
        .barra .filtro { margin-left: auto; }
        .btn, .btn-sec { border: 0; border-radius: 6px; padding: 10px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn { color: #fff; background: linear-gradient(135deg, #667eea, #764ba2); }
        .btn-sec { color: #555; background: #f3f3f3; }
        .btn:disabled, .btn-sec:disabled { opacity: .55; cursor: wait; }
        .filtro { border: 1px solid #ddd; border-radius: 6px; background: white; padding: 9px 10px; font-size: 13px; }
        .resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
        .dato { border: 1px solid #eee; border-radius: 10px; padding: 14px 16px; }
        .dato strong { display: block; font-size: 22px; }
        .dato span { color: #888; font-size: 12px; }
        .lista { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .mensaje { min-width: 0; border: 1px solid #eee; border-radius: 12px; padding: 17px; }
        .mensaje.vencido { border-color: #f0caca; }
        .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .cab h2 { overflow-wrap: anywhere; }
        .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
        .etiqueta { display: inline-block; padding: 4px 8px; border-radius: 12px; background: #f5f5f5; color: #666; font-size: 11px; }
        .etiqueta.urgente { background: #fff0f0; color: #b3261e; }
        .texto { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 180px; overflow: auto; padding: 12px; border-radius: 7px; background: #fafafa; font-size: 13px; line-height: 1.5; }
        .notas { margin: 10px 0 0; color: #777; font-size: 12px; white-space: pre-wrap; }
        .acciones { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
        .historial { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; color: #777; font-size: 12px; }
        .historial summary { cursor: pointer; color: #667eea; }
        .historial p { margin: 8px 0 0; }
        .vacio, .cargando { padding: 34px 18px; border: 1px dashed #ddd; border-radius: 10px; text-align: center; color: #888; }
        .error { color: #b3261e; }
        .aviso { margin: 0 0 18px; padding: 11px 14px; border-radius: 7px; background: #f7f7ff; color: #555; font-size: 13px; line-height: 1.5; }
        .fondo { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; background: #0006; }
        .modal { width: min(620px, 100%); max-height: 94vh; overflow: auto; border-radius: 12px; background: white; padding: 22px; box-shadow: 0 14px 50px #0003; }
        .modal h2 { margin-bottom: 18px; font-size: 19px; }
        .campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
        .campo { min-width: 0; }
        .campo.ancho { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 12px; font-weight: 600; }
        input, select, textarea { width: 100%; border: 1px solid #ddd; border-radius: 6px; padding: 10px; color: #333; background: white; font: inherit; font-size: 14px; }
        textarea { resize: vertical; line-height: 1.45; }
        input:focus, select:focus, textarea:focus { outline: 2px solid #667eea44; border-color: #667eea; }
        .check { display: flex; align-items: center; gap: 8px; min-height: 40px; color: #555; font-size: 13px; }
        .check input { width: auto; }
        .pie { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .msg { min-height: 18px; margin-top: 8px; font-size: 12px; }
        @media (max-width: 760px) {
            .main { padding: 20px 14px 48px; }
            .lista { grid-template-columns: 1fr; }
            .resumen { gap: 8px; }
            .dato { padding: 11px; }
            .dato strong { font-size: 19px; }
            .barra .filtro { margin-left: 0; flex: 1; }
        }
        @media (max-width: 460px) { .campos { grid-template-columns: 1fr; } .campo.ancho { grid-column: auto; } }
    </style>
</head>
<body>
    <main class="main" id="app"><div class="cargando">Cargando mensajes...</div></main>
    <script type="module">
        import { crearNavbar } from '../../../js/navbar.js';
        import { isAuthenticated, esAdmin, getCurrentUser, db } from '../../../js/auth.js';
        import { collection, getDocs, addDoc, updateDoc, doc, serverTimestamp, writeBatch } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const app = document.getElementById('app');
        const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const hoy = () => {
            const d = new Date();
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        };
        const frecuencia = {
            diarioHabil: 'Cada día hábil', semanal: 'Cada semana', quincenal: 'Cada 15 días', mensual: 'Cada mes',
            bimestral: 'Cada 2 meses', trimestral: 'Cada 3 meses', semestral: 'Cada 6 meses',
            anual: 'Cada año', unaVez: 'Una sola vez', eventual: 'Sin frecuencia fija'
        };
        let mensajes = [];
        let mostrarArchivados = false;
        let aviso = '';

        if (!isAuthenticated()) {
            window.location.href = '/login.html';
        } else if (!esAdmin()) {
            crearNavbar();
            app.innerHTML = '<h1>Acceso restringido</h1><p class="sub">Esta sección es solo para el administrador.</p>';
        } else {
            crearNavbar();
            cargar().catch(err => {
                console.error(err);
                app.innerHTML = `<h1>Mensajes a locatarios</h1><p class="error">No se pudo cargar la sección: ${esc(err.message)}</p>`;
            });
        }

        async function cargar() {
            const snap = await getDocs(collection(db, 'mensajes_locatarios'));
            mensajes = snap.docs.map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) => (a.fechaSiguiente || '9999').localeCompare(b.fechaSiguiente || '9999') || (a.titulo || '').localeCompare(b.titulo || '', 'es'));
            dibujar();
        }

        function dibujar() {
            const visibles = mensajes.filter(m => mostrarArchivados || m.activo !== false);
            const pendientes = mensajes.filter(m => m.activo !== false && !m.completado && m.fechaSiguiente && m.fechaSiguiente <= hoy()).length;
            const activos = mensajes.filter(m => m.activo !== false).length;
            app.innerHTML = `
                <h1>Mensajes a locatarios</h1>
                <p class="sub">Guarda textos que se repiten, programa recordatorios y lleva un registro de cuándo se enviaron.</p>
                <p class="aviso">Los mensajes automáticos se envían individualmente por Gmail desde admin@fabrica.la. Para empezar, configura un correo de prueba y activa el envío solo cuando estés listo. El programador aún requiere publicar la función de Firebase para operar.</p>
                ${aviso ? `<p class="aviso" role="status">${esc(aviso)}</p>` : ''}
                <div class="resumen">
                    <div class="dato"><strong>${activos}</strong><span>Mensajes activos</span></div>
                    <div class="dato"><strong>${pendientes}</strong><span>Por enviar o vencidos</span></div>
                    <div class="dato"><strong>${mensajes.filter(m => m.activo === false).length}</strong><span>Archivados</span></div>
                </div>
                <div class="barra">
                    <button class="btn" id="nuevo">Agregar mensaje</button>
                    <label class="filtro"><input id="archivados" type="checkbox" ${mostrarArchivados ? 'checked' : ''}> Mostrar archivados</label>
                </div>
                ${visibles.length ? `<div class="lista">${visibles.map(tarjeta).join('')}</div>` : '<div class="vacio">Todavía no hay mensajes guardados. Agrega una plantilla para empezar.</div>'}`;

            document.getElementById('nuevo').addEventListener('click', () => formulario());
            document.getElementById('archivados').addEventListener('change', e => { mostrarArchivados = e.target.checked; dibujar(); });
            app.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => formulario(mensajes.find(m => m.id === b.dataset.editar))));
            app.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', () => copiar(mensajes.find(m => m.id === b.dataset.copiar))));
            app.querySelectorAll('[data-enviado]').forEach(b => b.addEventListener('click', () => registrarEnvio(mensajes.find(m => m.id === b.dataset.enviado), b)));
            app.querySelectorAll('[data-historial]').forEach(d => d.addEventListener('toggle', () => { if (d.open && !d.dataset.cargado) historial(d); }));
        }

        function tarjeta(m) {
            const vencido = m.activo !== false && !m.completado && m.fechaSiguiente && m.fechaSiguiente <= hoy();
            const proxima = m.completado ? 'Enviado' : m.fechaSiguiente ? `${vencido ? 'Pendiente desde' : 'Próximo envío'}: ${esc(m.fechaSiguiente)}${m.envioAutomatico && m.canal === 'Correo' ? ` · ${esc(m.horaEnvio || '09:00')}` : ''}` : 'Sin fecha programada';
            return `<article class="mensaje ${vencido ? 'vencido' : ''}">
                <div class="cab"><h2>${esc(m.titulo || 'Mensaje sin título')}</h2><span class="etiqueta ${vencido ? 'urgente' : ''}">${esc(proxima)}</span></div>
                <div class="etiquetas">
                    <span class="etiqueta">${esc(m.categoria || 'General')}</span>
                    <span class="etiqueta">${esc(m.canal || 'Canal por definir')}</span>
                    <span class="etiqueta">${esc(m.destinatarios || 'Destinatarios por definir')}</span>
                    <span class="etiqueta">${esc(frecuencia[m.frecuencia] || frecuencia.eventual)}</span>
                    ${m.canal === 'Correo' ? `<span class="etiqueta ${m.envioAutomatico ? 'urgente' : ''}">${m.envioAutomatico ? 'Correo automático activo' : 'Correo automático apagado'}</span>` : ''}
                    ${m.activo === false ? '<span class="etiqueta">Archivado</span>' : ''}
                </div>
                <div class="texto">${esc(m.contenido || '')}</div>
                ${m.notas ? `<p class="notas">${esc(m.notas)}</p>` : ''}
                <div class="acciones">
                    <button class="btn-sec" data-copiar="${esc(m.id)}">Copiar texto</button>
                    ${m.activo !== false && !m.completado && !m.envioAutomatico ? `<button class="btn-sec" data-enviado="${esc(m.id)}">Registrar envío</button>` : ''}
                    <button class="btn-sec" data-editar="${esc(m.id)}">Editar</button>
                </div>
                <details class="historial" data-historial="${esc(m.id)}"><summary>Ver últimos envíos</summary><div class="historial-items">Abre para consultar el registro.</div></details>
            </article>`;
        }

        async function copiar(m) {
            if (!m) return;
            try {
                await navigator.clipboard.writeText(m.contenido || '');
                aviso = `Se copió «${m.titulo}». Revisa el texto y envíalo desde ${m.canal || 'tu canal habitual'}.`;
            } catch {
                aviso = 'El navegador no permitió copiar el texto. Abre Editar y cópialo manualmente.';
            }
            dibujar();
        }

        function fechaSiguiente(fecha, frecuenciaId) {
            if (!fecha || frecuenciaId === 'eventual') return '';
            const d = new Date(`${fecha}T12:00:00Z`);
            if (frecuenciaId === 'diarioHabil') {
                do { d.setUTCDate(d.getUTCDate() + 1); } while ([0, 6].includes(d.getUTCDay()));
                return d.toISOString().slice(0, 10);
            }
            const dias = { semanal: 7, quincenal: 15 };
            if (dias[frecuenciaId]) d.setUTCDate(d.getUTCDate() + dias[frecuenciaId]);
            else {
                const meses = { mensual: 1, bimestral: 2, trimestral: 3, semestral: 6, anual: 12 }[frecuenciaId];
                if (!meses) return '';
                const dia = d.getUTCDate();
                d.setUTCDate(1);
                d.setUTCMonth(d.getUTCMonth() + meses);
                const ultimo = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
                d.setUTCDate(Math.min(dia, ultimo));
            }
            return d.toISOString().slice(0, 10);
        }

        async function registrarEnvio(m, boton) {
            if (!m || !confirm(`¿Registrar que se envió «${m.titulo}» a ${m.destinatarios || 'los destinatarios indicados'}?`)) return;
            boton.disabled = true;
            try {
                const usuario = getCurrentUser();
                const fecha = hoy();
                const batch = writeBatch(db);
                const envio = doc(collection(db, 'mensajes_locatarios', m.id, 'envios'));
                batch.set(envio, {
                    fecha,
                    destinatarios: m.destinatarios || '',
                    canal: m.canal || '',
                    registradoPor: usuario.email,
                    registradoPorUid: usuario.uid,
                    enviadoEn: serverTimestamp()
                });
                batch.update(doc(db, 'mensajes_locatarios', m.id), {
                    ultimoEnvio: fecha,
                    fechaSiguiente: fechaSiguiente(fecha, m.frecuencia),
                    completado: m.frecuencia === 'unaVez',
                    actualizadoPor: usuario.email,
                    actualizadoEn: serverTimestamp()
                });
                await batch.commit();
                aviso = `Se registró el envío de «${m.titulo}».`;
                await cargar();
            } catch (err) {
                console.error(err);
                boton.disabled = false;
                aviso = `No se pudo registrar el envío: ${err.message}`;
                dibujar();
            }
        }

        async function historial(detalle) {
            const contenedor = detalle.querySelector('.historial-items');
            const id = detalle.dataset.historial;
            try {
                const snap = await getDocs(collection(db, 'mensajes_locatarios', id, 'envios'));
                const filas = snap.docs.map(d => d.data()).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).slice(0, 8);
                contenedor.innerHTML = filas.length
                    ? filas.map(e => `<p>${esc(e.fecha)} · ${esc(e.canal || 'Canal no indicado')} · ${esc(e.destinatarios || 'Destinatarios no indicados')} · ${esc(e.registradoPor || '')}</p>`).join('')
                    : '<p>No hay envíos registrados todavía.</p>';
                detalle.dataset.cargado = 'true';
            } catch (err) {
                contenedor.innerHTML = `<p class="error">No se pudo cargar el historial: ${esc(err.message)}</p>`;
            }
        }

        function formulario(m = null) {
            const nuevo = !m;
            const datos = m || { titulo: '', categoria: 'Operación', canal: 'WhatsApp', destinatarios: 'Todos los locatarios', frecuencia: 'mensual', fechaSiguiente: '', contenido: '', notas: '', activo: true, audiencia: 'prueba', correoPrueba: '', asunto: '', periodo: '', horaEnvio: '09:00', envioAutomatico: false };
            const fondo = document.createElement('div');
            fondo.className = 'fondo';
            fondo.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
                <h2 id="tituloModal">${nuevo ? 'Agregar mensaje' : 'Editar mensaje'}</h2>
                <div class="campos">
                    <div class="campo ancho"><label for="m_titulo">Nombre interno</label><input id="m_titulo" maxlength="100" value="${esc(datos.titulo)}" placeholder="Ej. Recordatorio de pago de renta"></div>
                    <div class="campo"><label for="m_categoria">Categoría</label><select id="m_categoria">${['Administración', 'Operación', 'Mantenimiento', 'Comunidad', 'Otro'].map(x => `<option ${datos.categoria === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
                    <div class="campo"><label for="m_canal">Canal habitual</label><select id="m_canal">${['WhatsApp', 'Correo', 'Aviso impreso', 'Otro'].map(x => `<option ${datos.canal === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
                    <div class="campo" id="campoDestinatarios"><label for="m_destinatarios">Destinatarios / referencia</label><input id="m_destinatarios" maxlength="160" value="${esc(datos.destinatarios)}" placeholder="Ej. Todos los locatarios"></div>
                    <div class="campo"><label for="m_frecuencia">Frecuencia</label><select id="m_frecuencia">${Object.entries(frecuencia).map(([id, nombre]) => `<option value="${id}" ${datos.frecuencia === id ? 'selected' : ''}>${nombre}</option>`).join('')}</select></div>
                    <div class="campo"><label for="m_fecha">Próxima fecha de envío</label><input id="m_fecha" type="date" value="${esc(datos.fechaSiguiente || '')}"></div>
                    <div class="campo ancho" id="campoCorreo" style="display:none"><label for="m_audiencia">Audiencia de correo</label><select id="m_audiencia"><option value="prueba" ${datos.audiencia !== 'locatariosActivos' ? 'selected' : ''}>Solo correo de prueba</option><option value="locatariosActivos" ${datos.audiencia === 'locatariosActivos' ? 'selected' : ''}>Locatarios con contrato vigente</option></select></div>
                    <div class="campo" id="campoCorreoPrueba" style="display:none"><label for="m_correoPrueba">Correo de prueba</label><input id="m_correoPrueba" type="email" maxlength="254" value="${esc(datos.correoPrueba || '')}" placeholder="Escribe el correo que recibirá la prueba"></div>
                    <div class="campo" id="campoAsunto" style="display:none"><label for="m_asunto">Asunto del correo</label><input id="m_asunto" maxlength="180" value="${esc(datos.asunto || datos.titulo || '')}"></div>
                    <div class="campo" id="campoHora" style="display:none"><label for="m_hora">Hora de envío (Guadalajara)</label><input id="m_hora" type="time" value="${esc(datos.horaEnvio || '09:00')}"></div>
                    <div class="campo" id="campoPeriodo" style="display:none"><label for="m_periodo">Periodo para [periodo] (opcional)</label><input id="m_periodo" maxlength="80" value="${esc(datos.periodo || '')}" placeholder="Ej. octubre de 2026"></div>
                    <div class="campo ancho"><label for="m_contenido">Texto del mensaje</label><textarea id="m_contenido" rows="7" maxlength="5000" placeholder="Escribe el texto reutilizable. Puedes dejar variables visibles, por ejemplo: [nombre] o [periodo].">${esc(datos.contenido)}</textarea></div>
                    <div class="campo ancho"><label for="m_notas">Notas para quien lo envía (opcional)</label><textarea id="m_notas" rows="2" maxlength="1000">${esc(datos.notas || '')}</textarea></div>
                    <label class="campo ancho check" id="campoAutomatico" style="display:none"><input type="checkbox" id="m_automatico" ${datos.envioAutomatico === true ? 'checked' : ''}> Activar envío automático en la fecha y hora programadas</label>
                    <p class="campo ancho aviso" id="avisoAutomatico" style="display:none">La prueba se envía únicamente al correo indicado. La audiencia de locatarios toma correos guardados en contratos vigentes. Cada correo se envía por separado. Verifica el texto, fecha y audiencia antes de activar.</p>
                    ${nuevo ? '' : `<label class="campo ancho check"><input type="checkbox" id="m_activo" ${datos.activo !== false ? 'checked' : ''}> Mensaje activo (desmarca para archivarlo)</label>`}
                </div>
                <div class="msg" id="m_msg" role="status"></div>
                <div class="pie"><button class="btn-sec" data-cerrar>Cancelar</button><button class="btn" id="m_guardar">${nuevo ? 'Guardar mensaje' : 'Guardar cambios'}</button></div>
            </section>`;
            const cerrar = () => { fondo.remove(); document.removeEventListener('keydown', tecla); };
            const tecla = e => { if (e.key === 'Escape') cerrar(); };
            fondo.addEventListener('click', e => { if (e.target === fondo || e.target.closest('[data-cerrar]')) cerrar(); });
            document.addEventListener('keydown', tecla);
            document.body.appendChild(fondo);
            const canalInput = document.getElementById('m_canal');
            const audienciaInput = document.getElementById('m_audiencia');
            const actualizarCamposCorreo = () => {
                const esCorreo = canalInput.value === 'Correo';
                document.getElementById('campoCorreo').style.display = esCorreo ? '' : 'none';
                document.getElementById('campoAsunto').style.display = esCorreo ? '' : 'none';
                document.getElementById('campoHora').style.display = esCorreo ? '' : 'none';
                document.getElementById('campoPeriodo').style.display = esCorreo ? '' : 'none';
                document.getElementById('campoAutomatico').style.display = esCorreo ? '' : 'none';
                document.getElementById('avisoAutomatico').style.display = esCorreo ? '' : 'none';
                document.getElementById('campoCorreoPrueba').style.display = esCorreo && audienciaInput.value === 'prueba' ? '' : 'none';
                document.getElementById('campoDestinatarios').style.display = esCorreo ? 'none' : '';
            };
            canalInput.addEventListener('change', actualizarCamposCorreo);
            audienciaInput.addEventListener('change', actualizarCamposCorreo);
            actualizarCamposCorreo();
            document.getElementById('m_titulo').focus();
            document.getElementById('m_guardar').addEventListener('click', async e => {
                const btn = e.currentTarget, msg = document.getElementById('m_msg');
                const nuevoDato = {
                    titulo: document.getElementById('m_titulo').value.trim(),
                    categoria: document.getElementById('m_categoria').value,
                    canal: document.getElementById('m_canal').value,
                    destinatarios: document.getElementById('m_canal').value === 'Correo'
                        ? (document.getElementById('m_audiencia').value === 'prueba' ? `Prueba: ${document.getElementById('m_correoPrueba').value.trim()}` : 'Locatarios con contrato vigente')
                        : document.getElementById('m_destinatarios').value.trim(),
                    frecuencia: document.getElementById('m_frecuencia').value,
                    fechaSiguiente: document.getElementById('m_fecha').value,
                    contenido: document.getElementById('m_contenido').value.trim(),
                    notas: document.getElementById('m_notas').value.trim(),
                    activo: nuevo || document.getElementById('m_activo').checked,
                    audiencia: document.getElementById('m_canal').value === 'Correo' ? document.getElementById('m_audiencia').value : '',
                    correoPrueba: document.getElementById('m_canal').value === 'Correo' && document.getElementById('m_audiencia').value === 'prueba' ? document.getElementById('m_correoPrueba').value.trim() : '',
                    asunto: document.getElementById('m_canal').value === 'Correo' ? document.getElementById('m_asunto').value.trim() : '',
                    horaEnvio: document.getElementById('m_canal').value === 'Correo' ? document.getElementById('m_hora').value : '',
                    periodo: document.getElementById('m_canal').value === 'Correo' ? document.getElementById('m_periodo').value.trim() : '',
                    envioAutomatico: document.getElementById('m_canal').value === 'Correo' && document.getElementById('m_automatico').checked
                };
                if (!nuevoDato.titulo || !nuevoDato.contenido || !nuevoDato.destinatarios) {
                    msg.className = 'msg error'; msg.textContent = 'Completa el nombre, destinatarios y texto del mensaje.'; return;
                }
                if (nuevoDato.frecuencia !== 'eventual' && !nuevoDato.fechaSiguiente && !m?.completado) {
                    msg.className = 'msg error'; msg.textContent = 'Indica cuándo debe enviarse por primera vez.'; return;
                }
                if (nuevoDato.envioAutomatico && nuevoDato.frecuencia === 'eventual') {
                    msg.className = 'msg error'; msg.textContent = 'El envío automático requiere una frecuencia fija.'; return;
                }
                if (nuevoDato.canal === 'Correo' && (!nuevoDato.asunto || (nuevoDato.audiencia === 'prueba' && !/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(nuevoDato.correoPrueba)))) {
                    msg.className = 'msg error'; msg.textContent = 'Escribe un asunto y un correo de prueba válido para la audiencia seleccionada.'; return;
                }
                if (nuevoDato.envioAutomatico && !m?.envioAutomatico && !confirm(`Vas a activar el envío automático por Gmail. Audiencia: ${nuevoDato.audiencia === 'prueba' ? nuevoDato.correoPrueba : 'todos los correos registrados en contratos vigentes'}. ¿Confirmas?`)) return;
                btn.disabled = true;
                try {
                    const usuario = getCurrentUser();
                    if (nuevo) {
                        await addDoc(collection(db, 'mensajes_locatarios'), { ...nuevoDato, completado: false, creadoPor: usuario.email, creadoEn: serverTimestamp(), actualizadoPor: usuario.email, actualizadoEn: serverTimestamp() });
                    } else {
                        const reprogramado = nuevoDato.fechaSiguiente !== (m.fechaSiguiente || '');
                        await updateDoc(doc(db, 'mensajes_locatarios', m.id), {
                            ...nuevoDato,
                            ...(reprogramado ? { completado: false } : {}),
                            actualizadoPor: usuario.email,
                            actualizadoEn: serverTimestamp()
                        });
                    }
                    aviso = nuevo ? 'Mensaje agregado.' : 'Cambios guardados.';
                    cerrar(); await cargar();
                } catch (err) {
                    console.error(err); btn.disabled = false;
                    msg.className = 'msg error'; msg.textContent = `No se pudo guardar: ${err.message}`;
                }
            });
        }
    </script>
</body>
</html>
