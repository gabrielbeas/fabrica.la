<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidores Hidráulicos - La Fábrica de Chocolate</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        .diametro {
            font-weight: 600;
            color: var(--primary);
        }
    </style>
</head>
<body class="lfdc">
    <div class="container">
        <div class="top-bar">
            <a href="index.html?activeTab=dashboard" class="brand">LA FÁBRICA<span>.</span>DE CHOCOLATE</a>
            <div class="nav-links">
                <a href="index.html?activeTab=dashboard">DASHBOARD</a>
                <a href="index.html?activeTab=building">EDIFICIO</a>
                <a href="index.html?activeTab=contracts">LOCALES</a>
                <a href="hidraulico.html" class="active">HIDRÁULICO</a>
                <a href="lecturas-agua.html">LECTURAS</a>
                <a href="agua-cobros.html">AGUA Y COBROS</a>
            </div>
        </div>

        <div class="page-header">
            <h1>Medidores Hidráulicos</h1>
        </div>
        <div class="page-subtitle">Registro de medidores de agua por local</div>

        <div class="stat-row" id="statsGrid"></div>

        <section class="block">
            <div class="block-title">Registro de Medidores</div>
            <input type="text" id="searchInput" class="control-input" style="width:100%; margin-bottom: 18px;" placeholder="Buscar por local, empresa o notas...">
            <div class="table-wrapper">
                <table class="clean" id="medidoresTable">
                    <thead>
                        <tr>
                            <th>Local</th>
                            <th>Tubo</th>
                            <th>Medidor</th>
                            <th>Empresa</th>
                            <th>Diámetro</th>
                            <th>Fecha de Instalación</th>
                            <th>Notas</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="sheets-data.js"></script>
    <script>
        // Datos de medidores hidráulicos
        // (fallback: si la conexión en vivo a Google Sheets falla,
        // la página sigue funcionando con estos valores fijos)
        let medidores = [
            { local: "0", tubo: "0", medidor: "SI", empresa: "LAFABDECHOC", diametro: "2\"", fecha: "03/01/2023", notas: "SERVICIOS GENERALES" },
            { local: "1", tubo: "1", medidor: "X", empresa: "8 SAMURAIS", diametro: "1\"", fecha: "08/05/2024", notas: "" },
            { local: "2", tubo: "2", medidor: "SI", empresa: "MEXA DISEÑO SA DE CV", diametro: "1\"", fecha: "10/19/2023", notas: "" },
            { local: "3", tubo: "3", medidor: "SI", empresa: "ALQUIMIA DE VINOS", diametro: "3/4\"", fecha: "02/21/2024", notas: "" },
            { local: "4", tubo: "4", medidor: "SI", empresa: "ENCRUDO, S.A.P.I. DE C.V.", diametro: "1\"", fecha: "08/16/2023", notas: "Restaurant-bar. Contacto: Ana Paula Isaac" },
            { local: "5", tubo: "5", medidor: "SI", empresa: "PILEA NITRO COFFEE BAR", diametro: "1\"", fecha: "02/21/2024", notas: "" },
            { local: "6", tubo: "6", medidor: "SI", empresa: "COCKTAILS AND DIAMONDS", diametro: "1\"", fecha: "08/16/2023", notas: "COCKTAILS AND DIAMONDS" },
            { local: "7", tubo: "7", medidor: "X", empresa: "", diametro: "3/4\"", fecha: "", notas: "CLAUSURADO" },
            { local: "8", tubo: "8", medidor: "X", empresa: "", diametro: "1\"", fecha: "", notas: "" },
            { local: "9", tubo: "9", medidor: "X", empresa: "ESTEREO AMERICANA 2023", diametro: "1\"", fecha: "", notas: "" },
            { local: "10", tubo: "10", medidor: "SI", empresa: "SEMILLERO STUDIOS", diametro: "1\"", fecha: "01/11/2023", notas: "" },
            { local: "11", tubo: "11", medidor: "SI", empresa: "SEMILLERO STUDIOS", diametro: "1\"", fecha: "03/01/2023", notas: "" },
            { local: "12", tubo: "12", medidor: "X", empresa: "SEMILLERO STUDIOS", diametro: "1\"", fecha: "", notas: "SE INTERCONECTÓ CON 11" },
            { local: "13", tubo: "13", medidor: "X", empresa: "SEMILLERO STUDIOS", diametro: "3/4\"", fecha: "", notas: "SE INTERCONECTÓ CON 11" },
            { local: "14", tubo: "14", medidor: "SI", empresa: "LAFABDECHOC", diametro: "3/4\"", fecha: "01/11/2023", notas: "LOCAL 14" },
            { local: "15", tubo: "15", medidor: "SI", empresa: "A MI ME GUSTA LA GASOLINA", diametro: "3/4\"", fecha: "08/16/2023", notas: "MAMMUT" },
            { local: "16", tubo: "16", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "17", tubo: "17", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "18", tubo: "18", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "19", tubo: "19", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "SE INTERCONECTÓ CON 21" },
            { local: "20", tubo: "20", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "21", tubo: "21", medidor: "SI", empresa: "SARAPE SOCIAL", diametro: "1\"", fecha: "03/01/2023", notas: "LA LINEA HACIA EL LOCAL ES DE 3/4\"" },
            { local: "22", tubo: "22", medidor: "X", empresa: "SARAPE SOCIAL", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "23", tubo: "23", medidor: "X", empresa: "", diametro: "3/4\"", fecha: "", notas: "" },
            { local: "24", tubo: "24", medidor: "", empresa: "", diametro: "3/4\"", fecha: "", notas: "?" },
            { local: "", tubo: "25", medidor: "", empresa: "", diametro: "1\"", fecha: "", notas: "?" }
        ];

        // Renderizar tabla
        function renderTable(data = medidores) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: var(--muted);">No se encontraron medidores.</td></tr>';
                return;
            }

            data.forEach(medidor => {
                const row = document.createElement('tr');
                const medidorStatus = medidor.medidor === 'SI' ? '<span class="pill pill-good">ACTIVO</span>' :
                                     medidor.medidor === 'X' ? '<span class="pill pill-bad">INACTIVO</span>' : '-';

                row.innerHTML = `
                    <td><strong>${medidor.local || '-'}</strong></td>
                    <td>${medidor.tubo}</td>
                    <td>${medidorStatus}</td>
                    <td>${medidor.empresa || '-'}</td>
                    <td><span class="diametro">${medidor.diametro}</span></td>
                    <td>${medidor.fecha || '-'}</td>
                    <td>${medidor.notas || '-'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Búsqueda
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const search = this.value.toLowerCase();
            const filtered = medidores.filter(m =>
                m.local.toLowerCase().includes(search) ||
                m.empresa.toLowerCase().includes(search) ||
                m.notas.toLowerCase().includes(search) ||
                m.tubo.toLowerCase().includes(search)
            );
            renderTable(filtered);
        });

        // Estadísticas
        function renderStats() {
            const stats = {
                total: medidores.length,
                activos: medidores.filter(m => m.medidor === 'SI').length,
                inactivos: medidores.filter(m => m.medidor === 'X').length,
                conFecha: medidores.filter(m => m.fecha).length
            };

            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = `
                <div class="stat-tile accent-primary">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Medidores Totales</div>
                </div>
                <div class="stat-tile accent-good">
                    <div class="stat-number">${stats.activos}</div>
                    <div class="stat-label">Medidores Activos</div>
                </div>
                <div class="stat-tile accent-bad">
                    <div class="stat-number">${stats.inactivos}</div>
                    <div class="stat-label">Medidores Inactivos</div>
                </div>
                <div class="stat-tile">
                    <div class="stat-number">${stats.conFecha}</div>
                    <div class="stat-label">Con Fecha Instalación</div>
                </div>
            `;
        }

        // Inicializar
        renderTable();
        renderStats();

        (async function loadLiveData() {
            if (!window.LFdCSheets) return;
            LFdCSheets.configure({
                endpoint: 'https://script.google.com/macros/s/AKfycbxDpFEO82dbxRVdS1fS-cSoYdAGC2mAby-6SdVipmG1QjCInBLVgD25k0XZRo7kGMVZ/exec',
                token: '7b8f6d4c35ec17952822b19c9c1d3c304dc24875'
            });
            try {
                const operacionBook = await LFdCSheets.fetchBook('operacion');
                if (!operacionBook) return;
                const live = LFdCSheets._internal.parseMedidoresHidraulico(
                    LFdCSheets._internal.findTab(operacionBook, 'MEDIDORES HIDRAULICO')
                );
                if (live && live.length) {
                    medidores = live;
                    renderTable();
                    renderStats();
                    console.info('[LFdC] Medidores hidráulicos en vivo cargados desde Google Sheets (' + medidores.length + ').');
                }
            } catch (err) {
                console.warn('[LFdC] No se pudo cargar medidores en vivo, se mantienen los datos locales.', err);
            }
        })();

        // Manejo de URL parameters para navegación desde index.html
        const params = new URLSearchParams(window.location.search);
        const activeTab = params.get('activeTab');
        if (activeTab) {
            // El parámetro se usaría si esta página fuera parte de index.html
            // Por ahora solo navegamos hacia index.html con el tab especificado
        }
    </script>
</body>
</html>
