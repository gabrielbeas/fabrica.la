<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Contrato</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --ink: #111827;
            --muted: #8a8f98;
            --border: #ececec;
            --good-bg: #d1fae5;
            --good-fg: #065f46;
            --warn-bg: #fef3c7;
            --warn-fg: #92400e;
            --bad-bg: #fee2e2;
            --bad-fg: #991b1b;
            --neutral-bg: #f1f1f3;
            --neutral-fg: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: var(--ink);
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .brand {
            font-weight: 800;
            font-size: 1.05em;
            letter-spacing: 0.5px;
            color: var(--ink);
            text-decoration: none;
        }

        .brand span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 18px;
        }

        .nav-links a {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 1.9em;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        .pill-active { background: var(--good-bg); color: var(--good-fg); }
        .pill-expiring { background: var(--warn-bg); color: var(--warn-fg); }
        .pill-expired { background: var(--bad-bg); color: var(--bad-fg); }
        .pill-available { background: var(--neutral-bg); color: var(--neutral-fg); }

        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            color: var(--muted);
            font-size: 0.95em;
            margin-bottom: 36px;
        }

        .subtitle-row .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--muted);
        }

        section.block {
            margin-bottom: 34px;
        }

        .block-title {
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--muted);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
        }

        .field-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 32px;
        }

        .field-grid.single {
            grid-template-columns: 1fr;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .field-label {
            font-size: 0.78em;
            color: var(--muted);
        }

        .field-value {
            font-size: 1.05em;
            font-weight: 600;
            color: var(--ink);
            word-break: break-word;
        }

        .field-value.muted {
            color: var(--muted);
            font-weight: 500;
        }

        .field-value.accent {
            color: var(--primary);
        }

        .field-value.big {
            font-size: 1.3em;
            font-weight: 800;
        }

        .timeline {
            position: relative;
            padding-left: 22px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            bottom: 6px;
            width: 1px;
            background: var(--border);
        }

        .timeline-item {
            position: relative;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 50%;
            transform: translateY(-50%);
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--primary);
        }

        .timeline-item .ty-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timeline-year {
            font-weight: 700;
            font-size: 1.02em;
        }

        .timeline-amount {
            font-weight: 700;
            font-size: 1.05em;
        }

        .empty-note {
            color: var(--muted);
            font-size: 0.9em;
            font-style: italic;
        }

        @media (max-width: 640px) {
            .field-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 28px 18px 60px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="index.html?activeTab=dashboard" class="brand">LA FÁBRICA<span>.</span>DE CHOCOLATE</a>
            <div class="nav-links">
                <a href="index.html?activeTab=dashboard">DASHBOARD</a>
                <a href="index.html?activeTab=building">EDIFICIO</a>
                <a href="index.html?activeTab=contracts">LOCALES</a>
                <a href="hidraulico.html">HIDRÁULICO</a>
                <a href="lecturas-agua.html">LECTURAS</a>
                <a href="agua-cobros.html">AGUA Y COBROS</a>
            </div>
        </div>

        <div class="title-row">
            <h1 id="contractName">Detalles del Contrato</h1>
            <span class="pill pill-available" id="statusPill" style="display:none;"></span>
        </div>
        <div class="subtitle-row" id="subtitleRow">
            <span id="contractNumber">Local</span>
        </div>

        <div id="detailContent">
            <p class="empty-note">Cargando detalles...</p>
        </div>
    </div>

    <script>
        function esc(v) {
            if (v === null || v === undefined || v === '') return '<span class="field-value muted">No disponible</span>';
            return '<span class="field-value">' + v + '</span>';
        }

        function field(label, value, opts) {
            opts = opts || {};
            var cls = 'field-value' + (opts.big ? ' big' : '') + (opts.accent ? ' accent' : '');
            var v = (value === null || value === undefined || value === '')
                ? '<span class="' + cls + ' muted">No disponible</span>'
                : '<span class="' + cls + '">' + value + '</span>';
            return '<div class="field"><span class="field-label">' + label + '</span>' + v + '</div>';
        }

        var STATUS_TEXT = { active: 'Activo', expiring: 'Por vencer', expired: 'Vencido', available: 'Disponible' };
        var STATUS_CLASS = { active: 'pill-active', expiring: 'pill-expiring', expired: 'pill-expired', available: 'pill-available' };

        // Obtener datos de la URL
        var params = new URLSearchParams(window.location.search);
        var encodedData = params.get('data');

        if (encodedData) {
            try {
                // Debe coincidir con la codificación UTF-8-safe usada en
                // index.html (btoa/atob normal rompe con acentos/ñ).
                var contractJson = decodeURIComponent(escape(atob(encodedData)));
                var contract = JSON.parse(contractJson);
                var d = contract.detail || {};

                document.getElementById('contractName').textContent = contract.name || contract.number;
                document.getElementById('contractNumber').textContent = contract.number;

                if (contract.status && STATUS_TEXT[contract.status]) {
                    var pillEl = document.getElementById('statusPill');
                    pillEl.textContent = STATUS_TEXT[contract.status];
                    pillEl.className = 'pill ' + STATUS_CLASS[contract.status];
                    pillEl.style.display = 'inline-block';
                }

                var subtitleBits = [];
                if (contract.area) subtitleBits.push(contract.area);
                if (d.plazo) subtitleBits.push(d.plazo);
                document.getElementById('subtitleRow').innerHTML =
                    subtitleBits.map(function (b) { return '<span>' + b + '</span>'; }).join('<span class="dot"></span>');

                var content = document.getElementById('detailContent');
                var html = '';

                // ---- Información General ----
                html += '<section class="block"><div class="block-title">Información General</div><div class="field-grid">';
                html += field('Inquilino', contract.tenant);
                if (d.rfc) html += field('RFC', d.rfc);
                html += field('Contacto', contract.contact);
                html += field('Email', contract.email);
                html += field('Superficie', contract.area);
                html += field('Renta Mensual', contract.rent, { accent: true });
                if (d.direccion) html += field('Domicilio', d.direccion);
                html += '</div></section>';

                var inicio = d.inicioContrato || contract.startDate;
                var fin = d.finContrato || contract.endDate;
                if (d.firmaContrato || d.plazo || inicio || fin || d.fechaLimite) {
                    html += '<section class="block"><div class="block-title">Términos del Contrato</div><div class="field-grid">';
                    html += field('Firma de Contrato', d.firmaContrato);
                    html += field('Plazo', d.plazo);
                    html += field('Fecha de Entrega / Inicio', inicio);
                    html += field('Fin del Contrato', fin);
                    html += field('Fecha Límite de Pago Mensual', d.fechaLimite);
                    html += '</div></section>';
                }

                if (d.incrementoRenta || d.incrementoTipo) {
                    html += '<section class="block"><div class="block-title">Incremento de Renta</div><div class="field-grid">';
                    html += field('Fecha de Incremento', d.incrementoRenta);
                    html += field('Tipo de Incremento', d.incrementoTipo);
                    html += '</div></section>';
                }

                if (d.deposito || d.fechaDeposito || d.meses || d.porPagar) {
                    html += '<section class="block"><div class="block-title">Depósito en Garantía</div><div class="field-grid">';
                    html += field('Depósito', d.deposito, { big: true });
                    html += field('Fecha de Depósito', d.fechaDeposito);
                    html += field('Banco', d.depositoBanco);
                    html += field('Meses de Garantía', d.meses);
                    html += field('Por Pagar', d.porPagar);
                    html += '</div></section>';
                }

                // ---- Renta mensual por año (timeline) ----
                var years = d.rentasPorAnio ? Object.keys(d.rentasPorAnio).sort() : [];
                if (years.length) {
                    html += '<section class="block"><div class="block-title">Renta Mensual por Año</div><div class="timeline">';
                    years.forEach(function (y) {
                        var yr = d.rentasPorAnio[y];
                        html += '<div class="timeline-item">' +
                            '<div class="ty-left"><span class="timeline-year">' + y + '</span>' +
                            (yr.incremento ? '<span class="pill pill-active">' + yr.incremento + '</span>' : '') +
                            '</div>' +
                            '<span class="timeline-amount">' + (yr.monto || 'No disponible') + '</span>' +
                            '</div>';
                    });
                    html += '</div></section>';
                }

                if (d.porcentajeMantenimiento || d.mantenimiento || d.total || d.totalIVA) {
                    html += '<section class="block"><div class="block-title">Resumen Financiero</div><div class="field-grid">';
                    html += field('Mantenimiento (' + (d.porcentajeMantenimiento || '—') + ')', d.mantenimiento);
                    html += field('Total', d.total, { big: true });
                    html += field('Total + IVA', d.totalIVA, { big: true, accent: true });
                    html += '</div></section>';
                }

                if (!Object.keys(d).length) {
                    html += '<p class="empty-note">Este local no tiene datos de contrato detallados en la hoja de INQUILINOS todavía.</p>';
                }

                content.innerHTML = html;
            } catch (e) {
                document.getElementById('detailContent').innerHTML = '<p class="empty-note">Error al cargar los detalles.</p>';
            }
        } else {
            document.getElementById('detailContent').innerHTML = '<p class="empty-note">No se encontraron datos del contrato.</p>';
        }
    </script>
</body>
</html>
