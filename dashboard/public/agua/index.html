    <link rel="stylesheet" href="theme.css">
    <style>
        .lfdc .tabs {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }

        .lfdc .tab-btn {
            padding: 10px 2px;
            margin-bottom: -1px;
            border: none;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .lfdc .tab-btn:hover {
            color: var(--primary);
        }

        .lfdc .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .lfdc .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .lfdc .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lfdc .search-filter {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .lfdc .search-filter input.control-input {
            flex: 1;
            min-width: 240px;
        }

        .lfdc .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }

        .lfdc .contract-card {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 18px 16px;
            text-align: center;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s ease, transform 0.15s ease;
        }

        .lfdc .contract-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .lfdc .contract-card.alarm-active {
            border-color: var(--bad-fg);
            border-width: 1.5px;
        }

        .lfdc .contract-card.alert-active {
            border-color: var(--warn-fg);
            border-width: 1.5px;
        }

        .lfdc .compact-alarm {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 1.1em;
        }

        .lfdc .card-number {
            font-size: 1.4em;
            font-weight: 800;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .lfdc .card-title {
            font-size: 0.85em;
            color: var(--muted);
            line-height: 1.3;
        }

        .lfdc .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        .lfdc .empty-state-icon {
            font-size: 2.5em;
            margin-bottom: 14px;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            .lfdc .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

        function getStatusClass(status) {
            const classes = {
                active: 'status-active',
                expiring: 'status-expiring',
                expired: 'status-expired',
                available: 'status-available'
            };
            return classes[status] || '';
        }

        function getStatusText(status) {
            const texts = {
                active: 'Activo',
                expiring: 'Por vencer',
                expired: 'Vencido',
                available: 'Disponible'
            };
            return texts[status] || status;
        }

        function calculateAlarmStatus(endDate) {
            if (!endDate || endDate === '-') return null;

            const end = new Date(endDate.split('/').reverse().join('-'));
            const today = new Date();

            // Calcular fecha de alerta (4 meses antes)
            const alarmDate = new Date(end);
            alarmDate.setMonth(alarmDate.getMonth() - 4);

            if (today >= alarmDate && today < end) {
                // Calcular meses restantes
                const monthsLeft = Math.ceil((end - today) / (1000 * 60 * 60 * 24 * 30.44));
                return {
                    hasAlarm: true,
                    monthsLeft: monthsLeft,
                    type: monthsLeft <= 1 ? 'alarm' : 'alert'
                };
            }

            if (today >= end) {
                return { hasAlarm: true, monthsLeft: 0, type: 'alarm' };
            }

            return null;
        }

        function calculateRentIncreaseAlarm(startDate) {
            if (!startDate || startDate === '-') return null;

            const start = new Date(startDate.split('/').reverse().join('-'));
            const today = new Date();

            // Próximo aumento en el aniversario del contrato
            const nextIncrease = new Date(start);
            nextIncrease.setFullYear(today.getFullYear());

            if (nextIncrease < today) {
                nextIncrease.setFullYear(today.getFullYear() + 1);
            }

            // Alerta un mes antes
            const alertDate = new Date(nextIncrease);
            alertDate.setMonth(alertDate.getMonth() - 1);

            if (today >= alertDate && today < nextIncrease) {
                const daysLeft = Math.ceil((nextIncrease - today) / (1000 * 60 * 60 * 24));
                return {
                    hasAlert: true,
                    daysLeft: daysLeft,
                    date: nextIncrease.toLocaleDateString('es-MX')
                };
            }

            return null;
        }

        function renderContracts(contractsToShow = contracts) {
            const container = document.getElementById('cardsContainer');

            if (contractsToShow.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <p style="font-weight:700; margin-bottom:6px;">No se encontraron resultados</p>
                        <p class="empty-note">Intenta con otros términos de búsqueda</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = contractsToShow.map(contract => {
                const alarm = calculateAlarmStatus(contract.endDate);
                const rentAlert = calculateRentIncreaseAlarm(contract.startDate);

                // Determinar clase del header: alarma roja tiene prioridad
                let headerClass = 'card-header';
                if (alarm && alarm.type === 'alarm') {
                    headerClass = 'card-header alarm';
                } else if (alarm && alarm.type === 'alert') {
                    headerClass = 'card-header alert';
                } else if (rentAlert) {
                    headerClass = 'card-header alert';
                }

                // Guardar contrato en localStorage para la página de detalles
                const contractJson = JSON.stringify(contract);
                // btoa() solo soporta Latin1; los nombres con acentos/ñ
                // (muy comunes aquí) lo rompían. Se codifica a UTF-8 primero.
                const encodedData = btoa(unescape(encodeURIComponent(contractJson)));

                let cardClass = 'contract-card';
                let alarmIcon = '';

                if (alarm && alarm.type === 'alarm') {
                    cardClass += ' alarm-active';
                    alarmIcon = '<div class="compact-alarm">🚨</div>';
                } else if (alarm && alarm.type === 'alert') {
                    cardClass += ' alert-active';
                    alarmIcon = '<div class="compact-alarm">⚠️</div>';
                } else if (rentAlert) {
                    cardClass += ' alert-active';
                    alarmIcon = '<div class="compact-alarm">💰</div>';
                }

                return `
                <a href="detail.html?id=${contract.id}&data=${encodedData}" style="text-decoration: none; color: inherit;">
                <div class="${cardClass}">
                    ${alarmIcon}
                    <div class="card-number">${contract.number}</div>
                    <div class="card-title">${contract.name}</div>
                </div>
                </a>
            `;
            }).join('');
        }

        function filterContracts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;

            const filtered = contracts.filter(contract => {
                const matchesSearch =
                    contract.name.toLowerCase().includes(searchTerm) ||
                    contract.tenant.toLowerCase().includes(searchTerm) ||
                    contract.number.toString().includes(searchTerm);

                const matchesStatus = !statusFilter || contract.status === statusFilter;

                return matchesSearch && matchesStatus;
            });

            renderContracts(filtered);
        }

        // ===== EVENT LISTENERS =====
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabName = e.target.getAttribute('data-tab');

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

                e.target.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        document.getElementById('searchInput').addEventListener('input', filterContracts);
        document.getElementById('filterStatus').addEventListener('change', filterContracts);

        function refreshUI() {
            renderDashboard();
            renderBuilding();
            renderContracts();
        }

        // ===== INICIALIZAR =====
        // Primero se pinta con los datos fijos (fallback) para que la
        // página nunca aparezca vacía; si la conexión en vivo a
        // Google Sheets responde, se vuelve a pintar con esos datos.
        refreshUI();

        (async function loadLiveData() {
            if (!window.LFdCSheets) return;
            LFdCSheets.configure({
                endpoint: 'https://script.google.com/macros/s/AKfycbxDpFEO82dbxRVdS1fS-cSoYdAGC2mAby-6SdVipmG1QjCInBLVgD25k0XZRo7kGMVZ/exec',
                token: '7b8f6d4c35ec17952822b19c9c1d3c304dc24875'
            });
            try {
                const live = await LFdCSheets.loadLiveData();
                if (live && live.contractsUI && live.contractsUI.length) {
                    contracts = live.contractsUI;
                    if (live.building) Object.assign(building, live.building);
                    refreshUI();
                    console.info('[LFdC] Datos en vivo cargados desde Google Sheets (' + contracts.length + ' locales).');
                } else {
                    console.warn('[LFdC] Sin datos en vivo utilizables; se mantienen los datos locales.');
                }
            } catch (err) {
                console.warn('[LFdC] No se pudo cargar datos en vivo, se mantienen los datos locales.', err);
            }
        })();

        // Leer parámetro de URL para activar pestaña
        const params = new URLSearchParams(window.location.search);
        const activeTab = params.get('activeTab');

        if (activeTab) {
            // Encontrar y hacer click en el botón de la pestaña
            const tabBtn = document.querySelector(`[data-tab="${activeTab}"]`);
            if (tabBtn) {
                tabBtn.click();
            }
        }
    </script>
</body>
</html>
